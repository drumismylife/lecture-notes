<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.Div 강의 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --bg:#111418;--surface:rgba(255,255,255,0.07);--surface-h:rgba(255,255,255,0.11);
  --border:rgba(255,255,255,0.14);--border-h:rgba(255,255,255,0.28);
  --text:#f0eee8;--text2:#a8a49c;--text3:#6b6760;
  --gold:#d4a843;--gold-dim:rgba(212,168,67,0.35);
  --r:18px;--r-sm:12px;--ease:cubic-bezier(0.25,0.46,0.45,0.94)
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;background:rgba(17,20,24,0.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(255,255,255,0.14);display:flex;align-items:center}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-logo{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;flex-shrink:0;cursor:pointer}
.nav-logo span{color:var(--gold);font-weight:300}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:6px 14px;font-size:13px;font-weight:400;color:var(--text2);border-radius:20px;transition:all .2s var(--ease);white-space:nowrap;flex-shrink:0;cursor:pointer}
.nav-tab:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.nav-tab.active{color:#fff;background:rgba(255,255,255,0.12);font-weight:500}
.nav-school{font-size:12px;color:#8c8880;border:.5px solid var(--border);border-radius:20px;padding:5px 12px;transition:all .2s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}
.nav-school:hover{color:#b8b5ae;border-color:var(--border-h)}

/* PAGES */
.page{display:none;padding-top:52px}
.page.active{display:block}

/* HERO */
.hero{min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px 60px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(ellipse at center,rgba(212,168,67,.08) 0%,transparent 70%);pointer-events:none}
.hero-eye{font-size:13px;font-weight:400;color:var(--gold);letter-spacing:.04em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.hero-eye::before,.hero-eye::after{content:'';display:block;width:24px;height:.5px;background:var(--gold-dim)}
.hero-h1{font-family:'Noto Serif KR',serif;font-size:clamp(2.4rem,6vw,4rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:#fff;margin-bottom:12px}
.hero-h1 .light{font-weight:300;font-family:-apple-system,sans-serif;font-size:.72em;color:rgba(255,255,255,.45);display:block;margin-top:6px;letter-spacing:.01em}
.hero-sub{font-size:16px;font-weight:300;color:#b8b5ae;line-height:1.6;max-width:460px;margin:16px auto 0}

/* SEMESTER SWITCHER */
.sem-switch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.sem-pill{font-size:13px;color:var(--text2);border:.5px solid var(--border);border-radius:20px;padding:8px 18px;transition:all .2s var(--ease);cursor:pointer;white-space:nowrap}
.sem-pill:hover{color:var(--text);border-color:var(--border-h);background:rgba(255,255,255,0.05)}
.sem-pill.active{color:#111;background:var(--gold);border-color:var(--gold);font-weight:500}
.sem-pill.empty{opacity:.55}

/* SECTION */
.divider{height:.5px;background:var(--border);max-width:1200px;margin:0 auto}
.section{max-width:1200px;margin:0 auto;padding:64px 24px}
.sec-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#c9a050;margin-bottom:32px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:.5px;background:var(--border)}

/* COURSE GRID (적응형: 과목 수에 무관) */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;border-radius:var(--r);overflow:hidden}
.ctile{background:var(--surface);padding:32px 28px;cursor:pointer;position:relative;overflow:hidden;transition:background .3s var(--ease);display:flex;flex-direction:column}
.ctile:hover{background:var(--surface-h)}
.tacc{width:3px;height:28px;border-radius:2px;margin-bottom:20px;transition:height .3s var(--ease)}
.ctile:hover .tacc{height:36px}
.tcode{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#8c8880;margin-bottom:10px}
.ttitle{font-family:'Noto Serif KR',serif;font-size:1.25rem;font-weight:700;color:#f0eee8;line-height:1.25;margin-bottom:4px}
.teng{font-size:12px;color:#8c8880;margin-bottom:16px;font-style:italic}
.tdesc{font-size:13px;color:#b8b5ae;line-height:1.7;flex:1}
.tfoot{margin-top:24px;display:flex;align-items:center;justify-content:space-between}
.tprog{font-size:12px;color:#8c8880}
.tprog strong{color:#d0cdc6;font-weight:500}
.tcaret{font-size:18px;color:#6b6760;transition:transform .25s var(--ease),color .2s}
.ctile:hover .tcaret{transform:translateX(4px);color:#b8b5ae}
.tapps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tapp-chip{font-size:11px;color:rgba(157,133,199,.8);border:.5px solid rgba(157,133,199,.3);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ag{background:#9d85c7}.am{background:#5b9abf}.ap{background:#68a87a}.an{background:#bf6b60}.ah{background:#b89d5a}
.empty-sem{max-width:1200px;margin:0 auto;padding:40px 24px;text-align:center;color:#8c8880;font-size:14px;line-height:1.8;background:var(--surface);border-radius:var(--r)}

/* DETAIL */
.cdpage{min-height:100vh}
.dhero{padding:60px 24px 40px;max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;gap:20px;border-bottom:.5px solid var(--border)}
.back-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#b8b5ae;background:var(--surface);border:.5px solid var(--border);border-radius:20px;padding:7px 16px;transition:all .2s;flex-shrink:0;margin-bottom:4px}
.back-pill:hover{background:var(--surface-h);color:#f0eee8}
.dsup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8c8880;margin-bottom:6px}
.dtitle{font-family:'Noto Serif KR',serif;font-size:2rem;font-weight:700;color:#f0eee8;margin-bottom:4px}
.ddesc{font-size:14px;color:#b8b5ae;line-height:1.7;max-width:600px}
.dbody{max-width:1200px;margin:0 auto;padding:0 24px 80px}

/* TOOLS */
.trow{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px;margin:40px 0 32px;border-radius:var(--r-sm);overflow:hidden}
.ttile{background:var(--surface);padding:24px 22px;display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--text);transition:background .2s}
.ttile:hover{background:var(--surface-h)}
.tico{width:42px;height:42px;border-radius:10px;background:rgba(157,133,199,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tname{font-size:14px;font-weight:500;color:#f0eee8;margin-bottom:2px}
.tnote{font-size:12px;color:#8c8880;line-height:1.5}
.tnew{font-size:9px;font-weight:600;background:rgba(157,133,199,.25);color:#c4adf5;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}

/* WEEKS */
.wlist{display:flex;flex-direction:column;gap:1px;border-radius:var(--r-sm);overflow:hidden}
.witem{background:var(--surface);overflow:hidden}
.wtog{width:100%;display:flex;align-items:center;padding:16px 22px;gap:16px;background:none;border:none;text-align:left;color:#f0eee8;cursor:pointer;transition:background .18s}
.wtog:hover{background:rgba(255,255,255,.05)}
.wnum{font-size:11px;color:#8c8880;width:28px;flex-shrink:0}
.wtxt{flex:1;font-size:14px;font-weight:400;color:#e8e5de}
.wdate{font-size:12px;color:#8c8880;flex-shrink:0}
.wbadge{font-size:10px;padding:2px 8px;border-radius:10px;flex-shrink:0;font-weight:500}
.wb-done{background:rgba(104,168,122,.22);color:#7bc994}
.wb-partial{background:rgba(212,168,67,.18);color:#d4a843}
.wb-empty{background:rgba(255,255,255,.07);color:#7a7670}
.wchev{font-size:10px;color:#6b6760;flex-shrink:0;transition:transform .2s var(--ease)}
.witem.open .wchev{transform:rotate(90deg)}
.wbody{display:none;padding:12px 22px 16px 66px;background:rgba(0,0,0,.25);border-top:.5px solid var(--border);flex-wrap:wrap;gap:8px}
.witem.open .wbody{display:flex}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c8c5be;border:.5px solid rgba(255,255,255,0.18);border-radius:20px;padding:6px 14px;background:rgba(255,255,255,0.07);transition:all .18s;text-decoration:none}
.fchip:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);color:#f0eee8}
.chip-pdf{color:#f4a27a;border-color:rgba(244,162,122,0.35);background:rgba(244,162,122,0.08)}
.chip-pdf:hover{background:rgba(244,162,122,0.18);border-color:rgba(244,162,122,0.6);color:#f9c4a8}
.chip-audio{color:#7ac4f4;border-color:rgba(122,196,244,0.35);background:rgba(122,196,244,0.08)}
.chip-audio:hover{background:rgba(122,196,244,0.18);border-color:rgba(122,196,244,0.6);color:#aadcf9}
.chip-narration{color:#9be3a3;border-color:rgba(111,207,151,0.35);background:rgba(111,207,151,0.08)}
.chip-narration:hover{background:rgba(111,207,151,0.18);border-color:rgba(111,207,151,0.6);color:#bdf0c4}
.chip-notes{color:#c8c5be;border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.07)}
.nof{font-size:12px;color:#7a7670;font-style:italic}

/* RESOURCES */
.rhero{padding:60px 24px 48px;border-bottom:.5px solid var(--border)}
.rhero-in{max-width:1200px;margin:0 auto}
.rhero h2{font-family:'Noto Serif KR',serif;font-size:2rem;font-weight:700;color:#f0eee8;margin-bottom:6px}
.rhero p{font-size:14px;color:#b8b5ae}
.rgrp{max-width:1200px;margin:0 auto;padding:40px 24px 0}
.rgrp:last-child{padding-bottom:80px}
.rglbl{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#8c8880;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rglbl::after{content:'';flex:1;height:.5px;background:var(--border)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;border-radius:var(--r-sm);overflow:hidden}
.rcard{background:var(--surface);padding:22px;display:flex;gap:14px;text-decoration:none;color:#f0eee8;transition:background .2s}
.rcard:hover{background:var(--surface-h)}
.rico{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;border:.5px solid var(--border)}
.rname{font-size:13.5px;font-weight:500;color:#f0eee8;margin-bottom:3px}
.rdesc{font-size:12px;color:#b8b5ae;line-height:1.6}
.rtag{display:inline-block;margin-top:7px;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
.tag-greek{background:rgba(157,133,199,.2);color:#c4adf5}
.tag-bible{background:rgba(191,107,96,.2);color:#e0958d}
.tag-hist{background:rgba(184,157,90,.2);color:#d4b96e}
.tag-gen{background:rgba(91,154,191,.2);color:#8ac4e0}
.tag-yt{background:rgba(200,60,60,.2);color:#e87878}
.tag-tool{background:rgba(255,255,255,.1);color:#c8c5be}
.tag-phil{background:rgba(104,168,122,.2);color:#7bc994}

/* AUDIO PLAYER */
.ap-wrap{background:var(--surface);border-radius:var(--r-sm);overflow:hidden;margin-bottom:8px}
.ap-player{padding:18px 22px;display:flex;align-items:center;gap:16px;border-bottom:.5px solid var(--border)}
.ap-controls{display:flex;gap:6px;flex-shrink:0;align-items:center}
.ap-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.08);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .2s;border:none;cursor:pointer;font-family:inherit}
.ap-btn:hover{background:rgba(255,255,255,0.15)}
.ap-btn.ap-play{background:var(--gold);color:#111;width:46px;height:46px;font-size:15px}
.ap-btn.ap-play:hover{background:#e0b84a}
.ap-info{flex:1;min-width:0}
.ap-now{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-cat-tag{font-size:11px;color:var(--text3);margin-top:2px}
.ap-bar{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:10px;cursor:pointer;position:relative}
.ap-fill{height:100%;background:var(--gold);border-radius:2px;width:0%;transition:width .1s linear;pointer-events:none}
.ap-list{padding:8px 0;max-height:300px;overflow-y:auto}
.ap-list::-webkit-scrollbar{width:4px}
.ap-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.ap-group-label{padding:10px 22px 4px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.ap-item{display:flex;align-items:center;gap:12px;padding:10px 22px;cursor:pointer;transition:background .15s;border:none;background:none;width:100%;text-align:left;color:var(--text2);font-family:inherit;font-size:13px}
.ap-item:hover{background:var(--surface-h)}
.ap-item.ap-active{background:rgba(212,168,67,0.07)}
.ap-item.ap-active .ap-iname,.ap-item.ap-active .ap-inum{color:var(--gold)}
.ap-inum{font-size:11px;color:var(--text3);width:20px;flex-shrink:0;text-align:right}
.ap-iname{flex:1}
.ap-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;display:none}
.ap-item.ap-active .ap-dot{display:block;animation:apPulse 1.2s ease infinite}
@keyframes apPulse{0%,100%{opacity:1}50%{opacity:.25}}

/* FOOTER */
footer{border-top:.5px solid var(--border);padding:28px 24px}
.foot-in{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8c8880;gap:12px;flex-wrap:wrap}
.flinks{display:flex;gap:18px}
.flinks a{color:#8c8880;transition:color .15s}
.flinks a:hover{color:#b8b5ae}

/* ANIM */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.page.active .ctile,.page.active .ttile,.page.active .rcard{animation:fadeUp .4s var(--ease) both}

/* RESPONSIVE */
@media(max-width:600px){
  .nav-tabs{display:none}
  .hero-h1{font-size:2rem}
}
</style>
</head>

<script>
const FMETA={
  notes:{icon:'📄',label:'강의노트',chip:'chip-notes'},
  summary:{icon:'📌',label:'핵심요약',chip:'chip-notes'},
  exam:{icon:'📝',label:'시험대비',chip:'chip-notes'},
  handout:{icon:'📋',label:'핸드아웃',chip:'chip-notes'},
  text:{icon:'📖',label:'텍스트',chip:'chip-notes'},
  pdf:{icon:'📕',label:'PDF',chip:'chip-pdf'},
  audio:{icon:'🎧',label:'음성',chip:'chip-audio'},
  narration:{icon:'🔊',label:'노트 낭독',chip:'chip-narration'},
  other:{icon:'🔗',label:'자료',chip:''}
};

// ── 학기 상태 ─────────────────────────────────────────────
let activeSemId = null;

function semesters(){ return (SITE_DATA.semesters)||[]; }
function getSemester(id){ return semesters().find(s=>s.id===(id||activeSemId)); }
function defaultSemId(){
  const list=semesters();
  const act=list.find(s=>s.active);
  return (act||list[0]||{}).id;
}

// ── 배지 ──────────────────────────────────────────────────
function bClass(f){if(!f||!f.length)return 'wb-empty';const h=t=>f.some(x=>x.type===t);return(h('notes')&&h('summary'))?'wb-done':'wb-partial'}
function bLabel(f){if(!f||!f.length)return'—';return bClass(f)==='wb-done'?'완료':'일부'}

// ── 학기 전환기 ───────────────────────────────────────────
function renderSemSwitch(){
  const el=document.getElementById('sem-switch'); if(!el)return;
  el.innerHTML=semesters().map(s=>{
    const n=Object.keys(s.courses||{}).length;
    const cls=`sem-pill${s.id===activeSemId?' active':''}${n===0?' empty':''}`;
    return `<button class="${cls}" onclick="switchSemester('${s.id}')">${s.label}${n?` · ${n}과목`:' · 준비 중'}</button>`;
  }).join('');
}

function switchSemester(id){
  activeSemId=id;
  renderSemSwitch(); renderNavTabs(); renderGrid(); renderHero();
  showPage('home');
}

function renderHero(){
  const s=getSemester(); if(!s)return;
  const n=Object.keys(s.courses||{}).length;
  document.getElementById('hero-eye').textContent=`한국침례신학대학교 대학원 · ${s.label}`;
  document.getElementById('hero-sub').textContent= n? `${n}개 과목 · 주차별 강의노트 · 학습 앱 · 노트 음성` : '이 학기는 준비 중입니다';
  document.getElementById('home-sec-label').textContent=`${s.label} 수업 과목`;
}

// ── 네비게이션 탭 ─────────────────────────────────────────
function renderNavTabs(){
  const el=document.getElementById('nav-tabs'); if(!el)return;
  const s=getSemester();
  let html=`<div class="nav-tab" data-nav="home" onclick="showPage('home')">전체 과목</div>`;
  if(s){
    Object.entries(s.courses).forEach(([id,c])=>{
      html+=`<div class="nav-tab" data-nav="${id}" onclick="showCourse('${id}')">${c.meta.title}</div>`;
    });
  }
  html+=`<div class="nav-tab" data-nav="resources" onclick="showPage('resources')">관련 자료</div>`;
  el.innerHTML=html;
}
function setActiveNav(navKey){
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active',b.dataset.nav===navKey));
}

// ── 홈 그리드 ─────────────────────────────────────────────
function renderGrid(){
  const g=document.getElementById('cgrid');
  const empty=document.getElementById('empty-sem');
  const s=getSemester();
  const entries=s?Object.entries(s.courses):[];
  if(!entries.length){
    g.innerHTML=''; g.style.display='none';
    empty.style.display=''; empty.textContent=`${s?s.label:''} 과목 정보가 아직 등록되지 않았습니다. 학업계획서가 확정되면 추가됩니다.`;
    return;
  }
  g.style.display=''; empty.style.display='none';
  g.innerHTML=entries.map(([id,c])=>{
    const m=c.meta;
    const done=c.weeks.filter(w=>w.files&&w.files.length>0).length;
    const apps=(c.tools&&c.tools.length)?`<div class="tapps">${c.tools.map(t=>`<span class="tapp-chip">${t.name}</span>`).join('')}</div>`:'';
    return`<div class="ctile" onclick="showCourse('${id}')">
      <div class="tacc ${m.acc||''}"></div>
      <div class="tcode">${m.code||''}</div>
      <div class="ttitle">${m.title}</div>
      <div class="teng">${m.eng||''}</div>
      <div class="tdesc">${m.desc||''}${apps}</div>
      <div class="tfoot"><span class="tprog"><strong>${done}</strong> / ${c.weeks.length} 주차</span><span class="tcaret">›</span></div>
    </div>`;
  }).join('');
}

// ── 과목 상세 (동적 렌더) ─────────────────────────────────
function buildAudioGroups(c){
  const groups=[];
  (c.audio||[]).forEach(g=>groups.push(g));
  // 주차별 노트 낭독 (files 중 type:'narration')
  const narr=[];
  (c.weeks||[]).forEach(w=>{
    (w.files||[]).forEach(f=>{
      if(f.type==='narration') narr.push({name:`${w.week}주차 ${w.title}`,href:f.href});
    });
  });
  if(narr.length) groups.push({category:'주차별 노트 낭독',tracks:narr});
  return groups;
}

function audioPlayerMarkup(){
  return `<div class="ap-wrap" id="ap-wrap">
    <div class="ap-player">
      <div class="ap-controls">
        <button class="ap-btn" onclick="apPrev()" title="이전">⏮</button>
        <button class="ap-btn ap-play" id="ap-play-btn" onclick="apToggle()">▶</button>
        <button class="ap-btn" onclick="apNext()" title="다음">⏭</button>
      </div>
      <div class="ap-info">
        <div class="ap-now" id="ap-now">트랙을 선택하세요</div>
        <div class="ap-cat-tag" id="ap-cat-tag">—</div>
        <div class="ap-bar" id="ap-bar" onclick="apSeek(event)"><div class="ap-fill" id="ap-fill"></div></div>
      </div>
    </div>
    <div class="ap-list" id="ap-list"></div>
  </div>`;
}

function renderCourse(courseId){
  const s=getSemester(); if(!s)return;
  const c=s.courses[courseId]; if(!c)return;
  const m=c.meta;
  const el=document.getElementById('page-course');
  let html=`<div class="dhero"><button class="back-pill" onclick="showPage('home')">← 전체 과목</button>
    <div><div class="dsup">${m.code||''}${m.eng?' · '+m.eng:''}</div><div class="dtitle">${m.title}</div>
    <div class="ddesc">${m.desc||''}</div></div></div><div class="dbody">`;

  if(c.syllabus&&c.syllabus.href){
    html+=`<div class="sec-label" style="margin-top:40px">학업계획서</div>
      <div class="trow"><a class="ttile" href="${c.syllabus.href}" target="_blank">
        <div class="tico">🗂️</div><div><div class="tname">학업계획서</div>
        <div class="tnote">과목 개요 · 교재 · 주차계획 · 평가</div></div></a></div>`;
  }

  if(c.tools&&c.tools.length){
    html+=`<div class="sec-label"${c.syllabus?'':' style="margin-top:40px"'}>학습 도구 / 앱</div>
      <div class="trow">${c.tools.map(t=>`<a class="ttile" href="${t.href}" target="_blank"><div class="tico">${t.icon}</div><div><div class="tname">${t.name}${t.isNew?'<span class="tnew">NEW</span>':''}</div><div class="tnote">${t.desc}</div></div></a>`).join('')}</div>`;
  }

  const audioGroups=buildAudioGroups(c);
  if(audioGroups.length){
    const topMargin=(c.syllabus||c.tools&&c.tools.length)?'':' style="margin-top:40px"';
    html+=`<div class="sec-label"${topMargin}>음성 자료</div>${audioPlayerMarkup()}`;
  }

  const noTopYet=!(c.syllabus||(c.tools&&c.tools.length)||audioGroups.length);
  html+=`<div class="sec-label"${noTopYet?' style="margin-top:40px"':''}>주차별 강의 자료</div><div class="wlist" id="weeks-course"></div>`;
  html+=`</div>`;
  el.innerHTML=html;

  renderWeeksInto('weeks-course',c.weeks,courseId);
  if(audioGroups.length) initAudioPlayer(audioGroups);
}

function renderWeeksInto(elId,weeks,courseId){
  const el=document.getElementById(elId); if(!el)return;
  el.innerHTML=weeks.map((w,i)=>{
    const bc=bClass(w.files);const bl=bLabel(w.files);
    const fh=(w.files&&w.files.length>0)?w.files.map(f=>{const fm=FMETA[f.type]||FMETA.other;return`<a class="fchip ${fm.chip||''}" href="${f.href}" target="_blank">${fm.icon} ${f.label||fm.label}</a>`;}).join(''):`<span class="nof">아직 등록된 자료가 없습니다.</span>`;
    return`<div class="witem" id="wi-${courseId}-${w.week}" style="animation-delay:${i*.025}s">
      <button class="wtog" onclick="toggleW('${courseId}','${w.week}')">
        <span class="wnum">W${String(w.week).padStart(2,'0')}</span>
        <span class="wtxt">${w.title}</span>
        ${w.date?`<span class="wdate">${w.date}</span>`:''}
        <span class="wbadge ${bc}">${bl}</span>
        <span class="wchev">▶</span>
      </button>
      <div class="wbody">${fh}</div>
    </div>`;
  }).join('');
}

// ── 오디오 플레이어 ───────────────────────────────────────
let _apTracks=[],_apIdx=-1;
function _apEl(){return document.getElementById('ap-audio');}

function initAudioPlayer(groups){
  const list=document.getElementById('ap-list'); if(!list)return;
  let html='',idx=0;_apTracks=[];_apIdx=-1;
  groups.forEach(g=>{
    html+=`<div class="ap-group-label">${g.category}</div>`;
    g.tracks.forEach(t=>{
      _apTracks.push({...t,category:g.category});
      html+=`<button class="ap-item" id="ap-i-${idx}" onclick="apPlay(${idx})"><span class="ap-inum">${idx+1}</span><span class="ap-iname">${t.name}</span><span class="ap-dot"></span></button>`;
      idx++;
    });
  });
  list.innerHTML=html;
  const a=_apEl(); a.pause();
}

function apPlay(idx){
  if(idx<0||idx>=_apTracks.length)return;
  const a=_apEl();
  if(_apIdx>=0)document.getElementById(`ap-i-${_apIdx}`)?.classList.remove('ap-active');
  _apIdx=idx;
  const t=_apTracks[idx];
  document.getElementById(`ap-i-${idx}`)?.classList.add('ap-active');
  document.getElementById(`ap-i-${idx}`)?.scrollIntoView({block:'nearest'});
  document.getElementById('ap-now').textContent=t.name;
  document.getElementById('ap-cat-tag').textContent=t.category;
  a.src=t.href;a.play().catch(()=>{});
}
function apToggle(){
  const a=_apEl();
  if(_apIdx<0){if(_apTracks.length)apPlay(0);return;}
  a.paused?a.play():a.pause();
}
function apNext(){apPlay(Math.min(_apTracks.length-1,_apIdx+1));}
function apPrev(){apPlay(Math.max(0,_apIdx-1));}
function apSeek(e){
  const a=_apEl();if(!a.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  a.currentTime=((e.clientX-r.left)/r.width)*a.duration;
}

// ── 관련 자료 ─────────────────────────────────────────────
function renderResources(){
  const el=document.getElementById('resources-body');if(!el||!SITE_DATA.resources)return;
  el.innerHTML=SITE_DATA.resources.map(g=>`<div class="rgrp"><div class="rglbl">${g.label}</div><div class="rgrid">${g.items.map(r=>`<a class="rcard" href="${r.href}" target="_blank" rel="noopener"><div class="rico">${r.icon}</div><div><div class="rname">${r.name}</div><div class="rdesc">${r.desc}</div><span class="rtag tag-${r.tag}">${r.tagLabel}</span></div></a>`).join('')}</div></div>`).join('');
}

// ── 라우팅 ────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  setActiveNav(id);
  window.scrollTo({top:0,behavior:'smooth'});
}
function showCourse(courseId){
  renderCourse(courseId);
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-course').classList.add('active');
  setActiveNav(courseId);
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleW(cid,w){document.getElementById(`wi-${cid}-${w}`).classList.toggle('open');}

// ── 부팅 ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof SITE_DATA==='undefined')return;
  activeSemId=defaultSemId();
  renderSemSwitch(); renderNavTabs(); renderHero(); renderGrid(); renderResources();
  const a=_apEl();
  a.addEventListener('timeupdate',()=>{if(!a.duration)return;const f=document.getElementById('ap-fill');if(f)f.style.width=(a.currentTime/a.duration*100).toFixed(1)+'%';});
  a.addEventListener('ended',()=>{const b=document.getElementById('ap-play-btn');if(b)b.textContent='▶';apNext();});
  a.addEventListener('pause',()=>{const b=document.getElementById('ap-play-btn');if(b)b.textContent='▶';});
  a.addEventListener('play',()=>{const b=document.getElementById('ap-play-btn');if(b)b.textContent='⏸';});
});
</script>
