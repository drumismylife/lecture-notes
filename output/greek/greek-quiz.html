<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬라어 퀴즈 — 동사 해석 + 어휘</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --card: #161b27;
  --card2: #1e2538;
  --gold: #c9a84c;
  --gold-dim: #8a6e2f;
  --gold-glow: rgba(201,168,76,0.15);
  --greek: #f0d080;
  --blue: #7c9ed9;
  --red: #e07b6a;
  --red-bg: #3d1a1a;
  --green: #6fcf97;
  --green-bg: #1a2d1a;
  --text: #e8eaf0;
  --muted: #9ba3b8;
  --hint: #6b7490;
  --border: #2a3050;
  --purple: #b07ed9;
  --purple-bg: #1e1a2d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 48px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,158,217,0.04) 0%, transparent 60%);
  pointer-events: none;
}

/* ── 헤더 ── */
.header {
  text-align: center;
  margin-bottom: 24px;
  animation: fadeDown 0.6s ease;
}
.header-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.header-title {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.header-greek {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  font-style: italic;
  color: var(--muted);
  letter-spacing: 0.08em;
}

/* ── 탭 ── */
.tab-bar {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 560px;
  margin-bottom: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 5px;
  animation: fadeIn 0.4s ease;
}
.tab-btn {
  flex: 1;
  padding: 10px 8px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--muted);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1.4;
}
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.tab-btn.active {
  background: var(--card2);
  color: var(--gold);
  border: 1px solid var(--border);
}
.tab-btn .tab-sub {
  display: block;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 9px;
  color: var(--hint);
  margin-top: 2px;
  letter-spacing: 0;
}
.tab-btn.active .tab-sub { color: var(--gold-dim); }

/* ── 프로그레스 ── */
.progress-wrap {
  width: 100%;
  max-width: 560px;
  margin-bottom: 24px;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.progress-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.progress-score { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); }
.progress-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── 퀴즈 카드 ── */
.quiz-card {
  width: 100%;
  max-width: 560px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px 28px;
  position: relative;
  animation: cardIn 0.4s ease;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}
.quiz-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 16px 16px 0 0;
  opacity: 0.6;
}
.quiz-card.vocab-mode::before {
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
}
.question-num {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--hint);
  text-transform: uppercase;
  margin-bottom: 20px;
  text-align: center;
}
.question-word {
  text-align: center;
  margin-bottom: 36px;
  padding: 20px;
  background: rgba(240,208,128,0.04);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 12px;
}
.quiz-card.vocab-mode .question-word {
  background: rgba(176,126,217,0.04);
  border-color: rgba(176,126,217,0.2);
}
.greek-word {
  font-family: 'IM Fell English', serif;
  font-size: 48px;
  color: var(--greek);
  display: block;
  line-height: 1.2;
  letter-spacing: 0.02em;
}
.word-tag {
  display: inline-block;
  margin-top: 8px;
  font-size: 10px;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.15em;
  padding: 2px 10px;
  border-radius: 20px;
  background: rgba(176,126,217,0.12);
  color: var(--purple);
  border: 1px solid rgba(176,126,217,0.25);
}

/* ── 보기 버튼 ── */
.options { display: grid; gap: 10px; }
.option-btn {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s ease;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-btn:hover:not(:disabled) {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.08);
  transform: translateX(3px);
}
.vocab-mode .option-btn:hover:not(:disabled) {
  border-color: rgba(176,126,217,0.5);
  background: rgba(176,126,217,0.08);
}
.option-label {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--hint);
  min-width: 18px;
  font-weight: 600;
}
.option-btn.correct { border-color: var(--green); background: var(--green-bg); animation: pulse-green 0.4s ease; }
.option-btn.correct .option-label { color: var(--green); }
.option-btn.wrong { border-color: var(--red); background: var(--red-bg); animation: shake 0.3s ease; }
.option-btn.wrong .option-label { color: var(--red); }
.option-btn.reveal { border-color: var(--green); background: var(--green-bg); opacity: 0.6; }
.option-btn:disabled { cursor: default; }
.result-icon { margin-left: auto; font-size: 16px; opacity: 0; transition: opacity 0.2s; }
.option-btn.correct .result-icon,
.option-btn.wrong .result-icon,
.option-btn.reveal .result-icon { opacity: 1; }

/* ── 피드백 ── */
.feedback {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
  animation: fadeIn 0.3s ease;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: var(--green-bg); border-left: 3px solid var(--green); color: var(--green); }
.feedback.wrong-fb { background: var(--red-bg); border-left: 3px solid var(--red); color: #f0a090; }

/* ── 다음 버튼 ── */
.next-btn {
  width: 100%;
  max-width: 560px;
  margin-top: 16px;
  padding: 16px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.2s ease;
  display: none;
  animation: fadeIn 0.3s ease;
}
.next-btn.show { display: block; }
.next-btn:hover { background: var(--gold-glow); border-color: var(--gold); }
.next-btn.vocab { border-color: rgba(176,126,217,0.4); color: var(--purple); }
.next-btn.vocab:hover { background: rgba(176,126,217,0.08); border-color: var(--purple); }

/* ── 결과 화면 ── */
.result-screen {
  width: 100%;
  max-width: 560px;
  text-align: center;
  display: none;
  animation: cardIn 0.5s ease;
}
.result-screen.show { display: block; }
.result-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  background: radial-gradient(circle, rgba(201,168,76,0.1), transparent);
  box-shadow: 0 0 40px rgba(201,168,76,0.15);
}
.result-circle.vocab-circle {
  border-color: var(--purple);
  background: radial-gradient(circle, rgba(176,126,217,0.1), transparent);
  box-shadow: 0 0 40px rgba(176,126,217,0.15);
}
.result-num { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 700; color: var(--gold); line-height: 1; }
.result-circle.vocab-circle .result-num { color: var(--purple); }
.result-denom { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold-dim); }
.result-title { font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.result-screen.vocab-result .result-title { color: var(--purple); }
.result-msg { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.7; }
.result-review {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
  text-align: left;
}
.review-title {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--hint);
  margin-bottom: 12px;
}
.review-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  line-height: 1.6;
}
.review-item:last-child { border-bottom: none; }
.review-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.review-greek { font-family: 'IM Fell English', serif; font-size: 16px; color: var(--greek); min-width: 120px; }
.review-answer { color: var(--muted); }
.review-answer strong { color: var(--text); }
.retry-btn {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  border: none;
  border-radius: 10px;
  color: #0d1117;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 20px rgba(201,168,76,0.3);
}
.retry-btn.vocab-retry {
  background: linear-gradient(135deg, #7a4fa0, var(--purple));
  box-shadow: 0 4px 20px rgba(176,126,217,0.3);
}
.retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(201,168,76,0.4); }
.retry-btn.vocab-retry:hover { box-shadow: 0 6px 30px rgba(176,126,217,0.4); }

/* ── 애니메이션 ── */
@keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes cardIn { from{opacity:0;transform:translateY(20px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes pulse-green { 0%{box-shadow:0 0 0 0 rgba(111,207,151,0.4)} 100%{box-shadow:0 0 0 8px rgba(111,207,151,0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>

<style id="lnotes-back-btn-style">

</style>
</head>

<div class="header">
  <div class="header-label">Κοινὴ Ἑλληνική · 헬라어 I</div>
  <div class="header-title" id="mainTitle">동사 해석 퀴즈</div>
  <div class="header-greek" id="mainSubtitle">Verb Parsing & Translation</div>
</div>

<!-- 탭 -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab1" onclick="switchTab('verb')">
    탭 1 — 동사
    <span class="tab-sub">활용형 해석</span>
  </button>
  <button class="tab-btn" id="tab2" onclick="switchTab('vocab')">
    탭 2 — 어휘
    <span class="tab-sub">32개 단어 뜻 맞히기</span>
  </button>
  <button class="tab-btn" id="tab3" onclick="switchTab('stem')">
    탭 3 — 어간 변화
    <span class="tab-sub">제2단순과거 불규칙 어간</span>
  </button>
</div>

<!-- 프로그레스 -->
<div class="progress-wrap" id="progressWrap">
  <div class="progress-info">
    <span class="progress-label" id="progressLabel">문제 1 / 10</span>
    <span class="progress-score" id="scoreLabel">0 / 0</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<!-- 어간 참고표 (탭 3 전용) -->
<details id="stemRef" style="display:none;margin-bottom:16px;max-width:540px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
  <summary style="cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;">
    📖 어간 참고표 (탭 하여 펼치기)
  </summary>
  <table id="stemRefTable" style="width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;"></table>
</details>

<!-- 퀴즈 카드 -->
<div class="quiz-card" id="quizCard">
  <div class="question-num" id="questionNum">QUESTION 1</div>
  <div class="question-word">
    <span class="greek-word" id="greekWord">λύω</span>
    <span class="word-tag" id="wordTag" style="display:none"></span>
  </div>
  <div class="options" id="optionsContainer"></div>
  <div class="feedback" id="feedback"></div>
</div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>

<!-- 결과 -->
<div class="result-screen" id="resultScreen">
  <div class="result-circle" id="resultCircle">
    <div class="result-num" id="resultNum">0</div>
    <div class="result-denom">/ 10</div>
  </div>
  <div class="result-title" id="resultTitle">수고하셨습니다</div>
  <div class="result-msg" id="resultMsg"></div>
  <div class="result-review" id="resultReview">
    <div class="review-title">REVIEW — 오답 노트</div>
    <div id="reviewItems"></div>
  </div>
  <button class="retry-btn" id="retryBtn" onclick="retrySession()">새 세션 시작</button>
</div>

<script>
// ════════════════════════════════════════════════
// 1. 어휘 데이터 (32개)
// ════════════════════════════════════════════════
const VOCAB_LIST = [
  // 동사 14개
  { greek:"λύω",       pron:"뤼오",     kr:"풀다",            pos:"동사" },
  { greek:"ἀκούω",     pron:"아쿠오",   kr:"듣다",            pos:"동사" },
  { greek:"βλέπω",     pron:"블레포",   kr:"보다",            pos:"동사" },
  { greek:"γινώσκω",   pron:"기노스코", kr:"알다",            pos:"동사" },
  { greek:"γράφω",     pron:"그라포",   kr:"쓰다",            pos:"동사" },
  { greek:"διδάσκω",   pron:"디다스코", kr:"가르치다",        pos:"동사" },
  { greek:"λαμβάνω",   pron:"람바노",   kr:"취하다",          pos:"동사" },
  { greek:"λέγω",      pron:"레고",     kr:"말하다",          pos:"동사" },
  { greek:"πιστεύω",   pron:"피스튜오", kr:"믿다",            pos:"동사" },
  { greek:"θεραπεύω",  pron:"떼라퓨오", kr:"치료하다",        pos:"동사" },
  { greek:"ἐγείρω",    pron:"에게이로", kr:"일으키다",        pos:"동사" },
  { greek:"βαπτίζω",   pron:"밥티조",   kr:"침례를 주다",     pos:"동사" },
  { greek:"ἔχω",       pron:"에코",     kr:"가지고 있다",     pos:"동사" },
  { greek:"σῴζω",      pron:"소조",     kr:"구원하다 / 치료하다", pos:"동사", alt:["구원하다","치료하다"] },
  // 명사 11개
  { greek:"λόγος",     pron:"로고스",   kr:"말씀",            pos:"명사" },
  { greek:"θεός",      pron:"떼오스",   kr:"하나님",          pos:"명사" },
  { greek:"φῶς",       pron:"포스",     kr:"빛",              pos:"명사" },
  { greek:"ἄνθρωπος",  pron:"안뜨로포스",kr:"사람",           pos:"명사" },
  { greek:"κόσμος",    pron:"코스모스", kr:"세상",            pos:"명사" },
  { greek:"ἀπόστολος", pron:"아포스톨로스",kr:"사도",         pos:"명사" },
  { greek:"νόμος",     pron:"노모스",   kr:"율법",            pos:"명사" },
  { greek:"υἱός",      pron:"휘오스",   kr:"아들",            pos:"명사" },
  { greek:"ἀδελφός",   pron:"아델포스", kr:"형제",            pos:"명사" },
  { greek:"δῶρον",     pron:"도론",     kr:"선물",            pos:"명사" },
  { greek:"ζωή",       pron:"조에",     kr:"생명",            pos:"명사" },
  // 형용사 6개
  { greek:"ἀγαθός",    pron:"아가토스", kr:"좋은, 착한",      pos:"형용사" },
  { greek:"κακός",     pron:"카코스",   kr:"나쁜",            pos:"형용사" },
  { greek:"καλός",     pron:"칼로스",   kr:"좋은, 아름다운",  pos:"형용사" },
  { greek:"μικρός",    pron:"미크로스", kr:"작은, 적은",      pos:"형용사" },
  { greek:"νεκρός",    pron:"네크로스", kr:"죽은",            pos:"형용사" },
  { greek:"δίκαιος",   pron:"디카이오스",kr:"옳은",           pos:"형용사" },

  { greek:"καί",       pron:"카이",     kr:"그리고",          pos:"접속사" },

function buildAnswer(pLabel,voice,tense,kr,alts){
  let vp = voice==="능동태"?applyActive(kr,tense):voice==="수동태"?applyPassive(kr,tense):applyMiddle(kr,tense);
  return `${pLabel} ${vp}`;
}
function isCorrectVerb(item,chosen){
  const correct=[item.answer];
  if(item.alts&&item.alts.length>0) item.alts.forEach(a=>correct.push(buildAnswer(item.personLabel,item.voice,item.tense,a,[])));
  return correct.includes(chosen);
}
function buildVerbPool(){
  const pool=[];
  verbDefs.forEach(d=>{
    const verb=d.v; const kr=VERBS[verb].kr; const alts=VERBS[verb].alt;
    TENSE_KEYS.forEach(tense=>{
      const td=VERB_FORMS[verb][tense]; if(!td) return;
      VOICE_KEYS.forEach(voice=>{
        const forms=td[voice]; if(!forms) return;
        forms.forEach((form,idx)=>{
          const answer=buildAnswer(PERSON_LABELS[idx],voice,tense,kr,alts);
          pool.push({greek:form,verb,tense,voice,person:idx,personLabel:PERSON_LABELS[idx],answer,kr,alts});
        });
      });
    });
  });
  return pool;
}
function generateVerbOptions(item,pool){
  const correct=item.answer;
  const opts=new Set([correct]);
  const same=pool.filter(p=>p.verb===item.verb&&p.tense===item.tense&&p.voice===item.voice&&p.person!==item.person&&p.answer!==correct);
  const diffVerb=pool.filter(p=>p.verb!==item.verb&&p.tense===item.tense&&p.voice===item.voice&&p.person===item.person&&p.answer!==correct);
  const diffTense=pool.filter(p=>p.verb===item.verb&&p.tense!==item.tense&&p.voice===item.voice&&p.person===item.person&&p.answer!==correct);
  const cands=shuffle([...same,...diffVerb,...diffTense]);
  for(const c of cands){if(opts.size>=4)break;if(!opts.has(c.answer))opts.add(c.answer);}
  const others=shuffle(pool.filter(p=>p.answer!==correct&&!opts.has(p.answer)));
  for(const c of others){if(opts.size>=4)break;opts.add(c.answer);}
  return [...opts];
}

  const correct = item.alt ? item.alt[0] : item.kr;
  const opts = new Set([item.kr]);
  // 같은 품사 우선
  const samePos = VOCAB_LIST.filter(v=>v.pos===item.pos && v.greek!==item.greek);
  const diffPos = VOCAB_LIST.filter(v=>v.pos!==item.pos && v.greek!==item.greek);
  const cands = shuffle([...samePos,...diffPos]);
  for(const c of cands){
    if(opts.size>=4) break;
    const val = c.alt ? c.alt[0] : c.kr;
    if(!opts.has(c.kr)) opts.add(c.kr);
  }
  return shuffle([...opts]);
}
function isCorrectVocab(item, chosen){
  if(item.alt && item.alt.length>0) return item.alt.includes(chosen) || chosen===item.kr;
  return chosen===item.kr;
}

// ════════════════════════════════════════════════
// 4-B. 어간 퀴즈 로직
// ════════════════════════════════════════════════
function buildStemPool(){
  const pool = [];
  const VM = { act:'능동', mid:'중간', pass:'수동' };
  AOR2_DATA.forEach(d => {
    // Type A: 주어진 활용형 → 원형 맞히기 (능동+중간 12형씩)
    ['act','mid'].forEach(v => {
      d[v].forEach((form, i) => {
        pool.push({
          type:'A', greek:form, answer:d.verb,
          options: AOR2_DATA.map(x => x.verb),
          hint:`${PERSON_LABELS_STEM[i]} ${VM[v]}태 — 이 형태의 원형은?`,
          feedback:`정답: ${d.verb} (${d.meaning})\n💡 ${d.note}`,
          d
        });
      });
    });
    // Type B: 원형 → 제2단순과거 어간 맞히기
    pool.push({
      type:'B', greek:d.verb, answer:d.stem,
      options: AOR2_DATA.map(x => x.stem),
      hint:'제2단순과거 어간은?',
      feedback:`정답: ${d.stem} (${d.stemPron})\n💡 ${d.note}`,
      d
    });
    // Type C: 원형 → 제2단순과거 1인칭 단수 맞히기 (능동/중간)
    ['act','mid'].forEach(v => {
      pool.push({
        type:'C', greek:d.verb, answer:d[v][0],
        options: AOR2_DATA.map(x => x[v][0]),
        hint:`제2단순과거 ${VM[v]}태 1인칭 단수는?`,
        feedback:`정답: ${d[v][0]}\n💡 ${d.note}`,
        d
      });
    });
  });
  return pool;
}
function isCorrectStem(item, chosen){ return item.answer === chosen; }

function buildStemRefTable(){
  const tbl = document.getElementById('stemRefTable');
  if(!tbl) return;
  const hdStyle = 'padding:6px 10px;text-align:left;color:var(--muted);font-size:10px;letter-spacing:0.06em;border-bottom:1px solid var(--border);';
  const tdStyle = 'padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.05);';
  const grStyle = 'font-family:"Times New Roman",serif;color:var(--greek);font-size:14px;';
  tbl.innerHTML = `
    <thead><tr>
      <th style="${hdStyle}">원형</th>
      <th style="${hdStyle}">의미</th>
      <th style="${hdStyle}">현재어간</th>
      <th style="${hdStyle}">제2과거어간</th>
      <th style="${hdStyle}">1인칭 단수</th>
    </tr></thead>
    <tbody>
      ${AOR2_DATA.map(d=>`<tr>
        <td style="${tdStyle}"><span style="${grStyle}">${d.verb}</span> <span style="color:var(--hint);font-size:10px">${d.pron}</span></td>
        <td style="${tdStyle};color:var(--muted)">${d.meaning}</td>
        <td style="${tdStyle}"><span style="${grStyle};color:var(--blue);font-size:12px">${d.note.split('→')[0].replace('현재어간 ','').trim()}</span></td>
        <td style="${tdStyle}"><span style="${grStyle};color:var(--gold)">${d.stem}</span> <span style="color:var(--hint);font-size:10px">${d.stemPron}</span></td>
        <td style="${tdStyle}"><span style="${grStyle}">${d.act[0]}</span></td>
      </tr>`).join('')}
    </tbody>`;
}

// ════════════════════════════════════════════════
// 5. 공통 상태 & 탭 전환
// ════════════════════════════════════════════════
let currentTab = 'verb';
let verbPool = [];
let vocabPool = [];
let stemPool = [];
let session = [];
let current = 0;
let score = 0;
let answered = false;
let sessionLog = [];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function switchTab(tab){
  if(currentTab===tab) return;
  currentTab=tab;
  document.getElementById('tab1').classList.toggle('active', tab==='verb');
  document.getElementById('tab2').classList.toggle('active', tab==='vocab');
  document.getElementById('tab3').classList.toggle('active', tab==='stem');

  const stemRef = document.getElementById('stemRef');

  if(tab==='verb'){
    document.getElementById('mainTitle').textContent='동사 해석 퀴즈';
    document.getElementById('mainSubtitle').textContent='Verb Parsing & Translation';
    document.getElementById('nextBtn').className='next-btn';
    document.getElementById('retryBtn').className='retry-btn';
    document.getElementById('quizCard').classList.remove('vocab-mode');
    document.getElementById('resultScreen').classList.remove('vocab-result');
    document.getElementById('resultCircle').classList.remove('vocab-circle');
    stemRef.style.display = 'none';
  } else if(tab==='vocab'){
    document.getElementById('mainTitle').textContent='어휘 퀴즈';
    document.getElementById('mainSubtitle').textContent='Vocabulary · 32 Words';
    document.getElementById('nextBtn').className='next-btn vocab';
    document.getElementById('quizCard').classList.add('vocab-mode');
    document.getElementById('resultScreen').classList.add('vocab-result');
    document.getElementById('resultCircle').classList.add('vocab-circle');
    document.getElementById('retryBtn').className='retry-btn vocab-retry';
    stemRef.style.display = 'none';
  } else { // stem
    document.getElementById('mainTitle').textContent='어간 변화 퀴즈';
    document.getElementById('mainSubtitle').textContent='제2단순과거 불규칙 어간 · 4 Verbs';
    document.getElementById('nextBtn').className='next-btn';
    document.getElementById('retryBtn').className='retry-btn';
    document.getElementById('quizCard').classList.remove('vocab-mode');
    document.getElementById('resultScreen').classList.remove('vocab-result');
    document.getElementById('resultCircle').classList.remove('vocab-circle');
    stemRef.style.display = 'block';
    buildStemRefTable();
  }

  // 결과화면 숨기고 새 세션 시작
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizCard').style.display='block';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('nextBtn').classList.remove('show');
  startSession();
}

function startSession(){
  if(currentTab==='verb'){
    verbPool=buildVerbPool();
    session=shuffle(verbPool).slice(0,10);
  } else if(currentTab==='vocab'){
    vocabPool=buildVocabPool();
    session=shuffle(vocabPool).slice(0,10);
  } else { // stem
    stemPool=buildStemPool();
    session=shuffle(stemPool).slice(0,10);
  }
  current=0; score=0; sessionLog=[]; answered=false;
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizCard').style.display='block';
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('nextBtn').classList.remove('show');
  renderQuestion();
}

function retrySession(){ startSession(); }

function renderQuestion(){
  answered=false;
  const item=session[current];

  document.getElementById('questionNum').textContent=`QUESTION ${current+1}`;
  document.getElementById('greekWord').textContent=item.greek;
  document.getElementById('progressLabel').textContent=`문제 ${current+1} / 10`;
  document.getElementById('scoreLabel').textContent=`${score} / ${current}`;
  document.getElementById('progressFill').style.width=`${(current/10)*100}%`;

  // 태그 표시
  const tag=document.getElementById('wordTag');
  if(currentTab==='vocab'){
    tag.textContent=item.pos; tag.style.display='inline-block';
  } else if(currentTab==='stem'){
    tag.textContent=item.hint; tag.style.display='inline-block';
  } else {
    tag.style.display='none';
  }

  // 보기 생성
  let opts;
  if(currentTab==='verb')       opts = generateVerbOptions(item, verbPool.length?verbPool:buildVerbPool());
  else if(currentTab==='vocab') opts = generateVocabOptions(item);
  else                          opts = shuffle([...item.options]); // stem: fixed 4 options
  const shuffled=shuffle(opts);

  const container=document.getElementById('optionsContainer');
  container.innerHTML='';
  const labels=['①','②','③','④'];
  shuffled.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<span class="option-label">${labels[i]}</span><span>${opt}</span><span class="result-icon"></span>`;
    btn.onclick=()=>selectOption(btn,opt,item,shuffled);
    container.appendChild(btn);
  });

  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.textContent='';

  const card=document.getElementById('quizCard');
  card.style.animation='none'; card.offsetHeight; card.style.animation='cardIn 0.35s ease';
}

function selectOption(btn,chosen,item,opts){
  if(answered) return;
  answered=true;

  const correct = currentTab==='verb' ? isCorrectVerb(item,chosen)
                : currentTab==='vocab' ? isCorrectVocab(item,chosen)
                : isCorrectStem(item,chosen);
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>{
    b.disabled=true;
    const text=b.querySelector('span:nth-child(2)').textContent;
    const icon=b.querySelector('.result-icon');
    const isRight = currentTab==='verb' ? isCorrectVerb(item,text)
                  : currentTab==='vocab' ? isCorrectVocab(item,text)
                  : isCorrectStem(item,text);
    if(isRight){ b.classList.add('reveal'); icon.textContent='✓'; }
  });

  if(correct){
    btn.classList.remove('reveal'); btn.classList.add('correct');
    btn.querySelector('.result-icon').textContent='✓';
    score++;
    showFeedback(true,item);
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.result-icon').textContent='✗';
    showFeedback(false,item);
  }

  sessionLog.push({item,chosen,correct});
  document.getElementById('scoreLabel').textContent=`${score} / ${current+1}`;
  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(correct,item){
  const fb=document.getElementById('feedback');
  if(currentTab==='verb'){
    const td=item.tense==='단순과거'?'제1단순과거':item.tense;
    if(correct){ fb.className='feedback show correct-fb'; fb.textContent=`✓ 정답! — ${item.greek} = ${td} ${item.voice} ${item.personLabel} "${item.answer}"`; }
    else { fb.className='feedback show wrong-fb'; fb.textContent=`✗ 오답 — 정답: ${td} ${item.voice} ${item.personLabel} "${item.answer}"`; }
  } else if(currentTab==='vocab'){
    if(correct){ fb.className='feedback show correct-fb'; fb.textContent=`✓ 정답! — ${item.greek} (${item.pron}) = ${item.kr}`; }
    else { fb.className='feedback show wrong-fb'; fb.textContent=`✗ 오답 — 정답: ${item.kr}  (${item.greek} · ${item.pron})`; }
  } else { // stem
    if(correct){ fb.className='feedback show correct-fb'; fb.textContent=`✓ 정답! — ${item.answer}`; }
    else { fb.className='feedback show wrong-fb'; fb.textContent=`✗ 오답 — ${item.feedback}`; }
  }
}

function nextQuestion(){
  current++;
  document.getElementById('nextBtn').classList.remove('show');
  if(current>=10) showResult();
  else renderQuestion();
}

function showResult(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('progressWrap').style.display='none';
  document.getElementById('nextBtn').classList.remove('show');

  const rs=document.getElementById('resultScreen');
  rs.classList.add('show');
  document.getElementById('resultNum').textContent=score;

  let title='',msg='';
  if(score===10){title='완벽합니다! 🏆';msg='10문제 모두 정답입니다.';}
  else if(score>=8){title='우수합니다! ✨';msg=`${score}문제 정답. 거의 완벽합니다.`;}
  else if(score>=6){title='양호합니다 📚';msg=`${score}문제 정답. 조금 더 연습하세요.`;}
  else if(score>=4){title='계속 노력하세요 💪';msg=`${score}문제 정답. 변화표를 다시 확인하세요.`;}
  else{title='더 많은 연습이 필요합니다 📖';msg=`${score}문제 정답. 기본부터 다시 복습하세요.`;}
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultMsg').textContent=msg;

  const wrongItems=sessionLog.filter(l=>!l.correct);
  const reviewEl=document.getElementById('resultReview');
  const reviewItems=document.getElementById('reviewItems');
  if(wrongItems.length===0){ reviewEl.style.display='none'; }
  else {
    reviewEl.style.display='block'; reviewItems.innerHTML='';
    wrongItems.forEach(log=>{
      const div=document.createElement('div');
      div.className='review-item';
      if(currentTab==='verb'){
        const td=log.item.tense==='단순과거'?'제1단순과거':log.item.tense;
        div.innerHTML=`<span class="review-icon">✗</span><span class="review-greek">${log.item.greek}</span><span class="review-answer">내 답: <span style="color:var(--red)">${log.chosen}</span><br>정답: <strong>${log.item.answer}</strong><br><span style="color:var(--hint);font-size:11px">${td} · ${log.item.voice} · ${log.item.personLabel}</span></span>`;
      } else if(currentTab==='vocab'){
        div.innerHTML=`<span class="review-icon">✗</span><span class="review-greek">${log.item.greek}</span><span class="review-answer">내 답: <span style="color:var(--red)">${log.chosen}</span><br>정답: <strong>${log.item.kr}</strong><br><span style="color:var(--hint);font-size:11px">${log.item.pos} · ${log.item.pron}</span></span>`;
      } else { // stem
        div.innerHTML=`<span class="review-icon">✗</span><span class="review-greek">${log.item.greek}</span><span class="review-answer">내 답: <span style="color:var(--red)">${log.chosen}</span><br>정답: <strong>${log.item.answer}</strong><br><span style="color:var(--hint);font-size:11px">${log.item.hint}</span></span>`;
      }
      reviewItems.appendChild(div);
    });
  }
}

// 초기 시작
verbPool=buildVerbPool();
startSession();
</script>
