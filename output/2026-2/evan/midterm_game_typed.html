<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전도학개론 중간고사 랜덤 카드 퀴즈 (주관식)</title>

<style id="lnotes-back-btn-style">
#lnotes-back-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: rgba(20, 20, 28, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(180, 140, 60, 0.35);
  border-radius: 20px;
  color: #c9a84c;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  letter-spacing: 0.02em;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  cursor: pointer;
}
#lnotes-back-btn:hover {
  background: rgba(30, 28, 20, 0.95);
  border-color: rgba(180, 140, 60, 0.7);
  transform: translateX(-2px);
}
#lnotes-back-btn svg {
  flex-shrink: 0;
}
@media (max-width: 600px) {
  #lnotes-back-btn {
    top: 10px;
    left: 10px;
    padding: 7px 11px;
    font-size: 12px;
  }
}
</style>

<style>
:root {
  --bg: #f7f4fb;
  --card: #ffffff;
  --ink: #241f2e;
  --mut: #7b7388;
  --line: #e5def0;
  --acc: #7b3fa0;
  --acc2: #a35bd1;
  --accsoft: #f1e8f9;
  --ok: #15803d;
  --okbg: #e7f7ec;
  --bad: #c0262d;
  --badbg: #fdecec;
  --shadow: 0 1px 3px rgba(60,20,90,.06), 0 6px 20px rgba(60,20,90,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14101b;
    --card: #1d1828;
    --ink: #efeaf7;
    --mut: #a79fb8;
    --line: #33294a;
    --acc: #c79be8;
    --acc2: #b77fe0;
    --accsoft: #2a1f3c;
    --ok: #6fdc90;
    --okbg: #14301f;
    --bad: #ff8c88;
    --badbg: #3b1a1c;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.7 Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 88px;
}

/* Top Status Header */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 48px;
  margin-bottom: 12px;
}
.combo-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: .95rem;
  font-weight: 800;
  color: #ea580c;
  background: rgba(234, 88, 12, 0.12);
  padding: 4px 14px;
  border-radius: 999px;
  transition: transform .15s ease-out;
}
.combo-badge.pulse {
  transform: scale(1.15);
}
.btn-reset {
  font: inherit;
  font-size: .84rem;
  font-weight: 600;
  color: var(--mut);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  cursor: pointer;
  transition: .15s;
}
.btn-reset:hover {
  color: var(--ink);
  border-color: var(--acc);
}

/* Progress line & bar */
.progress-bar-wrap {
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--acc), var(--acc2));
  transition: width .25s ease-out;
}
.progress-line {
  font-size: .9rem;
  font-weight: 600;
  color: var(--mut);
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
}
.progress-line .again-tag {
  color: #d97706;
  font-weight: 700;
}

/* Card container */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 20px 18px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}
.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.chip {
  font-size: .76rem;
  font-weight: 700;
  color: var(--mut);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 1px 10px;
  line-height: 1.7;
}
.chip.pri {
  background: var(--accsoft);
  color: var(--acc);
  border-color: transparent;
}
.sc {
  margin-left: auto;
  font-weight: 800;
  font-size: .98rem;
  color: var(--mut);
}
.sc.full { color: var(--ok); }
.sc.zero { color: var(--bad); }

/* Card body & contents */
.card-body {
  font-size: 1.02rem;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.tx { white-space: pre-line; margin: .4em 0; }
.shown { font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin: .5em 0; }
.row > .tx, .row > .grp, .row > .tbl {
  flex: 1 1 180px;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 10px;
  margin: 0;
}
.op { flex: none; font-size: 1.4rem; font-weight: 800; color: var(--acc); padding: 0 2px; align-self: center; }
.grp { border-left: 3px solid var(--line); padding-left: 10px; margin: .5em 0; }
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: .5em 0; }
.tbl table { border-collapse: collapse; width: 100%; }
.tbl td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; white-space: pre-line; }
#s35 .tbl table { min-width: 460px; }

/* Blanks styling */
.cell { display: inline-block; vertical-align: baseline; margin: 2px 3px; max-width: 100%; white-space: normal; }
.cell.wide { display: block; margin: 6px 0; }
input.blank, textarea.blank {
  font: inherit;
  font-size: 17px;
  color: var(--ink);
  background: var(--accsoft);
  border: 0;
  border-bottom: 2.5px solid var(--acc);
  border-radius: 8px 8px 0 0;
  padding: 2px 8px;
  max-width: 100%;
  transition: .15s;
  vertical-align: baseline;
}
textarea.blank {
  display: block;
  width: 100%;
  border: 1.5px solid var(--line);
  border-bottom: 2.5px solid var(--acc);
  border-radius: 10px;
  padding: 8px 10px;
  line-height: 1.55;
  resize: vertical;
}
input.blank:focus, textarea.blank:focus {
  outline: none;
  background: var(--card);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 30%, transparent);
}
.blank.ok { border-bottom-color: var(--ok); background: var(--okbg); color: var(--ok); }
.blank.bad { border-bottom-color: var(--bad); background: var(--badbg); color: var(--bad); }
.mark { display: inline-block; margin-left: 3px; font-weight: 800; font-size: .95rem; }
.mark.ok { color: var(--ok); }
.mark.bad { color: var(--bad); }
.chipans {
  display: block;
  margin-top: 3px;
  padding: 1px 9px;
  border-radius: 8px;
  background: var(--badbg);
  color: var(--bad);
  font-size: .84rem;
  font-weight: 700;
  line-height: 1.6;
  white-space: pre-wrap;
  width: fit-content;
  max-width: 100%;
}
.chipans::before { content: "정답 "; opacity: .75; font-weight: 600; }
.chipans[hidden] { display: none; }
.hint { display: inline-block; margin-left: 4px; font-size: .78rem; color: var(--mut); letter-spacing: .08em; }

.fixed { font-weight: 700; }

/* Control Actions */
.act-bar {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}
button.pri {
  flex: 2;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  color: #ffffff;
  cursor: pointer;
  transition: transform .1s, opacity .15s;
  box-shadow: 0 3px 10px rgba(123, 63, 160, 0.25);
}
button.pri:hover { opacity: .95; }
button.pri:active { transform: scale(.98); }
button.sec {
  flex: 1;
  font: inherit;
  font-size: .95rem;
  font-weight: 600;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--mut);
  cursor: pointer;
  transition: .15s;
}
button.sec:hover { color: var(--ink); border-color: var(--acc); background: var(--accsoft); }

/* Screen overlays (Start & Done) */
.screen {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 36px 24px 30px;
  text-align: center;
  box-shadow: var(--shadow);
  margin-top: 32px;
}
.screen h1 {
  margin: 0 0 10px;
  font-size: 1.65rem;
  letter-spacing: -.02em;
  color: var(--acc);
}
.screen p {
  margin: 0 0 24px;
  color: var(--mut);
  font-size: .95rem;
  line-height: 1.6;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0 auto 28px;
  max-width: 380px;
  text-align: left;
}
.filter-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: .15s;
}
.filter-opt:hover, .filter-opt.active {
  border-color: var(--acc);
  background: var(--accsoft);
}
.filter-opt input {
  margin: 0;
  accent-color: var(--acc);
  width: 18px;
  height: 18px;
}
.filter-title {
  font-weight: 700;
  font-size: .98rem;
}
.filter-desc {
  font-size: .8rem;
  color: var(--mut);
  margin-top: 2px;
}
.screen-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 320px;
  margin: 0 auto;
}

@media (max-width: 480px) {
  .wrap { padding: 12px 12px 80px; }
  .card { padding: 16px 14px 14px; border-radius: 16px; }
  .top-nav { margin-top: 44px; }
  button.pri { font-size: 1rem; padding: 11px 18px; }
}
</style>
</head>
<body>
<a id="lnotes-back-btn" href="../../../index.html">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
    <path d="M9 2L4 7L9 12" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  강의 목록
</a>
<div class="wrap">

  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <h1>전도학 중간고사<br>랜덤 카드 퀴즈 (주관식)</h1>
    <p>45개 슬라이드 카드를 1장씩 무작위 순서로 훈련합니다.<br>하나라도 틀린 카드는 5~8장 뒤에 자동으로 다시 출제됩니다.</p>
    
    <div class="filter-group">
      <label class="filter-opt active" data-filter="all">
        <input type="radio" name="slide-range" value="all" checked>
        <div>
          <div class="filter-title">전체 범위 (45개 카드 · 183빈칸)</div>
          <div class="filter-desc">1~48번 슬라이드 전체</div>
        </div>
      </label>
      <label class="filter-opt" data-filter="part1">
        <input type="radio" name="slide-range" value="part1">
        <div>
          <div class="filter-title">전반부 (23개 카드 · 79빈칸)</div>
          <div class="filter-desc">1~26번 슬라이드</div>
        </div>
      </label>
      <label class="filter-opt" data-filter="part2">
        <input type="radio" name="slide-range" value="part2">
        <div>
          <div class="filter-title">후반부 (22개 카드 · 104빈칸)</div>
          <div class="filter-desc">27~48번 슬라이드</div>
        </div>
      </label>
    </div>

    <div class="screen-actions">
      <button class="pri" id="btn-start">게임 시작</button>
      <button class="btn-reset" id="btn-resume" style="display:none; padding: 10px 18px; font-size: .95rem;">이어서 풀기</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" style="display:none;">
    <div class="top-nav">
      <div class="combo-badge" id="combo-badge" style="display:none;">🔥 <span id="combo-num">0</span> 연속</div>
      <button class="btn-reset" id="btn-restart">처음부터</button>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <div class="progress-line">
      <span id="progress-text">남은 카드 45 / 45</span>
      <span class="again-tag" id="again-text" style="display:none;">다시 풀 카드 0</span>
    </div>

    <div class="card" id="active-card-container">
      <div class="card-header">
        <span class="chip pri" id="c-slide">슬라이드</span>
        <span class="chip" id="c-blanks">빈칸</span>
        <span class="sc" id="c-score"></span>
      </div>
      <div class="card-body" id="c-body"></div>
    </div>

    <div class="act-bar">
      <button class="pri" id="btn-action">채점</button>
      <button class="sec" id="btn-card-reset">다시 풀기</button>
    </div>
  </div>

  <!-- Completion Screen -->
  <div id="done-screen" class="screen" style="display:none;">
    <h1>🎉 축하합니다!</h1>
    <p>선택한 범위의 모든 카드를 마스터했습니다!<br>틀린 카드까지 전부 복습을 완료하였습니다.</p>
    <div class="screen-actions">
      <button class="pri" id="btn-replay">처음부터 다시 풀기</button>
    </div>
  </div>

</div>

<script>
const CARDS = [{"card_id": "s2", "slide_no": 2, "slide_str": "슬라이드 2", "blank_count": 4, "ans": [{"a": "Response (반응)을 잘하기", "alt": []}, {"a": "“들어주셔서 감사합니다”", "alt": []}, {"a": "“나눠주셔서 감사합니다. 예쁘다, 아름답다, 탁월하다!”", "alt": []}, {"a": "“나눠주셔서 감사합니다. 멋있다, 훌륭하다, 탁월하다!”", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tbl\"><table><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:22.7em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n① 본인얘기 끝날때는<span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:16.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>라고 마침.\n\n②그러면 나머지분들이  일제히\n자매일때: <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"2\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>하고 박수\n\n형제일때:<span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"3\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>하고 박수\n\n당신이 한 나눔은 우리에게 소중하며, 당신이 어떤 얘기를 하던지 우리는 그것을 소중히 여긴다는 의미입니다.</td></tr></table></div></div>"}, {"card_id": "s3", "slide_no": 3, "slide_str": "슬라이드 3", "blank_count": 1, "ans": [{"a": "L.R.스카보로", "alt": ["스카보로"]}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 신학교에서 전도학(Evangelism)을 정규과목으로 처음으로 가르친 사람 이름은?\n<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:11.2em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n1908년 미국 텍사스 포트워스에 위치한 Southwestern Baptist Theological Seminary에서 B.H. Carroll(카롤) 총장이 신학교 설립과 동시에 전도학((Chair of Evangelism, 별칭 \"Chair of Fire\")을 정규과목으로 만들고, 스카보로를 그 첫 담당 교수로 직접 지명\n\n『Recruits for World Conquests』, 『With Christ After the Lost』\n\n신학교에서의 전도학 교육을 체계화하고, 실제 목회 현장과 연계하여 수많은 목회자와 선교사에게 영향을 끼침\n1915년부터 1942년까지 Southwestern 의 2대 총장</div></div>"}, {"card_id": "s4", "slide_no": 4, "slide_str": "슬라이드 4", "blank_count": 1, "ans": [{"a": "로이피쉬", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. Scarborough의 전도학 유산을  계승하고 발전 Southwestern Seminary에서 50년 가까이 봉직하며 전도학 교수, 학장 역임. 남침례교(SBC) 내에서 “전도(Evangelism)”와 거의 동의어로 여겨졌던 교수의 이름은? <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n『Dare to Share』, 『Giving a Good Invitation』</div></div>"}, {"card_id": "s5", "slide_no": 5, "slide_str": "슬라이드 5", "blank_count": 5, "ans": [{"a": "유앙겔리온", "alt": []}, {"a": "바사르", "alt": []}, {"a": "좋은", "alt": []}, {"a": "소식", "alt": []}, {"a": "유앙겔리조마이", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 복음의 어원적 정의\n\n명사: 복음, 福音, Gospel, 헬 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> εὐαγγέλιον, 히브리어 בּשׂר <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>(basar)\n\nεὖ(eu,<span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, 기쁜) + ἄγγελος(angelos, 전하는 자, <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>)\nGood +  News = Goodnews (Gospel) = 좋은 소식\n\n동사: <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> εὐαγγελίζομαι (euangelizomai),\n“좋은 소식을 전하다, 복음을 선포하다”\n\n헬라·로마 사회에서는 “euangelion”이 황제의 승리, 즉위, 평화 선포 같은 “기쁜 소식”을 가리킬 때 사용</div></div>"}, {"card_id": "s7", "slide_no": 7, "slide_str": "슬라이드 7", "blank_count": 5, "ans": [{"a": "하나님은 누구신가?", "alt": []}, {"a": "인간의 문제", "alt": []}, {"a": "하나님의 해법", "alt": []}, {"a": "인간의 반응", "alt": []}, {"a": "성화", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 복음 메세지의 5가지 핵심을 쓰십시오\n\n1.<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n2.<span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n3.<span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n4. <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n5.<span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div></div>"}, {"card_id": "s8", "slide_no": 8, "slide_str": "슬라이드 8", "blank_count": 5, "ans": [{"a": "YHWH", "alt": []}, {"a": "야훼", "alt": []}, {"a": "세오스(θεὸς)", "alt": ["세오스"]}, {"a": "God", "alt": []}, {"a": "하나님", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\"><span class=\"shown\">하나님은 누구신가</span>?</div><div class=\"tx\">* 우리가 부르는 신의 이름, 신명(神名)에 대해</div><div class=\"tx\">Q. ‘온세상의 창조자’, ‘전능하시고 전지하신 분’, ‘유일한 신’\n이 분을 뭐라고 부르는가?</div><div class=\"tbl\"><table><tr><td>히브리어로 신의 이름을 나타내는 4글자(Tetragrammaton) = <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></td></tr></table></div><div class=\"tx\">히-    <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>(Yawheh), 여호와(Jehovah), 헬-     <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:12.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, 영어-     <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, 천주(天主), 샹띠(上帝), 카미사마(神様, かみさま), 보흐(Бог) , 한-     <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n하늘님-&gt;하ᄂᆞ님-&gt;하나님</div></div>"}, {"card_id": "s9", "slide_no": 9, "slide_str": "슬라이드 9", "blank_count": 1, "ans": [{"a": "친밀한 사랑의 교제를 나눌 가족", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q.                                  <span class=\"shown\">창조의 교훈은 무엇입니까</span>?\n\n하나님은 창조의 마지막 날, 즉 인간에게 필요한 모든 것을 먼저 창조하신 후에 인간을 지으셨습니다. 그리고 하나님은 다른 피조물들과는 달리 인간은 특별히 하나님의 형상을 따라 만드셨고, 깊은 교제를 나눌 가족으로 창조하셨습니다. 그리고 매우 좋아하고 기뻐하셨습니다.\n\n하나님께서는 우리를 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:21.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>으로 불러주셨습니다\n\n-&gt; 모든 것을  ‘하나님과의 관계’라는 관점에서 이해할 것</div></div>"}, {"card_id": "s10", "slide_no": 10, "slide_str": "슬라이드 10", "blank_count": 5, "ans": [{"a": "하나님 여호와", "alt": []}, {"a": "생명", "alt": []}, {"a": "life", "alt": []}, {"a": "생명", "alt": []}, {"a": "생명", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">신명기 30:20. 네 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>를 사랑하고\n그의 말씀을 청종하며 또 그를 의지하라\n'그는 네 <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이시요...’\n\nand that you may love the LORD your God, listen to his voice, and hold fast to him.\nFor the LORD is your <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>...\n\n하나님 그분이 ‘<span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></spa cell\"><input class=\"blank\" data-b=\"4\" style=\"width:18.1em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n<span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:14.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n<span class=\"cell\"><input class=\"blank\" data-b=\"6\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div></div><div class=\"tx\">제 인생 전체를 관통했던 중요한 질문..\n\nQ. 나는 예수님을 영접하고 믿었는데, 왜 내 삶에는 넘치는 평안과 솟구치는 기쁨이 없을까요?\n\n- <span class=\"cell\"><input class=\"blank\" data-b=\"9\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>에 머무르고 <span class=\"cell\"><input class=\"blank\" data-b=\"10\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>로 완전히 <span class=\"cell\"><input class=\"blank\" data-b=\"11\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>되지 못했기 때문입니다.</div></div>"}, {"card_id": "s27", "slide_no": 27, "slide_str": "슬라이드 27", "blank_count": 7, "ans": [{"a": "내 안에 거하라", "alt": []}, {"a": "내", "alt": []}, {"a": "내", "alt": []}, {"a": "성령", "alt": []}, {"a": "그", "alt": []}, {"a": "그", "alt": []}, {"a": "성령하나님 안에 살아감으로.", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 요15장에 따르면 신앙의 본질은 포도나무 되신 예수님 안에 거하는 것입니다. 그런데 이제 승천하신 예수님 안에 거하는 것은 어떻게 가능합니까?\n- <span class=\"cell\"><input class=\"blank\" data-b=\"6\" style=\"width:19.2em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div><div class=\"tx\">요한복음 15:4 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:11.2em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음 같이 너희도 내 안에 있지 아니하면\n그러하리라\n\"Abide(μείνατε) in Me, and I in you. As the branch cannot bear fruit of itself unless it abides in the vine, so neither can you unless you abide in Me.\n15:5 나는 포도나무요 너희는 가지라 그가 <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> 안에, <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>가 그 안에 거하면 사람이 열매를 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라\n15:6 사람이 내 안에 거하지 아니하면 가지처럼 밖에 버려져 마르나니 사람들이 그것을 모아다가 불에 던져 사르느니라\n\n요한일서 4:13 그의 <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>을 우리에게 주시므로 우리가 <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> 안에 거하고 <span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>가 우리 안에 거하시는 줄을 아느니라\nBy this we know that we abide(μένομεν) in Him and He in us, because He has given us of His Spirit.</div></div>"}, {"card_id": "s28", "slide_no": 28, "slide_str": "슬라이드 28", "blank_count": 10, "ans": [{"a": "육신", "alt": []}, {"a": "사망", "alt": []}, {"a": "영", "alt": []}, {"a": "생명", "alt": []}, {"a": "평안", "alt": []}, {"a": "the Spirit", "alt": []}, {"a": "육신", "alt": []}, {"a": "육신", "alt": []}, {"a": "육신", "alt": []}, {"a": "영", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">로마서8:5 육신을 따르는 자는 육신의 일을, 영을 따르는 자는 영의 일을 생각하나니\n8:6 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>의 생각은 <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이요 <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>의 생각은 <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>과 <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이니라\nFor the mind set on the flesh is death, but the mind set on <span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> is life and peace,\n8:7 육신의 생각은 하나님과 원수가 되나니 이는 하나님의 법에 굴복하지 아니할 뿐 아니라 할 수도 없음이라\n8:8 육신에 있는 자들은 하나님을 기쁘시게 할 수 없느니라\n8:9 만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라\n8:10 또 그리스도께서 너희 안에 계시면 몸은 죄로 말미암아 죽은 것이나 영은 의로 말미암아 살아 있는 것이니라\n8:11 예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라\n8:12 그러므로 형제들아 우리가 빚진 자로되 <span class=\"cell\"><input class=\"blank\" data-b=\"6\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>에게 져서 <span class=\"cell\"><input class=\"blank\" data-b=\"7\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>대로 살 것이 아니니라\n8:13 너희가 <span class=\"cell\"><input class=\"blank\" data-b=\"8\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>대로 살면 반드시 죽을 것이로되 <span class=\"cell\"><input class=\"blank\" data-b=\"9\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>으로써 몸의 행실을 죽이면 살리니</div></div>"}, {"card_id": "s29", "slide_no": 29, "slide_str": "슬라이드 29", "blank_count": 3, "ans": [{"a": "마16:24 이에 예수께서 제자들에게 이르시되 누구든지 나를 따라오려거든 자기를 부인하고 자기 십자가를 지고 나를 따를 것이니라", "alt": []}, {"a": "롬8:13 너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 살리니", "alt": []}, {"a": "갈5:16 내가 이르노니 너희는 성령을 따라 행하라 그리하면 육체의 욕심을 이루지 아니하리라", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 최상위문제 : 복음메세지 5단계 성화에 있어서 가장 중요한 진리는 자기를 부인하고, 성령님께 완전히 순복하여 사는 것입니다. 이것을 증거하는 3구절을 쓰십시오.(아래 3구절은 통으로 암기해서 쓸 것, )\n\n① <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"0\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n갈5:24 그리스도 예수의 사람들은 육체와 함께 그 정욕과 탐심을 십자가에 못 박았느니라\n\n고전15:31 형제들아 내가 그리스도 예수 우리 주 안에서 가진 바 너희에 대한 나의 자랑을 두고 단언하노니 나는 날마다 죽노라\n\n② <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"1\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n③ <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"2\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div></div>"}, {"card_id": "s30", "slide_no": 30, "slide_str": "슬라이드 30", "blank_count": 6, "ans": [{"a": "복음", "alt": []}, {"a": "유앙겔리온", "alt": []}, {"a": "전도", "alt": []}, {"a": "유앙겔리온", "alt": []}, {"a": "전도하다", "alt": []}, {"a": "유앙겔리조마이", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">4강 전도의 어원 및 정의\n\n전도의 성경적 어원 - 신약\n\n* <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>(명사): (복복 福, 소리 음 音),\n- 헬라어 εὐαγγέλιον <span class=\"cell\">(<input class=\"blank\" data-b=\"1\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\">)<span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n- 라틴어 Evangelium 영어 Gospel, Evangel\n\n* <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>(명사): (전할 전 傳, 길 도 道),\n- 헬라어 εὐαγγέλιον <span class=\"cell\">(<input class=\"blank\" data-b=\"3\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\">)<span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n- 라틴어 Evangelizatio 영어 Evangelism\n\n* <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, 복음을 전하다(동사):\n- 헬라어 εὐαγγελίζομαι <span class=\"cell\">(<input class=\"blank\" data-b=\"5\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\">)<span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n-  라틴어 Evangelizare 영어 Evangelize\n- 신약 헬라어에서 “전도”라는 명사는 거의 등장하지 않고, “복음(εὐαγγέλιον)”이 곧 전도의 내용을 의미한다.  대신 “전도하다”라는 동사는 많이 등장.</div></div>"}, {"card_id": "s31", "slide_no": 31, "slide_str": "슬라이드 31", "blank_count": 5, "ans": [{"a": "유앙겔리조", "alt": []}, {"a": "케룻소", "alt": []}, {"a": "마르튜레오", "alt": []}, {"a": "디다스코", "alt": []}, {"a": "마테테스", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 신약의 5가지 전도의 주요 개념\n\n1) 기쁜 소식을 전하는 것 : <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, εὐαγγελίζω\n\n2) 선포하는 것: <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, κηρύσσω\n\n3) 증인이 되는 것: <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, μαρτυρέω\n\n4) 가르치는 것: <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, διδάσκω)\n\n5) 제자로 삼는 것: <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, μαθητής</div></div>"}, {"card_id": "s32", "slide_no": 32, "slide_str": "슬라이드 32", "blank_count": 4, "ans": [{"a": "너희는 가서", "alt": []}, {"a": "삼위 하나님 이름으로 침례주고", "alt": []}, {"a": "가르쳐 지키게 하라", "alt": []}, {"a": "모든 민족을 제자로 삼아", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 예수님의 유언과같은 위대한 명령의 4가지 동사꼴과 그중 헬라어 원문에 나타난 진짜 동사는 무엇입니까?\n\n마 28:19 그러므로 ①너희는 가서 모든 민족을 ②제자로 삼아 아버지와 아들과 성령의 이름으로 ③세례를 베풀고\n28:20 내가 너희에게 분부한 모든 것을 ④가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라</div><div class=\"grp\"><div class=\"tx\">1. <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Go)</div><div class=\"tx\">2. <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:16.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Make Disciples)</div><div class=\"tx\">3. <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:20.4em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Baptize)</div><div class=\"tx\">4. <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Teach\nto obey)</div></div></div>"}, {"card_id": "s33", "slide_no": 33, "slide_str": "슬라이드 33", "blank_count": 1, "ans": [{"a": "빌리 그레함", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">4. 전도에 대한 신학적 정의\n(Theological Definitions of Evangelism)\n\n▪ <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> Billy Graham:\n“Evangelism is proclaiming Jesus Christ by the power of the Holy Spirit and leaving the results to God.”\n\n“전도란 성령의 능력으로 예수 그리스도를 선포하고, 그 결과는 하나님께 맡기는 것이다.”</div></div>"}, {"card_id": "s34", "slide_no": 34, "slide_str": "슬라이드 34", "blank_count": 4, "ans": [{"a": "하나님", "alt": []}, {"a": "아버지 하나님", "alt": []}, {"a": "아들 하나님", "alt": []}, {"a": "성령 하나님", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">1) 삼위하나님의 전도\nQ. 세상에서 가장 위대한 전도자는 누구입니까?\n= <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\nOur God is a Missionary God\n\n– 인간이 타락한 순간부터 하나님께서는 잃어버린 인간을 구원하기 위해 찾고 계셨다. 이러한 하나님의 노력은 태초부터 끊임없이 계속되어 온다. 성경은 이 아버지 하나님이 자녀를 찾으려는 열망으로 가득차 있다.\n\n전도의 계획 – <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n전도의 수행 – <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n전도의 능력 – <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div></div>"}, {"card_id": "s35", "slide_no": 35, "slide_str": "슬라이드 35", "blank_count": 6, "ans": [{"a": "복음주의", "alt": []}, {"a": "WEA, 로잔운동", "alt": []}, {"a": "에큐메니컬", "alt": []}, {"a": "WCC", "alt": []}, {"a": "근본주의", "alt": []}, {"a": "자유주의", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tbl\"><table><tr><td>&lt;-            <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Evangelical)\n<span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:12.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></td><td><span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>          -&gt;\n(Ecumenical)\n<span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></td><td></td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> (Fundamental)</td><td></td><td><span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n(Liberal)\nConcilian Theology</td></tr></table></div></div>"}, {"card_id": "s36", "slide_no": 36, "slide_str": "슬라이드 36", "blank_count": 1, "ans": [{"a": "구원의 서정", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 하나님께서 그리스도 안에서 이루신 구원의 사역이 성령을 통해 각 개인에게 적용되는 논리적, 신학적 순서를 무엇이라고 합니까?\n\n-* <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> (Ordo Salutis, the Order of Salvation)\n\n마치 씨앗이 자라 열매를 맺듯, 하나님께서 우리를 구원하시기 위해 역사하시는 일련의 단계들을 '구원의 서정'(Ordo Salutis)이라고 부릅니다. 이 순서는 신학적인 논의 주제이며, 학자들마다 약간의 차이가 있다.</div></div>"}, {"card_id": "s37", "slide_no": 37, "slide_str": "슬라이드 37", "blank_count": 9, "ans": [{"a": "예정(Predestination/Election)", "alt": []}, {"a": "소명(Calling)", "alt": []}, {"a": "중생(Regeneration)", "alt": []}, {"a": "회심(Conversion) – 믿음과 회개", "alt": []}, {"a": "칭의(Justification)", "alt": []}, {"a": "양자(Adoption)", "alt": []}, {"a": "성화(Sanctification)", "alt": []}, {"a": "견인(Perseverance of the Saints)", "alt": []}, {"a": "영화(Glorification)", "alt": []}], "body_html": "<div class=\"body\"><div class=\"row\"><div class=\"tx\">* 구원의 서정 9단계 를 한글과 영어로 쓰십시오.\n\n1. <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"0\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n2. <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:14.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n3. <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:20.4em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n4. <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:28.4em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n5. <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:21.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n6. <span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:15.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n7. <span class=\"cell\"><input class=\"blank\" data-b=\"6\" style=\"width:22.7em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n8. <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"7\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n9. <span class=\"cell\"><input class=\"blank\" data-b=\"8\" style=\"width:21.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div><div class=\"tx\">구원의 서정 순서는 논리적인 순서이며, 실제 경험에서는 이러한 단계들이 동시에 또는 밀접하게 연관되어 나타날 수 있다.\n\n학자들마다 강조하는 측면이나 순서에 대한 이해가 약간씩 다를 수 있다.\n\n구원의 서정은 인간의 구원을 위한 하나님의 주권적인 역사와 인간의 책임적인 응답을 함께 보여준다.</div></div></div>"}, {"card_id": "s38", "slide_no": 38, "slide_str": "슬라이드 38", "blank_count": 5, "ans": [{"a": "전적 타락", "alt": []}, {"a": "무조건적 선택", "alt": []}, {"a": "제한 속죄", "alt": []}, {"a": "불가항력적 은혜", "alt": []}, {"a": "성도의 견인", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">Q. 칼빈주의 5대교리를 쓰십시오. (한글)</div><div class=\"tbl\"><table><tr><td>칼빈주의 5대 교리 (TULIP)</td><td>알미니안주의 5대 교리</td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>  (Total Depravity):\n인간은 전적으로 부패하여 스스로 하나님께 나아갈 수 없음.</td><td>전적 타락 (Total Depravity):\n인간은 타락하여 스스로 구원할 수 없으나, 하나님의 선행적(prevenient) 은혜로 믿을 수 있다.</td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>  (Unconditional Election)</td><td>조건적 선택 (Conditional Election)</td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:7.8em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>  (Limited Atonement)</td><td>보편 속죄 (Universal Atonement)</td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:11.2em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>  (Irresistible Grace)</td><td>가항력적 은혜 (Resistible Grace)</td></tr><tr><td><span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>  (Perseverance of the Saints)</td><td>구원 상실 가능 (Possibility of Falling from Grace)</td></tr></table></div></div>"}, {"card_id": "s39", "slide_no": 39, "slide_str": "슬라이드 39", "blank_count": 3, "ans": [{"a": "예정", "alt": []}, {"a": "Predestination/Election", "alt": []}, {"a": "예정", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">0. <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span><span class=\"cell\">(<input class=\"blank\" data-b=\"1\" style=\"width:28.4em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\">)<span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\nQ. 하나님의 구원 계획의 시작점으로, 하나님께서 영원 전부터 누구를 구원할지 미리 정하셨다는 교리를 무엇이라고 합니까? - <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n예정은 구원의 “적용”이 아니라 “계획”의 차원.\n\n구원의 서정(Ordo Salutis)은 구원의 적용(Application of Redemption)에 초점을 두지만, 예정은 그 적용이 시작되기 전, 하나님의 영원한 작정(Decree)의 차원에서 다뤄진다. 예정은 하나님의 영원한 계획의 차원이고, 구원의 서정의 나머지 단계들은 시간 속에서 개인에게 적용되는 과정이다.\n\n따라서 구원의 서정(적용의 순서)에서는 소명(부르심)부터 시작하는 경우도 많지만, 논리적·신학적으로는 예정이 가장 먼저이다.</div></div>"}, {"card_id": "s40", "slide_no": 40, "slide_str": "슬라이드 40", "blank_count": 5, "ans": [{"a": "예정", "alt": []}, {"a": "예정", "alt": []}, {"a": "구원받은 사람", "alt": []}, {"a": "감사", "alt": []}, {"a": "감격", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 예정의 교훈\n\n- <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>의 교리는 전도할때 딱히 생각할 필요가 없다. 또한 전도대상자에게 전할 필요가 없다.\n\n- <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>은 이미 <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:10.0em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이 ‘하나님이 창세전부터 나를 선택하셨구나..’하는 것에 <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>하고 <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>하도록 하기 위함이다.\n\n- 엡1:4 곧 창세 전에 그리스도 안에서 우리를 택하사 우리로 사랑 안에서 그 앞에 거룩하고 흠이 없게 하시려고  1:5 그 기쁘신 뜻대로 우리를 예정하사 예수 그리스도로 말미암아 자기의 아들들이 되게 하셨으니</div></div>"}, {"card_id": "s41", "slide_no": 41, "slide_str": "슬라이드 41", "blank_count": 2, "ans": [{"a": "전도자의 외적소명", "alt": []}, {"a": "성령님의 내적소명", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 소명의 교훈\n\nQ.  하나님의 소명의 2가지 차원을 쓰십시오.\n<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:12.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> vs <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:12.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\nOuter calling of an evangelist     vs       Inner calling of the Spirit\n\n- 지구상 그 어떤 위대한 전도자도 자신의 복음전도가 언제나 성령님의 내적소명이 된 적이 없다. 가장 위대한 전도자라고 여겨지는 빌리그래함 목사님도 전도의 20%만 결신했을 뿐이다. 전도의 결과는 하나님께 맡기고, 최선을 다해 전할 따름이다.\n\n- 전도자는 자신의 복음전도(외적소명)가 성령님께 쓰임받는 내적소명이 되도록 절대적으로 성령님을 의지해야 한다.</div></div>"}, {"card_id": "s42", "slide_no": 42, "slide_str": "슬라이드 42", "blank_count": 4, "ans": [{"a": "중생", "alt": []}, {"a": "거듭남", "alt": []}, {"a": "born again", "alt": []}, {"a": "전도의 결과를 본인이 책임지려고 하기 때문이다.", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 중생의 교훈\n\n- <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>(<span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>, 다시태어남, <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>)은 구원받음, 하나님의 자녀가 됨, 하나님과의 관계가 회복되고 다시 생명이 흘러옴，영생을 얻음과 전부 다 동의어이다.\n\n- 전도는 죽은자가 살아나는 기적이 일어나야 하는 하나님의 역사이다. 따라서 이것이 우리 개인의 경건과 어떠함으로 이루어질 턱이 없다.\n\nQ. 사람들이 전도를 어려워하는 가장 큰 이유는\n- <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:31.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span></div></div>"}, {"card_id": "s43", "slide_no": 43, "slide_str": "슬라이드 43", "blank_count": 3, "ans": [{"a": "회개와 믿음", "alt": []}, {"a": "동시적", "alt": []}, {"a": "죄를 회개하라고 촉구해야 한다.", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 회심의 교훈\nQ.회심은 두가지 차원에서 이루어집니다. 무엇입니까?\n–<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:8.9em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n- 회개가 먼저인가? 믿음이 먼저인가? 신학적으로는 순서가 대단히 중요해 보이지만, 실제 전도의 현장에서 회개와 믿음은 동전의 양면과 같아서 <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>으로 발생하는 하나님의 역사이다.\n\n- 전도할때, 정말 중요한 것은 ‘죄’의 심각성을 전하는 것이다. 죄의 무서움과 심각성을 알지 못하면 예수 그리스도의 십자가의 피의 사랑이 감격되지 못한다.\n- 가장 지독한 개혁주의자라도 불신자에게 전도할 때 <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:21.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> “회개하라”는 것이야말로 성경이 우리에게 요청하는 ‘인간의 반응’이다. 이 회개가 어떻게 하나님의 은혜와 주권으로 이루어지는 가는 나중에 생각할 문제다. 전도할 때는 ‘당신이 반드시 의지를 가지고 하나님께 돌이키고 회개해야 한다’고 목이 터져라 촉구해야 한다.</div></div>"}, {"card_id": "s44", "slide_no": 44, "slide_str": "슬라이드 44", "blank_count": 4, "ans": [{"a": "칭의", "alt": []}, {"a": "죄의 저주의 심각성", "alt": []}, {"a": "하나님의 의가 전가됨", "alt": []}, {"a": "내 안에 의가 없고, 예수님만이 나의 의가 되신다는 것", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 칭의의 교훈\n\n<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>는 하나님의 공의로운 판단으로, 그리스도의 의가 믿는 자에게 전가되어 죄인임에도 불구하고 의롭다고 여겨지는 것을 말한다.\n\n- 개혁주의 전통에 따라 칭의를 법정적 차원에서 하나님 앞에 의롭게 됨이라고 정의한다면, 칭의와 양자됨은 분리되지 않는 한 사건이다. 칭의교리 이해의 핵심은 ‘<span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:13.5em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>’을 이해하는 것이다. 죄인됨의 무서움을 깨달아야 <span class=\"cell\"><input class=\"blank\" data-b=\"2\" style=\"width:14.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>의 영광이 무엇인지 깨달을 수 있다. <span class=\"cell wide\"><textarea class=\"blank\" rows=\"2\" data-b=\"3\" aria-label=\"빈칸\"></textarea><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이 핵심이다.\n\n- 전도할때, 칭의 교리를 굳이 어렵게 설명할 필요가 없다. 사도들은 복음전도시 칭의를 설명하기보다, 이미 구원받은 자들(교회)에게 전하는 서신서에서 칭의를 설명하였다. 예정과 마찬가지로 칭의교리는 구원이후에 생각하도록 하는 것이 좋다.</div></div>"}, {"card_id": "s45", "slide_no": 45, "slide_str": "슬라이드 45", "blank_count": 2, "ans": [{"a": "양자됨", "alt": []}, {"a": "양자됨", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 양자됨의 교훈\n<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span> 은 하나님께서 믿는 자들을 자신의 자녀로 삼으시고, 하나님의 모든 권세와 영광에 참여할 수 있는 신분을 부여하시는 은혜로운 행위입니다.\n\n- 칭의와 양자됨은 분리되지 않는 한 사건이다. 그런데 전도할 때는 칭의에 대한 개념을 전하기보다 <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>의 개념을 전하는 것이 훨씬 효과적이다\n\n- 성경은 45% 이상이 이야기 장르(narrative genre)로 되어 있고, 복음은 관계의 이야기로 전하는 것이 가장 좋다.\n- 복음메세지의 1단계를 생각해보자,\n\n“온 우주를 만드신 하나님께서는 우리를 만드시고, 생명을 주셨습니다. 그리고 당신과 친밀한 사랑의 교제를 나눌 가족으로 불러주셨습니다”</div></div>"}, {"card_id": "s46", "slide_no": 46, "slide_str": "슬라이드 46", "blank_count": 8, "ans": [{"a": "성화", "alt": []}, {"a": "성화", "alt": []}, {"a": "자기부인", "alt": []}, {"a": "성령께 순복하는 삶", "alt": []}, {"a": "성화", "alt": []}, {"a": "빨리 깨닫고 돌이켜", "alt": []}, {"a": "3", "alt": []}, {"a": "전환", "alt": []}], "body_html": "<div class=\"body\"><div class=\"tx\">* 성화의 교훈\n<span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>는 성령님의 능력으로 말미암아 믿는 자들이 점점 더 그리스도의 형상을 닮아가도록 변화되는 지속적인 과정이다. 이는 죄로부터 점진적으로 멀어지고 거룩함을 추구하는 삶을 살아가는 것을 포함한다.\n\n- <span class=\"cell\"><input class=\"blank\" data-b=\"1\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>에서 가장 중요한 것은 <span class=\"c el=\"빈칸 □□□ □□\" placeholder=\"□□□ □□\"><span class=\"hint\">□□□ □□</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n라민 사네(Lamin Sanneh)의 <span class=\"cell\"><input class=\"blank\" data-b=\"3\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸 □□□□\" placeholder=\"□□□□\"><span class=\"hint\">□□□□</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n유진 나이더(Eugene Nida)의 <span class=\"cell\"><input class=\"blank\" data-b=\"4\" style=\"width:12.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸 □□□ □□ □□\" placeholder=\"□□□ □□ □□\"><span class=\"hint\">□□□ □□ □□</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\nQ. 사도들은 유대인을 대상으로 복음을 전할때 예수님을 무엇으로 소개했는가?\n히-<span class=\"cell\"><input class=\"blank\" data-b=\"5\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸 □□□\" placeholder=\"□□□\"><span class=\"hint\">□□□</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>    헬- <span class=\"cell\"><input class=\"blank\" data-b=\"6\" style=\"width:6.6em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸 □□□□\" placeholder=\"□□□□\"><span class=\"hint\">□□□□</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\nQ. 사도들은 이방인 대상으로 복음을 제시할때 예수님을 어떤 개념으로 소개했는가?\n- <span class=\"cell\"><input class=\"blank\" data-b=\"7\" style=\"width:18.1em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"hint\">슬라이드에는 칸 없음 · 순서 무관</span><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>\n\n“초대교회 사도들은 유대인, 헬라인, 로마인에게 각기 다른 방식으로 예수를 소개했다. 오늘의 한국교회의 전도자도 <span class=\"cell\"><input class=\"blank\" data-b=\"0\" style=\"width:27.3em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\"><span class=\"mark\"></span><span class=\"chipans\" hidden></span></span><span class=\"cell\">(<input class=\"blank\" data-b=\"1\" style=\"width:19.2em\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" aria-label=\"빈칸\">)<span class=\"mark\"></span><span class=\"chipans\" hidden></span></span>이 필요하다.”</div></div>"}];

// Verbatim grading functions from live midterm_quiz.html
function nz(s) {
  return (s || '').normalize('NFKD').replace(/[̀-֑ͯ-ׇ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
}
function setOk(groups, v) {
  var parts = v.split(/[,，、\/·;\n]+/);
  if (parts.length < 2) parts = v.split(/\s+/);
  parts = parts.map(nz).filter(Boolean);
  if (parts.length !== groups.length) return false;
  var used = groups.map(function() { return false; });
  return parts.every(function(p) {
    var i = groups.findIndex(function(g, k) {
      return !used[k] && g.some(function(f) { return nz(f) === p; });
    });
    if (i < 0) return false;
    used[i] = true;
    return true;
  });
}

// Fisher-Yates shuffle
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

const STORAGE_KEY = 'evan_random_card_quiz_v3_typed';

let state = {
  queue: [],           // array of card_ids
  currentCardId: null,
  totalDeck: 0,
  filter: 'all',
  missedCardIds: [],
  streak: 0,
  graded: false
};

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function clearState() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

// DOM elements
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const doneScreen = document.getElementById('done-screen');
const btnStart = document.getElementById('btn-start');
const btnResume = document.getElementById('btn-resume');
const btnRestart = document.getElementById('btn-restart');
const btnReplay = document.getElementById('btn-replay');
const btnAction = document.getElementById('btn-action');
const btnCardReset = document.getElementById('btn-card-reset');

const comboBadge = document.getElementById('combo-badge');
const comboNum = document.getElementById('combo-num');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const againText = document.getElementById('again-text');

const cardContainer = document.getElementById('active-card-container');
const cSlide = document.getElementById('c-slide');
const cBlanks = document.getElementById('c-blanks');
const cScore = document.getElementById('c-score');
const cBody = document.getElementById('c-body');

// Filter change
document.querySelectorAll('.filter-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.filter-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    const radio = opt.querySelector('input');
    radio.checked = true;
  });
});

function getSelectedFilter() {
  const checked = document.querySelector('input[name="slide-range"]:checked');
  return checked ? checked.value : 'all';
}

function initNewGame(filter) {
  let pool = [];
  if (filter === 'part1') {
    pool = CARDS.filter(c => c.slide_no <= 26);
  } else if (filter === 'part2') {
    pool = CARDS.filter(c => c.slide_no >= 27);
  } else {
    pool = CARDS.slice();
  }

  const ids = pool.map(c => c.card_id);
  shuffle(ids);

  state = {
    queue: ids,
    currentCardId: null,
    totalDeck: ids.length,
    filter: filter,
    missedCardIds: [],
    streak: 0,
    graded: false
  };

  saveState();
  showGameScreen();
  nextCard();
}

function resumeGame(saved) {
  state = saved;
  showGameScreen();
  if (state.currentCardId !== null) {
    renderCard(state.currentCardId);
  } else {
    nextCard();
  }
}

function showGameScreen() {
  startScreen.style.display = 'none';
  doneScreen.style.display = 'none';
  gameScreen.style.display = 'block';
}

function showDoneScreen() {
  startScreen.style.display = 'none';
  gameScreen.style.display = 'none';
  doneScreen.style.display = 'block';
  clearState();
}

function showStartScreen() {
  const saved = loadState();
  if (saved && saved.queue && (saved.queue.length > 0 || saved.currentCardId !== null)) {
    btnResume.style.display = 'inline-block';
    const rem = saved.queue.length + (saved.currentCardId !== null ? 1 : 0);
    btnResume.textContent = `이어서 풀기 (남은 ${rem}카드)`;
  } else {
    btnResume.style.display = 'none';
  }
  gameScreen.style.display = 'none';
  doneScreen.style.display = 'none';
  startScreen.style.display = 'block';
}

function updateHeader() {
  // Streak combo
  if (state.streak > 1) {
    comboBadge.style.display = 'inline-flex';
    comboNum.textContent = `${state.streak} 연속`;
  } else {
    comboBadge.style.display = 'none';
  }

  // Progress line
  const remaining = state.queue.length + (state.currentCardId !== null ? 1 : 0);
  progressText.textContent = `남은 카드 ${remaining} / ${state.totalDeck}`;

  const doneCount = state.totalDeck - remaining;
  const pct = state.totalDeck > 0 ? (doneCount / state.totalDeck) * 100 : 0;
  progressBar.style.width = `${pct}%`;

  if (state.missedCardIds.length > 0) {
    againText.style.display = 'inline';
    againText.textContent = `· 다시 풀 카드 ${state.missedCardIds.length}`;
  } else {
    againText.style.display = 'none';
  }
}

function nextCard() {
  if (state.queue.length === 0) {
    showDoneScreen();
    return;
  }

  state.currentCardId = state.queue.shift();
  state.graded = false;
  saveState();

  renderCard(state.currentCardId);
}

function renderCard(cardId) {
  const cardData = CARDS.find(c => c.card_id === cardId);
  if (!cardData) {
    nextCard();
    return;
  }

  updateHeader();

  cardContainer.id = cardData.card_id;
  cSlide.textContent = cardData.slide_str;
  cBlanks.textContent = `빈칸 ${cardData.blank_count}개`;
  cScore.textContent = '';
  cScore.className = 'sc';
  cBody.innerHTML = cardData.body_html;
  btnAction.textContent = '채점';

  // Setup input key listeners
  const blanks = Array.from(cBody.querySelectorAll('.blank'));
  blanks.forEach((inp, idx) => {
    inp.value = '';
    inp.classList.remove('ok', 'bad');
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (inp.tagName === 'TEXTAREA' && !e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        if (!state.graded) {
          // If next blank exists and is empty, focus it; else grade
          if (idx < blanks.length - 1 && blanks[idx + 1].value.trim() === '') {
            blanks[idx + 1].focus();
          } else {
            handleAction();
          }
        } else {
          handleAction();
        }
      }
    });
  });

  if (blanks.length > 0) {
    blanks[0].focus();
  }
}

function gradeCard() {
  const cardData = CARDS.find(c => c.card_id === state.currentCardId);
  if (!cardData) return;

  const ans = cardData.ans;
  const blanks = cBody.querySelectorAll('.blank');
  let okCount = 0;
  const total = blanks.length;

  blanks.forEach(el => {
    const bIdx = +el.dataset.b;
    const a = ans[bIdx];
    const val = el.value.trim();
    const good = a.set
      ? setOk(a.set, val)
      : [a.a].concat(a.alt || []).some(x => nz(x) === nz(val)) && nz(val) !== '';

    if (good) okCount++;

    el.classList.toggle('ok', good);
    el.classList.toggle('bad', !good);

    const cell = el.closest('.cell');
    if (cell) {
      const m = cell.querySelector('.mark');
      if (m) {
        m.textContent = good ? '✓' : '✗';
        m.className = 'mark ' + (good ? 'ok' : 'bad');
      }
      const c = cell.querySelector('.chipans');
      if (c) {
        if (!good) {
          c.textContent = a.a;
          c.hidden = false;
        } else {
          c.hidden = true;
        }
      }
    }
  });

  cScore.textContent = `${okCount} / ${total}`;
  const allRight = (okCount === total);
  state.graded = true;

  if (allRight) {
    cScore.className = 'sc full';
    state.streak++;
    const missedIdx = state.missedCardIds.indexOf(cardData.card_id);
    if (missedIdx >= 0) {
      state.missedCardIds.splice(missedIdx, 1);
    }

    // Streak badge pulse
    comboBadge.classList.add('pulse');
    setTimeout(() => comboBadge.classList.remove('pulse'), 200);
  } else {
    cScore.className = 'sc' + (okCount === 0 ? ' zero' : '');
    state.streak = 0;

    if (!state.missedCardIds.includes(cardData.card_id)) {
      state.missedCardIds.push(cardData.card_id);
    }

    // Re-insert card 5-8 cards later
    const offset = Math.floor(Math.random() * 4) + 5; // 5, 6, 7, or 8
    if (state.queue.length <= offset) {
      state.queue.push(cardData.card_id);
    } else {
      state.queue.splice(offset, 0, cardData.card_id);
    }
  }

  btnAction.textContent = '다음 카드 (Enter)';
  saveState();
  updateHeader();
}

function resetCurrentCard() {
  const blanks = cBody.querySelectorAll('.blank');
  blanks.forEach(el => {
    el.value = '';
    el.classList.remove('ok', 'bad');
    const cell = el.closest('.cell');
    if (cell) {
      const m = cell.querySelector('.mark');
      if (m) {
        m.textContent = '';
        m.className = 'mark';
      }
      const c = cell.querySelector('.chipans');
      if (c) {
        c.hidden = true;
      }
    }
  });

  cScore.textContent = '';
  cScore.className = 'sc';
  state.graded = false;
  btnAction.textContent = '채점';
  if (blanks.length > 0) blanks[0].focus();
}

function handleAction() {
  if (!state.graded) {
    gradeCard();
  } else {
    nextCard();
  }
}

btnAction.addEventListener('click', handleAction);
btnCardReset.addEventListener('click', resetCurrentCard);

btnStart.addEventListener('click', () => {
  const filter = getSelectedFilter();
  initNewGame(filter);
});

btnResume.addEventListener('click', () => {
  const saved = loadState();
  if (saved) resumeGame(saved);
});

btnRestart.addEventListener('click', () => {
  if (confirm('진행 상황을 초기화하고 처음부터 다시 시작할까요?')) {
    clearState();
    showStartScreen();
  }
});

btnReplay.addEventListener('click', () => {
  showStartScreen();
});

// Initialize on page load
const saved = loadState();
if (saved && (saved.queue.length > 0 || saved.currentCardId !== null)) {
  showStartScreen();
} else {
  showStartScreen();
}
</script>
</body>
</html>
