<div class="hero"><h1>신약성서2 중간고사 대비 공부자료 — 1~6주차 강의 근거 정리</h1>
<p>이 자료는 시험 답안 예시가 아닙니다. 1~6주차 강의(PPT·PDF·강의 녹취)에서 다룬 내용을 원문 인용과 함께 모아, 각자 스스로 정리해 볼 수 있게 만든 공부자료입니다.</p>
<div class="box">모든 설명에는 강의 원문 인용(근거 카드)이 붙어 있습니다. <b>강의 녹취는 음성인식으로 만들어져 오탈자가 있으며</b>, 인용은 원문 그대로 두었습니다. ‘해석 주의’ 표시가 붙은 내용은 강의 중에 언급되었을 뿐 확정된 사실이 아니니 조심해서 읽으세요.</div></div>

<script id="data" type="application/json">{"cards": [{"id": "C01", "label": "①-1", "section": "1", "claim": "신약의 서신들은 지역교회들과 사람들에게, 특정한 상황을 바탕으로 의사소통했던 생생한 현장의 모습을 담고 있다.", "quote": "신약의 서신서들은 지역교회들과 인물들에게 특정한 상황을 바탕으로 의사소통했던 생생한 현장의 모습들을 담고 있습니다.", "src": "1주차 오리엔테이션 PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C02", "label": "①-2", "section": "1", "claim": "먼 곳에서 서신은 보낸 사람의 인격적 현존을 뜻했고, 단순한 의사소통을 넘어 깊은 대화와 돌봄의 방법이었다.", "quote": "서로 멀리 떨어져 있고 가까운 시일 안에 만날 수 없는 상황에서 서신은 단순한 의사소통을 넘어 깊은 대화와 돌봄의 방법이었습니다.", "src": "2주차 PPT 슬라이드 41", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C03", "label": "①-3", "section": "1", "claim": "서신 장르에는 전형적인 구조가 있다: 인사 + 감사 + 본론 + 맺음.", "quote": "서신의 전형적인 구조와 형식: 인사 + 감사 + 본론 + 맺음", "src": "2주차 PPT 슬라이드 22", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C04", "label": "①-4", "section": "1", "claim": "신약서신의 저자들은 인사말로 ‘은혜와 평강’을 쓴다(그레코-로만 편지는 χαίρειν, 유대인 편지는 샬롬).", "quote": "신약서신의 저자들은 ‘은혜와 평강’(χάρις καὶ εἰρήνη)이라고 함(롬 1:7; 고전 1:3; 고후 1:2; 갈 1:3 등).", "src": "2주차 PPT 슬라이드 22", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C05", "label": "①-5", "section": "1", "claim": "그레코-로마인들은 (자기들의 신에게) 건강·재난에서의 구원에 감사했지만, 바울은 편지를 받는 교회를 생각하며 하나님께 감사했다.", "quote": "바울: 편지를 받는 교회를 생각하며 하나님께 감사", "src": "2주차 PPT 슬라이드 23", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C06", "label": "①-6", "section": "1", "claim": "서신의 본론에는 하위 장르(찬송시·교회 전승·덕목/악덕 목록·가훈표·교차대구·기도문)가 사용된다.", "quote": "하위 장르(subgenres)들을 사용 찬송시: 빌 2:6-11", "src": "2주차 PPT 슬라이드 24", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C07", "label": "①-7", "section": "1", "claim": "가훈표(Haustafel)는 서신 본론에 쓰인 하위 장르의 하나로, 엡 5:21-6:9 등이 예로 제시되었다.", "quote": "가훈표(Haustafel, Household Code, 家訓表): 엡 5:21-6:9", "src": "2주차 PPT 슬라이드 27", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C08", "label": "①-8", "section": "1", "claim": "서신을 전달하는 사람이 회중 앞에서 직접 읽어 주거나 필요한 설명을 제공하기도 했고, 로마서를 전달한 사람은 뵈뵈였다.", "quote": "서신을 전달하는 사람이 회중 앞에서 직접 읽어 주거나, 필요한 설명을 제공하기도 합니다.", "src": "2주차 PPT 슬라이드 20", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C09", "label": "①-9", "section": "1", "claim": "당시에는 공적 행정문서용 우편 제도만 있었고 모든 시민이 쓸 수 있는 우편 제도는 없어서, 서신 전달 방법을 각자가 찾아야 했다.", "quote": "대부분은 공적 행정문서들을 위한 우편 제도만 있었을 뿐, 모든 시민이 사용할 수 있는 우편 제도가 없었습니다.", "src": "2주차 PPT 슬라이드 20", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C10", "label": "①-10", "section": "1", "claim": "글로 하는 의사소통은 훈련 받은 대필자의 일이었고 본 저자는 끝 인사말 등에 표시를 남겼다(롬 16:22 더디오, 살후 3:17).", "quote": "글로 하는 의사소통은 전문적으로 훈련 받은 사람들(대필자, amanuensis)의 일이었고, 서신의 본 저자는 끝 인사말 등 일부에 표시를 남깁니다.", "src": "2주차 PPT 슬라이드 18", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C11", "label": "①-11", "section": "1", "claim": "바울 서신의 대필자·공동저자는 노예 계급이 아니라 바울의 동역자 팀이었고, 대필자에게는 재량권이 있었으며 저자(바울)가 최종 확인했다.", "quote": "쓴 사람들은 모두 바울의 동역자 팀이에요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 슬라이드 19: 대필자 재량권은 ‘비교적 다양했을 것’"}, {"id": "C12", "label": "①-12", "section": "1", "claim": "서신의 저자들은 오늘 독자에게도 대화를 청하고 목회적 돌봄을 제공한다.", "quote": "신약 서신의 저자들은 우리에게 대화를 청하고 목회적 돌봄을 제공하고 있습니다.", "src": "2주차 PPT 슬라이드 41", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C13", "label": "①-13", "section": "1", "claim": "갈라디아서에서 바울은 편지 서두의 감사를 생략하고 곧바로 다른 복음을 따르는 이들을 두 번 저주했다 — 전형적 구조를 알면 이 이탈이 눈에 띈다.", "quote": "바울은 편지의 서두에 감사의 말도 생략하여 시작하고", "src": "6주차 갈라디아서 PDF p.10", "kind": "강의자료", "caution": false, "mid": false, "note": "‘눈에 띈다’는 해석은 요점 문장에서 ‘볼 수 있다’ 수준으로만 사용"}, {"id": "C14", "label": "②-1", "section": "2", "claim": "고린도 교회가 바울에게 보낸 편지는 남아 있지 않으므로, 현대 독자는 고린도전·후서를 이해하려 읽는 속도를 늦춰야 한다.", "quote": "그러므로, 현대의 독자들은 이 두 서신을 이해하려고 할 때, 읽는 속도를 조금은 늦추어야만 합니다.", "src": "5주차 고린도전서(1) PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C15", "label": "②-2", "section": "2", "claim": "고린도 교회가 바울에게 보낸 편지도 있었지만 그것은 남아 있지 않다(서신은 오가던 대화의 한쪽만 남아 있다).", "quote": "고린도 교회가 바울에게 보낸 편지도 있었지만, 그 역시 남아 있지 않습니다.", "src": "5주차 고린도전서(1) PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C16", "label": "②-3", "section": "2", "claim": "바울은 때때로 고린도 교인들 사이에서 논란이 된 내용(그들이 질문한 내용?)을 인용한 뒤 그에 대해 조언한다.", "quote": "그의 편지에서 바울은 때때로 고린도 교인들 중에 논란이 된(그래서 그들이 질문한?) 내용을 인용한 후 그에 대해 조언합니다", "src": "5주차 고린도전서(1) PDF p.3", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C17", "label": "②-4", "section": "2", "claim": "어떤 학자들은 ‘여자는 교회에서 잠잠하라’(고전 14:34-35)를 바울의 견해라기보다 고린도 교인들의 견해를 서술한 것으로 생각한다.", "quote": "어떤 학자들은 ‘여자는 교회에서 잠잠하라’(14:34-35)는 말이 바울의 견해라기보다는 고린도 교인들의 견해를 서술한 것으로 생각합니다.", "src": "5주차 고린도전서(1) PDF p.4", "kind": "강의자료", "caution": false, "mid": true, "note": "학자 견해이며 논쟁 소지 — 확정된 내용이 아니므로 해석에 주의"}, {"id": "C18", "label": "②-5", "section": "2", "claim": "갈라디아서를 읽을 때는 바울의 심정과 그 심정이 향하는 대상을 혼동하지 않는 것이 첫 단추이다(목회적 고뇌 vs 신학적 격노).", "quote": "바울의 심정과 그 심정이 향하는 대상을 혼동하지 않는 것이 첫 단추", "src": "6주차 갈라디아서 PDF p.3", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C19", "label": "②-6", "section": "2", "claim": "심정과 대상을 분리하지 않고 읽으면 ‘어리석도다 갈라디아 사람들아’ 같은 구절이 독자인 나를 향한 것처럼 느껴진다(교수 자신도 그랬다).", "quote": "이 믹스 된 뭔가 뚜렷이 정의되지 않은 이 감정이 너무 자주 독자인 우리를 향하게 읽어요. 그래서 어리석도다 갈라디아 사람들이 하면 혹 나한테 하는 것 같은 느낌 이런 걸 받고", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C20", "label": "②-7", "section": "2", "claim": "오늘 교회가 성찬식에서 읽는 고전 11:27-29는 서신 상황(공동 만찬에서 음식이 모두에게 분배되지 않음)을 고려해 다시 생각되어야 할 듯하다.", "quote": "오늘날 교회에서 성찬식을 행할 때 읽는 고전 11:27-29는 다시 생각되어야 할 듯합니다", "src": "5주차 고린도전서(2) PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C21", "label": "②-8", "section": "2", "claim": "정확한 저자 정보는 서신 작성 시기를 포함한 역사적 상황 이해에 중요하고, 그 이해는 서신의 특정 구절을 어떤 의미로 해석할 수 있는지에 영향을 준다.", "quote": "그 이해는 서신의 특정한 구절들을 어떤 의미로 해석할 수 있는지에 영향을 줍니다.", "src": "2주차 PPT 슬라이드 40", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C22", "label": "②-9", "section": "2", "claim": "서신들은 공동체가 함께 읽는 것이었다 — 지금처럼 혼자 펴서 읽는 것이 아니었다.", "quote": "공동체 읽기. 그냥 지금처럼 이렇게 혼자 각자 펴서 읽고 하는 게 아니었어요.", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C23", "label": "③-1", "section": "3", "claim": "오늘 독자와 서신 사이에는 공간·시간·문화의 갭이 있다. 그 갭을 인식하고 그들의 사회·문화·상황을 배우면 저자가 전하려는 메시지가 더 크고 선명하게 들리기 시작한다.", "quote": "그 갭을 있는 그대로 인식하고, 그들의 사회, 문화, 그리고 그들이 경험했을 상황들에 대해 배워 나간다면 각 서신의 저자들이 전달하려고 하는 메시지가 더 크고 선명하게 들리기 시작할 것입니다.", "src": "2주차 PPT 슬라이드 41", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C24", "label": "③-2", "section": "3", "claim": "갈 6:6 ‘가르침을 받는 자는 … 함께 하라’는 원어(코이노네오)로는 ‘함께하다/동참하다’ 의미가 맞고, 개역개정은 ‘함께 하라’, 새번역 등은 ‘나누라’로 옮겼다.", "quote": "개혁개정 개혁 한글 같은 경우는 함께 하자로 돼 있고 새 번역 새 한글 기타 버전들은 나누다라고 되어 있어요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(‘개혁개정’=개역개정)"}, {"id": "C25", "label": "③-3", "section": "3", "claim": "교수는 갈 6:6이 부담스러웠는데, 공부해 보니 그 뜻이 아니어서 다행이었다고 한다(헬라어를 배우는 즐거움의 예).", "quote": "근데 공부를 해놓고 보니까 너무 다행인 걸 알았어요. 그 뜻이 아니더라고요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C26", "label": "③-4", "section": "3", "claim": "‘방언’(γλῶσσα)은 직역하면 ‘언어’ 또는 ‘말’이다.", "quote": "방언(γλῶσσα_직역하면 “언어” 또는 “말”)", "src": "5주차 고린도전서(2) PDF p.10", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C27", "label": "③-5", "section": "3", "claim": "번역본을 통해서도 하나님의 말씀은 계속된다 — 메시지이기 때문이다.", "quote": "번역본을 통해서도 하나님의 말씀은 계속됩니다. 왜냐하면 메시지이기 때문에 그래요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C28", "label": "③-6", "section": "3", "claim": "번역본을 얘기하는 것은 풍성함을 잃지 않기 위한 조언이지, 번역본 수준이 낮다는 뜻이 아니다.", "quote": "제가 번역본을 얘기할 때는 이 풍성함을 잃지 않기를 위한 어떤 조언으로 말씀드리는 거지 번역본 자체가 수준이 낮다 이런 거 아니에요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C29", "label": "③-7", "section": "3", "claim": "고린도: ‘고린도 사람처럼 산다’는 말이 성적 난잡함을 가리키는 속어로 쓰였다.", "quote": "“고린도 사람처럼 산다”는 말은 성적 난잡함을 가리키는 속어로 사용되었습니다", "src": "5주차 고린도전서(1) PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C30", "label": "③-8", "section": "3", "claim": "고린도 교회는 다양한 인종·사회계층을 포함해(대부분 이방인·하층 계급) 가치/인식 차이로 갈등의 소지가 비교적 높았을 가능성이 있다.", "quote": "다양한 인종 및 계층을 포함하는 공동체_가치/인식 차이로 갈등의 소지가 비교적 높았을 가능성이 있습니다", "src": "5주차 고린도전서(1) PDF p.11", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C31", "label": "③-9", "section": "3", "claim": "그레코-로마 세계의 만찬에서는 종들이 따로 밥을 먹고 남은 음식을 받는 것이 당연시되었는데, 바울은 그런 대우가 ‘하나님의 교회를 업신여기고 빈궁한 자들을 부끄럽게’ 하는 것이라고 말한다(고전 11:22).", "quote": "그레코-로마 세계의 만찬_종들은 따로 밥을 먹고, 남은 음식을 받는 것이 당연시됨.", "src": "5주차 고린도전서(2) PDF p.4", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C32", "label": "③-10", "section": "3", "claim": "로마 제국 시장에서 팔린 고기의 거의 대부분은 어떤 신에게 경의를 표하기 위해 도살된 짐승의 살이었다고 하며, 그래서 유대인들은 ‘코셔 가게’에서 따로 구입했다.", "quote": "로마 제국의 시장에서 팔린 고기의 거의 대부분은 어떤 신에게 경의를 표하기 위해 도살된 짐승의 살이었다고 합니다", "src": "5주차 고린도전서(2) PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C33", "label": "③-11", "section": "3", "claim": "바울은 음식은 음식이라고 하면서도, 믿음이 약한 성도를 보호하는 데 목회적 관심을 두고 때로는 가능한 일도 포기하라고 권면한다(고전 8–10장).", "quote": "바울이 주는 안내: 음식은 음식!(10:25-27) 그러나, 그의 목회적 관심은 믿음이 약한 성도들을 보호하는 것에 있습니다", "src": "5주차 고린도전서(2) PDF p.8", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C34", "label": "③-12", "section": "3", "claim": "유대인에게 할례는 ‘하나님과 이스라엘이 맺은 언약의 표시’였다.", "quote": "유대인들에게 할례는 ‘하나님과 이스라엘이 맺은 언약의 표시’였음.", "src": "6주차 갈라디아서 PDF p.8", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C35", "label": "③-13", "section": "3", "claim": "바울은 유대 전통을 지키는 것을 반대한 것이라기보다, 그것이 하나님과 올바른 관계에 반드시 필요하다고 여기는 사고방식에 동의하지 않았다(사람들 사이의 경계지표로 삼는 것).", "quote": "바울은 유대인(또는 그들에게 영향을 받은 이방인)이 중요하게 여기는 종교 전통을 지키는 것을 반대하는 것 이라기 보다는", "src": "6주차 갈라디아서 PDF p.9", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C36", "label": "③-14", "section": "3", "claim": "안디옥 사건에서 게바의 행동은 이방인들에게 유대인이 되어야 한다는 사회적 압박을 주었을 가능성이 크다.", "quote": "이방인들은 유대인이 되어야 한다는 사회적 압박을 준 것.", "src": "6주차 갈라디아서 PDF p.21", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C37", "label": "③-15", "section": "3", "claim": "유대인에게 구제는 높이 평가되었지만 죄인들에게 나누는 것은 철저히 금지되었다.", "quote": "(유대인들에게 구제는 높이 평가되었지만, 죄인들에게 나누는 것은 철저히 금지되었음)", "src": "5주차 고린도후서 PDF p.11", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C38", "label": "③-16", "section": "3", "claim": "바울이 ‘예수의 흔적’(갈 6:17)을 말한 것은, 당시 주인에게 속한 사람의 몸에 주인의 이름을 새기던 것을 아는 사람들과 나누는 비유 같은 것으로 이해하면 된다고 교수가 설명했다.", "quote": "바울이 이 말을 하는 것은 그 사람들이 알고 있는 그런 것들을 함께 나누는 일종의 비유 같은 거라고 생각하시면 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 교수도 ‘뜻을 확실히 하기는 어렵지만’이라고 단서를 달았다"}, {"id": "C39", "label": "③-17", "section": "3", "claim": "마태복음은 유대인 청중을 주로 생각하고 썼고, 유대 사회에서 시체는 ‘모든 부정한 것의 아버지’라는 별명이 있을 만큼 민감해서 마태·누가의 서술이 다르다는 예를 교수가 들었다.", "quote": "유대인들한테는 이 시체가 모든 부정한 것에 아버지라는 별명이 있어요. 민감해요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 복음서 예(서신 아님)"}, {"id": "C40", "label": "③-18", "section": "3", "claim": "바울에게는 이름이 둘 있었다 — 유대인들에게는 사울, 이방 세계에는 바울이 더 유용했을 것으로 보이며, 변화의 결과로 이름을 바꾼 것이라기보다 두 이름을 가졌다.", "quote": "사울이 경험한 변화의 결과로 이름을 바꾼 것 이라기 보다는, 오히려 그는 두 개의 이름을 가졌고 유대인들에게는 사울이, 이방 세계에는 바울이 더 유용했을 것으로 보여짐.", "src": "3주차 ‘바울과 그의 서신들 개관’ PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C41", "label": "③-19", "section": "3", "claim": "에베소서 1:1의 가장 오래되고 신뢰받는 헬라어 사본에는 ‘에베소에 있는’이 없다(여러 지역에서 돌려보도록 의도된 회람 서신으로 보는 학자가 많다).", "quote": "현재 가지고 있는 가장 오래되고 신뢰받는 헬라어 사본에는 “에베소에 있는”(ἐν Ἐφέσω)이 없습니다(1:1).", "src": "6주차 에베소서 PDF p.12", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C42", "label": "③-20", "section": "3", "claim": "에베소는 아데미(Artemis) 신전이 있던 도시이며, 그 신전은 고대 세계의 7대 불가사의 중 하나이다.", "quote": "에베소 아데미 신전은 고대 세계의 7대 불가사의 중 하나입니다.", "src": "6주차 에베소서 PDF p.6", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C43", "label": "③-21", "section": "3", "claim": "로마서는 49년경 클라우디우스의 유대인 추방과 그 후 귀환으로 교회 안 유대인/이방인 비율이 달라졌을 가능성이 있고, 이것이 바울이 유대인과 이방인 모두가 하나님의 진노와 은혜의 대상이라고 선언하는 이유로 보인다.", "quote": "교회 안에 유대인과 이방인의 비율이 처음과는 많이 달라졌을 가능성이 있으며(a power shift), 이는 바울이 로마서 안에서 유대인과 이방인 모두가 하나님의 진노와 은혜의 대상이라고 선언하는 이유로 보여짐.", "src": "4주차 로마서 PDF p.8", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C44", "label": "③-22", "section": "3", "claim": "로마서는 바울이 개인적으로는 알지 못하는 사람들에게 기록한 유일한 서신일 수도 있다.", "quote": "바울이 개인적으로는 알지 못하는 사람들에게 기록한 유일한 서신일 수도 있습니다", "src": "4주차 로마서 PDF p.6", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C45", "label": "④-1", "section": "4", "claim": "고대 사회의 문화를 건너뛰고 우리가 쉽게 알아들을 수 있게 번역하면 메시지를 단편적으로 이해하거나 오해할 수 있다.", "quote": "어떻게 보면 그들의 사회에는 문화는 완전히 차단시키고 우리가 쉽게 알아들을 수 있게 한 건데 다시 말하면 그렇게 번역해서 메시지를 우리가 받을 수 있는 그런 면은 있어요. 그러나 이 메시지 자체를단편적으로 이해할 수도 있고 오해할 수도 있고", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(원문 ‘메시지 자체를단편적으로’ 붙어 있음)"}, {"id": "C46", "label": "④-2", "section": "4", "claim": "성경 속 일은 ‘어디서 무슨 일이 있었는데 바울이 편지를 써서 해결됐다’ 정도가 아니라, 관련된 사람들이 실제로 피부로 느끼고 아파하던 일들이다.", "quote": "그냥 어디에 무슨 일이 있었는데 바울이 편지 써서 해결됐더라 이런 일이 아니에요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C47", "label": "④-3", "section": "4", "claim": "‘어리석도다 갈라디아 사람들아’의 헬라어는 우리가 느끼는 큰 모멸감이 담겼는지 의문이며, ‘조금 더 생각할 수 있었을 텐데 멈추셨군요’ 정도의 뜻으로 볼 수 있다고 교수가 설명했다.", "quote": "헬라어 의미로 보면 우리가 듣는 저와 여러분들이 어리석다라는 말 들을 때 그 느끼는 대단한 불쾌함이죠. 모멸감 이런 거 그거가 담겼을지 좀 의문스러운 표현이에요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 교수의 해석(‘~같아요’ 수준)"}, {"id": "C48", "label": "④-4", "section": "4", "claim": "갈라디아 교인들은 바울에게 육체의 약함에도 불구하고 하나님의 천사처럼 영접한 사람들이므로 ‘어리석기만 했다’고 보는 것은 오해다.", "quote": "오늘날 교회가 가지고 있는 갈라디아 교회들에 대한 두 가지 오해 o 갈라디아의 그리스도인들은 진실로 어리석기만 했는가?", "src": "6주차 갈라디아서 PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C49", "label": "④-5", "section": "4", "claim": "갈라디아서에는 ‘나의 자녀들아 … 해산하는 수고’(4:19) 같은 표현이 있어, 바울이 갈라디아 교회들을 매서운 눈초리로만 바라보았다는 것은 오해다.", "quote": "o 바울은 갈라디아 교회들을 매서운 눈초리로 바라보았는가?", "src": "6주차 갈라디아서 PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C50", "label": "④-6", "section": "4", "claim": "저주의 대상은 갈라디아 교인들이 아니라 그들을 혼란에 빠뜨린 유대주의자들이다(분명한 분노와 저주 — 유다이저들).", "quote": "분명한 분노와 저주-유다이저들(Judaizers, 유대주의 기독교 분파)", "src": "6주차 갈라디아서 PDF p.4", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C51", "label": "④-7", "section": "4", "claim": "신약시대 사람들의 세계관을 이해하도록 돕는 책(『성경과 편견』)이 북 리포트 도서로 소개되었다.", "quote": "신약시대에 살던 사람들의 세계관 이해에 도움이 되는 도서도 있고(랜돌프 리처즈, 브랜든 오브라이언)", "src": "1주차 오리엔테이션 PDF p.12", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C52", "label": "실례-1", "section": "5", "claim": "실례-로마서 16장: 로마서는 대필자 더디오가 기록했고 뵈뵈가 전달했다.", "quote": "로마서 16:22: “이 편지를 기록하는 나 더디오도 주 안에서 너희에게 문안하노라”", "src": "2주차 PPT 슬라이드 18", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C53", "label": "실례-2", "section": "5", "claim": "실례-고린도후서: 바울은 ‘마음에 큰 눌림과 걱정이 있어 많은 눈물로’ 편지를 써 디도의 손에 보냈다(눈물의 편지).", "quote": "바울은 이 서신을 “마음에 큰 눌림과 걱정이 있어 많은 눈물로” 썼다고 알리고(2:4), 디도의 손에 보냅니다.", "src": "5주차 고린도후서 PDF p.7", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C54", "label": "실례-3", "section": "5", "claim": "실례-고린도전서의 편지 배경: 우리가 가진 고린도전서는 고린도 교회에 보낸 두 번째 서신인 듯하다(‘잃어버린 서신’이 먼저 있었다).", "quote": "우리가 가진 ‘고린도전서’는 사실 고린도 교회에 보낸 두 번째 서신인 듯 보입니다.", "src": "5주차 고린도전서(1) PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C55", "label": "실례-4", "section": "5", "claim": "실례-고린도전서 11장: 주의 만찬에서 먼저 와서 배불리 먹은 이들과 늦게 도착한 이들은 다른 계층이었을 가능성이 크다.", "quote": "먼저 와서 배불리 먹을 수 있었던 이들/늦게 도착하는 이들은 다른 계층이었을 가능성이 커요", "src": "5주차 고린도전서(2) PDF p.4", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C56", "label": "실례-5", "section": "5", "claim": "실례-갈라디아서 낭독 장면: 교수는 ‘이건 상상’이라고 전제하며, 전달자가 저주 대목을 읽을 때 해당 사람들을 바라보지 않았을까 추정했다.", "quote": "예를 들면 이건 상상이에요. 그건 이제 갈라디아서에 없으니까", "src": "2주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "교수 자신이 ‘상상’이라고 한 부분 — 사실처럼 받아들이지 말 것"}, {"id": "C57", "label": "실례-6", "section": "5", "claim": "실례-갈라디아서: 바울은 ‘나의 자녀들아’ 같은 목회적 호칭과 분노를 함께 썼으며, 갈라디아서는 바울 서신 중 가장 먼저 쓰였을 가능성이 크다고 교수가 말했다.", "quote": "이 갈라디아서는 바울 서신 중에 가장 먼저 쓰였다고 보거든요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 6주차 pdf는 남/북갈라디아설에 따라 연대가 다르며 ‘확실하게 알 수 없음’이라 함"}, {"id": "C58", "label": "정경-1", "section": "정경", "claim": "신약성서를 쓴 사람들은 자기 글이 성서가 될 거라고 생각도 못했다고 교수가 말했다.", "quote": "그러니까 신약성서들을 적은 사람들은 자기 글이 성서가 될 거라고 생각도 못했어요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "교수 발언(녹취 표기) — ‘강의에서 이렇게 설명했다’ 수준으로 이해"}, {"id": "C59", "label": "정경-2", "section": "정경", "claim": "27권 말고도 글이 많았고, 이단이 올 때 성경으로 가치를 줄 책을 골라낼 필요가 생겼다.", "quote": "이단이 이렇게 올 때가 있었거든요. 그래서 우리가 성경이라고 가치를 줘야 되는 책들을 골라낼 필요가 있을 때가 있었어요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C60", "label": "정경-3", "section": "정경", "claim": "그 즈음에는 이미 교회(한 개인이 아님)가 거의 동의했고, 기준은 사도들이 가르친 것·예수님과 가까웠던 분들의 전통과 일맥하는가, 내용·역사 기술에 오류가 없는가 등이었다.", "quote": "첫째로는 이게 사도들이 가르친 것과 일맥하는가 예수님과 가장 가까웠던 분들이 가르쳐준 전통과 일맥하는가 내용상 역사상 기술하는데 오류가 발견되지 않고", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C61", "label": "정경-4", "section": "정경", "claim": "새로 만든 것이 아니라 이미 있는 것 중에서 아닌 것들을 골라내기 시작한 것이다.", "quote": "근데 더 흰 게 아니고 이미 있는 것을 골라내기 시작한 거예요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "음성인식 오탈자(‘더 흰’) — 의미는 ‘더한 것이 아니라’로 보이나 확인 필요"}, {"id": "C62", "label": "정경-5", "section": "정경", "claim": "정경화 작업은 지도자 몇몇이 결정한 것이 아니다 — 교회가 이미 어느 정도 알았고 외경·위경의 경계(바운더리)가 정해졌다.", "quote": "그런 면에서 정경화 작업은 지도자들 몇몇이 결정한 게 아니에요. 교회가 이미 어느 정도 알았어요.", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C63", "label": "정경-6", "section": "정경", "claim": "신약성서에 바울의 서신이 13권 포함된 것은 바울과 그의 견해가 교회로부터 널리 수용되었다는 증거이다.", "quote": "신약성서에 함께 포함된 그의 서신들은 그/그의 견해가 전반적으로 교회에 받아들여졌다는 증거", "src": "3주차 ‘바울과 그의 서신들 개관’ PDF p.3", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C64", "label": "정경-7", "section": "정경", "claim": "바울이 고린도 교회에 보낸 편지가 필사되어 보존·계승된 것은 교회가 그의 권면을 존중했다는 증거이다.", "quote": "바울이 고린도 교회에 보낸 편지(적어도 두 개)가 필사되어 보존·계승되었다는 것은 교회가 그의 권면을 존중했다는 증거입니다", "src": "5주차 고린도후서 PDF p.17", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C65", "label": "정경-8", "section": "정경", "claim": "바울 이름의 위조 서신(고린도삼서)의 저자는 고백한 뒤 징계를 받고 사임을 요구받았다.", "quote": "그 후, 자신이 그 서신의 실제 저자임을 고백하여 징계를 받음 & 사임을 요구받음", "src": "2주차 PPT 슬라이드 33", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C66", "label": "정경-9", "section": "정경", "claim": "바울과 테클라행전을 쓴 아시아 교회 장로도 저자임을 고백했으나 면직되었다.", "quote": "사도 바울을 너무나 사랑했기 때문이라는 주장과 함께 자신이 저자임을 고백했으나, 면직됨.", "src": "2주차 PPT 슬라이드 33", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C67", "label": "정경-10", "section": "정경", "claim": "초기 교회가 위명서신을 권위 있는 서신으로 받아들였다는 언급은 발견되지 않았다.", "quote": "*초기 교회가 위명서신을 권위 있는 서신으로 받아들였다는 언급은 발견되지 않았습니다*", "src": "2주차 PPT 슬라이드 34", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C68", "label": "정경-11", "section": "정경", "claim": "바울 이름으로 퍼진 허위 서신이 있었을 가능성이 있다(살후 2:1-2, 무라토리아 단편의 언급).", "quote": "바울의 이름으로 유포된 허위 서신들이 있었을 가능성", "src": "2주차 PPT 슬라이드 36", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C69", "label": "정경-12", "section": "정경", "claim": "마르시온이 처음으로 기독교 안에서 정경 리스트를 제시했고, 교회가 반응하면서 정경화 작업이 시작되었으며, 27권 확정은 한참 뒤지만 큰 테두리는 초기 교회부터 거의 정해져 있었다고 교수가 설명했다.", "quote": "그래서 정경화 작업이 그 과정이 시작이 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 구체 연도·회의는 강의에 없음"}, {"id": "C70", "label": "정경-13", "section": "정경", "claim": "편지가 쓰인 교회 인근에 필요하면 그 지역 교회들로도 보내 회람하는 문화가 있었다.", "quote": "왜냐하면 회람하는 문화가 많이 있었기 때문에", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C71", "label": "정경-14", "section": "정경", "claim": "교수는 교회에 필요한 특정 상황에서 먼 곳에서 돌봄의 표현으로 글을 써서 보내게 하신 분이 하나님이라고 생각하며, 그 과정의 하나님의 인도하심을 ‘감동’이라고 하고 싶다고 했다.", "quote": "신약 성경 쓸 때 하나님의 마음에 감동돼서 그 교회에 필요한 특정한 상황에 있는 그 교회를 먼 곳에서 돌봄의 표현으로", "src": "2주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "교수 개인 견해(‘저는 ~생각해요’) — 강의 견해로 인용할 때만"}, {"id": "C72", "label": "정경-15", "section": "정경", "claim": "교수는 ‘성경이 하나님 말씀이라고 믿어요’라고 말하자 질문자가 안심했다고 하며, 이런 설명은 하나님의 말씀을 부정하는 것이 아니라고 했다.", "quote": "하나님의 말씀을 부정하는 게 아니에요. 이런 설명은.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C73", "label": "⑥-1", "section": "6", "claim": "교수는 ‘안심하셔도 돼요 … 여기가 세상에서 제일 안전한 장소’라고 말했다.", "quote": "안심하셔도 돼요. 제가 첫 시간에 그랬죠. 여기가 세상에서 제일 안전한 장소라든요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C74", "label": "⑥-2", "section": "6", "claim": "낯선 배경 지식을 처음 접하면 ‘내가 모른다고?’ 하며 화가 날 수 있고, 교수는 그 반응을 ‘잘 들었구나, 딱 맞는 리액션’이라고 받아 주었다.", "quote": "그래서 제가 그랬어요. 잘 들었구나. 그게 딱 맞는 리액션이야.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C75", "label": "⑥-3", "section": "6", "claim": "교수는 상상을 쓰되 정직해야 한다고 했고, ‘이건 이래요’ 단정보다 ‘이럴 가능성이 커 보여요’라고 표현해도 전달이 많이 된다고 했다.", "quote": "표현할 때 이건 이래요 저건 저래요 라고 하는 건 위험하고요. 이럴 가능성이 커 보여요. 이런 거 같아요. 그렇게만 해도 전달이 많이 되는 편이에요.", "src": "2주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C76", "label": "⑥-4", "section": "6", "claim": "토론의 방식은 비판이 아니라 ‘왜 그렇게 생각하셨어요?’라고 묻고 답하는 것이며, 그러면 이해가 풍성해진다.", "quote": "그러면 상대방이 그래 당신은 왜 그렇게 생각했는데요?", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C77", "label": "⑥-5", "section": "6", "claim": "교수는 ‘우리는 평가자가 아니고 관찰자’라고 했다 — 바울이 한 것을 그대로 바라보라는 뜻.", "quote": "우리는 평가자가 아니고 관찰자예요. 바울이 한 거를 그대로 바라보세요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C78", "label": "⑥-6", "section": "6", "claim": "기독교인의 눈으로 유대교인들을 평가하지 말라고 교수가 말했다.", "quote": "기독교인의 눈으로 유대교인들을 평가해서는 멈추는 게 좋아요.", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C80", "label": "정경-16", "section": "정경", "claim": "신약성경 27권 중 13권은 바울을 저자로 나타낸다(사도행전의 많은 비중도 바울의 삶을 서술).", "quote": "신약성경의 책 27권 중에서 13권은 그의 이름을 저자로 나타냅니다.", "src": "3주차 ‘바울과 그의 서신들 개관’ PDF p.2", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C79", "label": "⑥-7", "section": "6", "claim": "강의 목표 중에는 배운 유익을 다른 그리스도인들과 나눌 수 있게 격려 받는 것이 있다.", "quote": "위와 같은 유익을 다른 그리스도인들과 나눌 수 있게 격려 받음", "src": "1주차 오리엔테이션 PDF p.6", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N01", "label": "주의-1", "section": "쓰지 말 것", "claim": "‘회심 후 겸손해서 사울을 바울로 개명했다’는 말은 강의가 부정한다 — 두 이름을 가졌다.", "quote": "회심 후에 겸손을 찾아서 바울로 이름을 바꿨답니다. 따라하세요. 거짓말", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 교수의 표현은 ‘거짓말’이라기까지 ‘너무 그렇죠’ 하며 ‘가능성이 커요’로 정리"}, {"id": "N02", "label": "주의-2", "section": "쓰지 말 것", "claim": "바울이 늘 도시 중심으로 선교하고 항상 자비량이었다고 단정하지 말 것 — 교수는 ‘항상’을 깼다.", "quote": "홀로 아니고 팀 성교했고요. 종종이라고 했어요 자비량", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(‘성교’=선교). 3주차 pdf: ‘종종 자비량’, ‘상업 중심 대도시를 주요 거점으로 삼은 듯 보임’"}, {"id": "N03", "label": "주의-3", "section": "쓰지 말 것", "claim": "로마서를 ‘바울이 세운 교회에 쓴 편지’라고 단정하지 말 것 — 바울이 개인적으로는 모르는 사람들에게 쓴 서신일 수도 있다.", "quote": "바울은 보통 자신이 복음을 전한 사람들에게 서신을 쓰지만, 로마서는 조금 다릅니다.", "src": "4주차 로마서 PDF p.6", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N04", "label": "주의-4", "section": "쓰지 말 것", "claim": "고린도전서를 ‘고린도 교회에 보낸 첫 편지’라고 단정하지 말 것 — 두 번째 서신인 듯하고 ‘잃어버린 서신’이 있었다.", "quote": "우리가 가진 ‘고린도전서’는 사실 고린도 교회에 보낸 두 번째 서신인 듯 보입니다.", "src": "5주차 고린도전서(1) PDF p.5", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N05", "label": "주의-5", "section": "쓰지 말 것", "claim": "갈라디아서가 언제 누구(남/북 갈라디아)에게 보내졌는지는 확실하게 알 수 없으므로 단정하지 말 것.", "quote": "그러나, 이 서신이 언제 누구에게(남/북) 보내졌는지는 확실하게 알 수 없음", "src": "6주차 갈라디아서 PDF p.16", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N06", "label": "주의-6", "section": "쓰지 말 것", "claim": "에베소서는 ‘에베소 교회에 보낸 편지’로만 단정하지 말 것 — 가장 오래된 사본에 ‘에베소에 있는’이 없다.", "quote": "많은 학자들은 이 서신을 하나의 특정한 지역으로 보낸 서신이라기보다는 여러 지역에서 돌려보도록 의도된 회람 서신으로 생각합니다", "src": "6주차 에베소서 PDF p.15", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N07", "label": "주의-7", "section": "쓰지 말 것", "claim": "바울이 직접 손으로 서신을 다 썼다고 단정하지 말 것 — 대필자가 있었고 본 저자는 끝 인사 등으로 표시했다.", "quote": "글로 하는 의사소통은 전문적으로 훈련 받은 사람들(대필자, amanuensis)의 일이었고", "src": "2주차 PPT 슬라이드 18", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "N08", "label": "주의-8", "section": "쓰지 말 것", "claim": "바울 서신의 진정성(어느 서신이 바울이 쓴 것인가)은 학자들 사이에 논의가 있다 — 강의는 7개를 ‘일반적으로 진정 서신으로 간주’, 6개를 ‘위명서신으로 여겨지는’ 서신으로 구분했으나, 청년에게 위작이라고 단정하지 말 것.", "quote": "일반적으로 바울의 진정 서신(authentic letters)으로 간주되는 7개의 편지들", "src": "2주차 PPT 슬라이드 38", "kind": "강의자료", "caution": false, "mid": true, "note": "확정된 내용이 아니므로 해석에 주의"}, {"id": "N09", "label": "주의-9", "section": "쓰지 말 것", "claim": "27권의 정경 확정 시기·회의·인물의 구체 연도는 강의에 없다 — 교수는 ‘27권을 정경으로 한다고 찍기는 한참 후’라고만 했다.", "quote": "나중에 그 모든 지도자들이 대표성을 띄는 지도자들이 모여서 우리는 27권을", "src": "6주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "강의에서 연도·회의명을 못 찾음 → 쓰지 않는다"}, {"id": "N10", "label": "주의-10", "section": "쓰지 말 것", "claim": "바울의 외모를 단정하지 말 것 — 바울과 테클라행전 묘사는 2세기 신약 외경의 기록이다.", "quote": "바울과 테클라 행전 2, “목격자에 따르면 ‘바울은 키가 작고 대머리에다가", "src": "3주차 ‘바울과 그의 서신들 개관’ PDF p.11", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C91", "label": "안내-1", "section": "시험 안내", "claim": "교수가 시험에서 상세하게 쓰려다 오답이 나오면 잘못된 정보를 준 것이라 감점(마이너스)이 된다고 말했다(감점 점수는 녹취가 불명확).", "quote": "근데 그런데 만약에 반대로 상세하게 쓰고 싶었었는데 오답이 나왔어요. 후 그럼 마이너스 1.1.3.4점 왜냐면 그거는 잘못된 정보를 주는 거잖아요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "녹취 표기 — 감점폭 숫자는 음성인식 불명확, ‘잘못된 정보를 주는 거잖아요’까지가 확실한 부분"}, {"id": "C92", "label": "안내-2", "section": "시험 안내", "claim": "교수가 예를 들 때 ‘고린도전서 몇 장 몇 절’까지 쓰지 않아도 된다고 했다.", "quote": "그러면 고린도 전서 몇 장 몇 절에 이렇게 쓰시고 싶은 마음도 있으실 거예요. 그렇게 안 쓰셔도 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C93", "label": "안내-3", "section": "시험 안내", "claim": "큰 그림에서 생각나는 예를 쓰면 되고, 어디까지 상세히 기억해 써야 할지 고민하지 않아도 된다(‘고린도서에 이렇게 쓰시면 돼요’).", "quote": "그러면 고린도전서에 아니 고린도 전후서도 모르겠다 그러면 고린도서에 이렇게 쓰시면 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C94", "label": "안내-4", "section": "시험 안내", "claim": "교수는 지난 학기와 같은 용지에 ‘앞뒤로 한 장 이상 쓰지 말라’고 했다(용지 이름은 음성인식 불명확 ‘비포’).", "quote": "답안지는 지난 학기에 썼던 거 그대로 비포 용지로 앞뒤 쓰는 걸 사용할 건데 한 장 이상 쓰지 마세요. 한 장 이상 쓰지 마세요 앞뒤로", "src": "6주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "용지 종류(크기)와 ‘앞뒤’ 분량은 녹취상 불명확합니다."}, {"id": "C95", "label": "안내-5", "section": "시험 안내", "claim": "시험은 손으로 쓰며 컴퓨터를 쓰면 안 된다.", "quote": "컴퓨터를 쓰시면 안 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C96", "label": "안내-6", "section": "시험 안내", "claim": "교수가 ‘포함해 주십사’ 한 것은 반드시 포함해야 하고 나머지는 열려 있다.", "quote": "준비가 되면 제가 포함을 해주십사 한 거는 반드시 포함이 돼야 되고 그 나머지는 오픈이에요", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C97", "label": "안내-7", "section": "시험 안내", "claim": "교수는 ‘써 주세요’ 한 것만으로 앞면이 찰 것이고, 뒷면은 청년들을 생각하며 도움이 될 것을 자유롭게 쓰라고 했다.", "quote": "뒷면은 여러분들이 쓰시고자 하는 것들을 충분히 청년들을 생각하면서 도움이 될 것을 말해주시고요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C98", "label": "안내-8", "section": "시험 안내", "claim": "시험 시간은 교수가 ‘맥시멈 1시간 반’을 준다고 했다.", "quote": "시간은 제가 맥시멈 1시간 반 드릴게요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C99", "label": "안내-9", "section": "시험 안내", "claim": "답안의 주안점은 이 강의 안에서 다룬 내용이고, 성경 본문은 예시 정도이다.", "quote": "일단은 이 강의 내에서 이루어진 그 내용이 주안점이 될 거예요. 성경에 나오는 것은 예시 정도가 될 거예요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C100", "label": "안내-10", "section": "시험 안내", "claim": "전반적 내용은 6주차(갈라디아서 수업)까지 한 것으로 충분하고, 특히 갈라디아서가 중요하다고 했다.", "quote": "구체적인 그 답안에 어떤 전반적인 내용은 오늘까지 한 걸로 해도 충분해요. 특별히 오늘은 중요해요. 그 중요해요. 갈라디아서가 중요해요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C101", "label": "안내-11", "section": "시험 안내", "claim": "교수는 편지가 무엇이고 어떻게 쓰였는지(2주차) 섹션을 복습하고, 강의 안에서 이루어진 실제적인 예로 설명해 주기를 요청했다.", "quote": "특별히 바울사신 처음에 다뤘을 때 편지는 무엇인가 편지는 어떻게 써졌나 이런 부분들도 이해하는 아주 섹션이 따로 있었거든요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C102", "label": "안내-12", "section": "시험 안내", "claim": "시험 속 청년은 30대 초반 남성이고, 같이 하는 그룹도 대부분 그 정도 연령이다.", "quote": "그래서 그 청년은 30대 초반이고요. 남성이고요 같이 하는 그룹들도 대부분 그 정도니까", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C103", "label": "⑥-8", "section": "6", "claim": "교수는 청년들이 부끄러움이 많으니 친절하고 따뜻하게 가르쳐야 한다고 했다.", "quote": "청년들은 굉장히 부끄러움도 많고 그렇기 때문에 친절하게 따뜻하게 가르쳐 주셔야 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C104", "label": "정경-17", "section": "정경", "claim": "교수는 ‘성경은 하나님의 말씀을 담은 책’이며 이것을 오해하면 안 된다고 했다.", "quote": "그래서 저는 성경은 하나님의 말씀을 담은 책입니다. 이거를 오해하시면 안 돼요.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C105", "label": "정경-18", "section": "정경", "claim": "교수는 성경 전체를 하나님의 말씀으로 여기는 신앙은 받아들일 수 있지만 그것이 한계이기도 하며, 한계를 인정하고 그 안의 하나님의 말씀을 이해하려고 노력해야 한다고 했다.", "quote": "우리가 한계를 인정하고 그 안에 있는 하나님의 말씀을 이해하려고 노력해야겠죠.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C106", "label": "①-14", "section": "1", "claim": "교수는 바울조차 ‘이 말은 주께서 주신 말씀입니다 / 주께서 주신 말씀이 아닙니다’라고 구분하며 자기 판단을 말한 곳이 있다고 말했다(장절은 말하지 않음).", "quote": "이 말은 주께서 주신 말씀입니다. 그 근처에 다시 말할 때 이 말은 주께서 주신 말씀이 아닙니다. 그러나 내가 압니다.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "음성인식 불명확·장절 불명 — 확정된 내용이 아니므로 해석에 주의"}, {"id": "C107", "label": "실례-7", "section": "5", "claim": "실례-고린도전서 10:23: 고린도 교인들의 ‘모든 것이 가하나’를 인용한 뒤 바울이 ‘모든 것이 유익한 것/덕을 세우는 것은 아니다’라고 답한다.", "quote": "예) “모든 것이 가하나” → “모든 것이 유익한 것/덕을 세우는 것은 아니다”_10:23.", "src": "5주차 고린도전서(1) PDF p.3", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C108", "label": "실례-8", "section": "5", "claim": "실례-고린도전서 6:12: 일부 고린도 그리스도인들이 ‘모든 것이 내가 가하다’를 복음의 철저한 이행으로 오해하여 방종했다.", "quote": "이러한 방종을 복음의 철저한 이행 정도로 (오해하여) 해석한 사람들이 있었던 듯합니다(6:12, “모든 것이 내가 가하다”; 참조 10:23)", "src": "5주차 고린도전서(2) PDF p.3", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C109", "label": "실례-9", "section": "5", "claim": "실례-고린도전서 4:8: 바울은 고린도 교인들의 삶을 풍자적으로 묘사하며 ‘너희가 이미 배부르며 이미 풍성해졌다’고 쓴다.", "quote": "그들의 삶을 풍자적으로 묘사하며 이렇게 씁니다_ “너희가 이미 배부르며 이미 풍성해졌다”(4:8)", "src": "5주차 고린도전서(1) PDF p.17", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C110", "label": "실례-10", "section": "5", "claim": "실례-고린도전서 12장: 몸의 비유는 헬라어 현재형으로 표현되어, ‘이루어져야 할 이상’이 아니라 ‘이미 이루어진 현실’로 읽어야 한다.", "quote": "이루어져야 할 이상이라기보다는 이미 이루어진 현실로!(12:12-27, 헬라어로 현재성으로 표현)", "src": "5주차 고린도전서(1) PDF p.14", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C111", "label": "실례-11", "section": "5", "claim": "실례-고린도전서 3:1-2: ‘밥’(βρῶμα, 음식)과 ‘젖’(γάλα)의 헬라어 대비 — 고린도 교회는 밥을 먹을 만큼 자라지 않은 모습이다.", "quote": "밥(βρῶμα, 음식 vs. γάλα, 젖/우유)을 먹을 만큼 성장하지 않은 모습을 보여줍니다(고전 3:1-2).", "src": "5주차 고린도전서(1) PDF p.2", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C112", "label": "실례-12", "section": "5", "claim": "실례-고린도전서 1:22-24: 유대인은 표적을, 헬라인은 지혜를 구하는 문화에서 십자가는 유대인에게 거리끼는 것, 이방인에게 미련한 것이었다.", "quote": "유대인은 표적을 구하고 헬라인은 지혜를 찾으나 우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되", "src": "5주차 고린도전서(1) PDF p.15", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C113", "label": "①-15", "section": "1", "claim": "고린도전서는 특정한 상황에서 일어난 특정한 문제에 초점을 맞추어 실천적인 성격을 보이고, 로마서는 신학적 주제를 체계적으로 표현한다.", "quote": "고린도전서: 특정한 상황에서 일어난 특정한 문제에 초점을 맞춤_실천적 특성", "src": "5주차 고린도전서(2) PDF p.12", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C114", "label": "실례-13", "section": "5", "claim": "실례-고린도전서 14장 방언: 바울의 조언은 방언이 과시거리가 된 고린도 교회의 상황에서 나온 것으로 이해된다고 교수가 설명했다.", "quote": "그래서 그런 상황에서 바울이 목회자로서 또 신학자로서 조언을 할 때 그렇게 그 부분에 대해서는 그렇게 조언해 준 것 같다라고 공감을 많이 합니다.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C115", "label": "실례-14", "section": "5", "claim": "고린도 교회에서 방언이 문제가 된 이유로 ‘예배에 지장을 주었거나 방언을 과시하려 했거나’ 등이 추측된다.", "quote": "o 예배에 지장을 주었거나, 어떤 이들은 방언을 과시하려 했거나", "src": "5주차 고린도전서(2) PDF p.11", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C116", "label": "실례-15", "section": "5", "claim": "실례-고린도후서의 어조 변화: 여행 중에 쓰였을 수도 있고, 여러 시기의 서신을 모은 서신집일 수도 있다고 학자들은 본다.", "quote": "o 하나의 서신이 아니라, 바울이 다른 시기에 기록한 여러 서신들을 모아서 만든 서신집인가?", "src": "5주차 고린도후서 PDF p.2", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C117", "label": "실례-16", "section": "5", "claim": "실례-고린도후서의 사도 기준 네 가지는 고린도 교회의 특정 상황이 바울이 제시하는 내용에 영향을 주었을 것이라고 강의했다.", "quote": "고린도 교회에 일어난 상황이 바울이 제시하는 내용에 영향을 주었을 것이라고", "src": "5주차 고린도후서 PDF p.14", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C118", "label": "①-16", "section": "1", "claim": "교수는 어떤 용어의 의미를 파악하려면 맨 먼저 그 서신 안에서 보아야 한다고 했다.", "quote": "그런데 어떤 그 용어나 커뮤니 소통하고자 하는 그것을 파악하려고 하던 맨 먼저는 어디를 봐야 되냐면 그 서신 안에서 봐야 돼요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C119", "label": "실례-17", "section": "5", "claim": "실례-고린도전서 11장 주의 만찬(교수 설명): 오늘 교회는 11:27-29를 ‘개인의 잘못을 회개한 뒤 참여’하는 뜻으로 인식해 왔다.", "quote": "보통 우리는 주의 만찬을 행하기 전에 남들이 알든 모르든 우리 안에 있는 어떤 개인적인 잘못을 개인적인 잘못을 고백하고 뉘우치고 회개하고 나서. 그 성찬에 참여해야 된다는 그런 정도로 인식을 해왔는데요.", "src": "5주차 영상 강의 녹취(고린도전서 2)", "kind": "녹취", "caution": false, "mid": true, "note": "영상 강의 녹취(음성인식)"}, {"id": "C120", "label": "실례-18", "section": "5", "claim": "실례-고린도전서 11장: 먼저 와서 배불리 먹은 이들은 낮은 계층으로 보이지 않는다(당시 사회 관례상).", "quote": "먼저 와서 배불리 먹을 수 있었던 이들은 아무래도 조금 낮은 계층의 사람들로 보이진 않아요. 사회적 일반 관례를 볼 때요.", "src": "5주차 영상 강의 녹취(고린도전서 2)", "kind": "녹취", "caution": false, "mid": true, "note": "영상 강의 녹취(음성인식)"}, {"id": "C121", "label": "③-23", "section": "3", "claim": "교수는 ‘은사’(카리스마)가 원래 ‘선물’을 뜻하는데 우리말 ‘은사’는 너무 특별하게 느끼는 경향이 있다고 했다.", "quote": "그런데 이것은 선물을 얘기합니다. 선물.", "src": "5주차 영상 강의 녹취(고린도전서 2)", "kind": "녹취", "caution": false, "mid": true, "note": "영상 강의 녹취(음성인식)"}, {"id": "C122", "label": "④-8", "section": "4", "claim": "교수는 번역된 단어가 굳어져(예: ‘방언’) 원래 뜻과 다르게 느껴지는 경우가 있어 원어를 짚어 준다고 했다.", "quote": "그런데 때로는 제가 이것을 포인트아웃 하는 이유가 번역된 단어가 오히려 뭔가 굳어져 가지고", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C123", "label": "③-24", "section": "3", "claim": "로마서 8:28의 헬라어 원문은 ‘모든 일이 함께 해서 선을 이루는 방향으로 일합니다’에 가깝다고 교수가 설명했다.", "quote": "헬라어 원문을 조금 더 가깝게 표현을 해본다면 이렇게 되는 겁니다. 모든 일이 함께 해서 선을 이루는 방향으로 일합니다. 그런 뜻이에요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C124", "label": "③-25", "section": "3", "claim": "교수는 한 단어의 의미가 궁금하면 먼저 그 책에서 누가 어떻게 썼는지를 보는 것이 가장 중요하다고 했다(같은 단어도 저자·상황에 따라 다르다).", "quote": "한 책에서 어떤 단어의 어떤 의미가 궁금하다 그러면 일단은 그 책에서 누가 어떻게 사용했는지를 보는 것이 가장 중요합니다.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C125", "label": "③-26", "section": "3", "claim": "갈 4:4 ‘때가 차매’의 ‘때’는 시간의 길이를 뜻하는 크로노스(χρόνος)로 쓰였다.", "quote": "참조 χρονος_length 와 καιρος_right time", "src": "6주차 갈라디아서 PDF p.24", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C126", "label": "③-27", "section": "3", "claim": "갈 1:6 ‘이상하게 여기노라’의 원어(다우마조)는 말문이 막힐 만큼 놀라는 느낌을 표현하는 말이라고 교수가 설명했다.", "quote": "그냥 떠 하고 있는 그 순간 정도의 느낌을 표현할 때 따 마주를 써요. 굉장히 놀라운 거죠.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(‘다우마조’를 ‘따 마주’로 받아적음)"}, {"id": "C127", "label": "③-28", "section": "3", "claim": "갈 6:1의 ‘형제들아’(아델포이)는 확장된 가족의 개념을 담은 말이라고 교수가 설명했다.", "quote": "아델포스라는 형제라는 단어인데 이 단어는 확장된 가족 어떤 개념을 담아요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C128", "label": "③-29", "section": "3", "claim": "갈 4:19 ‘나의 자녀들아’(테크나 무)는 보호받아야 할 존재로 느껴질 때 애정을 담아 부르는 표현이라고 교수가 설명했다.", "quote": "테크나라는 단어는 아이들을 부를 때 그러니까 부르는 사람보다 듣는 사람이 부르는 사람으로 하여금 보호 받아야 될 그런 존재로 느껴질 때 사람과 애정을 담아서 부르는 표현이에요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C129", "label": "④-9", "section": "4", "claim": "갈 1:9 ‘전에 말하였거니와’는 오래전에 한 것처럼 번역상 느껴지지만, 원어는 ‘방금 말했는데 한 번 더 말합니다’라는 뜻이라고 교수가 설명했다.", "quote": "아주 오래전에 한 것처럼 이게 번역상 그렇게 느껴질 수 있죠. 우리가 전에 말할 거니와 완전 그렇지 않아요. 지금 방금 말했습니다. 한 번 더 말합니다", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C130", "label": "③-30", "section": "3", "claim": "헬라어에는 한국어처럼 세분화된 존칭 체계가 없다(교수 설명).", "quote": "헬라와는 존칭이 없어요. 존칭을 따로 구분하는 레벨이 별로 없습니다.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(‘헬라와’=헬라어)"}, {"id": "C131", "label": "③-31", "section": "3", "claim": "교수는 ‘교회’(에클레시아)가 신학화된 개념이고 원래는 ‘불려나온 모임’이라는 뜻이라고 했다.", "quote": "에클레스아 원래는 모임이라는 뜻이에요. 이렇게 불려나온 모임 그 정도 생각하시면 돼요.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C132", "label": "③-32", "section": "3", "claim": "교수는 요한복음의 ‘내 말에 거하면’을 ‘계속 머물고 생각하고 곱씹고 새긴다’는 뜻이라고 설명했다(복음서 예, 녹취 불명확).", "quote": "헬라 계속 거기에 머물고 생각하고 또 곱씹고 새기고 한다는 뜻이에요.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": true, "mid": false, "note": "음성인식 불명확·복음서 예 — 해석 주의"}, {"id": "C133", "label": "③-33", "section": "3", "claim": "교수는 ‘이야기를 읽는 것은 그 환경을 읽는 것’이라고 했다.", "quote": "이야기를 읽는 것은 그 환경을 읽는 거예요.", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C134", "label": "③-34", "section": "3", "claim": "예언자들은 할례를 ‘할례 받지 못한 귀(렘 6:10)’·‘할례 받지 못한 마음(레 26:41)’처럼 상징으로 쓰기도 했고, 당시 사람들에게는 이런 상징이 익숙했다고 교수가 설명했다.", "quote": "예언자들은 때때로 할례를 상징적으로 사용하기도 했음_ ‘할례 받지 못한 귀’(렘 6:10), ‘할례 받지 못한 마음’(레 26:41)", "src": "6주차 갈라디아서 PDF p.8", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C135", "label": "③-35", "section": "3", "claim": "교수는 율법/할례가 유대인에게는 지키고 안 지키고의 문제라기보다 ‘내가 태어났을 때부터 살아가는 방식’이라고 설명하며 어린 시절 할아버지께 절을 배운 경험담을 들었다.", "quote": "그 모화라는 건 적어도 유대인들한테는 단순히 지키고 안 지키고 이런 문제라기보다 내가 태어났을 때부터 살아가는 방식이에요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기(‘모화’=율법·할례로 추정). 교수 본인 경험담 포함"}, {"id": "C136", "label": "③-36", "section": "3", "claim": "안디옥에서 베드로가 물러난 것은 의식적 결정이라기보다 몸에 밴 사회화에서 나온 행동이라고 교수가 설명했다.", "quote": "굉장히 무의식적이죠. 그만큼 사회화가 된 거예요. 몸에 그냥 된 거예요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C137", "label": "③-37", "section": "3", "claim": "토빗 4:17은 ‘의인들의 무덤에는 빵을 풍성하게 내놓되 죄인들에게는 주지 마라’고 하며, 이런 사회적 가치가 사람들의 행동에 힘을 가졌다고 강의했다.", "quote": "의인들의 무덤에는 빵을 풍성하게 내놓되 죄인들에게는 주지마라”", "src": "6주차 갈라디아서 PDF p.22", "kind": "강의자료", "caution": false, "mid": false, "note": ""}, {"id": "C138", "label": "③-38", "section": "3", "claim": "교수는 이방인이 유대 문화에서 ‘죄인’ 범주에 있었기에 이방 교회의 구제금을 예루살렘 교회가 받을지 바울이 걱정했다고 설명했다.", "quote": "왜냐하면 이방 사람들은 유대문화에서 아예 그냥 죄인들이라는 케레고리 안에 있었어요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C139", "label": "③-39", "section": "3", "claim": "교수는 로마 도시 인구를 대략 100만 명으로 보고, 그중 절반 정도가 노예였다고 설명했다.", "quote": "그런데 그 인구 중에 약 절반이 노예였어요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C140", "label": "③-40", "section": "3", "claim": "교수는 49년 클라우디우스 추방 배경(‘크레스토스’ 논쟁)을 ‘정황상 이런 일이 있었을 것이라는 합리적인 이야기’로 제시했다.", "quote": "그 당시에 아마도 정황상 이런 일이 있었을 것이다는 아주 합리적인 것을 제가 이야기로 말씀드리는 거예요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": true, "mid": false, "note": "추정 — 사실로 단정하지 말 것"}, {"id": "C141", "label": "④-10", "section": "4", "claim": "교수는 로마 작가 타키투스의 ‘혐오스러운 미신’이 그리스도를 따르는 것이며, 바깥 사람들은 주의 만찬을 오해했을 만한 이유가 있었다고 설명했다.", "quote": "그리스도를 따르는 거예요. 그럴만한 이유가 있어요. 주에 만찬할 때 그들은 사람을 죽여서 살을 뜯어 먹고 피를 마신 때", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": true, "mid": false, "note": "음성인식 불명확·교수 추정 — 해석 주의"}, {"id": "C142", "label": "③-41", "section": "3", "claim": "교수는 로마서 13장의 ‘권세에 순종’을 쓸 때 바울은 아마 네로가 변하기 전쯤이었을 것이라는 견해가 다수라고 설명했다.", "quote": "바울이 이 얘기를 썼을 때 아마도 네로가 어느 정 변하기 이전 정도가 되지 않았을까 이렇게 보는 견해가 다수입니다.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C143", "label": "④-11", "section": "4", "claim": "교수는 루터의 ‘오직 믿음’은 면죄부가 팔리던 시대 상황과 함께 볼 때 이해되며, 그 슬로건이 너무 부각되어 믿음 자체를 오해하게까지 된 경우도 있다고 했다.", "quote": "그러나 우리는 거기만 이렇게 꼭 볼 필요는 없는 거죠. 그 시대 상황과 함께 볼 때 이해를 하고", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C144", "label": "④-12", "section": "4", "claim": "교수는 유대교를 ‘율법주의’로 본 것을 우리가 오해했던 것을 바로잡은 것이라고 설명했다(바울이 변한 것이 아니라 우리의 관점이 변함).", "quote": "그게 바울의 관점이 변했다고 바울은 변하지 않죠. 말씀하신 것처럼 근데 우리가 오해했던 걸 바로 잡은 것 같다라고 우리가 인식을 해요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 새 관점 논의는 학계 논쟁이 있음(강의도 ‘비평이 있는 건 사실’이라 함)"}, {"id": "C145", "label": "④-13", "section": "4", "claim": "교수의 지인이 이스라엘 랍비 학교에서 들은 말: 서양 신학자들이 ‘스튜피드’라고 했고, 랍비는 ‘하나님 앞에 의인은 은혜로 받는 거야’라고 했다(교수 전언).", "quote": "그라삐가 하나님 앞에 의인은 은혜로 받는 거야. 그 말만 하고 딱 갔대요.", "src": "4주차 강의 녹취(로마서)", "kind": "녹취", "caution": true, "mid": false, "note": "전언·음성인식(‘그라삐’=랍비) — 단정하지 말 것"}, {"id": "C146", "label": "④-14", "section": "4", "claim": "교수는 유대교를 율법주의로 보는 관점이 종교개혁 이전 로마 가톨릭의 관점을 유대교에 투사한 것이라는 비판이 있다고 설명했다.", "quote": "그래서 종교개혁 이전에 로망캐롤릭의 그 관점을 투사시켜서 역사를 이해했다고 판단한 거예요.", "src": "6주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기. 학계 논쟁 소지"}, {"id": "C147", "label": "④-15", "section": "4", "claim": "교수는 『성경과 편견』(Misreading Scripture with Western Eyes)을 서양적 시각으로 잘못 읽는 성경, 문화적 차이의 문제로 소개했다.", "quote": "서양적 시각으로 잘못 읽는 성경 왜요 문화적 차이", "src": "1주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}, {"id": "C148", "label": "주의-11", "section": "쓰지 말 것", "claim": "바울을 지역교회 목회자나 지금 개념의 선교사로 단정하지 말고 현재 목회에 성급하게 적용하지 말라고 교수가 말했다.", "quote": "첫째 아울은 목회자가 아니었어요. 맞죠? 지역교회 목회자가 아니었어요.", "src": "3주차 강의 녹취", "kind": "녹취", "caution": false, "mid": true, "note": "녹취 표기"}], "sections": [{"key": "시험 안내", "title": "교수님이 6주차에 직접 한 시험 안내", "intro": "6주차 강의 녹취(음성인식) 기반입니다. 녹취가 불명확한 부분은 ‘녹취상 불명확’이라 적었습니다. 정확한 조건은 수업계획서·공지로 다시 확인하세요."}, {"key": "1", "title": "① 서신(편지) 장르를 이해하면 도움이 되는 점", "intro": "강의 내용 요약 — 각 문장 끝의 번호를 누르면 근거 카드(원문 인용)로 이동합니다."}, {"key": "2", "title": "② 서신 장르를 모르고 읽을 때 해가 되는 점", "intro": "강의가 직접 말한 것과, 이어서 생각해 볼 점(‘추론’ 표시)을 구분했습니다."}, {"key": "3", "title": "③ 바울·동역자·수신자 세계의 문화와 언어를 이해하면 도움이 되는 점", "intro": ""}, {"key": "4", "title": "④ 문화와 언어를 이해하지 못할 때 해가 되는 점", "intro": ""}, {"key": "5", "title": "⑤ 강의에서 소개된 실례", "intro": "실례마다 어느 시험 항목(①~④)을 보여 주는지 태그로 표시했습니다. 버튼으로 항목별로 걸러 볼 수 있습니다."}, {"key": "정경", "title": "청년의 질문 — 바울의 편지가 어떻게 성경(정경)이 되었나", "intro": "강의에서 다룬 범위만 모았습니다. 정경 확정의 연도·회의·인물은 강의에서 다루지 않았습니다."}, {"key": "6", "title": "⑥ 따뜻하고 친절한 태도", "intro": "강의에서 교수님이 보여 준 방식을 정리했습니다."}, {"key": "쓰지 말 것", "title": "주의 — 강의로 확인되지 않았거나 강의가 다르게 말한 내용", "intro": "공부할 때 단정하지 않도록 조심할 점입니다."}], "points": {"시험 안내": [{"text": "교수님은 시험에서 확실하지 않은 상세 내용을 쓰다가 오답이 되면 ‘잘못된 정보를 주는 것’이라 감점이 된다고 말했습니다(감점 점수는 녹취상 불명확).", "refs": ["C91"], "infer": false}, {"text": "예를 들 때 ‘고린도전서 몇 장 몇 절’까지 쓰지 않아도 되며, 큰 그림에서 생각나는 예(‘고린도서에 이렇게’)를 쓰면 된다고 했습니다.", "refs": ["C92", "C93"], "infer": false}, {"text": "‘포함해 달라’고 한 항목은 반드시 포함하고 나머지는 자유이며, 앞면은 필수 항목으로 채워지고 뒷면은 청년들에게 도움이 될 내용을 자유롭게 쓰라고 했습니다.", "refs": ["C96", "C97"], "infer": false}, {"text": "주안점은 이 강의에서 다룬 내용이고 성경 본문은 예시 정도입니다. 전반 내용은 6주차(갈라디아서)까지로 충분하며 특히 갈라디아서가 중요하다고 했습니다.", "refs": ["C99", "C100"], "infer": false}, {"text": "‘편지는 무엇인가·어떻게 쓰였나’(2주차) 부분을 복습하고, 강의 안에서 이루어진 실제 예로 설명해 달라고 했습니다.", "refs": ["C101"], "infer": false}, {"text": "손으로 쓰며 컴퓨터는 쓸 수 없고, ‘앞뒤로 한 장 이상 쓰지 말라’고 한 것으로 들립니다(용지 종류·분량은 녹취상 불명확). 시간은 최대 1시간 반이라고 했습니다.", "refs": ["C95", "C94", "C98"], "infer": false}, {"text": "시험 속 청년은 30대 초반 남성이고 같이 모이는 그룹도 대부분 그 정도 연령입니다. 청년들은 부끄러움이 많으니 친절하고 따뜻하게 가르쳐야 한다고 했습니다.", "refs": ["C102", "C103"], "infer": false}], "1": [{"text": "강의는 신약의 서신서를 ‘지역교회들과 인물들에게 특정한 상황을 바탕으로 의사소통했던 생생한 현장의 모습’을 담은 글이라고 소개했습니다.", "refs": ["C01"], "infer": false}, {"text": "멀리 떨어진 사람에게 서신은 보낸 이의 ‘인격적 현존’을 뜻했고, 단순한 의사소통을 넘어 깊은 대화와 돌봄의 방법이었다고 설명했습니다.", "refs": ["C02"], "infer": false}, {"text": "서신에는 ‘인사–감사–본론–맺음’의 전형적인 구조가 있고, 신약 저자들은 인사말에 ‘은혜와 평강’을 썼으며, 바울은 편지를 받는 교회를 생각하며 하나님께 감사했다고 합니다. 본론에는 찬송시·기도문·교차대구 같은 하위 장르가 쓰였습니다.", "refs": ["C03", "C04", "C05", "C06"], "infer": false}, {"text": "편지는 전달자가 회중 앞에서 읽고 필요하면 설명했으며(로마서의 뵈뵈), 글은 훈련 받은 대필자가 쓰기도 했고, 일반인이 쓸 수 있는 우편 제도는 없었다고 설명했습니다.", "refs": ["C08", "C10", "C09"], "infer": false}, {"text": "고린도전서는 특정한 상황에서 일어난 특정한 문제에 초점을 맞춘 실천적인 서신으로 소개되었습니다.", "refs": ["C113"], "infer": false}], "2": [{"text": "강의는 서신이 오가던 대화의 한쪽만 남아 있다고 지적했습니다. 고린도 교회가 바울에게 보낸 편지는 남아 있지 않고, 바울은 교인들 사이에서 논란이 된 말을 인용한 뒤 조언하기도 했습니다.", "refs": ["C15", "C16"], "infer": false}, {"text": "그래서 현대 독자는 고린도전·후서를 읽는 속도를 늦춰야 하며, 저자·역사적 상황의 이해가 구절을 어떻게 해석할 수 있는지에 영향을 준다고 했습니다.", "refs": ["C14", "C21"], "infer": false}, {"text": "갈라디아서에서는 바울의 심정과 그 심정이 향하는 대상(교인들을 향한 목회적 고뇌 vs 유대주의자들을 향한 분노·저주)을 혼동하지 않는 것이 첫 단추라고 했고, 교수님 자신도 ‘어리석도다’를 읽을 때 나를 향한 말처럼 느꼈다고 말했습니다.", "refs": ["C18", "C19", "C50"], "infer": false}, {"text": "고린도전서 11:27-29는 오늘 교회에서 읽는 방식과 달리, 당시 만찬 상황을 고려해 다시 생각되어야 한다고 설명했습니다.", "refs": ["C20", "C119"], "infer": false}, {"text": "(생각해 볼 점 — 강의가 직접 한 말은 아님) 한 구절만 떼어 읽으면 누구의 어떤 질문에 대한 답인지 놓치기 쉽습니다.", "refs": ["C14"], "infer": true}], "3": [{"text": "강의는 독자와 서신 사이에 공간·시간·문화의 갭이 있으며, 그 갭을 인식하고 그들의 사회·문화·상황을 배우면 저자의 메시지가 더 크고 선명하게 들린다고 말했습니다.", "refs": ["C23"], "infer": false}, {"text": "언어의 예: 갈라디아서 6:6의 ‘함께 하라’는 원어로 ‘동참하다’의 뜻이고(번역에 따라 ‘나누라’), ‘방언’(γλῶσσα)은 직역하면 ‘언어/말 function chipFor(id){const c=CARD[id]; const a=mk("a","chip",c.label); a.href="#c"+c.n; a.onclick=ev=>{ev.preventDefault(); const t=document.getElementById("c"+c.n); if(!t)return; let p=t.closest("details"); while(p){p.open=true; p=p.parentElement&&p.parentElement.closest("details");} t.scrollIntoView({behavior:"smooth",block:"center"}); t.style.outline="3px solid var(--acc2)"; setTimeout(()=>t.style.outline="",1800);}; return a;}
function srcTag(c){ if(c.caution) return mk("span","tag lo","강의 중 언급 — 해석 주의"); if(c.kind==="녹취") return mk("span","tag mid","강의 녹취(음성인식)"); return mk("span","tag hi","강의 자료 원문"); }
function cardEl(c){const d=mk("div","card"+(c.caution?" dim":"")); d.id="c"+c.n; d.dataset.id=c.id;
 const h=mk("div"); h.appendChild(mk("span","cid",c.label)); h.appendChild(mk("span","cl",c.claim)); d.appendChild(h);
 d.appendChild(mk("blockquote",null,"“"+c.quote+"”"));
 const s=mk("div","src"); s.appendChild(srcTag(c)); s.appendChild(document.createTextNode("출처: "+c.src)); d.appendChild(s);
 if(c.note) d.appendChild(mk("div","note","※ "+c.note)); return d;}
function sentEl(p){const e=mk("p"); if(p.infer)e.appendChild(mk("span","tag inf","추론")); e.appendChild(document.createTextNode(p.text)); const w=mk("span"); p.refs.forEach(r=>w.appendChild(chipFor(r))); e.appendChild(w); return e;}
function cardsDetails(sec,label){const cs=D.cards.filter(c=>c.section===sec); const d=mk("details","ev"); d.appendChild(mk("summary",null,"근거 카드 "+cs.length+"개 (원문 인용·출처)"+(label?" — "+label:""))); cs.forEach(c=>d.appendChild(cardEl(c))); return d;}
const NAVL={"시험 안내":"시험 안내","1":"①","2":"②","3":"③","4":"④","5":"⑤ 실례","정경":"정경","6":"⑥","쓰지 말 것":"주의"};
D.sections.forEach(s=>{const a=mk("a",null,NAVL[s.key]); a.href="#sec-"+s.key; $("nav").appendChild(a);});
const nb=mk("a",null,"스스로 정리하기"); nb.href="#sec-self"; $("nav").appendChild(nb);
let examWrap=null, setFilter=null;
D.sections.forEach(s=>{
 const w=mk("section"); w.id="sec-"+s.key; w.appendChild(mk("h2",null,s.title)); if(s.intro) w.appendChild(mk("div","sub",s.intro));
 if(s.key==="쓰지 말 것"){ const b=mk("div","dont"); const ul=mk("ul"); D.dont.forEach(x=>{const li=mk("li"); li.appendChild(document.createTextNode(x[0])); li.appendChild(chipFor(x[1])); ul.appendChild(li);}); b.appendChild(ul); w.appendChild(b); w.appendChild(cardsDetails(s.key)); root.appendChild(w); return;}
 const pts=D.points[s.key]; if(pts){const kp=mk("div","kp"); pts.forEach(p=>kp.appendChild(sentEl(p))); w.appendChild(kp);}
 if(s.key==="5"){
   w.appendChild(mk("div","sub","태그 ①②③④ = 그 실례가 보여 주는 시험 항목"));
   const fb=mk("div","fbar"); const btns=[]; const mkb=(lab,v)=>{const b=mk("button","fbtn"+(v==="all"?" on":""),lab); b.dataset.v=v; b.onclick=()=>setF(v); fb.appendChild(b); btns.push(b);};
   const setF=v=>{btns.forEach(x=>x.classList.toggle("on",x.dataset.v===v)); w.querySelectorAll(".ex").forEach(e=>{e.style.display=(v==="all"||(e.dataset.tags||"").split(",").includes(v))?"":"none";});}; setFilter=setF;
   mkb("전체 "+D.examples.length,"all"); [["① 장르 도움","1"],["② 장르 몰라 해","2"],["③ 문화·언어 도움","3"],["④ 모를 때 해","4"]].forEach(a=>mkb(a[0]+" "+D.examples.filter(e=>e.tags.includes(a[1])).length,a[1])); w.appendChild(fb);
   D.examples.forEach(e=>{const x=mk("div","ex"); x.dataset.tags=e.tags.join(","); const t=mk("div"); t.appendChild(mk("b",null,(e.use?"★ ":"")+e.name)); x.appendChild(t); x.appendChild(mk("div",null,"장면: "+e.scene)); const tg=mk("div","m"); e.tags.forEach(g=>tg.appendChild(mk("span","tag mid","①②③④"[+g-1]+" 항목 "+g))); x.appendChild(tg); const cw=mk("div","m"); cw.appendChild(document.createTextNode("근거: ")); e.claims.forEach(c=>cw.appendChild(chipFor(c))); x.appendChild(cw); w.appendChild(x);});
   w.appendChild(mk("div","sub","★ = 강의에서 비중 있게 다룬 실례")); }
 if(s.key==="정경"){ w.appendChild(mk("div","note","※ 강의에서 다루지 않은 것: 정경의 최종 확정 연도·회의·인물, 개별 서신이 언제부터 ‘성경’으로 인정되었는지의 시점. 교수님은 ‘큰 테두리는 초기부터 거의 정해져 있었고 27권 확정은 한참 뒤’라고만 설명했습니다."));}
 w.appendChild(cardsDetails(s.key,s.key==="5"?"실례 원문":"")); root.appendChild(w);
});
// 스스로 정리하기
const sw=mk("section"); sw.id="sec-self"; sw.appendChild(mk("h2",null,"스스로 정리하기")); sw.appendChild(mk("div","sub","모범 답안은 없습니다. 질문에 먼저 내 말로 답해 본 뒤, 참고 근거 카드의 원문 인용으로 확인하세요. 체크 표시는 이 기기의 브라우저에만 저장됩니다."));
let ck=0; function store(k,v){try{if(v===undefined)return localStorage.getItem(k); localStorage.setItem(k,v?"1":"0");}catch(e){return null;}}
D.self.forEach(it=>{const b=mk("div","self"); b.appendChild(mk("h3",null,it.title));
 b.appendChild(mk("h4",null,"① 스스로 답해 볼 질문")); const ol=mk("ol"); it.qs.forEach(q=>ol.appendChild(mk("li",null,q))); b.appendChild(ol);
 b.appendChild(mk("h4",null,"② 정리할 때 참고할 근거 카드·실례")); const rf=mk("div"); it.refs.forEach(r=>rf.appendChild(chipFor(r)));
 const lb=mk("div"); lb.style.marginTop="6px"; const bt=mk("button","linkbtn","실례 목록 보기"+(it.tag==="all"?"":" (항목 "+it.tag+")")); bt.onclick=()=>{ if(setFilter) setFilter(it.tag==="all"?"all":it.tag); document.getElementById("sec-5").scrollIntoView({behavior:"smooth"});}; lb.appendChild(bt); b.appendChild(rf); b.appendChild(lb);
 b.appendChild(mk("h4",null,"③ 체크리스트")); const ul=mk("ul","chk"); it.check.forEach(t=>{const li=mk("li"); const cb=document.createElement("input"); cb.type="checkbox"; const key="st-"+it.key+"-"+(ck++); try{cb.checked=localStorage.getItem(key)==="1";}catch(e){} cb.onchange=()=>{try{localStorage.setItem(key,cb.checked?"1":"0");}catch(e){}}; const lab=mk("span",null,t); li.appendChild(cb); li.appendChild(lab); ul.appendChild(li);}); b.appendChild(ul); sw.appendChild(b);});
root.appendChild(sw);
$("foot").textContent="근거 카드 "+D.cards.length+"개 · 실례 "+D.examples.length+"개 · 단일 파일(오프라인)";
</script></body></html>
