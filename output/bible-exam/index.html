"s":"'드단, 데마, 게달'과 같은 성읍이 있는 나라는 어디인가? ( )","a":"아라비아"},{"t":"OT","b":"이사야","y":"단답형","n":16,"s":"'아스돗, 가드, 아스글론'과 같은 성읍이 있는 나라는 어디인가? ( )","a":"블레셋"},{"t":"OT","b":"이사야","y":"단답형","n":17,"s":"이사야 소묵시 혹은 이사야 묵시록으로 불리는 곳은 이사야서의 어느 단락인가? ( )","a":"이사야 24-27장"},{"t":"OT","b":"이사야","y":"단답형","n":18,"s":"히스기야 왕 시절 예루살렘 성을 포위하고 랍사게를 보내어 여호와를 모독한 앗수르 왕은 누구인가? ( )","a":"산헤립"},{"t":"OT","b":"이사야","y":"단답형","n":19,"s":"이사야 45장에서 여호와의 기름부음을 받은 자는 누구인가? ( )","a":"고레스"},{"t":"OT","b":"이사야","y":"단답형","n":20,"s":"\"고난 받는 종\"의 노래로 메시야의 도래를 예언한 예언서는 무엇인가? ( )","a":"이사야서"},{"t":"OT","b":"이사야","y":"단답형","n":21,"s":"유다가 바벨론의 포로생활을 하는 경험을 기초로 전개되는 예언을 담고 있는 이사야서는 어느 단락인가? ( )","a":"이사야 40-55장"},{"t":"OT","b":"이사야","y":"단답형","n":22,"s":"\"보라 내가 새 하늘과 새 땅을 창조하나니 이전 것은 기억되거나 마음에 생각나지 아니할 것이라는 예언을 담고 있는 예언서\"는 무엇인가? ( )","a":"이사야서"},{"t":"OT","b":"이사야","y":"단답형","n":23,"s":"\"하늘은 나의 보좌요 땅은 나의 발판이니 너희가 나를 위하여 무슨 집을 지으랴 나의 처소가 어디랴\"는 말씀이 담겨 있는 곳은 이사야서 어느 장인가? ( )","a":"66장"},{"t":"OT","b":"이사야","y":"단답형","n":24,"s":"\"좋은 소식을 전하며 평화를 공포하며 복된 좋은 소식을 가져오며 구원을 공포하며 시온을 향하여 이르기를 네 하나님이 통치하신다 하는 자의 산을 넘는 발이 어찌 그리 아름다운가\"란 말씀이 담겨 있는 곳은 이사야서의 어느 장인가? ( )","a":"52장"},{"t":"OT","b":"이사야","y":"단답형","n":25,"s":"\"우리는 다 양같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다\"는 말씀이 담겨 있는 곳은 이사야서 어느 장인가? ( )","a":"53장"},{"t":"OT","b":"이사야","y":"진위형","n":1,"s":"이사야는 요시야 시대의 예언자이다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":2,"s":"이사야서는 총 66장으로 구성되어 있다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":3,"s":"이사야서의 종의 노래는 이사야 40-55장 가운데 등장한다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":4,"s":"이사야는 웃시야 왕이 죽던 해에 성전에서 소명을 체험했다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":5,"s":"주전 734년 시리아-에브라임 위기 때 아하스 왕에게 준 이사야의 표적은 임마누엘 아기 이름이다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":6,"s":"주전 734년 시리아-에브라임 위기란 북 왕국 베가(르말리야의 아들)와 시리아 르신 연합군이 예루살렘을 위협한 사건을 가리킨다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":7,"s":"주전 734년 시리아-에브라임 위기 때 이사야의 예언은 앗수르에게 지원을 요청하라는 것이었다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":8,"s":"주전 734년 시리아-에브라임 위기 때 유다의 아하스 왕은 이 동맹에 가담했다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":9,"s":"주전 734년 시리아-에브라임 위기 때 유다의 아하스 왕은 여호와를 전적으로 믿고 찾았다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":10,"s":"주전 701년 유다를 초토화시키고 예루살렘을 포위 공격한 앗수르 왕은 에살핫돈이다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":11,"s":"주전 701년 예루살렘이 앗수르에게 포위 공격을 당할 때 히스기야 왕은 이에 맞서 싸웠다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":12,"s":"히스기야 왕 때 바벨론의 사절 므로닥발라단의 사신에게 성전과 왕궁의 곳간을 전부 보여주었는데 이로 인해 이사야에게 바벨론 포로가 되리라는 예언을 들었다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":13,"s":"바벨론을 멸망시키고 유다 포로를 고국으로 귀환하도록 허락한 나라는 바사이다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":14,"s":"바벨론을 멸망시키고 유다 포로를 고국으로 귀환하는 칙령을 내린 바사 왕은 다리오다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":15,"s":"\"너희는 위로하라 내 백성을 위로하라\"는 말씀은 예레미야가 한 예언이다. (O,X)","a":"X"},{"t":"OT","b":"이사야","y":"진위형","n":16,"s":"고난 받는 종으로서 메시야에 관한 예언을 한 예언자는 이사야다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":17,"s":"이사야 24-27장은 이사야묵시로서 이름 모를 성읍의 심판과 회복에 관한 말씀을 담고 있다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":18,"s":"이사야 13-23장은 여러 민족들에 관한 심판 신탁을 담고 있다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":19,"s":"이사야서는 예루살렘의 운명에 관한 예언의 말씀들이 담겨 있다. (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"진위형","n":20,"s":"이사야서 40-55장은 바사 왕 고레스의 등장을 유다 포로민이 고향으로 귀국할 역사적 단초로 기대한 내용을 담고 있다. (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"선택형","n":1,"s":"\"힐기야의 아들, 살구나무 가지, 토기장이의 그릇, 바룩, 하나냐\" 등과 관련이 있는 책은 무엇인가?","c":["이사야","예레미야","에스겔","다니엘"],"a":"2"},{"t":"OT","b":"예레미야","y":"선택형","n":2,"s":"예레미야가 속한 지파는 무엇이며 고향은 어디인가? (렘1:1)","c":["베냐민, 아나돗","베냐민, 예루살렘","유다, 모레셋","레위, 그발"],"a":"1"},{"t":"OT","b":"예레미야","y":"선택형","n":3,"s":"예레미야는 유다 백성이 저지른 우상 숭배를 무엇에 비유했는가? (렘3:8)","c":["도둑질","살인","행음","교만"],"a":"3"},{"t":"OT","b":"예레미야","y":"선택형","n":4,"s":"\"너희는 이것이 여호와의 성전이라, 여호와의 성전이라, 여호와의 성전이라 하는 거짓말을 믿지 말라\"라고 외친 선지자는 누구인가? (렘7:4)","c":["이사야","예레미야","에스겔","아모스"],"a":"2"},{"t":"OT","b":"예레미야","y":"선택형","n":5,"s":"하나님께서 명령하신대로, 베 띠를 사서 유브라데 물 가에 감추어 두었다가 그것이 썩자 유다의 교만과 예루살렘의 큰 교만도 이와 같이 썩게 된다고 예언한 선지자는 누구인가? (렘13:1-10)","c":["이사야","호세아","예레미야","에스겔"],"a":"3"},{"t":"OT","b":"예레미야","y":"선택형","n":6,"s":"예레미야가 사용한 비유가 아닌 것은 무엇인가? (렘13장, 19장)","c":["썩은 허리띠","포도주 가죽부대","깨진 옹기","마른 뼈 골짜기 환상"],"a":"4"},{"t":"OT","b":"예레미야","y":"선택형","n":7,"s":"유다의 멸망을 예언하는 예레미야를 성전에 가두고 목에 나무 고랑을 채웠던 제사장이자 성전의 총감독은 누구인가? (렘20:1-2)","c":["하나냐","바스훌","바락","여호야긴"],"a":"2"},{"t":"OT","b":"예레미야","y":"선택형","n":8,"s":"예레미야는 유다 백성들이 바벨론에서 몇 년 동안 포로 생활을 하게 된다고 예언했는가? (렘25:12)","c":["40년","60년","70년","80년"],"a":"3"},{"t":"OT","b":"예레미야","y":"선택형","n":9,"s":"줄과 멍에를 목에 걸고 다니면서 유다와 에돔과 모압과 암몬과 두로와 시돈 등이 바벨론의 멍에를 지게 될 것을 예언한 자는 누구인가? (렘28장)","c":["이사야","예레미야","에스겔","다니엘"],"a":"2"},{"t":"OT","b":"예레미야","y":"선택형","n":10,"s":"예레미야 때에, 선조 요나답의 명령에 순종하여 영원히 포도주를 마시지 않아서 후손들이 영원히 끊어지지 않게 될 것을 약속받게 된 사람들은 누구인가?(렘35장)","c":["레갑 사람들","레위인들","시므온 지파","유다 지파"],"a":"1"},{"t":"OT","b":"예레미야","y":"선택형","n":11,"s":"유다가 바벨론에 패망하고 난 후에 예레미야는 요하난과 모든 군 지휘관과 남자, 여자, 유아, 왕의 딸들과 바룩과 함께 어디로 가서 활동을 했는가? (렘43:5-7)","c":["바사","앗수르","애굽","헬라"],"a":"3"},{"t":"OT","b":"예레미야","y":"선택형","n":12,"s":"예레미야서에 보면 여호와의 철퇴라고 불린 나라는 어디인가? (렘51:20)","c":["앗수르","시리아","블레셋","바벨론"],"a":"4"},{"t":"OT","b":"예레미야","y":"완성형","n":1,"s":"\"내가 너를 모태에 짓기 전에 너를 알았고 네가 배에서 나오기 전에 너를 성별하였고 너를 여러 나라의 선지자로 세웠노라\"라는 말씀은 여호와께서 ( )에게 주신 말씀이다(렘1:5).","a":"예레미야"},{"t":"OT","b":"예레미야","y":"완성형","n":2,"s":"유다 백성들이 섬기는 신들이 그들의 성읍 수와 같다고 지적하며 하나님의 심판을 선포한 선지자는 ( )이다(렘2:28).","a":"예레미야"},{"t":"OT","b":"예레미야","y":"완성형","n":3,"s":"공중의 ( )은 그 정한 시기를 알고 산비둘기와 제비와 두루미는 그들이 올 때를 지키거늘 내 백성은 여호와의 규례를 알지 못하도다(렘8:7).","a":"학"},{"t":"OT","b":"예레미야","y":"완성형","n":4,"s":"나라의 멸망을 예언하는 예레미야에게 \"너는 여호와의 이름으로 예언하지 말라 두렵건대 우리 손에 죽을까 하노라\"라고 엄포를 놓은 자들은 예레미야의 고향인 ( ) 사람들이다(렘11:21).","a":"아나돗"},{"t":"OT","b":"예레미야","y":"완성형","n":5,"s":"\"선지자들이 내 이름으로 거짓 예언을 하도다 나는 그들을 보내지 아니하였고 그들에게 명령하거나 이르지 아니하였거늘 그들이 거짓 계시와 점술과 헛된 것과 자기 마음의 거짓으로 너희에게 예언하는도다\"라는 말씀은 하나님께서 ( )를 통해 전하셨다(렘14:14).","a":"예레미야"},{"t":"OT","b":"예레미야","y":"완성형","n":6,"s":"불의로 치부하는 자는 ( )가 낳지 아니한 알을 품음 같아서 그의 중년에 그것이 떠나겠고 마침내 어리석은 자가 되리라(렘17:11).","a":"자고새"},{"t":"OT","b":"예레미야","y":"완성형","n":7,"s":"\"내가 다시는 여호와를 선포하지 아니하며 그의 이름으로 말하지 아니하리라 하면 나의 마음이 불붙는 것 같아서 골수에 사무치니 답답하여 견딜 수 없나이다\"라고 고백한 선지자는 ( )이다(렘20:9).","a":"예레미야"},{"t":"OT","b":"예레미야","y":"완성형","n":8,"s":"나의 삶으로 맹세하노니 유다 왕 여호야김의 아들 ( )가 나의 오른손의 인장반지라 할지라도 내가 빼어 네 생명을 찾는 자의 손과 네가 두려워하는 자의 손 곧 바벨론의 왕 느부갓네살이 손과 갈대아인의 손에 줄 것이라(렘22:24-25).","a":"고니야(여호야긴)"},{"t":"OT","b":"예레미야","y":"완성형","n":9,"s":"내가 ( ) 선지자들 가운데도 가증한 일을 보았나니 그들은 간음을 행하며 거짓을 말하며 악을 행하는 자의 손을 강하게 하여 사람으로 그 악에서 돌이킴이 없게 하였은즉 그들은 다 내 앞에서 소돔과 다름이 없고 그 주민은 고모라와 다름이 없느니라(렘23:14).","a":"예루살렘"},{"t":"OT","b":"예레미야","y":"완성형","n":10,"s":"바벨론이 예루살렘을 포위하여 나라가 패망하려는 시점에 숙부의 아들 하나멜의 제안에 따라 아나돗에 있는 땅을 은 칠십 세겔에 사기로 계약을 함으로써, 하나님께서 이루어주실 나라의 회복을 상징적으로 보여준 선지자는 ( )이다(렘32:8).","a":"예레미야"},{"t":"OT","b":"예레미야","y":"완성형","n":11,"s":"바벨론의 느부갓네살 왕이 유다 백성들을 포로로 데려가면서, 유다에 남아 있는 빈민들을 다스리도록 아히감의 아들 ( )를 총독으로 세웠다(렘40:7).","a":"그다랴(그달리야)"},{"t":"OT","b":"예레미야","y":"완성형","n":12,"s":"내 백성이 두 가지 악을 행하였나니 곧 그들이 ( )의 근원되는 나를 버린 것과 스스로 웅덩이를 판 것인데 그것은 그 물을 가두지 못할 터진 웅덩이들이니라(렘2:13).","a":"생수"},{"t":"OT","b":"예레미야","y":"완성형","n":13,"s":"유다인과 예루살렘 주민들아 너희는 스스로 할례를 행하여 너희 ( ) 가죽을 베고 나 여호와께 속하라 그리하지 아니하면 너희 악행으로 말미암아 나의 분노가 불 같이 일어나 사르리니 그것을 끌 자가 없으리라(렘4:4).","a":"마음"},{"t":"OT","b":"예레미야","y":"완성형","n":14,"s":"내 백성은 나를 알지 못하는 어리석은 자요 지각이 없는 미련한 자식이라 악을 행하기에는 지각이 있으나 ( )을 행하기에는 무지하도다(렘4:22).","a":"선"},{"t":"OT","b":"예레미야","y":"완성형","n":15,"s":"구스인이 그의 피부를, ( )이 그의 반점을 변하게 할 수 있으냐 할 수 있을 진대 악에 익숙한 너희도 선을 행할 수 있으리라(렘13:23).","a":"표범"},{"t":"OT","b":"예레미야","y":"단답형","n":1,"s":"하나님의 부르심에 대해 \"슬프도소이다 주 여호와여 보소서 나는 아이라 말할 줄을 알지 못하나이다\"라고 답한 자는 누구인가? (렘1:6) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":2,"s":"\"이 땅에 놀라운 일이 있도다 선지자들은 거짓을 예언하며 제사장들은 자기 권력으로 다스리며 내 백성은 그것을 좋게 여기니 마지막에는 너희가 어찌하려느냐\"라는 말씀을 전한 선지자는 누구인가? (렘5:30-31) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":3,"s":"\"그들이 내 백성의 상처를 가볍게 여기면서 말하기를 평강하다 평강하다 하나 평강이 없도다\"라는 말은 어느 선지자가 한 말인가? (렘6:14) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":4,"s":"\"만일 네가 보행자와 함께 달려도 피곤하면 어찌 능히 말과 경주하겠느냐 네가 평안한 땅에서는 무사하려니와 요단 강 물이 넘칠 때에는 어찌하겠느냐?\"라는 말씀은 하나님께서 누구에게 주신 말씀인가? (렘12:5) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":5,"s":"여호와께서 내게(예레미야) 이르시되 모세와 ( )이 내 앞에 섰다 할지라도 내 마음은 이 백성을 향할 수 없나니 그들을 내 앞에서 쫓아 내보내라(렘15:1). ( )","a":"사무엘"},{"t":"OT","b":"예레미야","y":"단답형","n":6,"s":"\"이스라엘 족속아 이 토기장이가 하는 것 같이 내가 능히 너희에게 행하지 못하겠느냐 이스라엘 족속아 진흙이 토기장이의 손에 있음 같이 너희가 내 손에 있느니라\"라는 여호와의 말씀을 외친 선지자는 누구인가? (렘18:6) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":7,"s":"\"여호와여 주께서 나를 권유하시므로 내가 그 권유를 받았사오며 주께서 나보다 강하사 이기셨으므로 내가 조롱 거리가 되니 사람마다 종일토록 나를 조롱하나이다\"라고 말한 자는 누구인가? (렘20:7) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":8,"s":"앗술의 아들로서, 예레미야가 목에 멍에를 매고 있는 것을 끊어버리면서 유다가 바벨론의 속박에서 속히 벗어나게 될 것이라고 외친 선지자는 누구인가? (렘28:12) ( )","a":"하나냐"},{"t":"OT","b":"예레미야","y":"단답형","n":9,"s":"\"너희가 내게 부르짖으며 내게 와서 기도하면 내가 너희들의 기도를 들을 것이요 너희가 온 마음으로 나를 구하면 나를 찾을 것이요 나를 만나리라\"라는 구절이 포함된 구약의 책은 무엇인가? (렘29:12) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":10,"s":"바벨론에 포로로 잡혀가게 된 유다 백성들에게 \"오래 지내야 하리니 너희는 집을 짓고 살며 밭을 일구고 그 열매를 먹으라\"라고 외친 선지자는 누구인가? (렘29:28) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"단답형","n":11,"s":"예레미야를 대신하여 성전에서 하나님의 말씀을 낭독한 자는 누구인가? (렘36:8) ( )","a":"바룩"},{"t":"OT","b":"예레미야","y":"단답형","n":12,"s":"예레미야가 보낸 두루마리를 면도칼로 베어 화로 불에 던져서 태워버린 유다의 왕은 누구인가? (렘36:23) ( )","a":"여호야김"},{"t":"OT","b":"예레미야","y":"단답형","n":13,"s":"\"너는 아이라 말하지 말고 내가 너를 누구에게 보내든지 너는 가며 네가 네게 무엇을 명령하든지 너는 말할지니라\"라는 말씀은 여호와께서 누구에게 하신 말씀인가? (렘1:7) ( )","a":"예레미야"},{"t":"OT","b":"예레미야","y":"진위형","n":1,"s":"살구나무 가지 환상과 끓는 가마 환상을 보며 하나님의 소명을 받은 선지자는 에스겔이다(렘1:11-19). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":2,"s":"예레미야가 본 끓는 가마 환상은 북쪽으로부터 앗수르가 쳐들어 올 것을 암시한 것이다(렘 1:13). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":3,"s":"\"너희는 예루살렘 거리로 빨리 다니며 그 넓은 거리에서 찾아보고 알라 너희가 만일 정의를 행하며 진리를 구하는 자를 한 사람이라도 찾으면 내가 이 성읍을 용서하리라\"라는 말씀은 하나님께서 예레미야를 통해 하신 말씀이다(렘5:1). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":4,"s":"\"지혜로운 자는 그의 지혜를 자랑하지 말라 용사는 그의 용맹을 자랑하지 말라 부자는 그의 부함을 자랑하지 말라 자랑하는 자는 이것으로 자랑할지니 곧 명철하여 나를 아는 것과 나 여호와는 사랑과 정의와 공의를 땅에 행하는 자인 줄 깨닫는 것이라\"라고 외친 선지자는 미가이다(렘9:23-24). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":5,"s":"\"만물보다 거짓되고 심히 부패한 것은 마음이라 누가 능히 이를 알리요마는 나 여호와는 심장을 살피며 폐부를 시험하고 각각 그의 행위와 그의 행실대로 보응하리니\"라고 외친 선지자는 예레미야이다(렘17:9). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":6,"s":"예레미야가 힌놈의 아들의 골짜기에서 토기장이의 옹기를 깨뜨린 것은 바벨론이 멸망하게 될 것을 예언한 것이다(렘19장). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":7,"s":"\"내 생일이 저주를 받았더면, 나의 어머니가 나를 낳던 날이 복이 없었더면, 나의 아버지에게 소식을 전하여 이르기를 당신이 득남하였다 하여 아버지를 즐겁게 하던 자가 저주를 받았더면…\"이라는 구절은 욥기에 나온다(렘20:14-15). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":8,"s":"시드기야 왕 때 예루살렘을 포위한 바벨론의 왕은 느부갓네살이다(렘34:1). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":9,"s":"\"너희는 죽은 자를 위하여 울지 말며 그를 위하여 애통하지 말고 잡혀간 자를 위하여 슬피 울라 그는 다시 돌아와 그 고국을 보지 못할 것임이라\"라는 예레미야의 예언에서 잡혀간 자는 살룸(여호아하스)을 뜻한다(렘22:10-11). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":10,"s":"\"내가 나의 법을 그들의 속에 두며 그들의 마음에 기록하여 나는 그들의 하나님이 되고 그들은 내 백성이 될 것이라\"라는 구절은 예레미야서에 있다(렘31:33). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":11,"s":"유다에 임할 칼과 기근과 전염병에 관해 예언하다가 왕궁 감옥 뜰에 있는 구덩이에 던져진 예레미야를 건져내는데 도운 자는 왕궁 내시 구스인 에벳멜렉이다(렘38:7). (O,X)","a":"O"},{"t":"OT","b":"예레미야","y":"진위형","n":12,"s":"눈이 뽑힌 채 바벨론에 포로로 잡혀간 유다의 왕은 여호야김이다(렘39:7). (O,X)","a":"X"},{"t":"OT","b":"예레미야","y":"진위형","n":13,"s":"\"너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 은밀한 일을 네게 보이리라\"라는 말씀은 예레미야서에 언급된다(렘33:3). (O,X)","a":"O"},{"t":"OT","b":"예레미야애가","y":"선택형","n":1,"s":"\"슬프다 이 성이여 전에는 사람들이 많더니 이제는 어찌 그리 적막하게 앉았는고 전에는 열국 중에 크던 자가 이제는 과부 같이 되었고 전에는 열방 중에 공주였던 자가 이제는 강제 노동을 하는 자가 되었도다\"라는 구절로 시작되는 책은 무엇인가? (애1:1)","c":["예레미야","예레미야애가","나훔","하박국"],"a":"2"},{"t":"OT","b":"예레미야애가","y":"선택형","n":2,"s":"\"사람이 여호와의 구원을 바라고 잠잠히 기다림이 좋도다\"라는 구절이 언급되는 구약의 책은 무엇인가? (애3:26)","c":["시편","잠언","전도서","예레미야애가"],"a":"4"},{"t":"OT","b":"예레미야애가","y":"선택형","n":3,"s":"\"딸 예루살렘이여 내가 무엇으로 네게 증거하며 무엇으로 네게 비유할까 처녀 딸 시온이여 내가 무엇으로 네게 비교하여 너를 위로할까 너의 파괴됨이 바다 같이 크니 누가 너를 고쳐 줄소냐\"라며 예루살렘의 멸망을 탄식하는 구약의 책은 무엇인가? (애2:13)","c":["예레미야","예레미야애가","에스겔","시편"],"a":"2"},{"t":"OT","b":"예레미야애가","y":"완성형","n":1,"s":"예레미야애가는 유다의 수도 ( )이 바벨론에 의해 함락되고 백성들이 포로로 잡혀간 것을 회고하며 그 백성들이 하나님 앞에서 죄를 회개하고 하나님의 자비와 용서를 간구하는 내용을 다룬 책이다.","a":"예루살렘"},{"t":"OT","b":"예레미야애가","y":"완성형","n":2,"s":"여호와의 인자와 ( )이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다 (애3:22-23).","a":"긍휼"},{"t":"OT","b":"예레미야애가","y":"완성형","n":3,"s":"여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것들이 아침마다 새로우니 주의 ( )하심이 크시도소이다 (애3:22-23).","a":"성실"},{"t":"OT","b":"예레미야애가","y":"단답형","n":1,"s":"\"여호와여 보시옵소서 주께서 누구에게 이같이 행하셨는지요 여인들이 어찌 자기 열매 곧 그들이 낳은 아이들을 먹으오며 제사장들과 선지자들이 어찌 주의 성소에서 죽임을 당하오리이까\"라는 구절이 포함된 구약의 책은 무엇인가? (애2:20) ( )","a":"예레미야애가"},{"t":"OT","b":"예레미야애가","y":"단답형","n":2,"s":"\"주께서 인생으로 고생하게 하시며 근심하게 하심은 본심이 아니시로다\"라는 구절이 언급되는 구약의 책은 무엇인가? (애3:33) ( )","a":"예레미야애가"},{"t":"OT","b":"예레미야애가","y":"단답형","n":3,"s":"\"우리가 스스로 우리의 행위들을 조사하고 여호와께로 돌아가자 우리의 마음과 손을 아울러 하늘에 계신 하나님께 들자\"라는 구절이 언급되는 구약의 책은 무엇인가? (애3:40-41) ( )","a":"예레미야애가"},{"t":"OT","b":"예레미야애가","y":"진위형","n":1,"s":"\"여호와의 분노의 매로 말미암아 고난 당한 자는 나로다 나를 이끌어 어둠 안에서 걸어가게 하시고 빛 안에서 걸어가지 못하게 하셨으며 종일토록 손을 들어 자주자주 나를 치시는도다\"라는 구절은 욥기에 언급된다(애3:1-3). (O,X)","a":"X"},{"t":"OT","b":"예레미야애가","y":"진위형","n":2,"s":"\"여호와여 우리를 주께로 돌이키소서 그리하시면 우리가 주께로 돌아가겠사오니 우리의 날들을 다시 새롭게 하사 옛적 같게 하옵소서\"라는 기도가 포함된 책은 예레미야애가이다(애5:21). (O,X)","a":"O"},{"t":"OT","b":"예레미야애가","y":"진위형","n":3,"s":"\"딸 내 백성이 멸망할 때에 자비로운 부녀들이 자기들의 손으로 자기들의 자녀들을 삶아 먹었도다\"라고 탄식하며 패망한 유다 백성들이 경험한 극심한 가난을 표현하고 있는 구약의 책은 예레미야이다(애 4:10). (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"선택형","n":1,"s":"다음 중 에스겔에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["그는 제사장이다","그는 포로기 때에 활약한 선지자다","그는 바벨론에서 이스라엘 유배인들을 상대로 활약하였다","'임마누엘' 이란 이름을 가진 아이의 탄생을 예고한 선지자다"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":2,"s":"다음 중 에스겔서에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["미래의 성전에 대한 묘사를 기록하고 있다","이스라엘에 대한 형벌과 심판에 대한 기록이 있다","이방 민족에 대한 경고의 말씀이 있다","에스겔이 소명 받는 사건에 대한 기록이 없다"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":3,"s":"다음 중 에스겔서와 가장 관련이 없는 것은 무엇인가?","c":["환상","영","마른 뼈","아닥사스"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":4,"s":"에스겔이 목격한 환상들의 내용이 아닌 것은 무엇인가?","c":["스랍들이 '거룩, 거룩, 거룩' 을 부르다","성전에서 이방 신들을 숭배","네 개의 얼굴을 가진, 네 발 달린 네 생물의 형상","하나님의 영광이 성전을 떠남"],"a":"1"},{"t":"OT","b":"에스겔","y":"선택형","n":5,"s":"에스겔서의 내용과 거리가 먼 것은 무엇인가?","c":["하나님은 이스라엘을 사랑으로 돌보셨지만 이스라엘은 다른 신들에게 향하였다","에스겔은 파수꾼으로서의 책임감을 가지고 말씀을 선포한다","옛적부터 항상 계신 이 앞에 괴수가 죽임을 당한다","유다와 이스라엘이 다시 한 국가로 연합한다"],"a":"3"},{"t":"OT","b":"에스겔","y":"선택형","n":6,"s":"다음 중 에스겔서처럼 소명을 받는 내용이 처음에 나오는 책은 무엇인가?","c":["예레미야","이사야","다니엘","학개"],"a":"1"},{"t":"OT","b":"에스겔","y":"선택형","n":7,"s":"다음 중 에스겔서의 첫 환상 속에 나오는 내용이 아닌 것은 무엇인가?","c":["눈이 가득한 네 개의 바퀴","불의 보좌","벽에 써진 글","네 개의 얼굴을 가진, 네 발 달린 네 생물의 형상"],"a":"3"},{"t":"OT","b":"에스겔","y":"선택형","n":8,"s":"에스겔 2장에서 에스겔이 하나님으로부터 받은 선지자로서의 임무는 무엇인가?","c":["패역한 백성에게 하나님의 말씀을 전하는 것","예루살렘의 멸망을 예고하는 것","예루살렘 성전 재건을 촉구하는 것","이집트와의 연합을 촉구하는 것"],"a":"1"},{"t":"OT","b":"에스겔","y":"선택형","n":9,"s":"다음 중 에스겔에게 벌어진 일이 아닌 것은 무엇인가?","c":["두루마리를 삼킴","영이 에스겔을 이끌어 데려감","벙어리가 되다","벌거벗고 예루살렘 거리를 뛰어다니다"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":10,"s":"다음 중 하나님이 에스겔에게 말씀하신 소위 '파수꾼의 임무' 란 무엇을 뜻하는 것인가? (겔3:1-27)","c":["파수꾼처럼 늘 경계를 하며 살아야 한다","파수꾼처럼 부지런하고 깨어있어 말씀을 전해야 한다","에스겔이 예언자로서 하나님의 뜻을 미리 경고하지 않으면 문책을 당할 것이다","성읍의 문을 철저히 지켜야 한다"],"a":"3"},{"t":"OT","b":"에스겔","y":"선택형","n":11,"s":"에스겔이 머리털과 수염을 깎고, 머리털을 셋으로 나눈 후 1/3은 태우고 1/3은 자르고 1/3은 바람에 날려버린 것의 의미는 무엇인가? (겔 5:1-17)","c":["성결할 것을 명령하는 표징","예루살렘 주민의 운명에 대한 표징","포로된 이들을 위한 위생 교육","바벨론 민족의 운명에 대한 표징"],"a":"2"},{"t":"OT","b":"에스겔","y":"선택형","n":12,"s":"하나님은 메시지를 더 효과적으로 전달하시기 위해 예언자들로 하여금 일종의 '상징적 행위' 를 하도록 하신다. 다음 중 예언자와 그 상징적 행위가 서로 일치되지 않는 것은 무엇인가? (겔4:12-17)","c":["예레미야-소의 멍에를 지고 다녀라","호세아-음란한 여자와 결혼하여 음란한 자식을 낳아라","에스겔-390일 동안 왼쪽으로 눕고, 40일 간은 오른 쪽으로 누우며 줄로 결박당하라","아모스-인분 물에 떡을 구어라"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":13,"s":"이스라엘 심판에 대하여 기록된 6-7장의 내용이 아닌 것은 무엇인가?","c":["이스라엘 산위에 있는 산당들의 파괴","흩어진 자들 중 "s":"에스겔 25장에는 암몬과 모압, 에돔, 블레셋에 대한 경고의 말씀이 나온다. 그들을 경고한 이유로 올바른 것은 무엇인가?","c":["여호와를 섬기지 않으므로","나그네를 홀대하여서","유다에게 행한 잔인한 복수로 인하여","애굽과 연합하였기 때문에"],"a":"3"},{"t":"OT","b":"에스겔","y":"선택형","n":24,"s":"에스겔 26장에 따르면 두로는 누가 멸망시킬 것으로 말하는가?","c":["이스라엘","느부갓네살","고레스","애굽"],"a":"2"},{"t":"OT","b":"에스겔","y":"선택형","n":25,"s":"\"또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며\"이 구절과 같은 뜻의 말을 하였던 선지자는 누구인가?(겔36:26)","c":["예레미야","엘리야","미가야","요나"],"a":"1"},{"t":"OT","b":"에스겔","y":"선택형","n":26,"s":"에스겔 37장 환상 속에서 다시 살아나는 '마른 뼈' 는 누구를 상징하는가? (겔37:11)","c":["애굽","이스라엘","다윗","메시야"],"a":"2"},{"t":"OT","b":"에스겔","y":"선택형","n":27,"s":"에스겔에 담겨있는 내용이 아닌 것은 무엇인가?","c":["악한 목자와 선한 목자","새 영과 새 마음","살아나는 마른 뼈","만민이 기도하는 집"],"a":"4"},{"t":"OT","b":"에스겔","y":"선택형","n":28,"s":"에스겔 38장에서 하나님이 갈고리로 아가리를 꿰어 끌고 가는 것은 누구인가?","c":["이스라엘 백성","마곡 땅의 곡","두로의 왕","악어"],"a":"2"},{"t":"OT","b":"에스겔","y":"선택형","n":29,"s":"에스겔이 환상 속에 보았던 새 예루살렘에 대한 묘사로 틀린 것은 무엇인가?","c":["멀리서 그 윤각만 대략 보았다","구체적으로 보고 정확한 치수까지도 알 수 있었다","하나님의 영광이 성전을 가득 채웠다","어떤 외국인도 성전지역에 들어올 수 없다"],"a":"1"},{"t":"OT","b":"에스겔","y":"완성형","n":1,"s":"너는 그들에게 말하라 주 여호와의 말씀이니라 나의 삶을 두고 맹세하노니 나는 ( )이 죽는 것을 기뻐하지 아니하고 ( )이 그의 길에서 돌이켜 떠나 사는 것을 기뻐하노라 이스라엘 족속아 돌이키고 돌이키라 너희 악한 길에서 떠나라 어찌 죽고자 하느냐 하셨다 하라 (겔33:11).","a":"악인"},{"t":"OT","b":"에스겔","y":"완성형","n":2,"s":"이스라엘 백성을 꾸짖는 것에 대한 다음 구절의 괄호 안을 채우시오. \"그들이 이른바 그 여러 나라에서 내 거룩한 ( )이 그들로 말미암아 더러워졌나니 곧 사람들이 그들을 가리켜 이르기를 이들은 여호와의 백성이라도 여호와의 땅에서 떠난 자라 하였음이라\"(겔36:20).","a":"이름"},{"t":"OT","b":"에스겔","y":"완성형","n":3,"s":"또 새 ( )을 너희 속에 두고 새 ( )을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며(겔36:26).","a":"영, 마음"},{"t":"OT","b":"에스겔","y":"완성형","n":4,"s":"다음은 에스겔의 중요한 신학적 입장을 밝힌 구절이다. 괄호 안을 채우시오. \"아들은 ( )의 죄악을 담당하지 아니할 것이요 아버지는 ( )의 죄악을 담당하지 아니하리니 의인의 공의도 자기에게로 돌아가고 악인의 악도 자기에게로 돌아가리라\"(겔18:20).","a":"아버지, 아들"},{"t":"OT","b":"에스겔","y":"단답형","n":1,"s":"16장에서 하나님은 예루살렘을 사랑하는 남자로, 예루살렘은 이를 저버리고 우상을 좇는 음란한 여인으로 비유된다. 이 내용과 가장 가까운 메시지를 전달하였던 선지자는 누구인가? ( )","a":"호세아"},{"t":"OT","b":"에스겔","y":"단답형","n":2,"s":"에스겔서의 유명한 파수꾼 비유는 어떤 직무의 책임감에 대하여 말하는 비유인가? ( )","a":"예언자/선지자"},{"t":"OT","b":"에스겔","y":"단답형","n":3,"s":"에스겔 34장의 선한 목자와 악한 목자의 비유에서 누구의 자손이 한 유일한 목자로 임명되고 평화가 오는가? (겔34:23-31) ( )","a":"다윗"},{"t":"OT","b":"에스겔","y":"단답형","n":4,"s":"새 예루살렘에 대한 환상에서, 새 성전은 그릇 행하여 하나님을 떠났던 레위인들이 아니라 누구의 자손 레위인들이 제사를 지낼 수 있도록 허락되었는가? (겔44:4-16) ( )","a":"사독"},{"t":"OT","b":"에스겔","y":"단답형","n":5,"s":"47장에서 만물을 생기 있게 만드는 물은 어디에서 나오는가? ( )","a":"성전"},{"t":"OT","b":"에스겔","y":"진위형","n":1,"s":"에스겔은 예루살렘 성전의 재건을 꿈꾸는 포로기 이후 이스라엘 귀환 사회 시대에 활약하던 선지자다. (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":2,"s":"에스겔은 바벨론에서 활약하지만 예루살렘의 상황에 대하여 잘 보고 하고 있다. 이는 예루살렘에 있는 그의 제자들이 에스겔에게 그 곳의 상황을 알려주기 때문에 가능하였다. (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":3,"s":"에스겔은 자신을 제사장으로 소개한다(겔1:3). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":4,"s":"에스겔은 예루살렘을 무너뜨린 바벨론에 대항하여 강력한 독립 정신을 고취시킨다. (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":5,"s":"에스겔서는 미래에 다가올 소망 보다는 유다와 이스라엘, 그 외 여러 민족들의 과오를 밝히는 말씀들이 주요 내용이다. (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":6,"s":"하나님은 에스겔로 하여금 390일 동안 왼쪽으로 눕고, 40일 간은 오른 쪽으로 누우며 줄로 결박당하도록 하신다. 여기의 일수는 각각 이스라엘과 유다가 범죄를 저지른 햇수를 의미한다(겔5:1-17). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":7,"s":"11장의 환상에서 예루살렘 멸망에 책임 있는 25명은 이방인들의 폭력에 넘겨질 것을 말한다. (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":8,"s":"13장에서 거짓 예언자들이 우상 신으로부터 받은 예언을 말하는 것을 질타 받는다(겔13:3). (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":9,"s":"16장에서 피투성이로 버려진 아이로 비유된 예루살렘이 성장하여 음란해졌다는 것은 자신을 키우고 사랑한 여호와를 버리고 다른 신들을 따랐다는 것을 의미한다. (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":10,"s":"\"아버지가 신 포도를 먹었으므로 그의 아들의 이가 시다\"는 속담을 이용하여 에스겔은 우리의 조상이 가나안 땅에서 하나님을 올바르게 섬기지 못한 죄의 대가를 우리가 치룰 수밖에 없다고 설명한다(겔 18:1-32). (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":11,"s":"에스겔서에는 하나님의 백성이 이방 땅에서 포로 생활하다 풀려나게 될 것을 예언하고 있다(겔20:33-34). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":12,"s":"22장에서 예루살렘을 고발할 때에 지도자들, 제사장들, 고관들, 예언자들이 범죄자로 지목되었으나 일반 백성들은 언급되지 않았다(겔 22:29). (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":13,"s":"28장에 따르면 두로 왕이 벌을 받는 것은 그가 교만하여졌기 때문이다(겔28:17). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":14,"s":"30장에서 느부갓네살은 하나님의 도구로서 애굽의 바로에 대항한다. (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":15,"s":"34장의 선한 목자와 악한 목자의 비유에서 하나님 자신이 선한 목자가 된다(겔34:11-22). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":16,"s":"35장에서 에돔은 유다의 멸망을 기뻐한 것과 많은 약탈을 행한 것 때문에 멸망이 예고된다. (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":17,"s":"에스겔은 이스라엘과 유다가 다시 통일되어 한 왕의 통치아래 한 민족이 되는 것이 현실적으로 불가능하다고 보았다(겔37:15-28). (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":18,"s":"에스겔서는 미래의 성전에 대한 환상으로 시작한다. (O,X)","a":"X"},{"t":"OT","b":"에스겔","y":"진위형","n":19,"s":"에스겔은 하나님의 권능이 임하여 환상 속에 새 예루살렘을 볼 수 있었다(겔40:1-4). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":20,"s":"출애굽기 12장에서 하나님이 애굽의 모든 처음 난 것을 치실 때에 이를 피하기 위해 문설주에 피를 발랐다. 이를 연상시키는 이야기가 에스겔서에도 나온다(겔9:4). (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":21,"s":"에스겔서는 성전을 떠난 하나님의 영광이 다시 새 성전으로 돌아오는 것을 보여주고 있다. (O,X)","a":"O"},{"t":"OT","b":"에스겔","y":"진위형","n":22,"s":"\"인자야 이스라엘 땅에서 이르기를 날이 더디고 모든 묵시가 사라지리라 하는 너희의 이 속담이 어찌 됨이냐\"이 구절이 말해 주는 것처럼 에스겔서에는 예언이 이루어 않는 것에 대하여 고민하는 흔적이 있으며, 이와 같은 고민이 드러나는 문서 선지자는 에스겔이 유일하다(겔 21:22). (O,X)","a":"X"},{"t":"OT","b":"다니엘","y":"선택형","n":1,"s":"\"느부갓네살, 하나냐, 미사엘, 아사랴, 다리오, 사자 굴\" 등과 관련이 있는 책은 무엇인가?","c":["에스겔","다니엘","스가랴","학개"],"a":"2"},{"t":"OT","b":"다니엘","y":"선택형","n":2,"s":"바벨론의 왕궁에 있으면서 뜻을 정하여 왕의 음식과 그가 마시는 포도주로 자기를 더럽히지 아니하리라고 작정한 자들이 아닌 자는 누구인가? (단1장)","c":["다니엘","하나냐","미가","아사랴"],"a":"3"},{"t":"OT","b":"다니엘","y":"선택형","n":3,"s":"다니엘 2장에 의하면 느부갓네살 왕의 꿈에 나타난 큰 신상에 대한 설명이 틀린 것은 무엇인가?","c":["머리-순금","가슴과 두 팔-은","배와 넓적다리-놋","종아리-흙"],"a":"4"},{"t":"OT","b":"다니엘","y":"선택형","n":4,"s":"\"왕이여 우리가 섬기는 하나님이 계시다면 우리를 맹렬히 타는 풀무 불 가운데에서 능히 건져내시겠고 왕의 손에서도 건져내시리이다 그렇게 하지 아니하실지라도 왕이여 우리가 왕의 신들을 섬기지도 아니하고 왕이 세우신 금 신상에게 절하지도 아니할 줄을 아옵소서\"라고 고백하지 않은 자는 누구인가? (단3:17-18)","c":["하나냐","미사엘","다니엘","아사랴"],"a":"3"},{"t":"OT","b":"다니엘","y":"선택형","n":5,"s":"\"다니엘의 하나님 앞에서 떨며 두려워할지니 그는 살아 계시는 하나님이시오 영원히 변하지 않으실 이시며 그의 나라는 멸망하지 아니할 것이요 그의 권세는 무궁할 것이며 그는 구원도 하시며 건져내기도 하시며 하늘에서든지 땅에서든지 이적과 기사를 행하시는 이로서 다니엘을 구원하여 사자의 입에서 벗어나게 하셨음이라\"고 말한 왕은 누구인가? (단6:26-27)","c":["느부갓네살","벨사살","다리오","고레스"],"a":"3"},{"t":"OT","b":"다니엘","y":"선택형","n":6,"s":"다니엘 7장에 다니엘이 꾼 꿈에 나타나지 않는 짐승은 무엇인가?","c":["사자","곰","표범","늑대"],"a":"4"},{"t":"OT","b":"다니엘","y":"완성형","n":1,"s":"사드락의 유대식 이름은 하나냐, 메삭의 유대식 이름은 미사엘이고, 아벳느고의 유대식 이름은 ( )이다(단1:7).","a":"아사랴"},{"t":"OT","b":"다니엘","y":"완성형","n":2,"s":"다니엘과 그 세 친구들이 왕궁에서 먹은 음식은 ( )이다(단1:12).","a":"채식"},{"t":"OT","b":"다니엘","y":"완성형","n":3,"s":"\"왕이 사람에게서 쫓겨나서 들짐승과 함께 살며 소처럼 풀을 먹으며 하늘 이슬에 젖을 것이요 이와 같이 일곱 때를 지낼 것이라 그 때에 지극히 높으신 이가 사람의 나라를 다스리시며 자기의 뜻대로 그것을 누구에게든지 주시는 줄을 아시리이다\"라고 다니엘이 꿈을 해석했을 때 이 왕은 ( )을 가리킨다(단4:25).","a":"느부갓네살"},{"t":"OT","b":"다니엘","y":"완성형","n":4,"s":"\"나라와 권세와 온 천하 나라들의 위세가 지극히 높으신 이의 거룩한 백성에게 붙인 바 되리니 그의 나라는 영원한 나라이라 모든 권세 있는 자들이 다 그를 섬기며 복종하리라\"라는 구절이 언급되는 구약의 책은 ( )이다(단7:27).","a":"다니엘(서)"},{"t":"OT","b":"다니엘","y":"완성형","n":5,"s":"다니엘서에 언급되는 두 천사들로서 하나님께서 유다 백성들에게 주신 환상을 깨닫게 한 자들은 가브리엘과 ( )이다(단9:21; 12:1).","a":"미가엘"},{"t":"OT","b":"다니엘","y":"완성형","n":6,"s":"\"땅의 티끌 가운데에서 자는 자 중에서 많은 사람이 깨어나 영생을 받는 자도 있겠고 수치를 당하여서 영원히 부끄러움을 당할 자도 있을 것이며\"라는 구절이 언급되는 구약의 책은 ( )이다(단12:2).","a":"다니엘(서)"},{"t":"OT","b":"다니엘","y":"완성형","n":7,"s":"지혜 있는 자는 궁창의 빛과 같이 빛날 것이요 많은 사람을 옳은 대로 돌아오게 한 자는 ( )과 같이 영원토록 빛나리라(단12:3).","a":"별"},{"t":"OT","b":"다니엘","y":"완성형","n":8,"s":"내가 또 밤 환상 중에 보니 ( ) 같은 이가 하늘 구름을 타고 와서 옛적부터 항상 계신 이에게 나아가 그 앞으로 인도되매 그에게 권세와 영광과 나라를 주고 모든 백성과 나라들과 다른 언어를 말하는 모든 자들이 그를 섬기게 하였다(단7:13-14).","a":"인자"},{"t":"OT","b":"다니엘","y":"단답형","n":1,"s":"바벨론의 왕궁에 있었던 다니엘은 누가 꾼 큰 신상의 꿈을 해몽해 주었는가? (단2장) ( )","a":"느부갓네살"},{"t":"OT","b":"다니엘","y":"단답형","n":2,"s":"\"오직 은밀한 것을 나타내실 이는 하늘에 계신 하나님이시라 그가 느부갓네살 왕에게 후일에 될 일을 알게 하셨나이다\"라고 말한 자는 누구인가? (단2:28) ( )","a":"다니엘"},{"t":"OT","b":"다니엘","y":"단답형","n":3,"s":"\"나는 하늘의 왕을 찬양하며 칭송하며 경배하노니 그의 일이 다 진실하고 그의 행하심이 의로우시므로 교만하게 행하는 자를 그가 능히 낮추심이라\"라고 고백한 바벨론의 왕은 누구인가? (단4:37) ( )","a":"느부갓네살"},{"t":"OT","b":"다니엘","y":"단답형","n":4,"s":"다니엘은 예루살렘을 향하여 하루에 몇 번씩 기도했는가? (단6:10) ( )","a":"세 번"},{"t":"OT","b":"다니엘","y":"단답형","n":5,"s":"숫양과 숫염소의 환상을 통해 메대, 바사, 그리고 헬라 제국의 운명을 예언하고 있는 구약의 책은 무엇인가? (단8장) ( )","a":"다니엘(서)"},{"t":"OT","b":"다니엘","y":"단답형","n":6,"s":"다니엘서 12장에 언급되는바 유다 백성들을 호위하는 천사의 이름은 무엇인가? ( )","a":"미가엘"},{"t":"OT","b":"다니엘","y":"진위형","n":1,"s":"벨드사살은 다니엘의 바벨론식 이름이다(단 1:6-7). (O,X)","a":"O"},{"t":"OT","b":"다니엘","y":"진위형","n":2,"s":"벨사살 왕이 잔치를 벌이고 있을 때 사람의 손가락들이 나타나서 석회벽에 글자를 썼는데, 그 내용은 '메네 메네 데겔 우바르신'으로 '왕을 저울에 달아 보니 부족함이 보여서 왕의 시대를 끝내고 왕의 나라를 왕의 후손들에게 넘기겠다'는 뜻이다(단5:25-28). (O,X)","a":"X"},{"t":"OT","b":"다니엘","y":"진위형","n":3,"s":"\"마지막 때까지 이 말을 간수하고 이 글을 봉합하라 많은 사람이 빨리 왕래하며 지식이 더하리라\"는 명령은 말라기에게 전해졌다(단12:4). (O,X)","a":"X"},{"t":"OT","b":"다니엘","y":"진위형","n":4,"s":"다니엘서에 나오는 느부갓네살 왕의 금 신상에 절하지 않은 자에게 주어진 형벌은 사자 굴에 던지는 것이었다(단3: 11). (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"선택형","n":1,"s":"12예언서 중에서 맨 처음 나오는 예언서는 무엇인가?","c":["다니엘","호세아","요엘","아모스"],"a":"2"},{"t":"OT","b":"열두 예언서","y":"선택형","n":2,"s":"12예언서 중에서 맨 마지막 예언서는 무엇인가?","c":["나훔","학개","스가랴","말라기"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"선택형","n":3,"s":"12예언서 중에서 가장 짧은 예언서는 무엇인가?","c":["나훔","학개","오바댜","요엘"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":4,"s":"다음 12예언서 중에서 8세기 예언서가 아닌 것은 무엇인가?","c":["아모스","호세아","미가","스바냐"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"선택형","n":5,"s":"다음 12예언서 중에서 7세기 예언서는 무엇인가?","c":["아모스","말라기","스바냐","학개"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":6,"s":"다음 12예언서 중에서 포로후기 예언서는 무엇인가?","c":["아모스","하박국","스가랴","미가"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":7,"s":"다음 12예언서 중에서 북 왕국에서 예언활동을 한 선지자의 예언서는 무엇인가?","c":["아모스","하박국","스바냐","학개"],"a":"1"},{"t":"OT","b":"열두 예언서","y":"선택형","n":8,"s":"다음 12예언서 중에서 남 왕국에서 활동한 선지자의 예언서가 아닌 것은?","c":["스바냐","하박국","미가","스가랴"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"선택형","n":9,"s":"다음 12예언서 중에서 바벨론에 관한 예언서는 무엇인가?","c":["나훔","하박국","미가","호세아"],"a":"2"},{"t":"OT","b":"열두 예언서","y":"선택형","n":10,"s":"다음 12예언서 중에서 앗수르에 관하여 예언한 내용이 없는 예언서는 무엇인가?","c":["요나","미가","말라기","호세아"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":11,"s":"\"나는 인애를 원하고 제사를 원하지 아니하며 번제보다 하나님을 아는 것을 원하노라\"고 말씀하는 예언자는 누구인가?","c":["아모스","호세아","미가","요엘"],"a":"2"},{"t":"OT","b":"열두 예언서","y":"선택형","n":12,"s":"\"너희는 옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께 돌아올지어다\"고 말씀한 예언자는 누구인가?","c":["요나","오바댜","요엘","미가"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":13,"s":"\"내가 기근을 땅에 보내리니 양식이 없어 주림이 아니며 물이 없어 갈함이 아니요 여호와의 말씀을 듣지 못한 기갈이라\"고 말씀한 예언자는 누구인가?","c":["호세아","미가","아모스","요엘"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":14,"s":"\"여호와께서 네게 구하시는 것은 오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것이 아니냐\"고 말씀한 예언자는 누구인가?","c":["아모스","호세아","하박국","미가"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"선택형","n":15,"s":"\"여호와는 질투하시며 보복하시는 하나님이시라\"고 말씀한 예언자는 누구인가?","c":["나훔","하박국","스바냐","미가"],"a":"1"},{"t":"OT","b":"열두 예언서","y":"선택형","n":16,"s":"\"여호와여 내가 부르짖어도 주께서 듣지 아니하시니 어느 때까지리이까\"는 질문으로 예언서를 시작하는 예언자는 누구인가?","c":["요엘","요나","하박국","나훔"],"a":"3"},{"t":"OT","b":"열두 예언서","y":"선택형","n":17,"s":"\"너의 하나님 여호와가 너의 가운데 계시니 그는 구원을 베푸실 전능자이시라\"고 말씀하는 예언자는 누구인가?","c":["미가","아모스","학개","스바냐"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"선택형","n":18,"s":"\"은도 내 것이요 금도 내 것이니라\"고 말씀하는 예언서는 무엇인가?","c":["학개","스가랴","말라기","호세아"],"a":"1"},{"t":"OT","b":"열두 예언서","y":"선택형","n":19,"s":"\"이는 힘으로 되지 아니하며 능력으로 되지 아니하고 오직 나의 영으로 되느니라\"고 말씀하는 예언서는 무엇인가?","c":["학개","스가랴","말라기","미가"],"a":"2"},{"t":"OT","b":"열두 예언서","y":"선택형","n":20,"s":"\"내 이름을 경외하는 너희에게는 공의로운 해가 떠올라서 치료하는 광선을 비추리니\"라고 말씀하는 예언서는 무엇인가?","c":["하박국","학개","미가","말라기"],"a":"4"},{"t":"OT","b":"열두 예언서","y":"완성형","n":1,"s":"내 백성이 ( )이 없으므로 망하는도다(호4:6).","a":"지식"},{"t":"OT","b":"열두 예언서","y":"완성형","n":2,"s":"나는 ( )를 원하고 제사를 원하지 아니하며 번제보다 하나님을 아는 것을 원하노라(호6:6).","a":"인애"},{"t":"OT","b":"열두 예언서","y":"완성형","n":3,"s":"내가 나의 맹렬한 진노를 나타내지 아니하며 내가 다시는 에브라임을 멸하지 아니하리니 이는 내가 하나님이요 ( )이 아님이라(호11:9).","a":"사람"},{"t":"OT","b":"열두 예언서","y":"완성형","n":4,"s":"그런즉 너의 하나님께로 돌아와서 인애와 ( )를 지키며 항상 너의 하나님을 바랄지니라(호12:6).","a":"정의"},{"t":"OT","b":"열두 예언서","y":"완성형","n":5,"s":"너희는 옷을 찢지 말고 ( )을 찢고 너희 하나님 여호와께 돌아올지어다(욜2:13).","a":"마음"},{"t":"OT","b":"열두 예언서","y":"완성형","n":6,"s":"그 후에 내가 내 ( )을 만민에게 부어 주리니 너희 자녀들이 장래 일을 말할 것이며 너희 늙은이는 꿈을 꾸며 너희 젊은이는 이상을 볼 것이며(욜2:28).","a":"영"},{"t":"OT","b":"열두 예언서","y":"완성형","n":7,"s":"여호와께서 시온에서 부르짖고 ( )에서 목소리를 내시리니 하늘과 땅이 진동하리로다(욜3:16).","a":"예루살렘"},{"t":"OT","b":"열두 예언서","y":"완성형","n":8,"s":"사자가 부르짖은즉 누가 두려워하지 아니하겠느냐 주 여호와께서 말씀하신즉 누가 ( )하지 아니하겠느냐(암3:8).","a":"예언"},{"t":"OT","b":"열두 예언서","y":"완성형","n":9,"s":"여호와의 ( )은 빛 없는 어둠이 아니며 빛남 없는 캄캄함이 아니냐(암5:20).","a":"날"},{"t":"OT","b":"열두 예언서","y":"완성형","n":10,"s":"오직 정의를 물 같이 ( )를 마르지 않는 강 같이 흐르게 할지어다(암5:27).","a":"공의"},{"t":"OT","b":"열두 예언서","y":"완성형","n":11,"s":"보라 날이 이를지라 내가 기근을 땅에 보내리니 양식이 없어 주림이 아니며 물이 없어 갈함이 아니요 여호와의 ( )을 듣지 못한 기갈이라(암8:11).","a":"말씀"},{"t":"OT","b":"열두 예언서","y":"완성형","n":12,"s":"나는 감사하는 목소리로 주께 제사를 드리며 나의 서원을 주께 갚겠나이다 ( )은 여호와께 속하였나이다(욘2:9).","a":"구원"},{"t":"OT","b":"열두 예언서","y":"완성형","n":13,"s":"오직 나는 여호와의 영으로 말미암아 능력과 정의와 ( )로 충만해져서 야곱의 허물과 이스라엘의 죄를 그들에게 보이리라(미3:8).","a":"용기"},{"t":"OT","b":"열두 예언서","y":"완성형","n":14,"s":"여호와께서 네게 구하시는 것은 오직 정의를 행하며 인자를 사랑하며 ( )하게 네 하나님과 함께 행하는 것이 아니냐(미6:8).","a":"겸손"},{"t":"OT","b":"열두 예언서","y":"완성형","n":15,"s":"여호와는 질투하시며 ( )하시는 하나님이시라(나1:2).","a":"보복"},{"t":"OT","b":"열두 예언서","y":"완성형","n":16,"s":"볼지어다 아름다운 소식을 알리고 ( )을 전하는 자의 발이 산 위에 있도다(나 1:15).","a":"화평"},{"t":"OT","b":"열두 예언서","y":"완성형","n":17,"s":"여호와여 내가 부르짖어도 주께서 듣지 아니하시리니 어느 때까지리이까 내가 ( )로 말미암아 외쳐도 주께서 구원하지 아니하시나이다(합1:2).","a":"강포"},{"t":"OT","b":"열두 예언서","y":"완성형","n":18,"s":"보라 그의 마음은 교만하며 그 속에서 정직하지 못하나 의인은 그의 ( )으로 말미암아 살리라(합2:4).","a":"믿음"},{"t":"OT","b":"열두 예언서","y":"완성형","n":19,"s":"너의 하나님 여호와가 너의 가운데 계시니 그는 구원을 베푸실 ( )이시라 그가 너로 말미암아 기쁨을 이기지 못하시며 너를 잠잠히 사랑하시며 너로 말미암아 즐거이 부르며 기뻐하시리라(습 3:17).","a":"전능자"},{"t":"OT","b":"열두 예언서","y":"완성형","n":20,"s":"스알디엘의 아들 내 종 스룹바벨아 여호와가 말하노라 그 날에 내가 너를 세우고 너를 ( )으로 삼으리니 이는 내가 너를 택하였음이니라(학2:23).","a":"인장"},{"t":"OT","b":"열두 예언서","y":"완성형","n":21,"s":"만군의 여호와께서 말씀하시되 이는 힘으로 되지 아니하며 능력으로 되지 아니하고 오직 나의 ( )으로 되느니라(슥4:6).","a":"영"},{"t":"OT","b":"열두 예언서","y":"완성형","n":22,"s":"보라 네 왕이 네게 임하시나니 그는 공의로우시며 ( )을 베푸시며 겸손하여서 나귀를 타시나니 나귀의 작은 것 곧 나귀 새끼니라(슥 9:9).","a":"구원"},{"t":"OT","b":"열두 예언서","y":"완성형","n":23,"s":"내가 잡혀 죽을 양 떼를 먹이니 참으로 가련한 양들이라 내가 막대기 둘을 취하여 하나는 은총이라 하며 하나는 ( )이라 하고 양 떼를 먹일새(슥11:7).","a":"연합"},{"t":"OT","b":"열두 예언서","y":"완성형","n":24,"s":"레위와 세운 나의 언약은 생명과 ( )의 언약이라 내가 이것을 그에게 준 것은 그로 경외하게 하려 함이라(말2:5).","a":"평강"},{"t":"OT","b":"열두 예언서","y":"완성형","n":25,"s":"만군의 여호와가 이르노라 보라 내가 내 ( )를 보내리니 그가 내 앞에서 길을 준비할 것이요(말3:1).","a":"사자"},{"t":"OT","b":"열두 예언서","y":"완성형","n":26,"s":"내 이름을 경외하는 너희에게는 공의로운 해가 떠올라서 ( )하는 광선을 비추리니 너희가 나가서 외양간에서 나온 송아지 같이 뛰리라(말4:2).","a":"치료"},{"t":"OT","b":"열두 예언서","y":"단답형","n":1,"s":"음란한 여인 고멜과 결혼하여 하나님의 말씀을 전한 예언자는 누구인가? ( )","a":"호세아"},{"t":"OT","b":"열두 예언서","y":"단답형","n":2,"s":"팥중이, 메뚜기, 느치, 황충을 언급한 예언자는 누구인가? ( )","a":"요엘"},{"t":"OT","b":"열두 예언서","y":"단답형","n":3,"s":"유다 땅 드고아의 목자요 뽕나무를 재배하던 사람으로서 북 왕국에 가서 예언한 사람은 누구인가? ( )","a":"아모스"},{"t":"OT","b":"열두 예언서","y":"단답형","n":4,"s":"12예언서 중에서 \"여호와의 날\"을 심판의 날로 처음 선포한 예언서는 무엇인가? ( )","a":"아모스"},{"t":"OT","b":"열두 예언서","y":"단답형","n":5,"s":"에돔에 관한 심판의 말씀을 전하는 예언서는 무엇인가? ( )","a":"오바댜"},{"t":"OT","b":"열두 예언서","y":"단답형","n":6,"s":"하나님의 인자하심과 구원베푸심을 오해하여 니느웨 선교의 사명을 거부하다 마지못해 예언 활동을 한 예언자는 누구인가? ( )","a":"요나"},{"t":"OT","b":"열두 예언서","y":"단답형","n":7,"s":"유다 땅 모레셋의 장로로서 시온의 멸망을 예언한 사람은 누구인가? ( )","a":"미가"},{"t":"OT","b":"열두 예언서","y":"단답형","n":8,"s":"메시야가 유다 땅 베들레헴에서 태어날 것을 예언한 사람은 누구인가? ( )","a":"미가"},{"t":"OT","b":"열두 예언서","y":"단답형","n":9,"s":"앗수르의 도성 니느웨의 멸망을 하나님의 보복으로 간주하고 노래한 예언서는 무엇인가? ( )","a":"나훔"},{"t":"OT","b":"열두 예언서","y":"단답형","n":10,"s":"세상 역사에 대한 하나님의 신정통치에 대한 질문으로 시작하는 예언서는 무엇인가? ( )","a":"하박국"},{"t":"OT","b":"열두 예언서","y":"단답형","n":11,"s":"히스기야의 현손이요 아마랴의 증손이며 그다랴의 손자요 구시의 아들로서 요시야 시대에 예언을 한 사람은 누구인가? ( )","a":"스바냐"},{"t":"OT","b":"열두 예언서","y":"단답형","n":12,"s":"성전 재건축을 촉구한 포로후기 예언자는 누구인가? ( )","a":"학개"},{"t":"OT","b":"열두 예언서","y":"단답형","n":13,"s":"여호와 하나님이 학개를 통하여 말씀을 전한 사람은 스룹바벨과 또 누구인가? ( )","a":"대제사장 여호수아"},{"t":"OT","b":"열두 예언서","y":"단답형","n":14,"s":"잇도의 손자요 베레가의 아들로 포로후기에 예언을 한 사람은 누구인가? ( )","a":"스가랴"},{"t":"OT","b":"열두 예언서","y":"단답형","n":15,"s":"메시야가 겸손하게 나귀를 타고 올 것이라고 말한 예언자는 누구인가? ( )","a":"스가랴"},{"t":"OT","b":"열두 예언서","y":"단답형","n":16,"s":"헬라 사람들에 대한 예언이 담긴 예언서는 무엇인가? ( )","a":"스가랴"},{"t":"OT","b":"열두 예언서","y":"단답형","n":17,"s":"스가랴 11장에 두 막대기에 대한 예언이 담겨 있다. 두 막대기가 의미하는 바는 무엇인가? ( )","a":"은총과 연합"},{"t":"OT","b":"열두 예언서","y":"단답형","n":18,"s":"12예언서 중에서 가장 짧은 예언서는 무엇인가? ( )","a":"오바댜"},{"t":"OT","b":"열두 예언서","y":"단답형","n":19,"s":"온전한 십일조를 드리라고 촉구한 예언서는 무엇인가? ( )","a":"말라기"},{"t":"OT","b":"열두 예언서","y":"단답형","n":20,"s":"말라기서에서 여호와의 크고 두려운 날이 이르기 전에 보내시겠다고 약속한 사람은 누구인가? ( )","a":"엘리야"},{"t":"OT","b":"열두 예언서","y":"진위형","n":1,"s":"아모스에게 벧엘을 떠나 유다 땅으로 가서 예언하라고 예언을 방해한 사람은 하나냐이다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":2,"s":"호세아는 북 왕국 이스라엘을 특징적으로 \"에브라임\"이라고 불렀다. (O,X)","a":"O"},{"t":"OT","b":"열두 예언서","y":"진위형","n":3,"s":"\"오라 우리가 여호와께로 돌아가자 여호와께서 우리를 찢으셨으나 도로 낫게 하실 것이요 우리를 치셨으나 싸매어 주실 것이라\"고 예언한 사람은 호세아이다. (O,X)","a":"O"},{"t":"OT","b":"열두 예언서","y":"진위형","n":4,"s":"\"그러나 너희가 나실 사람으로 포도주를 마시게 하며 또 선지자에게 명령하여 예언하지 말라 하였느니라\"고 예언한 사람은 호세아이다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":5,"s":"\"대접으로 포도주를 마시며 귀한 기름을 몸에 바르면서 요셉의 환난에 대하여는 근심하지 아니하는 자로다\"로 예언한 사람은 미가이다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":6,"s":"오바댜서는 모압의 멸망에 관한 묵시이다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":7,"s":"요나는 물고기 뱃속에 나온 뒤 니느웨 성을 사흘 동안 두루 다니면서 회개를 외쳤다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":8,"s":"\"야곱의 우두머리들과 이스라엘 족속의 통치자들아 들으라 정의를 아는 것이 너희의 본분이 아니냐\"고 책망한 예언자는 미가이다. (O,X)","a":"O"},{"t":"OT","b":"열두 예언서","y":"진위형","n":9,"s":"베들레헴에서 메시야가 올 것을 예언한 사람은 스가랴이다. (O,X)","a":"X"},{"t":"OT","b":"열두 예언서","y":"진위형","n":10,"s":"앗수르의 도성 니느웨가 멸망하는 장면을 생생하게 보도하며 예언한 사람은 나훔이다. (O,X)","a":"O"},{"t":"OT","b":"열두 예언서","y":"진위형","n":11,"s":"\"오직 의인은 그의 믿음으로 말미암아 살리라\"고 예언한 사람은 하박국이다. (O,X)","a":"O"},{"t":"OT","b":"열두 예언서","y":"진위형","n":12,"s":"12예언서 중에서 겸손과 공의를 강조한 예언서는 스바냐서이다. (O,X)","a":"O" 유에서 예수님은 건축자들의 버린 돌이 모퉁이의 무엇이 되었다는 말씀을 인용하셨는가? (마21장) ( )","a":"머릿돌"},{"t":"NT","b":"마태복음","y":"단답형","n":22,"s":"예수님이 예루살렘에 가셨을 때 부활에 관하여 질문해온 사람들은 누구였는가? (마22장) ( )","a":"사두개인"},{"t":"NT","b":"마태복음","y":"단답형","n":23,"s":"예수님은 서기관들과 바리새인들이 누구의 자리에 앉았다고 비판하셨는가? (마23장) ( )","a":"모세"},{"t":"NT","b":"마태복음","y":"단답형","n":24,"s":"종말의 때 구름을 타고 능력과 큰 영광으로 오시는 분은 누구인가? (마24장) ( )","a":"인자, 사람의 아들"},{"t":"NT","b":"마태복음","y":"단답형","n":25,"s":"마태복음 25장의 한 비유에서 영원한 벌을 받을 사람들로 판정을 받는 사람들은 어떤 짐승으로 비유된 사람들인가? (마25장) ( )","a":"염소"},{"t":"NT","b":"마태복음","y":"단답형","n":26,"s":"예수님이 체포되기 직전까지 기도하신 장소는 어디인가? (마26장) ( )","a":"겟세마네"},{"t":"NT","b":"마태복음","y":"단답형","n":27,"s":"빌라도에게 예수님의 시체를 달라하여 자기의 새 무덤에 장사한 아리마대 부자의 이름은 무엇인가? (마27장) ( )","a":"요셉"},{"t":"NT","b":"마태복음","y":"단답형","n":28,"s":"안식 후 첫날 예수님이 장사되었던 무덤에 찾아간 사람 중 첫 번째로 언급된 여성의 이름은 무엇인가? (마28장) ( )","a":"막달라 마리아"},{"t":"NT","b":"마태복음","y":"진위형","n":1,"s":"예수 그리스도의 계보에는 모압 여자인 룻이 포함되었다(마1장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":2,"s":"예수의 부모는 헤롯이 죽은 후에 이스라엘에 돌아와서 사마리아에 정착하게 되었다(마2장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":3,"s":"요한은 예수님이 자기에게 침례를 받으러 왔을 때 자기가 예수님에게 침례를 받아야 한다고 주장했었다(마3장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":4,"s":"마태복음 4장에 따르면, 예수님이 처음 부르신 제자들은 베드로와 안드레 그리고 야고보와 바울이었다(마4장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":5,"s":"예수님의 산상강화 교훈 중에는 원수를 사랑하며 핍박하는 자를 위해 기도하라는 교훈이 포함되어 있다(마5장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":6,"s":"마태복음 6장의 산상강화에는 구제, 기도, 금식, 그리고 보물에 관한 교훈이 나온다(마6장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":7,"s":"마태복음 7장에는 예수님을 향해 주여 주여 부르는 사람들이 다 천국에 들어갈 것이라는 말씀이 나온다(마7장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":8,"s":"예수님이 산상강화를 전하시고 산에서 내려와 첫 번째로 하신 일은 베드로의 장모를 치유하신 일이었다(마8장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":9,"s":"마태복음 9장에서 예수님이 한 관리의 딸을 치유하러 가다가 만난 여인은 혈루병을 앓던 사람이었다(마9장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":10,"s":"예수의 제자들이 전도 여행 시 가지고 가지 말라는 품목 속에는 신이나 지팡이가 포함되었다(마10장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":11,"s":"예수는 침례 요한이 여자가 낳은 자 중에 가장 큰 자이기 때문에 요한은 천국에서도 가장 큰 자라고 하셨다(마11장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":12,"s":"예수는 안식일 논쟁에서 다윗과 그의 동행자들이 성소에서 행한 것을 예로 들어 그의 제자들을 변호했다(마12장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":13,"s":"천국 비유 중 그물 비유에서 내어버림을 받을 못된 물고기는 풀무 불에 던짐을 받을 악인을 가리킨다(마13장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":14,"s":"오병이어 사건 후에 예수는 제자들과 함께 기도하시러 산으로 올라가셨다(마14장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":15,"s":"예수께서 두로와 시돈 지방에 가셨을 때 가나안 여자가 예수님을 향해 부른 칭호는 다윗의 자손이었다(마15장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":16,"s":"예수님이 베드로에게 주신 천국 열쇠는 땅과 바다에서 매고 푸는 권세에 관한 것이다(마16장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":17,"s":"예수님이 변형되셨던 높은 산에서 내려와서 하신 일은 간질로 고생하던 아이를 치유한 일이었다(마17장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":18,"s":"범죄한 형제의 문제를 해결하기 위한 첫 번째 일은 두 세 증인을 데리고 가서 증언하게 하는 일이다(마18장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":19,"s":"마태복음 19장에서 예수님께 와서 영생을 얻는 길에 관하여 질문한 사람은 청년이었다(마19장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":20,"s":"예수께 자기의 두 아들을 하나는 주의 우편에 하나는 주의 좌편에 앉게 해달라고 부탁한 사람은 세배대의 어머니였다(마20장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":21,"s":"마태복음 21장에서 예수님은 예루살렘에 들어가실 때에 나귀와 나귀 새끼를 타고 들어가셨다(마21장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":22,"s":"혼인 잔치를 베푼 어떤 임금의 비유에서 바깥 어두움에 내어던짐을 당한 사람은 예복을 입지 않았기 때문이었다(마22장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":23,"s":"마태복음 23장에서 예수님은 외식하는 사두개인들을 향하여 비판하는 말씀을 하셨다(마23장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":24,"s":"마태복음 24장에서 예수님은 종말의 과정에서 제자들이 유의해야 할 일은 깨어 있는 것은 물론 예비하는 일인 것을 말씀하셨다(마24장). (O,X)","a":"O"},{"t":"NT","b":"마태복음","y":"진위형","n":25,"s":"마태복음 25장의 달란트 비유에서 다섯 개 받아 다섯 개 남긴 사람에 대한 상급과 두 개 받아 두 개 남긴 사람에 대한 상급이 다르게 부여되었다(마25장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":26,"s":"예수님을 체포하기 위하여 무리를 이끌고 온 사람은 열 둘 중 한 사람인 도마였다(마26장). (O,X)","a":"X"},{"t":"NT","b":"마태복음","y":"진위형","n":27,"s":"예수님이 십자가에서 운명하셨을 때 성 ,"s":"부자와 나사로의 이야기가 나오는 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":24,"s":"바리새인과 세리의 비유가 나오는 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":25,"s":"누가복음 몇 장에 삭개오의 이야기가 나오는가? ( )","a":"19장"},{"t":"NT","b":"누가복음","y":"단답형","n":26,"s":"예루살렘을 보면서 예수께서 통곡하시는 장면이 기록된 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":27,"s":"\"사단이 하늘로서 번개 같이 떨어지는 것을 내가 보았노라\"라는 말씀이 나오는 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":28,"s":"누가복음에서 주의 기도가 나오는 장은 몇 장인가? ( )","a":"11장"},{"t":"NT","b":"누가복음","y":"단답형","n":29,"s":"예수께서 '저 여우' 라고 하신 자는 누구인가? (눅13:31-32) ( )","a":"헤롯"},{"t":"NT","b":"누가복음","y":"단답형","n":30,"s":"\"항상 기도하고 낙심하지 말아야 할 것을\"이라는 말씀이 나오는 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":31,"s":"\"인자가 올 때에 세상에서 믿음을 보겠느냐\"라는 말씀이 나오는 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":32,"s":"누구든지 말로 인자를 거역하면 사하심을 받으려니와 무엇을 모독하는 자는 사하심을 받지 못한다고 하였나? (눅12:10)","a":"성령"},{"t":"NT","b":"누가복음","y":"단답형","n":33,"s":"십자가상의 말씀 중 강도와의 대화가 기록된 복음서는 무엇인가? ( )","a":"누가복음"},{"t":"NT","b":"누가복음","y":"단답형","n":34,"s":"엠마오의 길에 나오는 제자의 이름은 무엇인가? (눅24:18)","a":"글로바"},{"t":"NT","b":"누가복음","y":"단답형","n":35,"s":"누가복음 23:19에 따르면, 민란과 살인을 인하여 옥에 갇힌 자로 예수님 대신에 놓임을 받은 사람은 누구인가? ( )","a":"바라바"},{"t":"NT","b":"누가복음","y":"단답형","n":36,"s":"누가복음 23:26에 따르면, 예수님 대신에 십자가를 지고 예수를 쫓게 되었던 사람의 이름은 무엇인가? ( )","a":"구레네 사람 시몬"},{"t":"NT","b":"누가복음","y":"단답형","n":37,"s":"아래 사항을 만족시키는 인물은 누구인가? (눅23:50-52) ( ) • 나는 하나님의 나라를 기다리는 사람입니다 • 나는 공회의원으로 선하고 의로운 사람입니다 • 나는 유대인의 동네 아리마대 사람입니다 • 나는 빌라도에게 가서 예수님의 시체를 달라고 하였습니다.","a":"요셉"},{"t":"NT","b":"누가복음","y":"단답형","n":38,"s":"누가복음 24:50에 따르면, 예수께서 손을 들어 축복하시고 하늘로 올라가신 곳은 어디인가? ( )","a":"베다니"},{"t":"NT","b":"누가복음","y":"진위형","n":1,"s":"누가복음에 나오는 예수님의 첫 설교에 사렙다 과부가 언급되었다(눅4:26). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":2,"s":"예수님께서 십자가에 달리신 날 제 구시에 어두움이 온 땅을 덮었다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":3,"s":"예수께서 운명하신 후 성소휘장이 위로부터 아래까지 찢어진 사건이 기록된 복음서는 누가복음이다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":4,"s":"처녀 마리아와 정혼한 요셉은 다윗의 자손이다(눅1:27). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":5,"s":"엘리사벳의 수태와 마리아의 수태는 여섯 달 차이이다(눅1:36). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":6,"s":"침례 요한의 아버지 사가랴의 아내 엘리사벳은 아론의 자손이다(눅1:5). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":7,"s":"\"이 아이여 네가 지극히 높으신 이의 선지자라 일컬음을 받고 주 앞에 앞서가서 그 길을 준비하여(눅1:76)에서 이 아이는 침례 요한을 말한다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":8,"s":"침례 요한이 빈들에 있을 당시의 대제사장은 안나스와 가야바였다(눅3:2). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":9,"s":"자신의 외딸이 죽어감으로 예수님의 발아래 엎드려 자기 집에 오시기를 간구한 야이로의 직업은 세리장이었다(눅8:41-42). (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":10,"s":"예수께서 자라나신 곳은 나사렛이다(눅4:16). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":11,"s":"예수께서 \"이 세대는 악한 세대라 표적을 구하되 요나의 표적 밖에는 보일 표적이 없다\"라고 하셨다(눅11:29). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":12,"s":"예수께서 심판 때에 남방여왕과 니느웨 사람들이 일어나 주님의 세대의 사람들을 심판할 것이라고 하셨다(눅11:31-32). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":13,"s":"예수께서 나인성 과부의 아들을 살리신 이적은 누가복음에만 나오는 것은 아니다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":14,"s":"누가복음은 사도행전의 저자와 동일한 저자가 기록하였다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":15,"s":"침례요한의 출생에 대한 보고는 누가복음에만 나온다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":16,"s":"예수님의 탄생시 수리아의 총독의 이름은 구레뇨였다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":17,"s":"누가복음 서두에 나오는 이야기 가운데 성전에서 생전에 메시야 보기를 기다리던 두 노인의 이름은 시므온과 안나였다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":18,"s":"마태복음의 산상설교의 내용과 비슷한 누가복음의 평지설교가 나오는 곳은 누가복음 11장이다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":19,"s":"누가복음에 따르면 변화산에서 예수께서 모세와 엘리야와 함께 나누신 대화의 주된 내용은 예수께서 예루살렘에서 별세하실 것에 관한 것이었다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":20,"s":"선한 사마리아인의 비유가 나오는 복음서는 누가복음만은 아니다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":21,"s":"누가복음에는 주의 기도가 11장에 나온다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":22,"s":"누가복음에 의하면 잃은 양의 비유는 서기관과 바리새인을 향하여 하신 비유이다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":23,"s":"예수께서 나병환자 열 명을 고치셨을 때 감사의 뜻을 표시한 사람은 사마리아인 단 한 명뿐이었다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":24,"s":"누가복음에만 부자와 나사로의 비유가 나오는 것은 아니다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":25,"s":"바리새인과 세리의 비유가 나오는 복음서는 누가복음서 뿐이다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":26,"s":"예루살렘을 보면서 예수께서 통곡하시는 장면이 기록된 복음서는 누가복음만은 아니다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":27,"s":"엠마오 도상에서의 예수의 부활현현 사건이 기록된 복음서는 누가복음뿐이다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":28,"s":"누가복음에도 마태복음처럼 감추인 보화의 비유가 나온다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":29,"s":"가난한 과부의 헌금 이야기가 나오는 곳은 누가복음 21장이다. (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":30,"s":"\"주리는 자를 좋은 것으로 배불리셨으며 부자는 빈손으로 보내셨도다 그 종 이스라엘을 도우사 긍휼히 여기시고 기억하시되 우리 조상에게 말씀하신 것과 같이 아브라함과 그 자손에게 영원히 하시리로다\"라고 노래한 이는 사가랴이다(눅1:53-55). (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":31,"s":"\"내 눈이 주의 구원을 보았사오니 이는 만민 앞에 예비하신 것이요 이방을 비추는 빛이요 주의 백성 이스라엘의 영광이니이다\"라고 찬송한 이는 시므온이었다(눅2:30-32). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":32,"s":"\"칼이 네 마음을 찌르듯 하리니 이는 여러 사람의 마음의 생각을 드러내려 함이니라\"라고 말한 사람은 안나라는 선지자였다(눅2:35). (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":33,"s":"\"아기가 자라며 강하여지고 지혜가 충만하며 하난님의 은혜가 그의 위에 있더라\"라는 묘사는 예수님에 관한 것이다(눅2:40). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":34,"s":"누가복음에도 마태복음처럼 예수님의 족보가 첫째 장에 나온다. (O,X)","a":"X"},{"t":"NT","b":"누가복음","y":"진위형","n":35,"s":"누가복음에서 예수님을 만난 삭개오가 누구의 것을 속여서 빼앗은 일이 있으면 네 갑절이나 갚겠다고 하였다(눅19:8). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":36,"s":"빌라도가 예수님을 심문하면서 처음 물은 말은 \"네가 유대인의 왕이냐\"이다(눅23:3). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":37,"s":"예수님께서 \"하나님의 나라가 이런 자의 것이니라\" 말씀하실 때에, 이런 자는 어린 아이를 의미한다(눅18:16). (O,X)","a":"O"},{"t":"NT","b":"누가복음","y":"진위형","n":38,"s":"\"하나님의 나라가 어느 때에 임하니이까\"라고 물었던 자들은 바리새인들이었다(눅17:20). (O,X)","a":"O"},{"t":"NT","b":"요한복음","y":"선택형","n":1,"s":"\"태초에 말씀이 계시니라\"라는 구절로 시작되는 복음서는 무엇인가?","c":["마태복음","마가복음","누가복음"  베드로의 정기적인 기도가 언급되어 있다. (O,X)","a":"X"},{"t":"NT","b":"사도행전","y":"진위형","n":10,"s":"바울의 동역자였던 구브로 출신 바나바의 이름의 뜻은 위로의 아들이다(행4:36). (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":11,"s":"바울의 동역자였던 구브로 출신 바나바의 또 다른 이름은 요셉이다(행4:36). (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":12,"s":"공회 중에서 \"이 사상과 이 소행이 사람으로부터 났으면 무너질 것이요 만일 하나님께로부터 났으면 너희가 그들을 무너뜨릴 수 없겠고 도리어 하나님을 대적하는 자가 될까 하노라\"라고 지적한 바리새인 율법 교사의 이름은 가말리엘이다(행5:34-39). (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":13,"s":"사도행전 6:1-6에 나타나는 예루살렘 교회 내의 두 파의 이름은 헬라파와 제사장파이다. (O,X)","a":"X"},{"t":"NT","b":"사도행전","y":"진위형","n":14,"s":"사도행전에는 많은 이들의 설교가 나오는데 이 중에서 성전을 공격한 설교를 한 사람은 스데반이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":15,"s":"사도행전에 의하면 바울이 디모데를 만난 곳은 이고니온이었다. (O,X)","a":"X"},{"t":"NT","b":"사도행전","y":"진위형","n":16,"s":"사도행전에 따르면 사마리아에 처음 복음전한 전도자는 빌립이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":17,"s":"사마리아성의 마술사로 빌립에게 침례를 받고 후에 돈으로 성령을 사려했던 사람의 이름은 시몬이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":18,"s":"예루살렘에 있던 사도들이 사마리아도 하나님의 말씀을 받았다 함을 듣고 보낸 사람은 베드로와 요한이었다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":19,"s":"바울을 찾아가 '형제 사울아' 라고 부르면서 안수해준 사람은 다메섹의 아나니아였다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":20,"s":"바울을 예루살렘의 제자들에게 소개해준 사람은 바나바였다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":21,"s":"욥바에서 선행과 구제를 많이 하던 여제자로 베드로에 의해서 살아난 사람의 이름은 다비다 혹은 도르가이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":22,"s":"바울의 1차 선교여행시 마가 요한이 그 일행을 떠나 예루살렘으로 돌아갔던 지점은 루스드라이다. (O,X)","a":"X"},{"t":"NT","b":"사도행전","y":"진위형","n":23,"s":"베드로를 자신의 가정에 초청하여 말씀을 들은 로마의 백부장의 이름은 고넬료이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":24,"s":"요한의 형제 야고보는 헤롯왕에 의하여 순교하였다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":25,"s":"로마로 압송되던 바울이 탄 배가 파선하여 도착한 섬의 이름은 살라미였다. (O,X)","a":"X"},{"t":"NT","b":"사도행전","y":"진위형","n":26,"s":"사울이라는 이름이 사도행전에서 처음 등장하는 사건은 스데반의 순교사건이다. (O,X)","a":"O"},{"t":"NT","b":"사도행전","y":"진위형","n":27,"s":"베드로가 가이사랴에서 침례를 준 사람의 이름은 고넬료이다. (O,X)","a":"O"},{"t 12장) ( )","a":"선"},{"t":"NT","b":"로마서","y":"단답형","n":25,"s":"바울은 남을 사랑하는 자는 무엇을 다 이루는 것이라고 말하는가? (롬13장) ( )","a":"율법"},{"t":"NT","b":"로마서","y":"단답형","n":26,"s":"바울은 그리스도인들이 자다가 깰 때가 되었는데 이것은 이제 우리의 무엇이 처음 믿을 때보다 가까웠기 때문이라고 말하는가? (롬13장) ( )","a":"구원"},{"t":"NT","b":"로마서","y":"단답형","n":27,"s":"바울은 형제를 판단하고 업신여기는 사람들을 향하여 우리가 다 하나님의 무엇 앞에 서게 될 것이고 말하는가? (롬14장) ( )","a":"심판대"},{"t":"NT","b":"로마서","y":"단답형","n":28,"s":"바울은 로마서 14장에서 그리스도께서 대신하여 죽으신 형제자매를 무엇으로 인하여 망하게 하지 말라고 권면하는가? (롬14장) ( )","a":"음식"},{"t":"NT","b":"로마서","y":"단답형","n":29,"s":"바울은 로마서의 본체를 마무리하면서 하나님이 성령의 능력으로 무엇이 넘치게 하기를 기원하는가? (롬15장) ( )","a":"소망"},{"t":"NT","b":"로마서","y":"단답형","n":30,"s":"바울은 로마서를 쓸 때 마게도냐와 아가야 성도들이 모금한 것을 어느 도시에 있는 교회에 전해주려는 계획을 갖고 있었는가? (롬15장) ( )","a":"예루살렘"},{"t":"NT","b":"로마서","y":"단답형","n":31,"s":"바울은 로마서를 쓸 때 그 편지를 대서해준 사람을 누구라고 말하는가? (롬16장) ( )","a":"더디오"},{"t":"NT","b":"로마서","y":"진위형","n":1,"s":"사도 바울이 로마의 성도들을 보기를 심히 원했던 이유는 그들에게 신령한 은사를 나누어주기 위함이었다(롬1장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":2,"s":"인간이 하나님을 모른다고 핑계할 수 없는 이유는 하나님이 하나님을 알만한 것을 그들 속에 보여주셨기 때문이다(롬1장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":3,"s":"하나님께서 각 사람에게 그 행한대로 보응하시는 이유는 하나님께서 외모로 사람을 취하기 때문이다(롬2장). (O,X)","a":"X"},{"t":"NT","b":"로마서","y":"진위형","n":4,"s":"사도 바울은 율법을 자랑하는 유대인들이 그 율법의 범함으로 하나님을 욕되게 한다고 비판했다(롬2장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":5,"s":"사도 바울이 지적한 것으로서 유대인이 가진 특권으로서 첫 번째로 언급된 것은 그들이 하나님의 말씀을 맡았다는 것이다(롬3장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":6,"s":"바울은 그리스도인들이 믿음으로 말미암아 의롭다하심을 받기 때문에 율법을 폐한다고 말했다(롬3장). (O,X)","a":"X"},{"t":"NT","b":"로마서","y":"진위형","n":7,"s":"바울은 율법은 진노를 이루어내기 때문에 율법이 없는 곳에는 범함도 없다고 말한다(롬4장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":8,"s":"바울은 아브라함이 받은 의는 그 자신 뿐 아니라 예수를 죽은 자 가운데서 살리신 분을 믿는 사람들도 위한 것이라고 말한다(롬4장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":9,"s":"바울은 그리스도인들이 환난 중에도 즐거워하는 이유는 환난은 인내를, 인내는 연단을, 연단은 소망을 이루기 때문이라고 말한다(롬5장). (O,X)","a":"O"},{"t":"NT","b":"로마서","y":"진위형","n":10,"s":"바울은 율법이 주어진 목적은 ":"단답형","n":13,"s":"바울은 무릇 시장에서 파는 것은 무엇을 위하여 묻지 말고 먹으라고 말하는가? (고전10장) ( )","a":"양심"},{"t":"NT","b":"고린도전서","y":"단답형","n":14,"s":"바울은 여자가 누구 때문에 권세 아래 있는 표를 그 머리 위에 두라고 말하는가? (고전11장) ( )","a":"천사들"},{"t":"NT","b":"고린도전서","y":"단답형","n":15,"s":"바울은 주의 만찬에서 떡을 먹고 잔을 마실 때 마다 주님의 무엇을 오실 때까지 전하는 것이라고 말하는가? (고전11장) ( )","a":"죽으심 or 죽음"},{"t":"NT","b":"고린도전서","y":"단답형","n":16,"s":"바울은 교회에서 주어지는 모든 은사가 누구에 의해 주어진다고 말하는가? (고전12장) ( )","a":"성령"},{"t":"NT","b":"고린도전서","y":"단답형","n":17,"s":"바울은 고린도 교인들을 향하여 그들은 누구의 몸이요 지체의 각 부분이라고 말하는가? (고전12장) ( )","a":"그리스도"},{"t":"NT","b":"고린도전서","y":"단답형","n":18,"s":"바울은 믿음, 소망, 사랑 중에서 제일은 무엇이라고 말하는가? (고전13장) ( )","a":"사랑"},{"t":"NT","b":"고린도전서","y":"단답형","n":19,"s":"바울은 방언을 말하는 자는 그 영으로 무엇은 말하는 것이라고 하는가? (고전14장) ( )","a":"비밀"},{"t":"NT","b":"고린도전서","y":"단답형","n":20,"s":"바울은 교회에서 방언을 말할 때는 꼭 무엇을 병행해서 하라고 하는가? (고전14장) ( )","a":"통역"},{"t":"NT","b":"고린도전서","y":"단답형","n":21,"s":"바울은 그리스도께서 우리 죄를 위해 죽으신 것은 무엇대로 이루어진 일이라고 말하는가? (고전15장) ( )","a":"성경"},{"t":"NT","b":"고린도전서","y":"단답형","n":22,"s":"바울은 하나님의 종말적 역사에서 맨 나중에 멸망 받을 원수를 무엇이라고 말하는가?(고전15장) ( )","a":"사망"},{"t":"NT","b":"고린도전서","y":"단답형","n":23,"s":"죽은 자의 부활은 육의 몸으로 심고 어떤 몸으로 다시 사는 것인가? (고전15장) ( )","a":"신령한 몸"},{"t":"NT","b":"고린도전서","y":"단답형","n":24,"s":"바울은 혈과 육은 무엇을 유업으로 받을 수 없다고 말하는가? (고전15장) ( )","a":"하나님의 나라"},{"t":"NT","b":"고린도전서","y":"단답형","n":25,"s":"바울은 고린도전서 16장에 따르면 오순절까지 어느 도시에 머무르려는 계획을 갖고 있었는가? (고전16장) ( )","a":"에베소"},{"t":"NT","b":"고린도전서","y":"진위형","n":1,"s":"바울에게 고린도 교회의 분별에 관하여 알려준 사람들은 글로에의 집 사람들이었다(고전1장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":2,"s":"바울은 오직 부르심을 입은 자들에게는 유대인이나 헬라인이나 그리스도는 하나님의 능력이요 하나님의 지혜라고 말한다(고전1장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":3,"s":"바울은 육에 속한 사람은 하나님의 성령의 일을 받은 사람이라고 말한다(고전2장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":4,"s":"바울은 그리스도인들이 세우는 집의 재료를 금, 은, 보석이나 나무, 풀, 짚으로 말한다(고전3장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":5,"s":"바울은 누구든지 사람을 자랑하지 말라 만물이 다 너희 것이기 때문이라고 말한다(고전3장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":6,"s":"바울은 하나님의 나라는 말에 있지 않고 오직 방언과 은사에 있다고 말한다(고전4장).","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":7,"s":"바울은 의인들은 하나님이 판단하시지만 교중 사람들은 교회 안에서 판단하는 것이 필요하다고 말한다(고전5장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":8,"s":"바울은 고린도 교회에서 형제가 형제로 더불어 송사할뿐더러 믿지 아니하는 자들 앞에서 하는 것 때문에 비판하며 권면한다(고전6장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":9,"s":"바울은 처녀 딸을 시집보내는 것은 잘하는 일이지만 시집 보내지 않는 것은 죄를 짓는 일이라고 말한다(고전7장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":10,"s":"바울은 우상의 제물을 먹음으로 약한 양심을 상하게 하는 것이 곧 그리스도에게 죄를 짓는 것이라고 말한다(고전8장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":11,"s":"바울은 자기가 복음을 전할지라도 자랑할 것이 없는 이유는 그가 직분을 맡았기 때문이라고 말한다(고전9장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":12,"s":"바울은 하나님은 때때로 사람이 감당할 수 없는 시험을 주신다고 말한다(고전10장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":13,"s":"바울은 유대인에게나 헬라인에게나 하나님의 교회에게나 거치는 자가 되지 말라고 권면한다(고전10장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":14,"s":"바울은 각 남자의 머리는 그리스도이지만 여자의 머리는 하나님이라고 말한다(고전11장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":15,"s":"바울은 주의 만찬을 먹으러 모일 때에 자기를 살핀 후에 떡을 먹고 잔을 마시라고 권면한다(고전11장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":16,"s":"바울은 하나님의 영으로 말하는 자는 누구든지 예수를 저주할 자라 하지 않는다고 말한다(고전12장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":17,"s":"바울은 각 사람에게 성령의 나타남을 주심은 차별을 두기 위함이라 말한다(고전12장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":18,"s":"바울은 사랑은 모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디는 것이라고 말한다(고전13장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":19,"s":"바울은 신령한 것을 사모하되 특별히 교회의 덕을 세우기 위하여 방언을 하라고 말한다(고전13장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":20,"s":"바울은 교회에서 방언을 말할 때 통역이 없으면 잠잠하고 자기와 및 하나님께 말하라고 권유한다(고전14장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":21,"s":"바울은 자기나 사도들이나 동일하게 복음을 전파했으며 고린도교인들도 그같이 믿었다고 말한다(고전15장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":22,"s":"바울은 그리스도께서 죽은 자 가운데서 다시 살아나심으로 잠자는 자들의 마지막 열매가 되었다고 말한다(고전15장). (O,X)","a":"X"},{"t":"NT","b":"고린도전서","y":"진위형","n":23,"s":"죽은 자의 부활은 썩을 것으로 심고 썩지 아니할 것으로 다시 사는 것이라고 말한다(고전15장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":24,"s":"바울은 그리스도인들이 마지막 나팔에 순식간에 홀연히 변화할 것이라고 말한다(고전15장). (O,X)","a":"O"},{"t":"NT","b":"고린도전서","y":"진위형","n":25,"s":"바울은 고린도전서 16장에서 게바와 바나바에게 문안 인사한다(고전16장). (O,X)","a":"X"},{"t":"NT","b":"고린도후서","y":"선택형","n":1,"s":"바울은 고린도후서 1장에서 어느 지역에서 당한 환난을 말하는가? (고후1장)","c":["마게도냐","아가야","아시아","유다"],"a":"3"},{"t":"NT","b":"고린도후서","y":"선택형","n":2,"s":"바울은 고린도후서 2장에 따르면 디도를 만나려고 어디로 갔다고 말하는가? (고후2장)","c":["예루살렘","에베소","로마","마게도냐"],"a":"4"},{"t":"NT","b":"고린도후서","y":"선택형","n":3,"s":"바울이 고린도후서 3장에서 복음의 일꾼을 가리켜 사용한 용어가 아닌 것은 무엇인가?(고후3장)","c":["정죄의 직분","영의 직분","의의 직분","새 언약의 직분"],"a":"1"},{"t":"NT","b":"고린도후서","y":"선택형","n":4,"s":"바울은 하나님이 예수 그리스도의 얼굴에 있는 하나님의 무엇을 아는 빛을 우리 마음에 비추셨다고 말하는가? (고후4장)","c":["지식","영광","지혜","은사"],"a":"2"},{"t":"NT","b":"고린도후서","y":"선택형","n":5,"s":"바울은 우리가 다 반드시 그리스도의 무엇 앞에 드러나 그 몸으로 행한 것을 따라 받을 것이라고 말하는가? (고후5장)","c":["집","성전","심판대","하늘"],"a":"3"},{"t":"NT","b":"고린도후서","y":"선택형","n":6,"s":"바울이 고린도후서 6장에서 언급한 것으로서 하나님의 일꾼들이 받는 고난에 포함되지 않는 것은 무엇인가? (고후6장)","c":["매맞음","갇힘","궁핍","과도침"],"a":"4"},{"t":"NT","b":"고린도후서","y":"선택형","n":7,"s":"바울은 마게도냐에 갔다가 누구를 만나서 큰 위로를 받게 되었는가? (고후7장)","c":["디모데","바나바","디도","게바"],"a":"3"},{"t":"NT","b":"고린도후서","y":"선택형","n":8,"s":"바울이 환난의 많은 시련 가운데서도 풍성한 연보를 한 교회는 어느 지역에 있는 교회였는가? (고후8장)","c":["마게도냐","아시아","유다","갈릴리"],"a":"1"},{"t":"NT","b":"고린도후서","y":"선택형","n":9,"s":"고린도후서 11장에서 바울이 냉소적으로 자기의 존재를 변호하는 내용에 포함되지 않는 것은 무엇은가? (고후11장)","c":["히브리인","사마리아인","이스라엘인","아브라함의 씨"],"a":"2"},{"t":"NT","b":"고린도후서","y":"선택형","n":10,"s":"바울이 십 사년 전에 경험했던 것에 포함되지 않는 것은 무엇인가? (고후12장)","c":["환상과 계시","셋째 하늘","영적 싸움","낙원"],"a":"3"},{"t":"NT","b":"고린도후서","y":"완성형","n":1,"s":"그가 또한 우리에게 인치시고 보증으로 우리( )에 ( )을 주셨느니라(고후1:22).","a":"마음, 성령"},{"t":"NT","b":"고린도후서","y":"완성형","n":2,"s":"그리스도의 ( )이 우리에게 넘친 것 같이 우리가 받은 ( )도 그리스도로 말미암아 넘치는도다(고후1:5).","a":"고난, 위로"},{"t":"NT","b":"고린도후서","y":"완성형","n":3,"s":"( )의 직분도 영광이  ( )","a":"실루아노"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":12,"s":"\"그러나 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라\"라는 말씀이 나오는 신약성경의 책은 무엇인가? ( )","a":"베드로전서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":13,"s":"\"양들의 큰 목자이신 우리 주 예수를 영원한 언약의 피로 죽은 자 가운데서 이끌어 내신 평강의 하나님이 모든 선한 일에 너희를 온전하게 하사 자기 뜻을 행하게 하시고 그 앞에 즐거운 것을 예수 그리스도로 말미암아 우리 가운데서 이루시기를 원하노라 영광이 그에게 세세 무궁토록 있을지어다 아멘\"이라는 아름다운 축도가 들어 있는 신약성경의 책은 무엇인가? ( )","a":"히브리서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":14,"s":"\"간음하는 여인들아 세상과 벗된 것이 하나님과 원수 됨을 알지 못하느냐 그런즉 누구든지 세상과 벗이 되고자 하는 자는 스스로 하나님과 원수 되는 것이니라\"라는 말씀이 나오는 신약성경의 책은 무엇인가? ( )","a":"야고보서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":15,"s":"\"너희가 음란과 정욕과 술 취함과 방탕과 향락과 무법한 우상숭배를 하여 이방인의 뜻을 따라 행한 것은 지나간 때로 족하도다\"라는 말씀이 나오는 신약성경의 책은 무엇인가? ( )","a":"베드로전서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":16,"s":"불의한 삯을 사랑하다가 자기의 불법으로 인하여 말 못하는 나귀에게 책망을 들은 사람은 누구인가? (벧후2:15-16) ( )","a":"발람"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":17,"s":"\"사랑은 허다한 죄를 덮느니라\"라는 말씀이 나오는 곳은 베드로전서의 몇 장인가? ( )","a":"4장"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":18,"s":"그리스도인의 행함을 특히 강조한 서신은 무엇인가? ( )","a":"야고보서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"단답형","n":19,"s":"선생 된 우리가 더 큰 심판받을 줄 알고 많이 선생 되지 말라고 권면한 서신은 무엇인가? ( )","a":"야고보서"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":1,"s":"하나님의 아들 예수를 대제사장으로 기록한 신약성경의 책은 히브리서이다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":2,"s":"\"사랑하는 자들아 너희를 연단하려고 오는 불 시험을 이상한 일 당하는 것 같이 이상히 여기지 말고 오히려 너희가 그리스도의 고난에 참여하는 것으로 즐거워하라 이는 그의 영광을 나타내실 때에 너희로 즐거워하고 기뻐하게 하려 함이라\"라는 말씀은 베드로전서에 나온다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":3,"s":"\"내 아들아 주의 징계하심을 경히 여기지 말며 그에게 꾸지람을 받을 때에 낙심하지 말라 주께서 그 사랑하시는 자를 징계하시고 그가 받아들이시는 아들마다 채찍질하심이라\"라는 말씀은 야고보서에 나온다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":4,"s":"\"시험을 참는 자는 복이 있나니 이는 시련을 견디어 낸 자가 주께서 자기를 사랑하는 자들에게 약속하신 생명의 면류관을 얻을 것이기 때문이다\"라는 말씀은 야고보서에 나온다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":5,"s":"\"형제 사랑하기를 계속하고 손님 대접하기를 잊지 말라 이로써 부지중에 천사들을 대접한 이들이 있느니라\"라는 말씀은 야고보서에 나온다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":6,"s":"야고보서에서 기도의 역사하는 힘을 설명하기 위하여 예로 들은 구약의 사람은 엘리야이다(약5:17). (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":7,"s":"야고보서에서 믿음과 행함이 서로 상호 유기적인 관계라는 것을 강조하기 위하여 예를 들은 구약의 두 사람은 아브라함과 기생 라합이다(약2:21, 25). (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":8,"s":"히브리서는 모두 15장으로 기록되었다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":9,"s":"믿음으로 임종 시에 이스라엘 자손들의 떠날 것을 말하고 또 자기 해골을 위하여 명한 사람은 요셉이었다(히11:22). (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":10,"s":"히브리서 11장에 나오는 믿음의 사람들 중에서 두 여인은 사라와 기생 라합이다(히11:11,31). (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":11,"s":"\"온갖 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로부터 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라\"라는 말씀이 나오는 신약성경의 책은 히브리서이다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":12,"s":"두 번째 회개의 불가능성을 언급한 신약성경의 서신은 히브리서이다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":13,"s":"'혀' 를 조심할 것을 강조한 신약성경의 서신은 베드로전서이다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":14,"s":"히브리서는 설교처럼 시작하고 서신처럼 끝난다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":15,"s":"야고보서에서 인내의 예로 든 사람은 욥이다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":16,"s":"그리스도께서 \"영으로 가서 옥에 있는 영들에게 선포하시니라\"라는 말씀은 베드로후서에서 나온다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":17,"s":"베드로후서에는 '천년' 이라는 말이 나오지 않는다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":18,"s":"야고보서는 서두에 감사와 축복의 말이 빠져있다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":19,"s":"요한은 \"사랑하는 자들아 나그네 같은 너희를 권하노니\"라고 말한다. (O,X)","a":"X"},{"t":"NT","b":"히브리서·야고보서·베드로전후서","y":"진위형","n":20,"s":"야고보서는 하나님 앞에서 정결하고 더러움이 없는 경건은 환난 중에 있는 고아와 과부를 돌보고 또한 자기를 세속에 물들지 않게 지키는 것이라고 정의한다. (O,X)","a":"O"},{"t":"NT","b":"히브리서·야고보서·베드로전후서 const ITEMS=DATA.items, BOOKS=DATA.books;
const TL={OT:"구약",NT:"신약"};
const key=i=>i.t+"|"+i.b+"|"+i.y+"|"+i.n;
const $app=document.getElementById("app");
let wrong={};try{wrong=JSON.parse(localStorage.getItem("bible_wrong")||"{}")}catch(e){wrong={}}
function saveWrong(){try{localStorage.setItem("bible_wrong",JSON.stringify(wrong))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[\s.,;:!?()\[\]"'“”‘’·\-]/g,"")}
function byBook(t,b){return ITEMS.filter(i=>i.t===t&&i.b===b)}
function drawExam(t,n){const pool=ITEMS.filter(i=>i.t===t&&i.a!==null);return shuffle(pool).slice(0,n)}
let Q=null; // {title,list,idx,res:{},mode}
function home(){
  Q=null;const wn=Object.keys(wrong).length;
  let h='<div class="modes">'+
   '<button class="pri" data-exam="OT">구약 모의시험<small>무작위 100문항 (전체 책)</small></button>'+
   '<button class="pri" data-exam="NT">신약 모의시험<small>무작위 100문항 (전체 책)</small></button>'+
   '<button data-wrong="1"'+(wn?'':' disabled')+'>오답 노트 ('+wn+')<small>틀린 문제만 다시 풀기</small></button></div>';
  for(const t of ["OT","NT"]){h+='<h2>'+TL[t]+' — 책별 연습 ('+BOOKS[t].length+'권)</h2><div class="books">'+
    BOOKS[t].map(b=>'<button data-t="'+t+'" data-b="'+esc(b)+'">'+esc(b)+'<small>'+byBook(t,b).length+'문항</small></button>').join("")+'</div>'}
  h+='<p class="mut">책을 고르면 그 책의 모든 유형 문제가 무작위 순서로 나옵니다. 오답은 이 기기(브라우저)에 저장됩니다.</p>';
  $app.innerHTML=h;
  $app.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>start(TL[b.dataset.exam]+" 모의시험 100문항",drawExam(b.dataset.exam,100)));
  $app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>start(b.dataset.b,shuffle(byBook(b.dataset.t,b.dataset.b))));
  const w=$app.querySelector("[data-wrong]");if(w)w.onclick=()=>{const l=ITEMS.filter(i=>wrong[key(i)]);start("오답 노트",shuffle(l))};
}
function start(title,list){Q={title,list,idx:0,res:{}};show()}
function show(){
  const i=Q.list[Q.idx],n=Q.list.length,done=Object.keys(Q.res).length;
  let h='<div class="top"><div class="toprow"><span><b>'+esc(Q.title)+'</b></span><span><b>'+(Q.idx+1)+'</b> / '+n+'</span><button id="quit">그만하기</button></div><div class="prog"><i style="width:'+(done/n*100)+'%"></i></div></div>';
  h+='<div class="card"><div><span class="badge">'+i.y+'</span><span class="mut">'+TL[i.t]+' · '+esc(i.b)+' '+i.n+'번</span></div><div class="stem">'+esc(i.s)+'</div><div id="ans"></div><div id="fb"></div></div>';
  h+='<div class="row"><button id="next" class="pri" disabled>'+(Q.idx+1<n?'다음 문제':'결과 보기')+'</button></div>';
  $app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("quit").onclick=()=>{if(confirm("그만하고 결과를 볼까요?"))result()};
  const nx=document.getElementById("next");nx.onclick=()=>{if(Q.idx+1<n){Q.idx++;show()}else result()};
  const ans=document.getElementById("ans"),fb=document.getElementById("fb");
  const unk=i.a===null;
  function finish(ok,userAns){
    if(unk){Q.res[Q.idx]=null}else{Q.res[Q.idx]=ok;if(ok)delete wrong[key(i)];else wrong[key(i)]=1;saveWrong()}
    nx.disabled=false;
  }
  function reveal(ok,extra){
    let c=i.a, shown;
    if(i.y==="선택형")shown=c+"번 "+i.c[+c-1];else shown=c;
    fb.innerHTML=unk?'<div class="res unk">정답 미확인 (교재에 정답 없음) — 채점에서 제외됩니다.</div>':
      '<div class="res '+(ok===null?'':(ok?'ok':'bad'))+'">'+(ok===null?'':(ok?'정답입니다! ':'오답입니다. '))+'정답: <b>'+esc(shown)+'</b>'+(i.x?'<div class="mut">'+esc(i.x)+'</div>':'')+(extra||'')+'</div>';
  }
  if(i.y==="선택형"){
    ans.innerHTML=i.c.map((t,k)=>'<button class="ch" data-k="'+(k+1)+'">'+(k+1)+'. '+esc(t)+'</button>').join("");
    ans.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
      ans.querySelectorAll(".ch").forEach(x=>x.disabled=true);
      const k=b.dataset.k,ok=!unk&&k===i.a;
      if(!unk){ans.querySelector('[data-k="'+i.a+'"]').classList.add("ok");if(!ok)b.classList.add("bad")}
      finish(ok);reveal(ok);});
  }else if(i.y==="진위형"){
    ans.innerHTML='<div class="ox"><button data-k="O">O</button><button data-k="X">X</button></div>';
    ans.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      ans.querySelectorAll("button").forEach(x=>x.disabled=true);
      const ok=!unk&&b.dataset.k===i.a;
      if(!unk){ans.querySelector('[data-k="'+i.a+'"]').classList.add("ok");if(!ok)b.classList.add("bad")}
      finish(ok);reveal(ok);});
  }else{
    ans.innerHTML='<input type="text" id="inp" placeholder="정답 입력 (선택)" autocomplete="off"><div class="row"><button id="rv" class="pri">정답 확인</button></div>';
    const inp=document.getElementById("inp");
    function go(){
      inp.disabled=true;document.getElementById("rv").remove();
      if(unk){finish(null);reveal(null);return}
      const auto=inp.value.trim()!==""&&norm(inp.value)===norm(i.a);
      reveal(auto?true:null,'<div class="row" id="sg"><button data-g="1">맞았어요</button><button data-g="0">틀렸어요</button></div>');
      const sg=document.getElementById("sg");
      sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{finish(b.dataset.g==="1");sg.remove();
        const ok=b.dataset.g==="1";fb.querySelector(".res").className="res "+(ok?"ok":"bad");});
      if(auto){sg.remove();finish(true)}
    }
    document.getElementById("rv").onclick=go;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  }
}
function result(){
  const idxs=Object.keys(Q.res).map(Number),scored=idxs.filter(k=>Q.res[k]!==null);
  const right=scored.filter(k=>Q.res[k]===true).length,w=scored.filter(k=>Q.res[k]===false).map(k=>Q.list[k]);
  const pct=scored.length?Math.round(right/scored.length*100):0;
  const by={};scored.forEach(k=>{const y=Q.list[k].y;(by[y]=by[y]||[0,0])[1]++;if(Q.res[k])by[y][0]++});
  let h='<div class="card"><div class="mut">'+esc(Q.title)+' · 결과</div><div class="score">'+right+' / '+scored.length+' ('+pct+'%)</div>'+
   '<div class="mut">푼 문제 '+idxs.length+' / 전체 '+Q.list.length+(idxs.length-scored.length?' · 채점 제외 '+(idxs.length-scored.length):'')+'</div>'+
   '<div class="mut">'+Object.keys(by).map(y=>y+' '+by[y][0]+'/'+by[y][1]).join(' · ')+'</div>'+
   '<div class="row"><button id="rw" class="pri"'+(w.length?'':' disabled')+'>틀린 문제만 다시 풀기 ('+w.length+')</button><button id="hm">처음으로</button></div></div>';
  if(w.length){h+='<h2>틀린 문제</h2><div class="card">'+w.map(i=>'<div class="wl"><span class="badge">'+i.y+'</span><span class="mut">'+esc(i.b)+' '+i.n+'번</span><div class="stem">'+esc(i.s)+'</div>'+
    (i.y==="선택형"?'<div class="mut">'+i.c.map((t,k)=>(k+1)+'. '+esc(t)).join('<br>')+'</div>':'')+
    '<div class="a">정답: '+esc(i.y==="선택형"?i.a+'번 '+i.c[+i.a-1]:i.a)+'</div></div>').join("")+'</div>'}
  $app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("hm").onclick=home;
  document.getElementById("rw").onclick=()=>start("틀린 문제 다시",shuffle(w));
}
function selftest(){
  const r={total:ITEMS.length,ot:ITEMS.filter(i=>i.t==="OT").length,nt:ITEMS.filter(i=>i.t==="NT").length,emptyGroups:[],exam:{}};
  for(const t of ["OT","NT"]){BOOKS[t].forEach(b=>{if(!byBook(t,b).length)r.emptyGroups.push(b)});
    let okAll=true;for(let k=0;k<20;k++){const d=drawExam(t,100);if(d.length!==100||new Set(d.map(key)).size!==100||d.some(x=>x.t!==t))okAll=false}
    r.exam[t]={books:BOOKS[t].length,draws20_ok:okAll,pool:ITEMS.filter(i=>i.t===t&&i.a!==null).length}}
  r.unconfirmed=ITEMS.filter(i=>i.a===null).map(key);
  r.keysUnique=new Set(ITEMS.map(key)).size===ITEMS.length;
  return r;
}
const H=location.hash;
if(H==="#selftest"){document.body.innerHTML="<pre id=st>"+JSON.stringify(selftest())+"</pre>"}
else if(H.startsWith("#demo=")){home();const ps=decodeURIComponent(H.slice(6)).split("&"),m=ps[0];
  const b=[...$app.querySelectorAll("[data-b]")].find(x=>x.dataset.b===m);if(b)b.click();
  if(ps.includes("sel")){Q.list=Q.list.filter(x=>x.y==="선택형").concat(Q.list.filter(x=>x.y!=="선택형"));show()}
  const f=document.querySelector(".ch");if(f&&ps.includes("a"))f.click()}
else home();
