:"엘리사가 예언한 것처럼 아합의 왕가를 무너뜨리고 이스라엘의 왕이 된 자는 ( )이다(왕하9장).","a":"예후"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":18,"s":"이스라엘의 악한 왕후로서 그 시체를 개들이 먹고 두골과 발과 손만 남은 자는 ( )이다(왕하9:30-37).","a":"이세벨"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":19,"s":"아하시야의 아들로서, 아달랴가 왕의 자손들을 모두 멸절할 때 살아남아 후에 왕이 된 자는 ( )이다(왕하11:2).","a":"요아스"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":20,"s":"엘리사가 죽을 병이 들매 이스라엘의 왕 ( )가 그에게로 내려와 자기의 얼굴에 눈물을 흘리며 \"내 아버지여 내 아버지여 이스라엘의 병거와 마병이여\"라고 외쳤다(왕하13:14).","a":"요아스"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":21,"s":"여로보암 2세가 통치할 때 그가 이스라엘 영토를 회복할 것을 예언한 선지자는 아밋대의 아들 ( )이다(왕하14:25).","a":"요나"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":22,"s":"아람 왕 르신과 이스라엘 왕 베가가 유다를 쳐들어왔을 때 앗수르 왕 디글랏 빌레셀에게 성전과 왕궁 곳간에 있는 은금을 내어주며 도움을 요청한 유다의 왕은 ( )이다(왕하16:8).","a":"아하스"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":23,"s":"북 왕국 이스라엘의 마지막 왕은 ( )이다(왕하17:1-6).","a":"호세아"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":24,"s":"앗수르의 산헤립이 쳐들어와서 유다의 모든 견고한 성읍을 점령하자 여호와의 성전과 왕궁 곳간에 있는 은을 주고, 또 성전 문의 금과 왕궁 기둥에 입힌 금을 벗겨 산헤립에게 준 유다의 왕은 ( )이다(왕하18:15-16).","a":"히스기야"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":25,"s":"\"아버지 히스기야가 헐어 버린 산당들을 다시 세우며 이스라엘 왕 아합의 행위를 따라 바알을 위하여 제단을 쌓으며 아세라 목상을 만들며 하늘의 일월 성신을 경배하여 섬기며…자기의 아들을 불 가운데로 지나게 하며…\"라는 설명과 연관이 있는 유다의 왕은( )이다(왕하21:3-6).","a":"므낫세"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":26,"s":"( )와 같이 마음을 다하며 뜻을 다하며 힘을 다하여 모세의 모든 율법을 따라 여호와께로 돌이킨 왕은 전에도 없었고 후에도 그와 같은 자가 없었더라(왕하23:25).","a":"요시야"},{"t":"OT","b":"열왕기상·하","y":"완성형","n":27,"s":"마침 사람을 장사하는 자들이 그 도적 떼를 보고 그의 시체를 ( )의 묘실에 들이던지매 시체가 그의 뼈에 닿자 곧 회생하여 일어섰더라(왕하13:21).","a":"엘리사"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":1,"s":"다윗 왕이 늙어 죽을 때가 되었을 때 스스로 높여서 \"내가 왕이 되리라\"고 생각하고 자기를 위하여 병거와 기병과 호위병을 준비한 자는 누구인가? (왕상1:5) ( )","a":"아도니야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":2,"s":"아도니야는 밧세바를 통해서 솔로몬 왕에게 누구를 달라고 요청했다가 죽임을 당하게 되었는가? (왕상2:17) ( )","a":"아비삭"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":3,"s":"잠언 삼천 가지를 말하였고 그의 노래는 천다섯 편이며 초목, 짐승, 새, 기어다니는 것, 물고기에 대해서도 박식했던 자는 누구인가? (왕상4:32-33) ( )","a":"솔로몬"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":4,"s":"솔로몬이 성전을 건축하기 위해 레바논의 백향목을 요청할 때 백향목과 잣나무를 제공한 두로의 왕은 누구인가? (왕상5:8) ( )","a":"히람"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":5,"s":"솔로몬이 성전을 건축하기 위해 레바논으로부터 나무들을 가져올 때 그 일을 감독하도록 임명했던 자는 누구인가? (왕상5:14) ( )","a":"아도니람"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":6,"s":"\"하나님이 참으로 땅에 거하시리이까 하늘과 하늘들의 하늘이라도 주를 용납하지 못하겠거든 하물며 내가 건축한 이 성전이오리이까\"라고 말한 자는 누구인가? (왕상8:27) ( )","a":"솔로몬"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":7,"s":"솔로몬의 지혜에 관한 소문을 듣고 직접 찾아와 본 후에 \"내게 말한 것은 절반도 못되니 당신의 지혜와 복이 내가 들은 소문보다 더 하도다\"라고 고백한 자는 어느 나라의 여왕인가? (왕상10:7) ( )","a":"스바"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":8,"s":"솔로몬이 예루살렘에서 온 이스라엘을 다스린 년 수는 얼마나 되는가? (왕상11:42) ( )","a":"40년"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":9,"s":"여로보암이 북 왕국 이스라엘의 왕이 될 것과 아울러 여로보암의 병든 아들이 죽게 될 것을 예언한 자는 누구인가? (왕상11:26-40) ( )","a":"아히야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":10,"s":"오므리 왕의 아들이고 이세벨을 아내로 두었으며, 그의 이전의 모든 왕보다 여호와 보시기에 악을 더욱 행했다고 평가를 받은 이스라엘의 왕은 누구인가? (왕상16:30) ( )","a":"아합"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":11,"s":"이세벨이 죽이려 하자 엘리야는 어떤 나무 아래에서 죽기를 간구했는가? (왕상19:4) ( )","a":"로뎀"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":12,"s":"이세벨의 간교에 의해 돌에 맞아 죽고 이스르엘에 있는 자기의 포도원을 아합 왕에게 빼앗긴 자는 누구인가? (왕상21) ( )","a":"나봇"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":13,"s":"길르앗 라못을 뺏기 위해 아람과 싸우려는 아합과 여호사밧 왕에 대해 전쟁에 나가면 패하게 된다고 예언했던 선지자는 누구인가? (왕상22:7) ( )","a":"미가야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":14,"s":"하나님께서는 호렙 산을 찾은 엘리야에게 다시 소명을 주시면서 이스라엘 가운데 바알에게 무릎을 꿇지 않고 바알에게 입맞추지 아니한 자 몇 명을 남겨주셨다고 약속했는가? (왕상19:18) ( )","a":"칠천"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":15,"s":"선지자 중에서 엘리야의 성령이 하시는 역사가 자기에게 갑절이나 임하게 해달라고 간구한 자는 누구인가? (왕하2:9) ( )","a":"엘리사"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":16,"s":"엘리야를 향하여 \"내 아버지여 내 아버지여 이스라엘의 병거와 그 마병이여\"라고 외친 선지자는 누구인가? (왕하2:12) ( )","a":"엘리사"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":17,"s":"나병환자였던 아람의 군대 장관 나아만은 요단강에서 몇 번이나 몸을 씻어서 낫게 되었는가? (왕하5:14) ( )","a":"일곱"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":18,"s":"\"지금이 어찌 은을 받으며 옷을 받으며 감람원이나 포도원이나 양이나 소나 남종이나 여종을 받을 때이냐\"라는 말은 엘리사가 누구에게 한 말인가? (왕하5:26) ( )","a":"게하시"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":19,"s":"이세벨과 그녀를 따르는 자들, 그리고 바알을 섬기는 자들을 모두 모아 처단하고 바알의 목상을 불사르고 바알의 신당을 헐어서 변소로 만들며 종교개혁을 일으켰던 이스라엘의 왕은 누구인가? (왕하10장) ( )","a":"예후"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":20,"s":"일곱 살 때 유다의 왕이 된 자는 누구인가? (왕하11:21) ( )","a":"요아스"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":21,"s":"십육 세에 유다의 왕이 되어 오십 년을 다스렸는데, 여호와께서 치셔서 죽는 날까지 나병환자가 되어 별궁에 거했던 자는 누구인가? (왕하15:2, 5) ( )","a":"아사랴"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":22,"s":"유다의 왕으로서 여호와께서 보시기에 정직하게 행하여 여러 산당들을 제거하며 주상을 깨뜨리며 아세라 목상을 찍으며 모세가 만들었던 놋뱀을 부수었던 자는 누구인가? (왕하18:4) ( )","a":"히스기야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":23,"s":"앗수르 왕 산헤립의 침공으로 두려워하고 있는 히스기야 왕에게 그들이 오던 길로 되돌아가게 될 것을 예언하며 두려워하지 말도록 권한 선지자는 누구인가? (왕하19:1-7) ( )","a":"이사야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":24,"s":"남 왕국 유다를 침공하였다가 하루 밤에 여호와의 사자가 나와서 군사 십팔만 오천 명을 치자 니느웨로 돌아간 앗수르의 왕은 누구인가? (왕하19:35-36) ( )","a":"산헤립"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":25,"s":"성전을 수리하다가 율법책을 발견하게 된 때의 유다 왕은 누구인가? (왕하22장) ( )","a":"요시야"},{"t":"OT","b":"열왕기상·하","y":"단답형","n":26,"s":"요시야 왕 때 성전을 수리하다가 발견된 율법책의 내용을 풀이 해주도록 요청을 받은 여선지자는 누구인가? (왕하22:14) ( )","a":"훌다"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":1,"s":"\"누가 주의 이 많은 백성을 재판할 수 있사오리이까 듣는 마음을 종에게 주사 주의 백성을 재판하여 선악을 분별하게 하옵소서\"라고 기도한 자는 다윗이다(왕상3:9). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":2,"s":"솔로몬 왕은 아도니야를 따랐던 사람들 중에 제사장 아비아달과 요압 장군을 처형시켰다(왕상2:27, 29). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":3,"s":"예루살렘을 떠나지 말라는 솔로몬 왕의 명령을 어기고 종을 찾으려고 가드까지 갔다가 발각되어 처형을 당한 자는 시므이이다(왕상2:36-46). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":4,"s":"이스라엘의 영토가 유브라데 강에서부터 블레셋 사람의 땅에 이르기까지와 애굽 지경에 미치기까지 이른 때는 요시야 왕 때이다(왕상4:21). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":5,"s":"솔로몬이 성전을 건축하기 시작한 때는 이스라엘 자손이 애굽 땅에서 나온 지 사백팔십년 때요, 솔로몬의 왕이 된 지 사년이 되던 때이다(왕상6:1). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":6,"s":"솔로몬 왕이 배를 건조한 곳은 에시온게벨이다(왕상9:26). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":7,"s":"예루살렘에서 은을 돌 같이 흔하게 하고 백향목을 평지의 뽕나무 같이 많게 한 왕은 다윗 왕이다(왕상10:27). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":8,"s":"솔로몬의 왕위를 이어받아 남쪽 유다의 왕이 된 자는 여로보암이다(왕상11:43). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":9,"s":"시돈 왕 엣바알의 딸이요 아합 왕의 아내로서 이스라엘에 바알과 아세라 우상을 퍼뜨린 자는 이세벨이다(왕상16:31-33). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":10,"s":"여호와께서 여호수아에게 예언한 바대로, 아합 왕 때에 여리고를 건축하는 동안 그 터를 쌓을 때에 맏아들 아비람을 잃고 그 성문을 세울 때에 막내 아들 스굽을 잃게 된 자는 히엘이다(왕상16:34). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":11,"s":"수넴 여인은 가뭄이 든 때에 얼마 남지 않은 재료들로 엘리야에게 작은 떡 하나를 제공하였다가 통에 가루가 떨어지지 아니하고 병의 기름이 없어지지 않는 약속을 받고, 죽은 아들이 살아나는 기적을 체험하게 되었다(왕상17:8-24). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":12,"s":"수년 동안의 가뭄을 예언하고 난 후에 그릿 시냇가에 머문 엘리야에게 하나님께서 비둘기를 통해서 떡과 고기를 가져오게 하셨다(왕상17:6). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":13,"s":"아람과의 전쟁에서 살아남기 위해 유다의 여호사밧 왕에게 자기의 군복을 입게 만들고 자신은 변장을 하였지만 한 사람이 무심코 당긴 화살에 맞아 죽게 된 자는 오므리이다(왕상22:29-36). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":14,"s":"다락 난간에서 떨어져 병든 아하시야가 에그론의 신 바알세불에게 병이 낫겠는지 묻자, 그 소식을 듣고 \"네가 올라간 침상에서 내려오지 못할지라 네가 반드시 죽으리라\"라고 예언한 자는 엘리사이다(왕하1:4). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":15,"s":"불수레와 불말을 타고 승천한 자는 엘리사이다(왕하2:11). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":16,"s":"작은 방을 담 위에 만들고 침상과 책상과 의자와 촛대를 두고 엘리사로 하여금 머물게 하고 음식을 제공한 여인은 사르밧 여인이다(왕하4:8-10). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":17,"s":"나병으로부터 낫게 된 나아만이 은 두 달란트와 옷 두 벌을 주자 그것을 감추어 두었다가 엘리사에게 저주를 받아 나병이 들게 된 엘리사의 종은 게하시이다(왕하5:27). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":18,"s":"사마리아를 포위한 아람인들이 도주한 사실을 사마리아 성내에 전한 자들은 나병환자 들이다(왕하7:3). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":19,"s":"아합과 이세벨의 딸이요, 유다 왕 여호람의 아내이자 아하시야의 어머니로서 왕의 자손들을 죽이고 섭정한 사람은 아달랴이다(왕하11장). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":20,"s":"유다 왕 요아스가 선정을 하도록 교훈했던 대제사장은 여호야다이다(왕하12:2). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":21,"s":"여로보암 2세의 아들 스가랴를 반역하여 쳐죽이고 이스라엘의 왕이 되었지만 한 달만에 므나헴에 의해 죽임을 당한 자는 살룸이다(왕하15:13). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":22,"s":"히스기야 왕 때 유다를 침공한 앗수르의 왕은 산헤립이다(왕하18:13). (O,X)","a":"O"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":23,"s":"병든 히스기야 왕이 십오 년을 더 살게 될 것을 예언한 선지자는 예레미야이다(왕하20:6). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":24,"s":"애굽의 왕 느고가 앗수르 왕을 치고자 하여 유브라데 강으로 올라가므로 맞서 나가 느고와 싸우다가 므깃도에서 죽게 된 유다의 왕은 여호야긴 왕이다(왕하23:29). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":25,"s":"여호야김의 아들로, 바벨론의 이차 침입 때에 바벨론으로 끌려간 유다의 왕은 여호아하스이다(왕하24:6). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"진위형","n":26,"s":"느부갓네살 왕이 예루살렘을 함락시킨 후에 그곳의 지도자로 세운 자는 그달리야이다(왕하25:22). (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"선택형","n":1,"s":"역대기에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["아담으로부터 시작한다","포로가 된 이스라엘과 유다인들이 돌아가는 것을 허락한 고레스의 칙령으로 끝난다","사무엘서와 열왕기서에 나와 있는 왕들의 시대가 다시 한 번 다루어진다","사무엘서와 열왕기서에 나와 있는 기록들에 전혀 변화를 주지 않고 같은 기록을 담고 있다"],"a":"4"},{"t":"OT","b":"역대기상·하","y":"선택형","n":2,"s":"역대상의 다윗에 대한 기록으로 옳지 않은 것은 무엇인가? (대상11:1-9)","c":["하나님의 언약궤를 예루살렘으로 옮긴다","다윗은 벧엘에 지지 기반을 둔 왕이다","다윗은 블레셋, 모압, 소바, 다메섹에 승리한다","왕이 되어 예루살렘을 정복한다"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":3,"s":"성전 건축을 준비하면서 조직된 성전 봉사자들에 속하지 않는 직임은 누구인가? (대상22-26장)","c":["문지기","노래하는 자들","성전 곳간 맡는 자","예언자"],"a":"4"},{"t":"OT","b":"역대기상·하","y":"선택형","n":4,"s":"솔로몬에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["역대기에는 그의 어머니 밧세바와 아버지 다윗 간에 있었던 불륜사건이 잘 기록되어있다","그는 하나님께 지혜를 구하여서 크게 칭찬을 받는다","하나님께 성전을 처음 봉헌하는 왕이었다","스바 여왕이 그의 명성을 듣고 찾아온다"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":5,"s":"이스라엘의 분열 과정에 대한 설명으로 옳지 않은 것은 무엇인가? (대하10장)","c":["솔로몬이 과도한 세금 및 노역의 멍에를 지웠기 때문에, 그의 아들 르호보암은 그 짐을 가볍게 해달라는 요구를 받는다","르호보암은 그 요구를 신중히 검토하여 받아들인다","르호보암은 원로들의 말보다 젊은 신하들의 말을 더 따랐다","원로들은 르호보암에게 그 백성들을 기쁘게 해주라도 조언하였다"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":6,"s":"아사왕에 대한 기록으로 옳지 않은 것은 무엇인가? (대하14-16장)","c":["아사가 왕이 되어 십년간 땅에 평화가 있었다","아사의 큰 과오는 우상을 제거하지 않았다는 것이다","구스의 세라가 쳐들어 오지만 싸워 이긴다","아사는 선견자 하나니에게 책망을 받는다"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":7,"s":"역대하 18장의 선지자 미가야 이야기는 고대 이스라엘 예언사 연구에 있어서 참선지자와 거짓 선지자 간의 갈등을 연구하는 좋은 자료이다. 이 이야기에 대한 설명 중 잘못 된 것은 무엇인가?","c":["미가야의 예언은 아합의 죽음을 예고한 참 예언이었다","미가야는 천상에서 하나님과 영들 간의 대화를 들었던 참 선지자다","아합의 거짓 선지자들은 바알의 악한 영에 이끌리어 예언하였다","천상의 영이 거짓말 하는 영으로 자원하여 선지자들에게 들어갔다"],"a":"3"},{"t":"OT","b":"역대기상·하","y":"선택형","n":8,"s":"웃시야 왕에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["블레셋에 승리도 하고 건축 활동을 하고 큰 군대를 지닐 만큼 강한 왕이었다","웃시야에 대한 행적은 선지자 이사야가 기록하였다","이방 산당을 많이 세워 하나님께 징계를 받는다","하나님의 징계로 문둥병에 걸린다"],"a":"3"},{"t":"OT","b":"역대기상·하","y":"선택형","n":9,"s":"히스기야 왕의 때에 일어난 일들로서 옳지 않은 것은 무엇인가? (대하 29-32장)","c":["앗수르 인들의 침입을 받았다","앗수르의 산헤립이 침공하였으나 예루살렘은 무너지지 않았다","선한 왕이었으나 산당들은 부수지 못하였다","성전 의식과 규례를 새롭게 하였다"],"a":"3"},{"t":"OT","b":"역대기상·하","y":"선택형","n":10,"s":"제의적 개혁을 일으켰던 히스기야의 아들 므낫세에 대한 설명으로 옳은 것은 무엇인가?","c":["아버지와는 달리 허문 산당들을 다시 세웠다","점술과 신접하는 자를 극히 혐호하였다","포로가 되어 이집트에 끌려 갔다","포로로 끌려가 비참하게 죽는다"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":11,"s":"역대하에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["솔로몬부터 유다의 마지막 왕들에 대한 기록이 담겨있다","맨 마지막의 이야기는 예루살렘이 무너져 유다 백성이 포로로 잡혀가는 기록이다","하나님께 악한 일을 한 왕들의 기록은 나오지 않는다","하나님께 선한 일을 한 왕들의 기록만 나온다"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":12,"s":"역대기에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["다윗 왕조에 대한 이야기가 많이 있다","사무엘서와 열왕기서에 있는 왕가의 역사가 역대기에 다시 나온다","엘리야-엘리사 이야기가 주요하게 다루어진다","다윗과 밧세바가 부정을 저지른 이야기는 나오지 않는다"],"a":"3"},{"t":"OT","b":"역대기상·하","y":"선택형","n":13,"s":"역대기서가 강조하고 있지 않는 것은 무엇인가?","c":["성전","제사장직","유다의 신정적인 다윗 왕조","희년제도"],"a":"4"},{"t":"OT","b":"역대기상·하","y":"선택형","n":14,"s":"\"온 이스라엘이 그 계보대로 계수되어 그들은 이스라엘 왕조실록에 기록되니라 유다가 범죄함으로 말미암아 바벨론으로 사로잡혀 갔더니, 그들의 땅 안에 있는 성읍에 처음으로 거주한 이스라엘 사람들은 ( )들과 ( ) 사람들과 느디님 사람들이라\" 괄호 안에 각각 맞는 말은 무엇인가? (대상9:1-2)","c":["제사장, 레위","제사장, 유다","서기관, 레위","선지자, 레위"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":15,"s":"\"또 찬송하는 자가 있으니 곧 ( ) 우두머리라 그들은 골방에 거주하면서 주야로 자기 직분에 전념하므로 다른 일은 하지 아니하였더라\" 괄호 안에 맞는 말은 무엇인가? (대상9:33)","c":["유다","레위","예루살렘","성전"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":16,"s":"'다윗성' (대상11:4-5) 에 대한 설명으로 옳지 않는 것은 무엇인가?","c":["시온산성이라고도 불렸다","예루살렘에 있다","그곳에는 여부스 원주민들이 살았었다","다윗이 오자 여부스인들이 환영하며 성을 넘겼다"],"a":"4"},{"t":"OT","b":"역대기상·하","y":"선택형","n":17,"s":"하나님이 다윗으로 하여금 성전을 짓게 하지 못하게 하신 이유로서 맞지 않는 것은 무엇인가? (대상22:8)","c":["피를 많이 흘리게 하였음으로","크게 전쟁을 하였기 때문에","밧세바와의 부정한 관계 때문에"],"a":"3"},{"t":"OT","b":"역대기상·하","y":"선택형","n":18,"s":"\"… 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길지어다 여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니 네가 만일 그를 찾으면 만날 것이요 만일 네가 그를 버리면 그가 너를 영원히 버리시리라\" 이 구절은 누가 누구에게 한 말씀인가? (대상28:9)","c":["하나님이 다윗에게","다윗이 솔로몬에게","다윗이 그의 군대 장관 요압에게","나단 선지자가 다윗에게"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":19,"s":"역대기의 원자료에 속하는 기록이 아닌 것은 무엇인가?","c":["이스라엘과 유다왕 역대 지략","열왕기 주석","선견자 사무엘, 선지자 나단, 선견자 갓의 글","선지자 미가야가 기록한 웃시아 왕에 대한 기록"],"a":"4"},{"t":"OT","b":"역대기상·하","y":"선택형","n":20,"s":"밤에 여호와께서 솔로몬에게 나타나셔서 하신 말씀이다. \"혹 내가 하늘을 닫고 비를 내리지 아니하거나 혹 메뚜기들에게 토산을 먹게 하거나 혹 전염병이 내 백성 가운데에 유행하게 할 때에\"이 다음에 오는 구절은 어떤 것인가? (대하7:13)","c":["내 이름으로 일컫는 내 백성이 그들의 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 찾으면 내가 하늘에서 듣고 그들의 죄를 사하고 그들의 땅을 고칠지라","내가 너희에게 준 땅에서 그 뿌리를 뽑아내고 내 이름을 위하여 거룩하게 한 이 성전을 내 앞에서 버려 모든 민족 중에 속담거리와 이야깃거리가 되게 하리니"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":21,"s":"역대하 5장에서, 성전에 언약궤가 모셔질 때 하나님께 찬송하던 상황으로 맞지 않는 것은 무엇인가? (대하5:13-14)","c":["'선하시도다 그의 자비하심이 영원히 있도다' 라고 찬양하였다","악기 연주는 절대 금하고 목소리로만 찬양하였다","여호와의 전에 구름이 가득하였다","제사장이 그 구름 때문에 제대로 서서 섬기지 못하였다"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"선택형","n":22,"s":"르호보암왕 때에 나라가 둘로 갈라졌다. 이에 대한 역대기서의 설명이 아닌 것은 무엇인가?","c":["이 일은 전적으로 르호보암의 잘못된 결정 때문에 말미암은 것이다","여호와께서 전에 여로보암에게 이르신 말씀을 응하게 하심이다","르호보암이 원로들의 말을 따르지 않았다","북쪽 지역은 여로보암이 다스리게 되었다"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":23,"s":"아마샤는 왕이 된 후 자신의 아버지를 죽인 신복들을 죽였지만 그 자식들은 죽이지 않았다. 그 이유는 무엇인가? (대하25:4)","c":["모세 율법책에 '자녀로 말미암아 아버지를 죽이지 말 것이요 아버지로 말미암아 자녀를 죽이지 말 것이라 오직 각 사람은 자기의 죄로 말미암아 죽을 것이니라' 라는 기록을 따랐기 때문","모세 십계명에 '살인하지 말라' 라는 말씀을 따랐기 때문","'이웃을 사랑하라' 는 율법책의 말씀을 따랐기 때문","'아버지가 신 포도를 먹었으므로 아들들의 이가 시다 하지 아니하겠고' 라는 예언자의 말씀을 따랐기 때문"],"a":"1"},{"t":"OT","b":"역대기상·하","y":"선택형","n":24,"s":"다음의 장엄하고 아름다운 장면은 무엇을 묘사한 것인가? \"레위 사람은 다윗의 악기를 잡고 제사장은 나팔을 잡고 서매, 히스기야가 명령하여 번제를 제단에 드릴새 번제 드리기를 시작하는 동시에 여호와의 시로 노래하고 나팔을 불며 이스라엘 왕 다윗의 악기를 울리고, 온 회중이 경배하며 노래하는 자들은 노래하고 나팔 부는 자들은 나팔을 불어 번제를 마치기까지 이르니라\"(대하29:26-28).","c":["예루살렘 성전에서의 제관식","예루살렘 성전에서의 제사","산당에서의 제사","성막에서의 제사"],"a":"2"},{"t":"OT","b":"역대기상·하","y":"완성형","n":1,"s":"역대기는 사무엘서와 ( )서와 평행되는 왕들 중심의 이야기들이 많이 담겨져 있다.","a":"열왕기"},{"t":"OT","b":"역대기상·하","y":"완성형","n":2,"s":"역대상 13장부터 16장에는 다윗이 점령한 예루살렘으로 하나님의 ( )를 들여오는 기념비적인 사건을 다루고 있다.","a":"(언약)궤"},{"t":"OT","b":"역대기상·하","y":"완성형","n":3,"s":"솔로몬은 하나님 앞에 이것을 구한 것으로 유명하다. 다음 구절을 완성하여 이것이 무엇인지 밝히시오. \"주는 이제 내게 ( )와 지식을 주사 이 백성 앞에서 출입하게 하옵소서 이렇게 많은 주의 백성을 누가 능히 재판하리이까 하니\"(대하1:10).","a":"지혜"},{"t":"OT","b":"역대기상·하","y":"완성형","n":4,"s":"웃시야 왕은 제사장을 기다리지 못하고 자신이 분향을 하였다가 하나님의 징계를 받는다. 그가 그런 행동을 한 이유가 다음 구절에 나온다. 괄호 안을 채우시오. \"그가 강성하여지매 그의 마음이 ( )하여 악을 행하여 그의 하나님 여호와께 범죄하되 곧 여호와의 성전에 들어가서 향단에 분향하려 한지라\"(대하26:16).","a":"교만"},{"t":"OT","b":"역대기상·하","y":"완성형","n":5,"s":"( )왕 때 큰 제의적 개혁이 일어나 산당을 부수었으며, 앗수르의 산헤립이 침공하나 무너뜨리지 못하였다(대하29-32장).","a":"히스기야"},{"t":"OT","b":"역대기상·하","y":"완성형","n":6,"s":"\"내가 영원히 그를 내 집과 내 나라에 세우리니 그의 왕위가 영원히 견고하리라 하셨다 하라\"이 말씀은 하나님이 ( )에게 하신 약속이며, 여기에 '그' 는 ( ) 이다(대상17:14).","a":"다윗, 솔로몬"},{"t":"OT","b":"역대기상·하","y":"완성형","n":7,"s":"… ( )은 장자라도 그의 아버지의 침상을 더럽혔으므로 장자의 명분이 이스라엘의 아들 ( )의 자손에게로 돌아가서 족보에 장자의 명분대로 기록되지 못하였느니라. 유다는 형제보다 뛰어나고 주권자가 유다에게서 났으나 장자의 명분은 ( )에게 있으니라(대상 5:1-2)","a":"르우벤, 요셉, 요셉"},{"t":"OT","b":"역대기상·하","y":"완성형","n":8,"s":"( )이 죽은 것은 여호와께 범죄하였기 때문이라 그가 여호와의 말씀을 지키지 아니하고 또 신접한 자에게 가르치기를 청하고, 여호와께 묻지 아니하였으므로 여호와께서 그를 죽이시고 그 나라를 이새의 아들 ( )에게 넘겨 주셨더라(대상10:13-14).","a":"사울, 다윗"},{"t":"OT","b":"역대기상·하","y":"완성형","n":9,"s":"다음 구절은 역대상의 핵심적 구절 중 하나이다. 괄호 안을 채우시오. \"… 사람에게 영원히 주의 이름을 높여 이르기를 만군의 ( )는 이스라엘의 하나님 곧 이스라엘에게 하나님이시라 하게 하시며 주의 종 ( )의 왕조가 주 앞에서 견고히 서게 하옵소서\"(대상17:24).","a":"여호와, 다윗"},{"t":"OT","b":"역대기상·하","y":"완성형","n":10,"s":"역대기가 강조하고 있는 두 요소를 잘 드러내는 다음 구절의 괄호 안을 채우시오. 하나님이 솔로몬에게 하신 말씀이다. \"( )을 택하여 내 이름을 거기 두고 또 ( )을 택하여 내 백성 이스라엘을 다스리게 하였노라 하신지라\"(대하6:6).","a":"예루살렘, 다윗"},{"t":"OT","b":"역대기상·하","y":"완성형","n":11,"s":"… 너희가 ( )하는 것이 사람을 위하여 할 것인지 여호와를 위하여 할 것인지를 잘 살피라 너희가 ( )할 때에 여호와께서 너희와 함께 하심이니라. 그런즉 너희는 여호와를 두려워하는 마음으로 삼가 행하라 우리의 하나님 여호와께서는 불의함도 없으시고 치우침도 없으시고 뇌물을 받는 일도 없으시니라 하니라(대하19:6-7).","a":"재판(여호사밧이 재판관들을 세운 후 하였던 말)"},{"t":"OT","b":"역대기상·하","y":"완성형","n":12,"s":"여호사밧 왕 때에 모압이 유다를 쳐들어오자 야하시엘이 한 말이다. 괄호 안을 채우시오. \"너희는 이 큰 무리로 말미암아 두려워하거나 놀라지 말라 이 ( )은 너희에게 속한 것이 아니요 ( )께 속한 것이니라\"(대하20:15).","a":"전쟁, 하나님"},{"t":"OT","b":"역대기상·하","y":"완성형","n":13,"s":"히스기야 왕 때에 있었던 일이다. 괄호 안을 채우시오. \"유다 온 회중과 제사장들과 레위 사람들과 이스라엘에서 온 모든 회중과 이스라엘 땅에서 나온 ( )들과 유다에 사는 ( )들이 다 즐거워하였으므로, 예루살렘에 큰 기쁨이 있었으니 이스라엘 왕 다윗의 아들 솔로몬 때로부터 이러한 기쁨이 예루살렘에 없었더라\"(대하30:25-26).","a":"나그네"},{"t":"OT","b":"역대기상·하","y":"완성형","n":14,"s":"\"( )가 온 유다에 이같이 행하되 그의 하나님 여호와 보시기에 선과 정의와 진실함으로 행하였으니 그가 행하는 모든 일 곧 하나님의 전에 수종드는 일에나 율법에나 계명에나 그의 하나님을 찾고 한 마음으로 행하여 형통하였더라\"제의적 개혁을 일으켰던 이 왕은 누구인가? (대하31:20-21).","a":"히스기야"},{"t":"OT","b":"역대기상·하","y":"단답형","n":1,"s":"역대상은 아담부터 다윗까지의 역사가 담겨져 있는데, 무려 10장부터 마지막 29장 까지는 한 인물의 이야기만 나온다. 그는 누구인가? ( )","a":"다윗"},{"t":"OT","b":"역대기상·하","y":"단답형","n":2,"s":"역대상 11장에서 왕이 된 다윗은 먼저 여부스인들의 땅을 차지하는 공헌을 세운다. 유명한 이 곳 지명은 무엇인가?","a":"예루살렘"},{"t":"OT","b":"역대기상·하","y":"단답형","n":3,"s":"다윗은 성전 건축을 위한 재료를 준비하였다. 실질적 건축은 누구에게 위임하는가? ( )","a":"솔로몬(대상22:2-19; 28:1-21)"},{"t":"OT","b":"역대기상·하","y":"단답형","n":4,"s":"이스라엘은 북쪽 지역과 남쪽지역의 갈등이 고조되어 결국 분열한다. 어느 왕이 죽고 나서 분열하는가?(대하10-12장) ( )","a":"솔로몬"},{"t":"OT","b":"역대기상·하","y":"단답형","n":5,"s":"솔로몬이 성전을 건축한 후 이것을 성전 안에 들여오자 성전이 하나님의 영광으로 가득 찼다. 이것은 무엇인가?(대하5) ( )","a":"(언약)궤"},{"t":"OT","b":"역대기상·하","y":"단답형","n":6,"s":"아합의 집을 멸하고 아하시야를 죽였던 인물은 누구인가?(대하22) ( )","a":"예후"},{"t":"OT","b":"역대기상·하","y":"단답형","n":7,"s":"아하시야의 어머니로서 아들이 죽은 후 유다 집의 왕가 씨를 전멸하려 하였고 나라를 다스렸던 여인은 누구인가? ( )","a":"아달랴"},{"t":"OT","b":"역대기상·하","y":"단답형","n":8,"s":"율법책을 발견 한 후 크게 종교적 개혁을 일으켰던 왕은 누구인가? ( )","a":"요시야"},{"t":"OT","b":"역대기상·하","y":"단답형","n":9,"s":"다음 구절은 다윗의 찬송이다. \"그의 성호를 자랑하라 ( )를 구하는 자마다 마음이 즐거울지로다\"마음이 즐거우려면 무엇/누구를 구해야만 하는가? 괄호에 맞는 말은?(대상16:10)","a":"여호와"},{"t":"OT","b":"역대기상·하","y":"단답형","n":10,"s":"유다의 가장 악한 왕으로 알려져 있으며 온 나라에 우상과 제단을 세우나, 앗수르에 의해 포로로 잡혀간 뒤 회개하고 다시 돌아오게 된 왕은 누구인가? ( )","a":"므낫세"},{"t":"OT","b":"역대기상·하","y":"진위형","n":1,"s":"역대기는 사무엘서나 열왕기서처럼 아담부터 시작하는 족보가 서두에 나온다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":2,"s":"역대기상에는 다윗 이야기가 많은 부분을 차지하는데 그 중에서도 그의 성전 건축 준비 이야기가 많이 있다. (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":3,"s":"역대상 11장에서 다윗은 그의 혈족이 많이 있는 예루살렘에서 왕으로 등극한다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":4,"s":"역대상 15-16장에 따르면, 하나님의 궤를 예루살렘으로 옮겨오는 것은 특별히 유다인들의 몫이었다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":5,"s":"다윗은 역대상 21-22장에서 인구조사를 하였다가 하나님으로부터 벌을 받는다. 그런데 다윗이 인구조사를 하도록 격동한 것은 바로 하나님이셨다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":6,"s":"성전 안에 하나님의 언약궤가 들어왔을 때 그리고 솔로몬이 성전 봉헌 기도를 마쳤을 때 하나님의 영광이 성전 안에 가득하게 되었다. (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":7,"s":"성전 봉헌 후 역대하 7장에 하나님이 솔로몬에게 하신 약속은 무조건적인 축복을 약속하는 은혜의 약속이었다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":8,"s":"아합왕의 죽음은 이믈라의 아들이었던 선지자 미가야에 의해 예견되었다. (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":9,"s":"아합왕이 전쟁에 나가기 전 왕에게 전쟁에 승리할 것이라는 거짓 예언을 한 이들은 모두 바알 선지자들이었다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":10,"s":"성전을 보수하였던 요아스 왕은 평안히 죽어 열조에게로 돌아갔다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":11,"s":"역대하 15:19에서는 아사왕의 통치 기간에 전쟁이 없었다고 전하나, 열왕기상 15:16에는 전쟁이 있었음을 시사한다. (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":12,"s":"\"( )가 이스라엘 하나님께 아뢰어 이르되 주께서 내게 복을 주시려거든 나의 지역을 넓히시고 주의 손으로 나를 도우사 나로 환난을 벗어나 내게 근심이 없게 하옵소서 하였더니 하나님이 그가 구하는 것을 허락하셨더라\" ( ) 안에 들어갈 인물의 이름은 야베스 이다(대상4:10). (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":13,"s":"백성을 계수하고 나서 하나님의 징벌을 백성들이 받게 되자 다윗은 하나님이 자기와 자기 집을 먼저 치고 그 다음 백성에게는 재앙을 내려달라고 하나님께 말하였다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":14,"s":"성전을 주요 주제로 다루고 있는 역대기 서는 책의 마지막에 성전의 멸망을 기록함으로 말미암아 악한 백성의 참혹한 결말을 일깨워준다. (O,X)","a":"X"},{"t":"OT","b":"역대기상·하","y":"진위형","n":15,"s":"여호사밧이 일으킨 제의적 개혁 중에는 모든 성읍을 돌며 여호와의 율법책을 가르치는 일도 있었다. (O,X)","a":"O"},{"t":"OT","b":"역대기상·하","y":"진위형","n":16,"s":"여호사밧은 선견자 예후로부터 \"왕이 악한 자를 돕고 여호와를 미워하는 자들을 사랑하는 것이 옳으니이까\"라는 책망을 받았다. (O,X)","a":"O"},{"t":"OT","b":"에스라","y":"선택형","n":1,"s":"다음 중 예루살렘의 예배 회복과 성전의 재건이 중심적 주제가 아닌 책은 무엇인가?","c":["에스라서","학개서","아모스서","스가랴서"],"a":"3"},{"t":"OT","b":"에스라","y":"선택형","n":2,"s":"다음 중 이방인들에 대하여 다른 시각을 가진 책은 무엇인가?","c":["에스라서","룻기","느헤미야"],"a":"2"},{"t":"OT","b":"에스라","y":"선택형","n":3,"s":"에스라서의 내용으로 옳지 않은 것은 무엇인가?","c":["유다 총독 세스바살이 성전 보물을 가지고 귀환한다","고향으로 돌아 온 자들의 명단이 나온다","성전 건축에 사마리아 사람들도 참여한다","제단을 복구하고 첫 번째 제사를 드린다"],"a":"3"},{"t":"OT","b":"에스라","y":"선택형","n":4,"s":"에스라에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["아닥사스 왕의 특별 전권을 가지고 예루살렘으로 오다","율법을 위임 받은 자이다","이방인과의 혼합 결혼에 탄식한다","사자 굴에 들어갔으나 하나님의 도움으로 살아나온다"],"a":"4"},{"t":"OT","b":"에스라","y":"선택형","n":5,"s":"에스라서에 나오는 포로 귀환에 대한 설명 중 옳지 않는 것은 무엇인가?","c":["스룹바벨이 성전 재건을 위하여 포로를 이끌고 귀환한다","에스라의 인도하에 귀환한다","두 차례 귀환은 모두 스룹바벨이 인도하고, 에스라는 영적인 지도만 한다","먼저 스룹바벨이, 그 다음은 에스라의 인도로 귀환한다"],"a":"3"},{"t":"OT","b":"에스라","y":"선택형","n":6,"s":"바사(페르시아)왕 고레스가 포로된 이스라엘 백성의 귀환을 허락하였다. 이스라엘은 어디/누구에게 포로 잡혀 있었는가?","c":["이집트","바벨론","헬라제국","블레셋"],"a":"2"},{"t":"OT","b":"에스라","y":"선택형","n":7,"s":"다음 중 시대적 배경이 어울리지 않는 한 인물은 누구인가?","c":["스룹바벨","이사야","에스라","느헤미야"],"a":"2"},{"t":"OT","b":"에스라","y":"선택형","n":8,"s":"에스라서의 주요 주제로서 어울리지 않는 것은 무엇인가?","c":["바사 왕국의 압제에 저항","예루살렘 성전의 회복","이스라엘 귀환 공동체의 영적, 도덕적, 사회적 회복"],"a":"1"},{"t":"OT","b":"에스라","y":"선택형","n":9,"s":"에스라서에 기록된 성전 재건에 대한 설명 중 옳지 않은 것은 무엇인가?","c":["온 이스라엘 전체가 합심하여 성전 재건을 빠르게 이룩한다","처음 스룹바벨의 인도하에 재건 사업을 벌인다","선지자 학개와 스가랴도 백성들에게 성전 재건을 독려한다","다리오 왕은 고레스의 조서를 확인하고, 재건에 필요한 물자를 공급을 명한다"],"a":"1"},{"t":"OT","b":"에스라","y":"선택형","n":10,"s":"다음 괄호 안에 들어갈 인물은 누구인가? \"요사닥의 아들 ( )와 그의 형제 제사장들과 스알디엘의 아들 스룹바벨과 그의 형제들이 다 일어나 이스라엘 하나님의 제단을 만들고 하나님의 사람 모세의 율법에 기록한 대로 번제를 그 위에서 드리려 할새\"(스3:2).","c":["에스라","학개","예수아","느헤미야"],"a":"3"},{"t":"OT","b":"에스라","y":"선택형","n":11,"s":"바벨론 망명 생활에서 돌아와 이스라엘 백성이 처음으로 드린 절기는 무엇인가? (스3:4)","c":["초막절","유월절","무교절","칠칠절"],"a":"1"},{"t":"OT","b":"에스라","y":"선택형","n":12,"s":"성전 건축을 방해하는 자들이 바사의 아닥사스왕에게 고발한 음해 내용이 아닌 것은 무엇인가? (스4:11-16)","c":["유다 사람들이 조공과 관세, 통행세를 내지 않을 것이다","유다 사람들이 반역 할 것이다","유다가 곧 이집트와 연합할 것이다","왕의 건너 편 땅이 없어질 것이다"],"a":"3"},{"t":"OT","b":"에스라","y":"선택형","n":13,"s":"이스라엘 길조들이 바벨론에서 예루살렘으로 돌아오면서 아하와 강가에서 한 일은 무엇인가? (스8:21)","c":["이방 여인들을 다 버렸다","성전 재건을 위한 계획을 세웠다","찬양하고 먹고 마시며 즐거워했다","에스라가 금식을 선포하고 평탕한 길을 하나님께 간구하였다"],"a":"4"},{"t":"OT","b":"에스라","y":"완성형","n":1,"s":"에스라 1:3에서 바사의 고레스는 다음과 같이 선포한다. 괄호 안에 맞는 말은 무엇인가? \"이스라엘의 하나님은 참 신이시라 너희 중에 그의 백성 된 자는 다 유다 ( )으로 올라가서 이스라엘의 하나님 여호와의 성전을 건축하라 그는 ( )에 계신 하나님이시라\"","a":"예루살렘"},{"t":"OT","b":"에스라","y":"완성형","n":2,"s":"에스라가 여호와의 ( )을 연구하여 준행하며 율례와 규례를 이스라엘에게 가르치기로 결심하였었더라(스7:10).","a":"율법"},{"t":"OT","b":"에스라","y":"완성형","n":3,"s":"바사 왕 고레스 원년에 여호와께서 ( )의 입을 통하여 하신 말씀을 이루게 하시려고 바사 왕 고레스의 마음을 감동시키시매 그가 온 나라에 공포도 하고 조서도 내려 이르되(스1:1)","a":"예레미야"},{"t":"OT","b":"에스라","y":"단답형","n":1,"s":"포로로 잡혀간 이스라엘 백성이 다시 귀환하여 성전을 지을 수 있도록 허락한 왕은 누구인가? ( )","a":"고레스"},{"t":"OT","b":"에스라","y":"단답형","n":2,"s":"예루살렘 성전 재건이 방해 받을 때에 유다인들에게 예언하여 성전을 계속 건축하게 하였던 두 선지자는 누구인가? (스5:1-5) ( )","a":"학개, 스가랴"},{"t":"OT","b":"에스라","y":"단답형","n":3,"s":"에스라 6장에 성전 봉헌을 하고 치룬 유대교 절기 행사는 무엇인가? ( )","a":"유월절"},{"t":"OT","b":"에스라","y":"단답형","n":4,"s":"에스라 6장의 유월절 행사 외에 에스라 3장 4절과 느헤미야 8장 13-18절에 보도되는 또 다른 절기 축제는 무엇인가? ( )","a":"초막절"},{"t":"OT","b":"에스라","y":"진위형","n":1,"s":"에스라서는 바벨론 유배 기간 동안의 일들을 기록한 것이고 느헤미야서는 유배 이후의 일들을 기록한 것이다. (O,X)","a":"X"},{"t":"OT","b":"에스라","y":"진위형","n":2,"s":"이사야는 이방인들도 하나님의 성회에 들어올 수 있으며 그래서 하나님의 집은 \"만민이 기도하는 집\"이라고 말하고 있다. 마찬가지로 에스라도 이방인들을 적극 수용하려 하였다. (O,X)","a":"X"},{"t":"OT","b":"에스라","y":"진위형","n":3,"s":"구약 성서에서 에스라서와 다니엘서는 중간에 아람어로 기록된 비교적 긴 본문을 지니고 있다. (O,X)","a":"O"},{"t":"OT","b":"에스라","y":"진위형","n":4,"s":"사마리아 사람들이 바사 왕에게 예루살렘과 유다 주민에 대한 부정적 서신을 보낸 이유는 그들이 성전을 혐오하기 때문이다(스4:1-10). (O,X)","a":"X"},{"t":"OT","b":"에스라","y":"진위형","n":5,"s":"이스라엘 백성이 유월절 절기를 치룬 기록은 에스라 6장이 유일한 기록이다. (O,X)","a":"X"},{"t":"OT","b":"에스라","y":"진위형","n":6,"s":"기독교 정경 속에 에스라서는 역대하 다음에 이어지는데, 두 책은 내용상 볼 때에 시간적으로 잘 이어진다. (O,X)","a":"O"},{"t":"OT","b":"에스라","y":"진위형","n":7,"s":"에스라서는 역대기서처럼 제사장적 관점이 강하게 부각되어 있으며, 특히 에스라 자신이 아론의 직계 후손이다(스7:1-5 참조). (O,X)","a":"O"},{"t":"OT","b":"에스라","y":"진위형","n":8,"s":"바사왕 다리오가 다시 성전 건축을 허락하게 된 것은 고레스 왕의 조서에 근거하여 조사하였기 때문이다(스6:8). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"선택형","n":1,"s":"다음 중 에스라서와 느헤미야서의 공통점이 아닌 것은 무엇인가?","c":["성전 재건을 중요시 한다","이방인 척결을 중요시 한다","바벨론 포로기 이후의 사건을 다루고 있다","제사나 절기, 희생제물보다 공의와 정의, 진정한 심령을 칭송한다"],"a":"4"},{"t":"OT","b":"느헤미야","y":"선택형","n":2,"s":"느헤미야서의 내용으로 옳지 않은 것은 무엇인가?","c":["예루살렘 성전 재건이 그 중심에 있다","성곽 건축을 마치기까지 얼마나 어려웠는지 보고한다","성의 문을 세우기 전에 에스라에 의해 율법이 낭송된다","안식일 같은 형식적인 신앙 행태는 비난 받았다"],"a":"4"},{"t":"OT","b":"느헤미야","y":"선택형","n":3,"s":"느헤미야에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["아닥사스왕은 신하 느헤미야에게 휴가를 허락하여 예루살렘에 가도록 한다","성벽 건축을 위한 전권을 부여 받는다","총독으로서 녹을 받아 성전을 위해 사용했다","산발랏과 도비야의 조롱을 당한다"],"a":"3"},{"t":"OT","b":"느헤미야","y":"선택형","n":4,"s":"느헤미야의 개혁 내용이 아닌 것은 무엇인가? (느13)","c":["이방인들을 공동체에서 분리","십일조 폐기","레위인들의 수입 회복","안식일에 판매 금지"],"a":"2"},{"t":"OT","b":"느헤미야","y":"선택형","n":5,"s":"느헤미야에 대한 설명으로 옳지 않은 것은 무엇인가? (느2:1-10)","c":["성경에 따르면 에스라와 동시대 인물이다","바사 왕궁에서 왕에게 술 따르는 일을 하였다","이스라엘 포로들의 세 번째 예루살렘 귀환을 주도 하였다","예루살렘에 대한 열정 때문에, 바사왕의 허락도 없이 귀환한다"],"a":"4"},{"t":"OT","b":"느헤미야","y":"선택형","n":6,"s":"고레스 칙령 이 후 이스라엘 백성에게 생긴 변화가 아닌 것은 무엇인가?","c":["성전 재건","이스라엘 왕권 재립","예루살렘 복구","언약의 갱신"],"a":"2"},{"t":"OT","b":"느헤미야","y":"선택형","n":7,"s":"\"성벽 역사가 오십이일 만인 엘룰월 이십오일에 끝나매, 우리의 모든 대적과 주위에 있는 이방 족속들이 이를 듣고 다 두려워하여 크게 낙담하였으니 그들이 우리 하나님께서 이 역사를 이루신 것을 앎이니라.\" 위의 구절과 가장 관련이 가까운 인물은 누구인가? (느6:15-16)","c":["스룹바벨","에스라","느헤미야","학개"],"a":"3"},{"t":"OT","b":"느헤미야","y":"선택형","n":8,"s":"느헤미야서에서 이스라엘 백성이 성벽을 재건한 후 한 일이 아닌 것은 무엇인가? (느:8장)","c":["언약 갱신","초막절 행사","할례","금식하고 회개"],"a":"3"},{"t":"OT","b":"느헤미야","y":"선택형","n":9,"s":"다음 구절은 절기 행사의 아름다운 가치를 보여주는 구절이며 성벽 재건 후 있었던 초막절 행사에 대한 보고이다. 괄호 안에 알맞은 말은 무엇인가? (느8:12) \"모든 백성이 곧 가서 먹고 마시며 ( ) 크게 즐거워하니 이는 그들이 그 읽어 들려 준 말을 밝히 앎이라\"","c":["기도하고","찬양하고","춤을 추고","나누어 주고"],"a":"4"},{"t":"OT","b":"느헤미야","y":"선택형","n":10,"s":"처음 느헤미야가 앉아서 울고 수일 동안 슬퍼하며 금식했던 이유는? (느1:3)","c":["바벨론에게 예루살렘이 함락되어서","예루살렘 성은 허물어지고 성문들은 불탔다 하여","이스라엘 백성이 이방 여인들과 결혼하여","사랑하는 아들이 목숨을 잃어"],"a":"2"},{"t":"OT","b":"느헤미야","y":"선택형","n":11,"s":"성벽 공사로 형편이 어려워지자 백성들의 불평이 많았다. 이 때 느헤미야가 귀족들과 민장들에게 취한 내용 중 옳지 않은 것은 무엇인가? (느5:1-11)","c":["이방인들이 우리를 비방하는 것을 기억하고 하나님을 경외하는 가운데 행하자","이자 받기를 그치자","받은 것의 백분의 일을 돌려보내라","밭에서 이삭 줍는 것을 허락하라"],"a":"4"},{"t":"OT","b":"느헤미야","y":"선택형","n":12,"s":"느헤미야가 유다의 총독으로 있으면서 녹읍을 받지 않은 이유는 무엇인가? (느5:14-15)","c":["재정이 넉넉지 못하여","성전 재건에 집중하기 위해","하나님을 경외하기 때문에","성전 재건 반대파에게 책잡히지 않기 위해"],"a":"3"},{"t":"OT","b":"느헤미야","y":"선택형","n":13,"s":"재건된 예루살렘에 거주하게 된 자들이 아닌 사람은 누구인가? (느11:1-2)","c":["백성의 지도자","느헤미야가 선택한 자","제비 뽑힌 십분의 일의 백성"],"a":"2"},{"t":"OT","b":"느헤미야","y":"완성형","n":1,"s":"바벨론으로 부터의 이스라엘 포로 귀환은 세 차례 이루어졌다. 그 귀환을 이끈 지도자 세명을 순서대로 적어라. ( )","a":"스룹바벨, 에스라, 느헤미야"},{"t":"OT","b":"느헤미야","y":"완성형","n":2,"s":"느헤미야 8장에 기록된 초막절 행사를 지내는 장면이다. 괄호 안에 맞는 말을 적어라. (느8:7-9) \"예수아와 바니와 세레뱌와 야민과 악굽과 사브대와 호디야와 마아세야와 그리다와 아사랴와 요사밧과 하난과 블라야와 레위 사람들은 백성이 제자리에 서 있는 동안 그들에게 ( )을 깨닫게 하였는데, 하나님의 ( )책을 낭독하고 그 뜻을 해석하여 백성에게 그 낭독하는 것을 다 깨닫게 하니, 백성이 ( )의 말씀을 듣고 다 우는지라 총독 느헤미야와 제사장 겸 학사 에스라와 백성을 가르치는 레위 사람들이 모든 백성에게 이르기를 오늘은 너희 하나님 여호와의 성일이니 슬퍼하지 말며 울지 말라 하고\"","a":"율법"},{"t":"OT","b":"느헤미야","y":"완성형","n":3,"s":"성벽을 재건하고 초막절 행사를 하면서 느헤미야가 한 말이다. 괄호 안에 알맞은 말을 적어라. (느8:10)\"느헤미야가 또 그들에게 이르기를 너희는 가서 살진 것을 먹고 단 것을 마시되 준비하지 못한 자에게는 나누어 주라 이 날은 우리 주의 성일이니 근심하지 말라 ( )로 인하여 기뻐하는 것이 너희의 힘이니라 하고\"","a":"여호와"},{"t":"OT","b":"느헤미야","y":"완성형","n":4,"s":"(느9:29) 다시 주의 ( )을 복종하게 하시려고 그들에게 경계하셨으나 그들이 교만하여 사람이 준행하면 그 가운데에서 ( )을 얻는 주의 계명을 듣지 아니하며 주의 규례를 범하여 고집하는 어깨를 내밀며 목을 굳게 하여 듣지 아니하였나이다.","a":"율법, 삶"},{"t":"OT","b":"느헤미야","y":"단답형","n":1,"s":"느헤미야 8-10장에는 누가 갑자기 등장하여 율법 낭독을 하는가? ( )","a":"에스라"},{"t":"OT","b":"느헤미야","y":"단답형","n":2,"s":"성서 기록에 따르면 그는 느헤미야와 동 시대 인물이며, 느헤미야에 앞서 두 번째 이스라엘 포로 귀환을 이끈 율법학자이고 제사장이다. 그는 누구인가? ( )","a":"에스라(느8:1-9; 12:36; 스7:1-15)"},{"t":"OT","b":"느헤미야","y":"단답형","n":3,"s":"느헤미야는 이방 사람들과 결혼하는 것을 금하면서 이방 여인들과 많이 결혼 한 옛날 한 왕에 대한 부정적인 예를 든다. 그 왕은 누구인가? (느13:26) ( )","a":"솔로몬"},{"t":"OT","b":"느헤미야","y":"단답형","n":4,"s":"느헤미야 때에 제사장이며 학자인 에스라는 백성들에게 무엇을 가르쳤는가? (느8:9) ( )","a":"율법"},{"t":"OT","b":"느헤미야","y":"진위형","n":1,"s":"에스라서와 느헤미야서는 모두 이스라엘 귀환 사회가 진정한 하나님의 공동체가 되기 위해서는 성전이 재건되어야 한다고 강조한다. (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":2,"s":"느헤미야서에는 친척의 특권을 제지하는 것도 새로운 귀환 공동체를 정결하게 하는 것으로 여겼다(느13:4-9). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":3,"s":"예루살렘에 돌아간 자들의 어려움과 성벽 파괴에 대한 소식을 들은 느헤미야는 하나님 앞에 제사를 드린다(느1:1-4). (O,X)","a":"X"},{"t":"OT","b":"느헤미야","y":"진위형","n":4,"s":"느헤미야는 많은 음모에 시달렸다(느6장). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":5,"s":"에스라 6장의 유월절 절기 행사 보고가 출애굽기 12-13, 여호수아 5, 열왕기하 23 그리고 역대하 30장에도 나오는 것처럼, 느헤미야 8장의 율법 낭독 행위가 구약 성서 다른 곳에도 보고되어있다. (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":6,"s":"느헤미야가 예루살렘에 다녀 올 수 있도록 허락한 바사의 왕은 고레스이다(느2:6). (O,X)","a":"X"},{"t":"OT","b":"느헤미야","y":"진위형","n":7,"s":"산발랏과 도비야란 인물의 공통점은 느헤미야의 성전 재건을 적극 도왔다는 것이다. (O,X)","a":"X"},{"t":"OT","b":"느헤미야","y":"진위형","n":8,"s":"성전 재건을 방해하는 무리 때문에 느헤미야는 백성들이 일할 때에도 한 손에는 병기를 잡게 하였다(느4:13-23). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":9,"s":"성벽 재건 때에 백성들의 경제적 어려움 때문에 불만이 높아가자 느헤미야는 귀족들과 민장들에게 몇 가지 제안을 한다. 그들은 느헤미야의 말대로 하고 아무것도 요구하지 않기로 결정한다(느5:12). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":10,"s":"느헤미야를 해하려는 대에 동조하였던 사람들 중에는 예언자들도 있었다(느6:10-14). (O,X)","a":"O"},{"t":"OT","b":"느헤미야","y":"진위형","n":11,"s":"방해 세력 때문에 성벽 재건은 오십이 년 만에 마쳤다(느6:15). (O,X)","a":"X"},{"t":"OT","b":"에스더","y":"선택형","n":1,"s":"에스더서는 어느 시대를 배경으로 쓰여진 성서인가?","c":["바벨론","앗수르","바사와 메대","헬라"],"a":"3"},{"t":"OT","b":"에스더","y":"선택형","n":2,"s":"다음 중 에스더서의 등장인물이 아닌 사람은 누구인가?","c":["하만","모르드개","에스더","느헤미야"],"a":"4"},{"t":"OT","b":"에스더","y":"선택형","n":3,"s":"에스더서 당시의 바사 왕은 누구인가?","c":["고레스","다리오","캄비세스","아하수에로"],"a":"4"},{"t":"OT","b":"에스더","y":"선택형","n":4,"s":"에스더서에서 유대민족을 말살하려는 음모를 꾸민 사람은 누구인가?","c":["하몰","하만","빅다","와스디"],"a":"2"},{"t":"OT","b":"에스더","y":"선택형","n":5,"s":"에스더와 모르드개의 활약으로 지키게 된 유대인 절기는 무엇인가?","c":["부림절","유월절","무교절","초막절"],"a":"1"},{"t":"OT","b":"에스더","y":"완성형","n":1,"s":"에스더 직전의 바사 왕후는 ( )이다.","a":"와스디"},{"t":"OT","b":"에스더","y":"완성형","n":2,"s":"에스더 당시의 바사 도성은 ( )이다.","a":"수산"},{"t":"OT","b":"에스더","y":"완성형","n":3,"s":"모르드개는 바벨론 왕 느부갓네살 당시에 예루살렘에서 사로잡혀 왔던 유다 왕( )와 함께 사로잡혀 온 사람이다.","a":"여고냐"},{"t":"OT","b":"에스더","y":"완성형","n":4,"s":"\"죽으면 죽으리다\"고 말한 사람은 ( )이다.","a":"에스더"},{"t":"OT","b":"에스더","y":"완성형","n":5,"s":"에스더와 함께 바사 나라 유다민족을 구원하는 공을 세운 사람은 ( )이다.","a":"모르드개"},{"t":"OT","b":"에스더","y":"단답형","n":1,"s":"유다민족을 말살하려는 계획을 품었다가 결국 나무에 매달려 죽은 바사시대의 고관은? ( )","a":"하만"},{"t":"OT","b":"에스더","y":"단답형","n":2,"s":"부림절의 '부르' 란 말의 뜻은 무엇인가? ( )","a":"제비"},{"t":"OT","b":"에스더","y":"단답형","n":3,"s":"부림절을 지키는 날은 언제인가(이틀간)? ( )","a":"아달월 14일, 15일"},{"t":"OT","b":"에스더","y":"단답형","n":4,"s":"에스더의 바사 시대 이름은 무엇인가? ( )","a":"하닷사"},{"t":"OT","b":"에스더","y":"진위형","n":1,"s":"에스더서는 바벨론 시대를 배경으로 기록된 성서이다. (O,X)","a":"X"},{"t":"OT","b":"에스더","y":"진위형","n":2,"s":"에스더와 함께 유대민족을 구한 사람은 모르드개이다. (O,X)","a":"O"},{"t":"OT","b":"에스더","y":"진위형","n":3,"s":"바사 시대에 유대민족을 말살하려는 계획을 품은 사람은 하몰이다. (O,X)","a":"X"},{"t":"OT","b":"에스더","y":"진위형","n":4,"s":"부림절은 아달월 14일과 15일에 지킨다. (O,X)","a":"O"},{"t":"OT","b":"에스더","y":"진위형","n":5,"s":"에스더는 왕후 와스디를 대신하여 왕후가 되었다. (O,X)","a":"O"},{"t":"OT","b":"욥기","y":"선택형","n":1,"s":"욥의 친구들 중 마지막에 단 한번만 등장하는 이는 누구인가?","c":["엘리후","엘리바스","빌닷","소발"],"a":"1"},{"t":"OT","b":"욥기","y":"선택형","n":2,"s":"욥이 하나님을 만나자 하나님께 순종한다. 그 이유는 무엇인가? (욥42:5-6)","c":["하나님이 욥이 왜 고난을 받는지 논리적으로 잘 설명하여 주셔서","이전엔 하나님을 듣기만 하다가 이제는 눈으로 보게 되어"],"a":"2"},{"t":"OT","b":"욥기","y":"선택형","n":3,"s":"욥이 재앙을 받게 되는 실질적인 근원은 다음 중 무엇이 가장 가까운가?","c":["1-2장에 나타난 하나님과 사탄과의 내기","욥의 지나친 신앙심","욥 자식들의 죄악","사탄의 거짓 보고"],"a":"1"},{"t":"OT","b":"욥기","y":"선택형","n":4,"s":"욥은 자신이 왜 고난을 받게 되었는지 알고 싶어 하였다. 이에 대한 하나님의 반응은 무엇인가?","c":["소상히 그 이유를 가르쳐 주셨다","사탄을 크게 꾸짖었다","1-2장에 나온 사탄과의 내기 때문에 시험하였다고 솔직히 밝히신다","그 이유는 밝히지 않으시고, 자신의 창조주로서의 권위와 위엄을 드러내신다"],"a":"4"},{"t":"OT","b":"욥기","y":"선택형","n":5,"s":"욥은 자신이 왜 고난을 받게 되었는지 그 실질적 :"선택형","n":15,"s":"욥의 친구들이 욥에게 한 충고로 옳지 않은 것은 무엇인가?","c":["하나님은 불의한 자들만 벌하신다","하나님께 향한 불평은 어리석은 짓이다","사탄의 계략에 넘어가지 말아라","무죄를 주장하는 너 자신이 지금 죄를 범하고 있다"],"a":"3"},{"t":"OT","b":"욥기","y":"선택형","n":16,"s":"친구들의 조언을 듣던 욥의 반응이 아닌 것은 무엇인가? (욥6, 9장)","c":["차라리 죽음을 바란다","항변하러 하나님께 나아가고 싶지만 그 분은 너무 강하셔서 근접할 수 없다","그래도 나는 옳다","현명한 친구들의 말을 듣고 울며 회개한다"],"a":"4"},{"t":"OT","b":"욥기","y":"선택형","n":17,"s":"욥이 하나님을 고발한 내용으로 옳지 않은 것은 무엇인가?","c":["의인은 벌을 받고 악인이 오히려 잘산다","하나님은 잔인하게 자신이 만든 피조물을 스스로 망가뜨리신다","인간을 괴롭히는 악한 영들을 벌하지 않으신다","힘 있는 자는 죄를 지어도 벌 받지 않고, 약한 자들은 학대를 받는다"],"a":"3"},{"t":"OT","b":"욥기","y":"선택형","n":18,"s":"'지혜의 노래'로 알려진 욥기 28장의 내용이 아닌 것은 무엇인가?","c":["지혜는 어디에서도 발견되지 않는다","지혜가 재물보다 더 낫다","하나님만이 지혜가 어디 있는지 아신다","지혜는 창조 때에 하나님과 함께 있지 않았다"],"a":"4"},{"t":"OT","b":"욥기","y":"선택형","n":19,"s":"욥에게 나타나신 하나님이 하신 말씀으로 맞지 않은 것은 무엇인가? (욥38-41장)","c":["바닷물의 운행이나 날의 기원과 같은 창조에 관한 것을 욥이 아는지 물으신다","짐승들의 생태에 대하며 말씀하시며 그것을 욥이 그것을 아는지 짐승들을 그렇게 행하게 할 수 있는 지 물어보신다","악어나 하마 같은 바다의 괴수를 욥이 제압할 수 있는지 묻는다","처음에 있었던 사탄과의 논쟁을 말씀하시며 욥이 시험 받게 된 경위를 알려주신다"],"a":"4"},{"t":"OT","b":"욥기","y":"선택형","n":20,"s":"마지막 장인 42장에 따르면, 결국 욥은 자신의 신앙적 문제(무고한 고난)를 어떻게 해결 할 수 있었는가? (욥42:1-6)","c":["신앙적 이해를 통하여","신앙적 체험을 통하여"],"a":"2"},{"t":"OT","b":"욥기","y":"선택형","n":21,"s":"다음 중 욥이 왜 고난 받는지 그 실질적 이유를 알고 있는 자가 아닌 것은 누구인가?","c":["사탄","욥기의 독자","욥과 그 친구들","하나님"],"a":"3"},{"t":"OT","b":"욥기","y":"선택형","n":22,"s":"마지막에 욥이 하나님께 회개하고 순종한 후 그에게 일어난 일이 아닌 것은 무엇인가? (욥42:7-17)","c":["다시 부자가 되었다","병들고 가난했지만 하나님께 끝까지 순종하며 살았다","다시 건강하게 살다가 기한이 차서 죽는다","모든 땅에서 제일 아름다운 세 딸을 얻는다"],"a":"2"},{"t":"OT","b":"욥기","y":"선택형","n":23,"s":"다음 중 욥기 1-2장에서처럼 하늘에서 하나님과 천상의 존재들이 모여 의논하는(소위 '천상의회') 장면이 나오지 않는 성경의 본문은 어디인가?","c":["열왕기상 22장에서 이믈라의 아들 미가야가 '거짓말 하는 영'을 본 환상","이사야 6장에서 이사야가 사명을 받는 환상","시 82편의 신들의 모임","예레미야 1장에서 예레미야가 소명을 받는 장면"],"a":"4"},{"t":"OT","b":"욥기","y":"선택형","n":24,"s":"자신의 생일을 저주하는 것은 자신을 만드신 이에 대한 가장 큰 모독일 것이다. 구약의 인물 중 욥처럼(욥3장) 자신의 생일을 저주한 이는 누구인가?","c":["요셉","사울","예레미야","나오미"],"a":"3"},{"t":"OT","b":"욥기","y":"선택형","n":25,"s":"욥기에 나타나 욥의 변화로 옳은 것은 무엇인가?","c":["하나님을 신뢰-하나님을 불평-스스로 의롭다 생각-회개","하나님을 신뢰-하나님을 신뢰-하나님을 신뢰-회개","하나님을 신뢰-하나님을 불평-하나님을 불평-재앙을 맞음","하나님을 불평-하나님을 신뢰-하나님을 찬양-스스로 의롭다 생각"],"a":"1"},{"t":"OT","b":"욥기","y":"선택형","n":26,"s":"아내가 욥에게 하나님을 욕하고 죽으라 하자 욥이 한 대답은 무엇인가?","c":["우리가 하나님께 화를 받았은즉 복도 받지 아니하겠느냐","우리가 하나님께 복을 받았은즉 화도 받지 아니하겠느냐","우리가 하나님께 복을 받았은즉 화는 받지 아니하리라","우리가 하나님께 화를 받았은즉 욕하고 죽자"],"a":"2"},{"t":"OT","b":"욥기","y":"선택형","n":27,"s":"다음은 엘리후가 욥에게 한 말이다. 괄호 안에 알맞은 말은 무엇인가? \"내가 그대에게 대답하리라 이 말에 그대가 의롭지 못하니 하나님은 사람보다 ( ) 하나님께서 사람의 말에 대답하지 않으신다 하여 어찌 하나님과 논쟁하겠느냐\"(욥33:12-13)","c":["크심이니라","지혜로우시니라","정의로우시니라","면밀하시니라"],"a":"1"},{"t":"OT","b":"욥기","y":"완성형","n":1,"s":"( )를 우리가 찾을 수 없나니 그는 권능이 지극히 크사 정의나 무한한 공의를 굽히지 아니하심이니라. 그러므로 사람들은 그를 경외하고 그는 스스로 지혜롭다 하는 모든 자를 무시하시느니라(욥37:23-24).","a":"전능자"},{"t":"OT","b":"욥기","y":"완성형","n":2,"s":"다음은 욥의 유명한 고백이다. 괄호 안을 채우시오. \"그러나 내가 가는 길을 그가 아시나니 그가 나를 ( )하신 후에는 내가 ( ) 같이 되어 나오리라\"(욥23:10).","a":"단련, 순금"},{"t":"OT","b":"욥기","y":"단답형","n":1,"s":"욥기에 의하면 악(재앙)은 어디로부터/누구로부터 오는 것인가? ( )","a":"하나님(2:10; 42:11)"},{"t":"OT","b":"욥기","y":"단답형","n":2,"s":"욥에게 조언하였던 친구들 중 가장 나이가 어리고, 처음에는 끼어들지 않다가 마지막에 혼자 조언하였던 친구는 누구인가?(욥32장) ( )","a":"엘리후"},{"t":"OT","b":"욥기","y":"단답형","n":3,"s":"욥기에서 특별히 한 장을 지혜에 관하여만 할애하는 '지혜의 장' 혹은 '지혜의 노래'로 불리는 장은 몇 장인가? ( )","a":"28장"},{"t":"OT","b":"욥기","y":"단답형","n":4,"s":"'지혜의 장'으로 유명한 28장에 보면, 인간이 금은보화는 찾아 캐 낼 수 있어도 지혜는 어디에 있는지 찾지 못한다고 하였다. 오직 지혜가 어디에 있는 아는 자는 누구인가?(욥28:23) ( )","a":"하나님"},{"t":"OT","b":"욥기","y":"단답형","n":5,"s":"다음은 누가 누구에게 한 말인가? \"무지한 말로 이치를 가리는 자가 누구니이까 나는 깨닫지도 못한 일을 말하였고 스스로 알 수도 없고 헤아리기도 어려운 일을 말하였나이다\"(욥42:3). ( )","a":"욥이 하나님에게"},{"t":"OT","b":"욥기","y":"진위형","n":1,"s":"하나님이 등장하시기 전까지 욥의 친구인 엘리바스, 빌닷, 소발은 욥과 대략 세 차례에 걸쳐 논쟁을 벌인다. (O,X)","a":"O"},{"t":"OT","b":"욥기","y":"진위형","n":2,"s":"욥기 서두에 하나님의 허락으로 사탄이 욥에게 두 번 재앙이 내리도록 한다. 나중에 욥에게 하나님이 나타나신 것도 두 번이었다. (O,X)","a":"O"},{"t":"OT","b":"욥기","y":"진위형","n":3,"s":"욥기에서 욥은 하나님이 내리신 재앙에 끝까지 절대 불평하지 않는다. (O,X)","a":"X"},{"t":"OT","b":"욥기","y":"진위형","n":4,"s":"욥은 자기와 왜 무고하게 고난을 받는지 알고 싶다면서 하나님께 항변한다. 결국 하나님은 나타나셔서 왜 그가 고난 받는지 그 이유를 구체적으로 밝히신다. (O,X)","a":"X"},{"t":"OT","b":"욥기","y":"진위형","n":5,"s":"욥은 하나님을 만나기 전까지 자신의 무죄함을 항변하였다(욥31:1-34). (O,X)","a":"O"},{"t":"OT","b":"욥기","y":"진위형","n":6,"s":"회오리바람 가운데에 나타나신 하나님을 만난 후 욥은 하나님으로부터 자신이 왜 고난 받는지에 대하여 소상히 듣고 깨닫고 회개하며 순종한다. (O,X)","a":"X"},{"t":"OT","b":"욥기","y":"진위형","n":7,"s":"결론적으로 욥기는 인간의 고난이란 반드시 죄와 연관되어 나타나는 것이라 가르친다. (O,X)","a":"X"},{"t":"OT","b":"욥기","y":"진위형","n":8,"s":"고난 받는 욥에게 하나님은, '네 시작은 미약하였으나 네 나중은 심히 창대하리라'라고 위로하셨다. (O,X)","a":"X"},{"t":"OT","b":"욥기","y":"진위형","n":9,"s":"엘리후는 당시 전통적 입장에 따라 \"(전능자는) 사람의 행위를 따라 갚으사 각각 그의 행위대로 받게 하시나니\"라고 말하였는데, 욥기는 결론적으로 이러한 사상에 과감히 반기를 드는 책이다(욥34:11). (O,X)","a":"O"},{"t":"OT","b":"시편","y":"선택형","n":1,"s":"다음 중 구약성서의 시편 속에 발견되지 않는 종류의 시는 무엇인가?","c":["다윗의 시","고라의 시","이사야의 시","아삽의 시"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":2,"s":"시편 1편에서 말하는 복 있는 사람이 아닌 것은 무엇인가?","c":["악인들의 꾀를 따르지 아니한다","시냇가에 심은 나무 같다","율법을 주야로 묵상한다","찬양을 주야로 부른다"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":3,"s":"시편 11편에서 악인에게 쫓기는 이가 피하는 곳은 어디인가?","c":["여호와","지붕 아래","하늘","바다 아래"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":4,"s":"시편 23편에서 목자이신 여호와가 하시는 일이 아닌 것은 무엇인가?","c":["쉴만한 물가로 인도하신다","내 영혼을 소생시키신다","지팡이와 막대기로 안위하신다","원수를 내 앞에서 소멸시키신다"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":5,"s":"시편 23:3에서 여호와가 나를 의의 길로 인도하시는 것은 무엇을 위해서인가?","c":["여호와의 의를 위하여","여호와의 이름을 위하여","나의 평안을 위하여","나의 목숨을 위하여"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":6,"s":"시편 27편에서 기자가 여호와께 청하였던 것이 아닌 것은 무엇인가?","c":["평생에 여호와의 집에 살게","장수할 수 있도록","여호와의 아름다움을 바라보게","그의 성전에서 사모하게"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":7,"s":"\"내 영혼아 네가 어찌하여 낙심하며 어찌하여 내 속에서 불안해 하는가 너는 하나님께 소망을 두라 나는 그가 나타나 도우심으로 말미암아 내 하나님을 여전히 ( )\" 괄호 안에 맞는 말은 무엇인가? (시42:11)","c":["찬송하리로다","의뢰하리로다","갈급해 하는 도다","따라가리로다"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":8,"s":"\"여호와를 경외하며 그의 길을 걷는 자마다 복이 있도다\" 이 구절은 소위 지혜시라 일컬어지는 128편의 첫 구절이다. 그 다음에 나오는 복의 내용이 아닌 것은 무엇인가?","c":["네 손이 수고한 대로 먹을 것이다","악인의 창에서 구원을 받을 것이다","네 아내는 결실한 포도나무 같을 것이다","자식들은 어린 감람나무 같을 것이다"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":9,"s":"\"우리가 바벨론의 여러 강변 거기에 앉아서 ( )을/를 기억하며 울었도다\" 괄호 안에 알맞은 말은 무엇인가? (시137:1)","c":["사마리아","시온","고기와 마늘","부모"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":10,"s":"시편 7편은 무죄를 주장하는 탄식시이다. 이와 유사한 장르의 글이 발견되는 책은 무엇인가?","c":["잠언","전도서","욥기","아가서"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":11,"s":"\"하나님이 바다를 변하여 육지가 되게 하셨으므로 무리가 걸어서 강을 건너고 우리가 거기서 주로 말미암아 기뻐하였도다\" 이 구절은 구약 성서 어느 사건을 떠올리게 하는가? (시66:6)","c":["창조","출애굽","여리고성 함락","성전 봉헌"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":12,"s":"다음 중 신약성서에 인용된 시편 구절은?","c":["우리의 능력이 되시는 하나님을 향하여 기쁘게 노래하며 야곱의 하나님을 향하여 즐거이 소리칠지어다 (시81:1)","주여 신들 중에 주와 같은 자 없사오며 주의 행하심과 같은 일도 없나이다 (시86:8)","여호와께서 내 주에게 말씀하시기를 내가 네 원수들로 네 발판이 되게 하기까지 너는 내 오른쪽에 앉아 있으라 하셨도다 (시110:1)","할렐루야 그의 성소에서 하나님을 찬양하며 그의 권능의 궁창에서 그를 찬양할지어다 (시150:1)"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":13,"s":"\"그들의 우상들은 은과 금이요 사람이 손으로 만든 것이라. 입이 있어도 말하지 못하며 눈이 있어도 보지 못하며. 귀가 있어도 듣지 못하며 코가 있어도 냄새 맡지 못하며. 손이 있어도 만지지 못하며 발이 있어도 걷지 못하며 목구멍이 있어도 작은 소리조차 내지 못하느니라\" 이와 같은 시각으로 우상을 조롱하는 책은? (시115:4-7)","c":["이사야","호세아","잠언","창세기"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":14,"s":"다음 중 시편에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["시편은 모두 150편으로 구성되어 있다","시편은 일종의 노래이다","시편은 포로기 전까지의 시만 보존되어있다","다윗의 시라는 시편들이 있다"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":15,"s":"시편은 성전 예배에서 불렸을 것으로 추정된다. 다음 중 예배 음악과 관련이 없는 사람은 누구인가?","c":["다윗","히스기야","아삽","요나"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":16,"s":"\"여호와여 주는 나의 방패시요 나의 영광이시요 ( ) 자이시니이다\" 괄호 안에 알맞은 말은 무엇인가? (시3:3)","c":["나의 손을 붙드시는","나를 수렁에서 건져주시는","나의 머리를 드시는","나의 발을 드시는"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":17,"s":"다음 중 시편 구절이 아닌 것은 무엇인가?","c":["내가 평안히 눕고 자기도 하리니 나를 안전히 살게 하시는 이는 오직 여호와이시니이다","여호와여 나의 말에 귀를 기울이사 나의 심정을 헤아려 주소서","나의 방패는 마음이 정직한 자를 구원하시는 하나님께 있도다","사람들이 사는 동안에 기뻐하며 선을 행하는 것보다 더 나은 것이 없는 줄을 내가 알았고"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":18,"s":"\"여호와여 일어나옵소서 하나님이여 손을 드옵소서 ( )을 잊지 마옵소서. 어찌하여 악인이 하나님을 멸시하여 그의 마음에 이르기를 주는 감찰하지 아니하리라 하나이까\" 괄호 안에 알맞은 말은 무엇인가? (시10:12-13)","c":["가난한 자들","능력 있는 자들","재능 있는 자들","준수한 자들"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":19,"s":"시편에서 \"순결하여 흙 도가니에 일곱 번 단련한 은\" 같은 것은 무엇을 표현한 것인가? (시12:6)","c":["믿음","여호와의 말씀","여호와의 사랑","순은"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":20,"s":"시편 16:8에서 기자가 \"여호와를 항상 내 앞에 모신다\"고 하는 데, 그럼으로써 기자에게는 어떤 영향이 있는가?","c":["요동치 아니한다","겁날 것이 없다","길을 잃지 않는다","앞이 보이지 않는다"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":21,"s":"다음 중 시편의 구절이 아닌 것은 무엇인가?","c":["서로 불러 이르되 거룩하다 거룩하다 거룩하다 만군의 여호와여 그의 영광이 온 땅에 충만하도다 하더라","나의 반석이시요 나의 구속자이신 여호와여 내 입의 말과 마음의 묵상이 주님 앞에 열납되기를 원하나이다","그들이 주께 부르짖어 구원을 얻고 주께 의뢰하여 수치를 당하지 아니하였나이다","내 겉옷을 나누며 속옷을 제비 뽑나이다"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":22,"s":"시 24편에서 \"여호와의 산에 오르며 그 거룩한 곳에 설자\"로서 묘사되지 않은 사람은 누구인가?","c":["손이 깨끗한 자","천사보다 조금 못한 자","마음이 청결한 자","뜻을 허탄한데 두지 아니하는 자"],"a":"2"},{"t":"OT","b":"시편","y":"선택형","n":23,"s":"\"주의 손이 주야로 나를 누르시오니 내 진액이 빠져서 여름 가뭄에 마름 같이 되었나이다\" 이 구절과 연관이 없는 것은 무엇인가? (시32:4)","c":["내가 입을 열지 않을 때에 이렇게 되었다","허물의 사함을 받고 자신의 죄가 가려진 자는 복이 있도다","내 허물을 여호와께 자복하리라 하고 주께 내 죄를 아뢰고 내 죄악을 숨기지 아니하였더니 곧 주께서 내 죄악을 사하셨나이다","속죄를 위하여 희생을 드렸다"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":24,"s":"\"생명을 사모하고 연수를 사랑하여 복 받기를 원하는 사람이 누구뇨\" 여기에 해당되지 않는 사람은 누구인가? (시34:12)","c":["혀를 악에서 금하는 사람","거짓말을 금하는 사람","지혜를 사랑하는","화평을 찾아 따르는 자"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":25,"s":"\"또 여호와를 ( ) 그가 네 마음의 소원을 네게 이루어 주시리로다 네 길을 여호와께 ( ) 그를 의지하면 그가 이루시고. 네 의를 빛 같이 나타내시며 네 공의를 정오의 빛 같이 하시리로다\" 괄호 안에 알맞은 말은 무엇인가? (시37:4-6)","c":["기뻐하라, 맡기라","즐거워하라, 던지라","감사하라, 보이라","간구하라, 간구하라"],"a":"1"},{"t":"OT","b":"시편","y":"선택형","n":26,"s":"다음 중 시편의 구절이 아닌 것은 무엇인가?","c":["여호와는 마음이 상한 자를 가까이 하시고 충심으로 통회하는 자를 구원하시는도다","악을 행하는 자들 때문에 불평하지 말며 불의를 행하는 자들을 시기하지 말지어다","죽은 자들이 그들의 죽은 자들을 장사하게 하고 너는 나를 따르라 하시니라","진실로 생명의 원천이 주께 있사오니 주의 빛 안에서 우리가 빛을 보리이다"],"a":"3"},{"t":"OT","b":"시편","y":"선택형","n":27,"s":"\"날마다 우리 ( )을/를 지시는 주 곧 우리의 구원이신 하나님을 찬송할지로다\" 괄호 안에 알맞은 말은 무엇인가?(시68:19)","c":["양식","눈물","죄악","짐"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":28,"s":"다음 중 시편의 구절이 아닌 것은 무엇인가?","c":["하나님이여 주께서 가난한 자를 위하여 주의 은택을 준비하셨나이다","주의 멧비둘기의 생명을 들짐승에게 주지 마시며 주의 가난한 자의 목숨을 영원히 잊지 마소서","주의 궁정에서의 한 날이 다른 곳에서의 천 날보다 나은즉 악인의 장막에 사는 것보다 내 하나님의 성전 문지기로 있는 것이 좋사오니","이스라엘아 들으라 우리 하나님 여호와는 오직 유일한 여호와이시니. 너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라"],"a":"4"},{"t":"OT","b":"시편","y":"선택형","n":29,"s":"\"이에 그들이 그들의 고통 때문에 여호와께 부르짖으매 그가 그들의 고통에서 그들을 구원하시되. 그가 그의 ( )을/를 보내어 그들을 고치시고 위험한 지경에서 건지시는도다\" 여기에서 그가 보낸 것은 무엇인가? (시107:19-20)","c":["사자","천사","군사","말씀"],"a":"4"},{"t":"OT","b":"시편","y":"완성형","n":1,"s":"시편 1편의 복있는 사람에 대한 설명이다. 괄호 안에 알맞은 말은 무엇인가? \"오직 여호와의 ( )을 즐거워하여 그의 ( )을 주야로 묵상하는도다\"(시1:2).","a":"율법"},{"t":"OT","b":"시편","y":"완성형","n":2,"s":"주의 손가락으로 만드신 주의 하늘과 주께서 베풀어 두신 달과 별들을 내가 보오니 ( )이 무엇이기에 주께서 그를 생각하시며 인자가 무엇이기에 주께서 그를 돌보시나이까(시8:3-4).","a":"사람"},{"t":"OT","b":"시편","y":"완성형","n":3,"s":"( )이 하나님의 영광을 선포하고 궁창이 그의 손으로 하신 일을 나타내는도다(시19:1).","a":"하늘"},{"t":"OT","b":"시편","y":"완성형","n":4,"s":"여호와는 나의 ( )시니 내게 부족함이 없으리로다. 그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다(시23:1-2).","a":"목자"},{"t":"OT","b":"시편","y":"완성형","n":5,"s":"해 돋는 데에서부터 해 지는 데에까지 여호와의 ( )이 찬양을 받으시리로다(시113:3).","a":"이름"},{"t":"OT","b":"시편","y":"완성형","n":6,"s":"여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요 여호와는 내 ( )이시니 내가 누구를 무서워하리요(시27:1).","a":"생명의 능력"},{"t":"OT","b":"시편","y":"완성형","n":7,"s":"하나님이여 사슴이 ( )을 찾기에 갈급함 같이 내 영혼이 주를 찾기에 갈급하니이다(시42:1).","a":"시냇물"},{"t":"OT","b":"시편","y":"완성형","n":8,"s":"( )로 제사를 드리는 자가 나를 영화롭게 하나니 그의 ( )를 옳게 하는 자에게 내가 하나님의 구원을 보이리라(시50:23).","a":"감사, 행위"},{"t":"OT","b":"시편","y":"완성형","n":9,"s":"주께서는 ( )를 기뻐하지 아니하시나니 그렇지 아니하면 내가 드렸을 것이라 주는 번제를 기뻐하지 아니하시나이다. 하나님께서 구하시는 제사는 ( )이라 하나님이여 상하고 통회하는 마음을 주께서 멸시하지 아니하시리이다(시51:16-17).","a":"제사, 상한 심령"},{"t":"OT","b":"시편","y":"완성형","n":10,"s":"내 ( )아 여호와를 송축하라 내 속에 있는 것들아 다 그의 거룩한 ( )을 송축하라(시103:1).","a":"영혼, 이름"},{"t":"OT","b":"시편","y":"완성형","n":11,"s":"보라 ( )가 연합하여 동거함이 어찌 그리 선하고 아름다운고. 머리에 있는 보배로운 기름이 수염 곧 아론의 수염에 흘러서 그의 옷깃까지 내림 같고. 헐몬의 이슬이 시온의 산들에 내림 같도다 거기서 여호와께서 복을 명령하셨나니 곧 ( )이로다(시133).","a":"형제, 영생"},{"t":"OT","b":"시편","y":"완성형","n":12,"s":"시편의 맨 마지막 구절이다. 괄호 안에 알맞은 말은 무엇인가? ( )이 있는 자마다 여호와를 찬양할지어다 할렐루야(시150:6).","a":"호흡"},{"t":"OT","b":"시편","y":"완성형","n":13,"s":"여호와 우리 주여 주의 ( )이 온 땅에 어찌 그리 아름다운지요 주의 영광이 하늘을 덮었나이다(시8:1).","a":"이름"},{"t":"OT","b":"시편","y":"완성형","n":14,"s":"이스라엘의 ( ) 중에 계시는 주여 주는 거룩하시니이다(시22:3).","a":"찬송"},{"t":"OT","b":"시편","y":"완성형","n":15,"s":"주께서 나의 ( )이 변하여 내게 춤이 되게 하시며 나의 베옷을 벗기고 ( )으로 띠 띠우셨나이다(시30:11)","a":"슬픔, 기쁨"},{"t":"OT","b":"시편","y":"완성형","n":16,"s":"( )께서 사람의 걸음을 정하시고 그의 길을 기뻐하시나니. 그는 넘어지나 아주 엎드러지지 아니함은 ( )께서 그의 손으로 붙드심이로다(시37:23-24).","a":"여호와"},{"t":"OT","b":"시편","y":"완성형","n":17,"s":"나의 영혼이 잠잠히 하나님만 바람이여 나의 ( )이 그에게서 나오는도다. 오직 그만이 나의 반석이시요 나의 구원이시요 나의 요새이시니 내가 크게 흔들리지 아니하리로다(시62:1-2).","a":"구원"},{"t":"OT","b":"시편","y":"완성형","n":18,"s":"( )으로 그의 문에 들어가며 ( )으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다(시100:4)","a":"감사함, 찬송함"},{"t":"OT","b":"시편","y":"완성형","n":19,"s":"( )이 내게 유익이라 이로 말미암아 내가 주의 율례들을 배우게 되었나이다(시119:71)","a":"고난당한 것"},{"t":"OT","b":"시편","y":"단답형","n":1,"s":"시편 50편은 짐승을 잡아 제물을 드리지 말라고 말하면서 대신 무엇으로 하나님께 제사를 드리라고 하는가?(시50:9-14, 23) ( )","a":"감사"},{"t":"OT","b":"시편","y":"단답형","n":2,"s":"\"내 평생에 (a)하심과 (b)하심이 반드시 나를 따르리니 내가 여호와의 집에 영원히 살리로다\"(시23:6). \"여호와께 감사하라 그는 (a)하시며 그 (b)하심이 영원함이로다\"(시107:1; 118:29). a와 b는 각각 무슨 말이 들어가야 하는가? ( )","a":"선, 인자"},{"t":"OT","b":"시편","y":"단답형","n":3,"s":"다음 시 23편의 구절들을 순서대로 배열하여라. ( ) A. 그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다 B. 여호와는 나의 목자시니 내게 부족함이 없으리로다 C. 내 평생에 선하심과 인자하심이 반드시 나를 따르리니 내가 여호와의 집에 영원히 살리로다 D. 내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다","a":"B-A-D-C"},{"t":"OT","b":"시편","y":"단답형","n":4,"s":"뜻을 깊이 새기며 다음 구절을 한 번 써 보아라(시57:9-11). ( ) \"주여 내가 만민 중에서 주께 감사하오며 뭇 나라 중에서 주를 찬송하리이다. 무릇 주의 인자는 커서 하늘에 미치고 주의 진리는 궁창에 이르나이다. 하나님이여 주는 하늘 위에 높이 들리시며 주의 영광이 온 세계 위에 높아지기를 원하나이다.\"","a":null,"x":"PDF p.187 (printed 201) 정답 block viewed at 200dpi: 단답형 lists only 1.감사 2.선,인자 3.B-A-D-C; no entry 4 in print."},{"t":"OT","b":"시편","y":"진위형","n":1,"s":"시편 중에는 여호와께 자신을 살펴보시고 시험하여 자신의 뜻과 양심을 단련시켜 달라는 기도가 있다(시26:2). (O,X)","a":"O"},{"t":"OT","b":"시편","y":"진위형","n":2,"s":"\"하나님이여 내 속에 정한 마음을 창조하시고 내 안에 정직한 영을 새롭게 하소서\" 이와 병행 되는 구절이 예레미야와 에스겔서에 발견된다(시51:10). (O,X)","a":"O"},{"t":"OT","b":"시편","y":"진위형","n":3,"s":"시편의 표제(머릿글)는 실제 구약 성서에 있는 내용과 아무 상관이 없다. (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":4,"s":"하나님이 짐승을 제물로 받는 것을 기뻐하지 않으신다는 표현은 시편에서 시 50편에만 있다(시40편). (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":5,"s":"시편 중에는 예루살렘의 멸망을 언급하는 시는 없다(시79편). (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":6,"s":"시편 중에는 '므리바'를 회상하는 시가 있다(시95; 81). (O,X)","a":"O"},{"t":"OT","b":"시편","y":"진위형","n":7,"s":"시편 중에는 예루살렘의 재건을 위해 기도하는 시가 있다. (O,X)","a":"O"},{"t":"OT","b":"시편","y":"진위형","n":8,"s":"시편에는 홍해를 건넜던 사건만 회상되지, 요단을 건넌 것은 기억되지 않는다(시114편). (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":9,"s":"구약성서에서 시는 시편에만 나타난다. (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":10,"s":"\"하나님의 도는 완전하고 여호와의 말씀은 순수하니 그는 자기에게 피하는 모든 자의 방패시로다\" 이 구절은 시편에 나오는 구절이다. (O,X)","a":"O"},{"t":"OT","b":"시편","y":"진위형","n":11,"s":"\"온전한 사람을 살피고 정직한 자를 볼지어다 모든 화평한 자의 미래는 평안이로다.\" 이 구절은 시편에 나오는 구절이 아니다. (시 37:37) (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":12,"s":"시편 69: 31에서 \"이것이 소 곧 뿔과 굽이 있는 황소를 드림보다 여호와를 더욱 기쁘시게 함이 될 것이라\" 하는 데, 여기에서 이것은 하나님께 울며 금식하는 것을 의미한다. (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":13,"s":"\"여호와를 경외함이 지혜의 근본이라\" 이 말은 잠언에는 나오지만 시편에는 나오지 않는다(시111:10). (O,X)","a":"X"},{"t":"OT","b":"시편","y":"진위형","n":14,"s":"\"건축자가 버린 돌이 집 모퉁이의 머릿돌이 되었나니\" 이 말은 신약성서가 시편에서 인용한 말이다. (O,X)","a":"O"},{"t":"OT","b":"잠언","y":"선택형","n":1,"s":"\"지혜와 훈계를 알게 하며 명철의 말씀을 깨닫게 하며 지혜롭게, 공의롭게, 정의롭게, 정직하게 행할 일에 대하여 훈계를 받게 하며 어리석은 자를 슬기롭게 하며 젊은 자에게 지식과 근신함을 주기 위한\" 목적으로 기록된 구약의 책은 무엇인가? (잠1:2-4)","c":["시편","잠언","전도서","신명기"],"a":"2"},{"t":"OT","b":"잠언","y":"선택형","n":2,"s":"잠언에 언급되는 저자가 아닌 자는 누구인가?","c":["다윗","솔로몬","아굴","르무엘 왕의 어머니"],"a":"1"},{"t":"OT","b":"잠언","y":"선택형","n":3,"s":"\"너는 네 우물에서 물을 마시며 네 샘에서 흐르는 물을 마시라 어찌하여 네 샘물을 집밖으로 넘치게 하며 네 도랑물을 거리로 흘러가게 하겠느냐\"라는 구절은 구약의 어느 책에 언급되고 있는가? (잠5:15-16)","c":["시편","전도서","아가","잠언"],"a":"4"},{"t":"OT","b":"잠언","y":"선택형","n":4,"s":"여호와께서 미워하시는 것, 곧 그의 마음에 싫어하시는 것 예닐곱 가지에 속하지 않는 것은 무엇인가? (잠6:16-19)","c":["교만한 눈","거짓된 혀","악한 계교를 꾀하는 마음","나태한 생각"],"a":"4"},{"t":"OT","b":"잠언","y":"선택형","n":5,"s":"\"악인의 제사는 여호와께서 미워하셔도 정직한 자의 기도는 그가 기뻐하시느니라\"라는 구절은 구약의 어느 책에 언급되는가? (잠15:8)","c":["사무엘상","시편","잠언","전도서"],"a":"3"},{"t":"OT","b":"잠언","y":"선택형","n":6,"s":"잠언에 의하면, 사람의 마음의 교만이 멸망의 선봉이라면 겸손은 무엇의 길잡이인가? (잠18:12)","c":["부귀","영생","영화","존귀"],"a":"4"},{"t":"OT","b":"잠언","y":"선택형","n":7,"s":"\"사람의 심령은 그의 병을 능히 이기려니와 심령이 상하면 그것을 누가 일으키겠느냐\"라는 구절은 구약의 어느 책에 기록되고 있는가? (잠18:14)","c":["전도서","시편","욥기","잠언"],"a":"4"},{"t":"OT","b":"잠언","y":"선택형","n":8,"s":"\"다투는 여인과 함께 큰 집에서 사는 것보다 움막에서 사는 것이 나으니라\"라는 구절은 구약의 어느 책에 기록되고 있는가? (잠21:9)","c":["전도서","잠언","아가","시편"],"a":"2"},{"t":"OT","b":"잠언","y":"선택형","n":9,"s":"잠언에 의하면 자기의 일에 능숙한 사람은 누구 앞에 서고 천한 자 앞에 서지 않게 되는가? (잠22:29)","c":["부유한 자","존귀한 자","왕","여호와"],"a":"3"},{"t":"OT","b":"잠언","y":"선택형","n":10,"s":"잠언에 의하면 무엇이 없을 때 백성이 방자히 행하게 되는가? (잠 29:18)","c":["찬양","기도","겸손","묵시"],"a":"4"},{"t":"OT","b":"잠언","y":"선택형","n":11,"s":"잠언 31장에 언급되는 현숙한 여인의 모습에 포함되지 않는 것은 무엇인가?","c":["부지런히 손으로 일하는 여인","곤고한 자에게 손을 펴는 여인","여호와를 경외하는 여인","말을 조심하는 여인"],"a":"4"},{"t":"OT","b":"잠언","y":"완성형","n":1,"s":"여호와를 ( )하는 것이 지식의 근본이거늘 미련한 자는 지혜와 훈계를 멸시하느니라(잠1:7).","a":"경외"},{"t":"OT","b":"잠언","y":"완성형","n":2,"s":"( )가 길거리에서 부르며 광장에서 소리를 높이며 시끄러운 길목에서 소리를 지르며 성문 어귀와 성중에서 그 소리를 발하여 이르되 너희 어리석은 자들은 어리석음을 좋아하며 거만한 자들은 거만을 기뻐하며…(잠1:20-22).","a":"지혜"},{"t":"OT","b":"잠언","y":"완성형","n":3,"s":"인자와 ( )가 네게서 떠나지 말게 하고 그것을 네 목에 매며 네 마음판에 새기라 그리하면 네가 하나님과 사람 앞에서 은총과 귀중히 여김을 받으리라(잠3:3-4).","a":"진리"},{"t":"OT","b":"잠언","y":"완성형","n":4,"s":"스스로 지혜롭게 여기지 말지어다 여호와를 경외하며 악을 떠날지어다 이것이 네 몸에 ( )이 되어 네 골수를 윤택하게 하리라(잠3:7-8).","a":"양약"},{"t":"OT","b":"잠언","y":"완성형","n":5,"s":"좀더 자자, 좀더 졸자, 손을 모으고 좀더 누워 있자 하면 네 ( )이 강도 같이 오며 네 곤핍이 군사 같이 이르리라(잠6:10-11).","a":"빈궁"},{"t":"OT","b":"잠언","y":"완성형","n":6,"s":"의인의 입은 생명의 샘이라도 악인의 입은 ( )을 머금었느니라(잠10:11).","a":"독"},{"t":"OT","b":"잠언","y":"완성형","n":7,"s":"( )를 아끼는 자는 그의 자식을 미워함이라 자식을 사랑하는 자는 근실히 징계하느니라(잠13:24).","a":"매"},{"t":"OT","b":"잠언","y":"완성형","n":8,"s":"악인의 제사는 여호와께서 미워하셔도 정직한 자의 ( )는 그가 기뻐하시느니라(잠15:8).","a":"기도"},{"t":"OT","b":"잠언","y":"완성형","n":9,"s":"마음의 ( )은 사람에게 있어도 말의 응답은 여호와께로부터 나오느니라(잠16:1).","a":"경영"},{"t":"OT","b":"잠언","y":"완성형","n":10,"s":"악을 행하는 것은 왕들이 미워할 바니 이는 그 보좌가 ( )로 말미암아 굳게 섬이라(잠16:12).","a":"공의"},{"t":"OT","b":"잠언","y":"단답형","n":1,"s":"\"내 아들아 네가 만일 나의 말을 받으며 나의 계명을 네게 간직하며 네 귀를 지혜에 기울이며 네 마음을 명철에 두며…\"라는 구절이 언급되는 구약의 책은 무엇인가? (잠2:1-2) ( )","a":"잠언"},{"t":"OT","b":"잠언","y":"단답형","n":2,"s":"잠언에 보면, 그의 오른손에는 장수가 있고 그의 왼손에는 부귀가 있고, 그 길은 즐거운 길이고 그의 지름길은 다 평강인 그는 무엇인가? (잠3:16-17) ( )","a":"지혜"},{"t":"OT","b":"잠언","y":"단답형","n":3,"s":"두령도 없고 감독자도 없고 통치자도 없으되 먹을 것을 여름 동안에 예비하며 추수 때에 양식을 모으는 곤충은 무엇인가? (잠6:7-8) ( )","a":"개미"},{"t":"OT","b":"잠언","y":"단답형","n":4,"s":"잠언에 보면 누구로 말미암아 사람이 한 조각 떡만 남게 되고 그로 말미암아 귀한 생명을 사냥 당하게 되는가? (잠6:26) ( )","a":"음녀"},{"t":"OT","b":"잠언","y":"단답형","n":5,"s":"잠언에 의하면 \"여호와께서 그 조화의 시작 곧 태초에 일하시기 전에 나를 가지셨으며 만세 전부터, 태초부터, 땅이 생기기 전부터 내가 세움을 받았나니\"라고 할 때 나는 무엇인가? (잠8:12, 22-23) ( )","a":"지혜"},{"t":"OT","b":"잠언","y":"단답형","n":6,"s":"잠언에 보면 속이는 저울은 여호와께서 미워하시나 공평한 무엇을 그가 기뻐하시는가? (잠11:1) ( )","a":"추"},{"t":"OT","b":"잠언","y":"단답형","n":7,"s":"잠언에 의하면, 유순한 대답은 분노를 쉬게 하여도 과격한 말은 무엇을 격동하게 되는가? (잠15:1) ( )","a":"노"},{"t":"OT","b":"잠언","y":"단답형","n":8,"s":"\"사람이 마음으로 자기의 길을 계획할지라도 그의 걸음을 인도하시는 이는 여호와시니라\"라는 구절은 구약의 어느 책에 기록되고 있는가? (잠16:9) ( )","a":"잠언"},{"t":"OT","b":"잠언","y":"단답형","n":9,"s":"노하기를 더디하는 자는 용사보다 낫고 자기의 마음을 다스리는 자는 무엇을 빼앗는 자보다 낫다고 잠언은 기록하고 있는가? (잠16:32) ( )","a":"성"},{"t":"OT","b":"잠언","y":"단답형","n":10,"s":"잠언에 의하면, 마음의 즐거움은 양약이라도 심령의 근심은 무엇을 마르게 하는가? (잠17:22) ( )","a":"뼈"},{"t":"OT","b":"잠언","y":"단답형","n":11,"s":"잠언에 의하면, 아비를 조롱하며 어미 순종하기를 싫어하는 자의 눈은 골짜기의 무엇에게 쪼이고 독수리 새끼에게 먹히게 되는가? (잠 30:17) ( )","a":"까마귀"},{"t":"OT","b":"잠언","y":"진위형","n":1,"s":"잠언은 모든 지킬 만한 것 중에 더욱 '건강'을 지키라고 권유하는데 이는 생명의 근원이 이에서 나기 때문이다(잠4:23). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":2,"s":"음녀의 입술은 꿀을 떨어뜨리며 그의 입은 기름보다 미끄러우나 나중은 쑥 같이 쓰고 두 날 가진 칼 같이 날카롭다(잠 5:3-4). (O,X)","a":"O"},{"t":"OT","b":"잠언","y":"진위형","n":3,"s":"잠언에 보면 \"나를 사랑하는 자들이 나의 사랑을 입으며 나를 간절히 찾는 자가 나를 만날 것이라\"고 기록하고 있는데, 여기에서 나는 지혜를 뜻한다(잠8:17). (O,X)","a":"O"},{"t":"OT","b":"잠언","y":"진위형","n":4,"s":"잠언에 의하면, 여호와께서 주시는 복은 사람을 부하게 하고 근심을 겸하여 주신다(잠10:22). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":5,"s":"잠언에 의하면, 어진 여인은 그 지아비의 면류관이나 욕을 끼치는 여인은 그 지아비의 뼈가 썩음 같게 한다(잠12:4). (O,X)","a":"O"},{"t":"OT","b":"잠언","y":"진위형","n":6,"s":"잠언에 의하면, 자주 노하는 자는 크게 명철하여도 마음이 조급한 자는 어리석음을 나타내게 된다(잠14:29). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":7,"s":"제비는 사람이 뽑으나 모든 일을 작정하시는 분은 여호와시라고 전도서는 기록하고 있다(잠16:33). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":8,"s":"잠언에 의하면, 형제는 사랑이 끊어지지 아니하고 친구는 위급한 때를 위하여 났다(잠17:17). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":9,"s":"잠언에 의하면 솔로몬의 잠언들 중에는 히스기야 왕의 신하들이 편집한 내용들도 있다(잠25:1). (O,X)","a":"O"},{"t":"OT","b":"잠언","y":"진위형","n":10,"s":"\"너는 내일 일을 자랑하지 말라 하루 동안에 무슨 일이 일어날는지 네가 알 수 없음이니라\"라는 구절은 전도서에 기록되고 있다(잠 27:1). (O,X)","a":"X"},{"t":"OT","b":"잠언","y":"진위형","n":11,"s":"\"내가 두 가지 일을 주께 구하였사오니 내가 죽기 전에 내게 거절하지 마시옵소서 곧 헛된 것과 거짓말을 내게서 멀리 하옵시며 나를 가난하게도 마옵시고 부하게도 마옵시고 오직 필요한 양식으로 나를 먹이시옵소서\"라고 기도한 자는 야게의 아들 아굴이다(잠30:7-8). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"선택형","n":1,"s":"전도서는 책 안의 글이 누구의 말씀이라고 밝히고 있는가?","c":["다윗","솔로몬","전도자","아굴"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":2,"s":"전도서에 어울리지 않는 말은 무엇인가?","c":["허무","율법준수","즐겨라","지혜"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":3,"s":"전도서의 내용으로 어울리지 않는 것은 무엇인가? (전1:2-11)","c":["해아래 새로운 것이 없다","모든 것은 영원히 순환한다","모든 것이 헛되고 바람을 잡는 것이다","여호와 외에 다른 신들을 섬기지 말라"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":4,"s":"다음은 전도서의 주요 사상중 하나를 드러내는 구절이다. 괄호 안에 공통으로 들어가는 말은? \"지혜자도 우매자와 함께 영원하도록 기억함을 얻지 못하나니 후일에는 모두 다 잊어버린 지 오랠 것임이라 오호라 지혜자의 ( )이/가 우매자의 ( )과/와 일반이로다\"(전 2:16).","c":["지혜","죽음","생명","허무"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":5,"s":"전도서 3:22는 \"사람이 자기 일에 즐거워하는 것보다 더 나은 것이 없다\"고 말한다. 무엇 때문에 그런가? (전3:16-21)","c":["죽음","허무","사명","하나님"],"a":"1"},{"t":"OT","b":"전도서","y":"선택형","n":6,"s":"\"… 이 두 가지를 하나님이 병행하게 하사 사람이 그의 장래 일을 능히 헤아려 알지 못하게 하셨느니라\" 여기에서 이 두 가지란 무엇인가? (전7:14)","c":["형통한 날에 기뻐하고 곤고한 날에 슬퍼하는 것","형통한 날에 기뻐하고 곤고한 날에 되돌아보는 것"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":7,"s":"전도자는 같은 말을 다섯 번 반복하며 그의 말을 시작한다. 그 말은 무엇인가? (전1:2)","c":["슬프다","곤고하다","피곤하다","헛되다"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":8,"s":"다음 중 전도서의 사상이 아닌 것은 무엇인가?","c":["해아래 새 것이 없다","하나님의 언약은 절대 파기되지 않는다","사람이 자기 일을 즐거워하는 것 보다 더 나은 것이 없다","사랑하는 아내와 함께 즐겁게 살아라"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":9,"s":"전도서에는 하나님의 이름이 몇 번 나오는가?","c":["0","4","7","40"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":10,"s":"\"사람이 먹고 마시며 수고하는 것보다 그의 마음을 더 기쁘게 하는 것은 없나니 내가 이것도 본즉 ( )의 손에서 나오는 것이로다.\"괄호 안에 알맞은 말은? (전2:24)","c":["우매자","지혜자","인간","하나님"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":11,"s":"다음 중 전도서의 주제가 아닌 것은?","c":["율법을 경외하라","모든 것은 헛되다","인생은 헛되다","하나님을 경외하라"],"a":"1"},{"t":"OT","b":"전도서","y":"선택형","n":12,"s":"세상의 모든 것이 늘 변함 없이 순환하는 것에 인간은 허망함을 느낀다. 이런 주제를 잘 표현한 다음 구절의 괄호 안에 알맞은 말은 무엇인가? \"한 세대는 가고 한 세대는 오되 ( )은 영원히 있도다\"(전1:4).","c":["여호와","하늘","땅","지혜"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":13,"s":"다음 중 전도서에서 표현하는 하나님이 아닌 것은 무엇인가? (전 3:11-15)","c":["사람에게 영원을 사모하는 마음을 주셨다","사람이 낙을 누리는 것은 하나님의 선물이다","하나님이 행하시는 것은 영원히 있을 것이다","하나님이 행하시는 모든 것을 지혜자는 측량할 수 있다"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":14,"s":"전도서가 두 사람이 한 사람보다 더 낫다고 말하며 예를 든 것이 아닌 것은 무엇인가? (전4:9-12)","c":["혹 넘어질 때 일으켜줄 사람이 있다","두 사람이 같이 누우면 따뜻하다","백지장도 맞들면 낫다","삼겹줄은 쉽게 끊어지지 않는다"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":15,"s":"전도서에서 말하는 하나님이 인간에게 주신 몫이 아닌 것은 무엇인가? (전5:18-19)","c":["먹고 마시는 것","낙을 누리는 것","하나님의 언약의 백성이 되는 것","수고함으로 즐거워하는 것"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":16,"s":"\"바람의 길이 어떠함과 아이 밴 자의 태에서 뼈가 어떻게 자라는지를 네가 알지 못함 같이…\"그 다음 이어지는 말로서 어울리는 것은 무엇인가? (전11:5)","c":["하나님의 행사는 신묘하시다","인간의 지혜는 한계가 있다","만사를 성취하시는 하나님의 일을 인간이 알 수 없다","공부를 많이 하면 피곤하다"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":17,"s":"\"청년이여 네 어린 때를 즐거워하며 네 청년의 날들을 마음에 기뻐하여 마음에 원하는 길들과 네 눈이 보는 대로 행하라…\"그 다음 이어지는 말로서 어울리는 것은 무엇인가? (전11:9)","c":["하나님도 이 모든 일로 말미암아 너를 기뻐하신다","하나님이 주신 날에 먹고 마시며 즐거워하라","그러나 재앙의 날이 홀연히 올 것을 염려하라","그러나 하나님이 이 모든 일로 말미암아 너를 심판하실 줄 알라"],"a":"4"},{"t":"OT","b":"전도서","y":"선택형","n":18,"s":"전도서에서는 '바람을 잡는 것이다' 라는 표현을 자주 쓴다. 무엇을 표현 할 때 쓰는 문학적 표현인가? (전1:14)","c":["힘든 것","헛된 것","뜨거운 것","잡히지 않는 것"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":19,"s":"\"내가 보니 지혜가 우매보다 뛰어남이 ( )이/가 ( )보다 뛰어남 같도다\" 괄호 안에 알맞은 말은 무엇인가? (전2:13)","c":["여우, 사자","빛, 어둠","하늘, 땅","여재, 장수"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":20,"s":"\"사람들이 사는 동안에 ( )보다 더 나은 것이 없는 줄을 내가 알았고\" 괄호 안에 알맞은 말은 무엇인가? (전3:12)","c":["기뻐하며 선을 행하는 것","울며 씨를 뿌리는 것","복음 들고 산을 넘는 것","기뻐하며 즐기는 것"],"a":"1"},{"t":"OT","b":"전도서","y":"선택형","n":21,"s":"전도서 7:1-2에서 밝히는 전도자의 생각이 아닌 것은 무엇인가?","c":["웃음이 슬픔보다 낫다","좋은 이름이 좋은 기름 보다 낫다","죽는 날이 출생하는 날보다 낫다","초상집에 가는 것이 잔칫집에 가는 것보다 낫다"],"a":"1"},{"t":"OT","b":"전도서","y":"선택형","n":22,"s":"전도서 7장 29절에서 말하기를 하나님은 인간을 정직하게 지으셨으나 사람이 어떻게 되었다고 말하는가?","c":["악하게","많은 꾀를 내었다","많은 거짓을 만들었다","바보"],"a":"2"},{"t":"OT","b":"전도서","y":"선택형","n":23,"s":"전도서 8장 15절에서 전도자가 희락을 찬양하는 이유는 무엇인가?","c":["사람을 건강하게 만들기 때문에","사람을 장수하게 하기 때문에","먹고 마시고 즐거워하는 것보다 더 나은 것이 해아래 없기 때문에","먹고 마시고 즐거워하는 것이 하나님을 찬양하는 것이기 때문에"],"a":"3"},{"t":"OT","b":"전도서","y":"선택형","n":24,"s":"전도서의 결말에 결국 사람의 본분은 무엇이라고 가르치는가? (전12:13)","c":["하나님을 경외하고 그의 명령을 지키는 것","하나님을 찬양하고 기뻐하는 것","해아래 즐거워하고 기뻐하는 것","말씀을 사랑하고 계명을 지키는 것"],"a":"1"},{"t":"OT","b":"전도서","y":"완성형","n":1,"s":"( )가 많으면 번뇌도 많으니 ( )을 더하는 자는 근심을 더하느니라(전1:18).","a":"지혜, 지식"},{"t":"OT","b":"전도서","y":"완성형","n":2,"s":"전도서에서 주요하게 사용 되는 두 단어를, 다음 괄호 안에 넣으시오. \"두 손에 가득하고 ( )하며 ( )을 잡는 것보다 한 손에만 가득하고 평온함이 더 나으니라\"(전4:6).","a":"수고, 바람"},{"t":"OT","b":"전도서","y":"완성형","n":3,"s":"너는 청년의 때에 너의 ( )를 기억하라 곧 곤고한 날이 이르기 전에, 나는 아무 낙이 없다고 할 해들이 가깝기 전에 해와 빛과 달과 별들이 어둡기 전에, 비 뒤에 구름이 다시 일어나기 전에 그리하라(전 12:1).","a":"창조주"},{"t":"OT","b":"전도서","y":"완성형","n":4,"s":"하나님이 모든 것을 지으시되 ( )를 따라 아름답게 하셨고 또 사람들에게는 ( )을 사모하는 마음을 주셨느니라 그러나 하나님이 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다(전3:11).","a":"때, 영원"},{"t":"OT","b":"전도서","y":"완성형","n":5,"s":"다음 구절의 괄호 안을 채우고, 잘 기억하라! \"( )이/가 지혜자를 우매하게 하고 ( )이/가 사람의 명철을 망하게 하느니라\"(전7:7).","a":"탐욕, 뇌물"},{"t":"OT","b":"전도서","y":"완성형","n":6,"s":"다음 괄호에 공통적으로 들어 갈 말은? \"또한 ( )들이 하는 모든 말에 네 마음을 두지 말라 그리하면 네 종이 너를 저주하는 것을 듣지 아니하리라. 너도 가끔 ( )을 저주하였다는 것을 네 마음도 알고 있느니라\"(전7:21-22).","a":"사람"},{"t":"OT","b":"전도서","y":"완성형","n":7,"s":"주권자가 네게 분을 일으키거든 너는 네 자리를 떠나지 말라 ( )이 큰 허물을 용서 받게 하느니라(전10:4).","a":"공손함"},{"t":"OT","b":"전도서","y":"완성형","n":8,"s":"은을 사랑하는 자는 은으로 ( )하지 못하고 풍요를 사랑하는 자는 소득으로 ( )하지 아니하나니 이것도 헛되도다(전5:10).","a":"만족"},{"t":"OT","b":"전도서","y":"완성형","n":9,"s":"그가 비록 천 년의 갑절을 산다 할지라도 ( )을 보지 못하면 마침내 다 한 곳으로 돌아가는 것뿐이 아니냐(전6:6).","a":"행복"},{"t":"OT","b":"전도서","y":"단답형","n":1,"s":"다음 중 전도서에서 가르치는 내용은 몇 가지가 있는가? (전9:7-12) ( ) (1) 하나님이 우리 하는 일을 이미 기쁘게 받으셨기 때문에 기쁨으로 먹고 마시자 (2) 죽고 나서 스올에 가면 할 일이 없기 때문에 열심히 일하자 (3) 사람은 자기의 시기와 기회를 모르기 때문에 재앙의 날이 홀연히 임할 수 있다 (4) 명철한 사람이라고 재물을 얻는 것은 아니다","a":"네 가지 모두"},{"t":"OT","b":"전도서","y":"단답형","n":2,"s":"지혜자나 우매자에게 모두 일반인 것, 둘 모두에게 같은 운명인 것은 무엇인가? (전2:16) ( )","a":"죽음"},{"t":"OT","b":"전도서","y":"단답형","n":3,"s":"전도서에 따르면 사람의 얼굴에 광채가 나게 하고 얼굴의 사나운 것을 변하게 하는 것은 사람의 무엇인가? (전8:1) ( )","a":"지혜"},{"t":"OT","b":"전도서","y":"진위형","n":1,"s":"전도서에는 우리가 구약의 다른 책들에서 배우는 것과 일치하지 않는 것처럼 보이는 내용이 많이 있다. 그 중 하나는, 인간이 하나님께서 하시는 일의 시종을 잘 알 수 없다는 것이다(전3:11; 11:5). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":2,"s":"전도서는 슬픔이 웃음보다 더 낫다고 말한다(전7:3). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":3,"s":"하나님을 경외하는 것이 인간의 본분이라는 사상은 잠언에는 나오지만 전도서에는 발견되지 않는 말이다(전12:13). (O,X)","a":"X"},{"t":"OT","b":"전도서","y":"진위형","n":4,"s":"우매한 자의 특징 중 하나는 말을 많이 하는 것이다(전10:14). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":5,"s":"\"게으른즉 서까래가 내려앉고 손을 놓은즉 집이 새느니라\" (전10:18) 이와 비슷하게 근면을 강조하는 말이 잠언에도 나온다. (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":6,"s":"전도서는 하나님을 경외하는 것이나 그분의 심판과는 아랑곳없이 우선 인생을 즐기고 누리라고 결론 짓는다(전12:13-14). (O,X)","a":"X"},{"t":"OT","b":"전도서","y":"진위형","n":7,"s":"전도서에 따르면 사람이 남의 일을 즐거워하는 것 보다 더 나은 것이 없다(전3:22). (O,X)","a":"X"},{"t":"OT","b":"전도서","y":"진위형","n":8,"s":"전도서는 사람이 전능하시고 우리의 형편을 잘 아시는 하나님 앞에 되도록 많은 말을 하라고 권면한다(전5:2). (O,X)","a":"X"},{"t":"OT","b":"전도서","y":"진위형","n":9,"s":"전도서에 따르면 지나치게 의인이 되거나 지나치게 지혜자가 되는 것은 스스로 패망하는 길이다(전7:16). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":10,"s":"전도서 4장에서 산자보다 죽은 자 혹은 아직 출생하지 않는 자가 복되다고 표현하는 것은 이 세상의 악함 때문이다(전4:1-4). (O,X)","a":"O"},{"t":"OT","b":"전도서","y":"진위형","n":11,"s":"하나님께서는 인간이 자신의 장래 일을 잘 예상하고 준비하게 하기 위하여, 인간에게 형통한 날과 곤고한 날 둘 모두를 주셨다(전7:14). (O,X)","a":"X"},{"t":"OT","b":"아가","y":"선택형","n":1,"s":"다음 중 아가서와 어울리지 않는 단어는 무엇인가?","c":["사랑","솔로몬","아름다움","공의"],"a":"4"},{"t":"OT","b":"아가","y":"선택형","n":2,"s":"다음 중 아가서의 내용과 거리가 먼 것은 무엇인가?","c":["검은 피부의 아름다움","사랑하는 자를 찾는 아름다운 처녀","어머니의 사랑","함께 도망하여 사랑을 나눈다"],"a":"3"},{"t":"OT","b":"아가","y":"선택형","n":3,"s":"다음 중 아가서의 내용과 거리가 먼 것은 무엇인가?","c":["향기를 통해 사랑의 아름다움을 찬양","잉태의 기쁨","사랑하는 자를 백합화와 사과나무에 비교","훌륭한 솔로몬의 가마와 같은 사랑하는 자"],"a":"2"},{"t":"OT","b":"아가","y":"선택형","n":4,"s":"아가서 8장 1절에서 소녀는 사랑하는 이가 자신의 오라비 같았으면 좋겠다고 한다. 그 이유는 무엇인가?","c":["오라비는 누이들을 잘 보살펴 주기 때문에","오라비는 자기와 닮았기 때문에","밖에서 입을 맞추어도 뭐라 할 자가 없기 때문에","밖에서 손을 잡아도 뭐라 할 자가 없기 때문에"],"a":"3"},{"t":"OT","b":"아가","y":"선택형","n":5,"s":"아가서 8장 2-3절에서 소녀가 사랑하는 이를 어머니의 방으로 데려가서 하고픈 것이 아닌 것은 무엇인가?","c":["식구들과 함께 맛있는 식사","향기로운 술 곧 석류즙을 그가 마시게 한다","그의 왼팔에 머리를 고이고 그의 오른손이 자기를 안기를 바란다","그가 원하기 전에는 깨지 않기를 바란다"],"a":"1"},{"t":"OT","b":"아가","y":"선택형","n":6,"s":"다음 중 아가서에 자주 반복되는 주제가 아닌 것은 무엇인가?","c":["예루살렘 딸들의 간청","내 오라비의 사랑","사랑하는 자를 밤새도록 찾음","나의 사랑하는 자는 나에게 속했고, 나는 그에게 속하였다"],"a":"2"},{"t":"OT","b":"아가","y":"선택형","n":7,"s":"다음에 구절의 괄호 안에 알맞은 말은 무엇인가? \"예루살렘 딸들아 너희에게 내가 부탁한다 너희가 내 사랑하는 자를 만나거든 내가 사랑하므로 ( )\"(아5:8).","c":["외롭다고 하려무나","병이 났다고 하려무나","떠나간다고 하려무나","배가 고프다고 하려무나"],"a":"2"},{"t":"OT","b":"아가","y":"선택형","n":8,"s":"사랑하는 이의 아름다움을 문학적으로 비유한 다음 구절의 괄호 안에 알맞은 말은? \"여자들 중에 내 사랑은 ( ) 가운데 ( ) 같도다. 남자들 중에 나의 사랑하는 자는 ( ) 가운데 ( ) 같구나…\"(아 2:2-3).","c":["가시나무, 백합화, 수풀, 사과나무","백합화, 가시나무, 사과나무, 수풀","잡초, 꽃, 짐승, 말","꽃, 잡초, 말, 짐승"],"a":"1"},{"t":"OT","b":"아가","y":"선택형","n":9,"s":"\"몰약과 유향과 상인의 여러 가지 향품으로 향내 풍기며 연기 기둥처럼 거친 들에서 오는 자가 누구인가. 볼지어다 ( )의 가마라 이스라엘 용사 중 육십 명이 둘러쌌는데\" 괄호 안에 들어갈 인물은? (아 3:6-7)","c":["다윗","라헬","솔로몬","메시야"],"a":"3"},{"t":"OT","b":"아가","y":"선택형","n":10,"s":"\"내가 잘지라도 마음은 깨었는데 나의 사랑하는 자의 소리가 들리는구나 문을 두드려 이르기를 나의 누이, 나의 사랑, 나의 비둘기, 나의 완전한 자야 문을 열어 다오 내 머리에는 이슬이, 내 머리털에는 밤이슬이 가득하였다 하는구나\"그 다음에 일어난 상황이 아닌 것은 무엇인가? (아5:2-6)","c":["내 사랑하는 자가 문틈으로 손을 들이밀매 내 마음이 움직였다","사랑하는 자를 위하여 문을 열 때 몰약이 내 손에서, 몰약의 즙이 내 손가락에서 문빗장에 떨어졌다","내 사랑하는 자를 위하여 문을 열었으나 그는 벌써 물러갔다","사랑하는 자가 문을 열고 들어왔으나 너무나 떨려 자는 척 하였다"],"a":"4"},{"t":"OT","b":"아가","y":"선택형","n":11,"s":"아가서 6장 13절에는 아가서의 사랑하는 여인이 사는 곳이 어디인지 밝혀지고 있다. 그곳은 어디인가?","c":["모압","예루살렘","술람미","암몬"],"a":"3"},{"t":"OT","b":"아가","y":"선택형","n":12,"s":"아가서 7장에서 사랑하는 여인의 아름다움을 묘사하는 대상이 아닌 것은 무엇인가?","c":["발","유방","현숙함","콧김"],"a":"3"},{"t":"OT","b":"아가","y":"선택형","n":13,"s":"\"예루살렘 딸들아 내가 비록 검으나 아름다우니 게달의 장막 같을지라도 ( )의 휘장과도 같구나\" 괄호 안에 알맞은 말은 무엇인가? (아1:5)","c":["성전","솔로몬","다윗","실로"],"a":"2"},{"t":"OT","b":"아가","y":"완성형","n":1,"s":"내게 입맞추기를 원하니 네 ( )이 포도주보다 나음이로구나(아1:2).","a":"사랑"},{"t":"OT","b":"아가","y":"완성형","n":2,"s":"내 신부야 네 ( )에서는 꿀 방울이 떨어지고 네 ( ) 밑에는 꿀과 젖이 있고 네 의복의 향기는 레바논의 향기 같구나(아4:11).","a":"입술, 혀"},{"t":"OT","b":"아가","y":"완성형","n":3,"s":"나는 내 사랑하는 자에게 ( ) 내 사랑하는 자는 내게 ( ) 그가 백합화 가운데에서 그 양 떼를 먹이는 도다(아6:3).","a":"속하였고, 속하였으며"},{"t":"OT","b":"아가","y":"완성형","n":4,"s":"다음의 유명한 아가서 구절의 괄호 안을 채우시오. \"너는 나를 도장 같이 마음에 품고 도장 같이 팔에 두라 사랑은 ( ) 같이 강하고 ( )는 스올 같이 잔인하며 불길 같이 일어나니 그 기세가 여호와의 불과 같으니라. 많은 물도 이 ( )을 끄지 못하겠고 홍수라도 삼키지 못하나니 사람이 그의 온 가산을 다 주고 ( )과 바꾸려 할지라도 오히려 멸시를 받으리라\"(아8:6-7).","a":"죽음, 질투, 사랑, 사랑"},{"t":"OT","b":"아가","y":"완성형","n":5,"s":"다음은 사랑하는 여인에 대한 아름다운 표현이다. 괄호 안을 채우시오. \"내 누이, 내 신부는 잠근 ( )이요 덮은 ( )이요 봉한 ( )이로구나\"(아4:12).","a":"동산, 우물, 샘"},{"t":"OT","b":"아가","y":"완성형","n":6,"s":"아가서의 배경이 되는 곳으로 자주 등장하는 이곳은 어디인가? 괄호 안을 채우시오. \"내 사랑하는 자야 우리가 함께 들로 가서 동네에서 유숙하자. 우리가 일찍이 일어나서 ( )으로 가서 포도 움이 돋았는지, 꽃술이 퍼졌는지, 석류 꽃이 피었는지 보자 거기에서 내가 내 사랑을 네게 주리라\"(아7:11-12). \"우리를 위하여 여우 곧 ( )을 허는 작은 여우를 잡으라 우리의 ( )에 꽃이 피었음이라\"(아2:15).","a":"포도원"},{"t":"OT","b":"아가","y":"완성형","n":7,"s":"사랑하는 이의 애타는 마음을 표현하기 위해 아가서에 몇 번 등장하는 다음의 표현을 완성하라. \"너희는 건포도로 내 힘을 돕고 사과로 나를 시원하게 하라 내가 사랑하므로 ( )이 생겼음이라\"(아2:5)","a":"병(아5:8)"},{"t":"OT","b":"아가","y":"단답형","n":1,"s":"아가서 1:1은 이 글이 누구의 노래라고 소개하는가? ( )","a":"솔로몬"},{"t":"OT","b":"아가","y":"단답형","n":2,"s":"아가서의 표현에 죽음같이 강한 것이 무엇인가?(아8:6) ( )","a":"사랑"},{"t":"OT","b":"아가","y":"진위형","n":1,"s":"\"내 사랑하는 자는 내게 속하였고 나는 그에게 속하였도다. 그가 백합화 가운데에서 양 떼를 먹이는구나\" 여기에서 '내 사랑하는 자' 와 '나' 는 사랑하는 남녀를 가리킨다(아2:16). (O,X)","a":"O"},{"t":"OT","b":"아가","y":"진위형","n":2,"s":"아가서는 여자 육체에 대한 아름다움을 묘사는 하지만 남자 육체에 대한 아름다움의 묘사는 없다. (O,X)","a":"X"},{"t":"OT","b":"아가","y":"진위형","n":3,"s":"아가서에서 여인이 사랑하는 남자의 눈은 시냇가의 비둘기 같다고 묘사되어 있다(아5:12). (O,X)","a":"O"},{"t":"OT","b":"이사야","y":"선택형","n":1,"s":"다음 중 이사야가 예언하던 시대의 왕이 아닌 사람은 누구인가?","c":["웃시야","요담","아하스","므낫세"],"a":"4"},{"t":"OT","b":"이사야","y":"선택형","n":2,"s":"이사야서는 총 몇 장으로 구성되어 있는가?","c":["45장","55장","65장","66장"],"a":"4"},{"t":"OT","b":"이사야","y":"선택형","n":3,"s":"\"소는 그 임자를 알고 나귀는 그 주인의 구유를 알건마는 이스라엘은 알지 못하고 나의 백성은 깨닫지 못하는도다\"라고 예언한 사람은 누구인가?","c":["이사야","예레미야","아모스","에스겔"],"a":"1"},{"t":"OT","b":"이사야","y":"선택형","n":4,"s":"\"헛된 제물을 다시 가져오지 말라 분향은 내가 가증히 여기는 바요 월삭과 안식일과 대회로 모이는 것도 그러하니 성회와 아울러 악을 행하는 것을 내가 견디지 못하겠노라\"고 예언한 사람은 누구인가?","c":["이사야","아모스","호세아","말라기"],"a":"1"},{"t":"OT","b":"이사야","y":"선택형","n":5,"s":"\"시온은 정의로 구속함을 받고 그 돌아온 자들은 공의로 구속함을 받으리라\"고 예언한 사람은 누구인가?","c":["에스겔","예레미야","스가랴","이사야"],"a":"4"},{"t":"OT","b":"이사야","y":"선택형","n":6,"s":"이사야 5장의 포도원의 노래의 주제는 무엇인가?","c":["인내","소망","정의","믿음"],"a":"3"},{"t":"OT","b":"이사야","y":"선택형","n":7,"s":"선지자 이사야는 언제 소명을 받았는가?","c":["요시야 개혁 때","웃시야 죽던 때","히스기야가 병들었을 때","예루살렘 멸망 때"],"a":"2"},{"t":"OT","b":"이사야","y":"선택형","n":8,"s":"임마누엘 예언을 한 선지자는 누구인가?","c":["다니엘","호세아","이사야","미가"],"a":"3"},{"t":"OT","b":"이사야","y":"선택형","n":9,"s":"주전 734년 시리아-에브라임 위기 때에 예언을 한 선지자는 누구인가?","c":["아모스","호세아"
