<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경고사 문제은행</title>
<style>
:root{--bg:#f7f4fb;--card:#fff;--ink:#241f2e;--mut:#7b7388;--line:#e5def0;--acc:#7b3fa0;--acc2:#a35bd1;--accsoft:#f1e8f9;--ok:#15803d;--okbg:#e7f7ec;--bad:#c0262d;--badbg:#fdecec;--shadow:0 1px 2px rgba(60,20,90,.06),0 6px 18px rgba(60,20,90,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14101b;--card:#1d1828;--ink:#efeaf7;--mut:#a79fb8;--line:#33294a;--acc:#c79be8;--acc2:#b77fe0;--accsoft:#2a1f3c;--ok:#6fdc90;--okbg:#14301f;--bad:#ff8c88;--badbg:#3b1a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.hero{margin:0;padding:30px 22px 22px;background:linear-gradient(135deg,#5b2a86 0%,#8e4bc0 60%,#b57be0 100%);color:#fff}
.hero h1{margin:0 0 6px;font-size:1.45rem;line-height:1.3;letter-spacing:-.02em}
.hero p{margin:0;font-size:.9rem;opacity:.9}
button{font:inherit;font-size:.95rem;font-weight:600;padding:9px 16px;border-radius:999px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
button:hover{background:var(--accsoft)} button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin:14px 0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}
.modes button{padding:14px;border-radius:14px;text-align:left;line-height:1.35}
.modes small{display:block;font-weight:400;color:inherit;opacity:.85;font-size:.8rem}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--acc)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.books button{border-radius:12px;padding:10px 8px;text-align:center;line-height:1.3;background:var(--card)}
.books button small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.toprow{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--mut)}
.toprow b{color:var(--ink)}
.prog{height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accsoft);color:var(--acc);margin-right:6px}
.stem{font-size:1.08rem;margin:8px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ch{display:block;width:100%;text-align:left;margin:7px 0;border-radius:12px;padding:10px 14px;font-weight:500;color:var(--ink);border-color:var(--line);background:var(--card)}
.ch.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)} .ch.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ox{display:flex;gap:12px}.ox button{flex:1;font-size:1.6rem;padding:14px;border-radius:14px}
.ox button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.ox button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.res{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--accsoft)}
.res.ok{background:var(--okbg)}.res.bad{background:var(--badbg)}.res.unk{background:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.score{font-size:2.2rem;font-weight:800;color:var(--acc);margin:4px 0}
.wl{border-top:1px solid var(--line);padding:10px 0}.wl .a{color:var(--ok);font-weight:600}
.mut{color:var(--mut);font-size:.88rem}
@media (max-width:480px){body{font-size:16px}.hero h1{font-size:1.25rem}}
</style></head><body>

O,X)","a":"O"},{"t":"OT","b":"창세기","y":"진위형","n":16,"s":"므낫세와 에브라임은 요셉이 애굽 여인 아스낫에게서 낳은 아들들이다. (O,X)","a":"O"},{"t":"OT","b":"창세기","y":"진위형","n":17,"s":"라헬이 죽기 직전에 낳은 아들은 요셉이다 (O,X)","a":"X"},{"t":"OT","b":"창세기","y":"진위형","n":18,"s":"소알 성은 롯이 소돔과 고모라에 떨어진 하나님의 심판을 피하여 도망한 성읍이다. (O,X)","a":"O"},{"t":"OT","b":"창세기","y":"진위형","n":19,"s":"창세기는 모두 55장으로 구성되어 있다. (O,X)","a":"X"},{"t":"OT","b":"창세기","y":"진위형","n":20,"s":"창세기 1-11장은 인간이 축복을 주도하였으나 실패한 역사를, 12-50장은 하나님이 축복을 주도하여 성공하는 역사를 보여준다. (O,X)","a":"O"},{"t":"OT","b":"출애굽기","y":"선택형","n":1,"s":"출애굽기에 의하면 히브리 여인들이 해산하게 될 때에 애굽 왕이 히브리인 산파들에게 시켜서 남자 아이들이 출생하게 되면 죽이도록 했는데, 그 산파들의 이름은 부아와 누구인가? (출1:15)","c":["미리암","십보라","십브라","라합"],"a":"3"},{"t":"OT","b":"출애굽기","y":"선택형","n":2,"s":"“내가 애굽에 있는 내 백성의 고통을 분명히 보고 그들이 그들의 감독자로 말미암아 부르짖음을 듣고 그 근심을 알고 내가 내려가서 그들을 애굽인의 손에서 건져내고 그들을 그 땅에서 인도하여…”라는 말씀은 여호와께서 누구에게 주신 말씀인가? (출3:7)","c":["여호수아","아브라함","아론","모세"],"a":"4"},{"t":"OT","b":"출애굽기","y":"선택형","n":3,"s":"모세가 바로 앞에서 보인 첫째 재앙은 무엇인가? (출7:17)","c":["나일 강을 피로 변하게 한 것","개구리 재앙","흑암 재앙","파리 재앙"],"a":"1"},{"t":"OT","b":"출애굽기","y":"선택형","n":4,"s":"애굽에 있던 이스라엘 백성들의 장자들이 여호와의 재앙을 면하게 된 것을 기념하는 절기는 무엇인가? (출12:11)","c":["오순절","맥추절","수장절","유월절"],"a":"4"},{"t":"OT","b":"출애굽기","y":"선택형","n":5,"s":"애굽에서 도망을 나온 이스라엘 백성들이 홍해를 육지처럼 건너고 난 후에 손에 소고를 잡고 이스라엘 여인들과 함께 춤추며 여호와를 찬송한 여선지자는 누구인가? (출15:20)","c":["라합","미리암","라헬","십보라"],"a":"2"},{"t":"OT","b":"출애굽기","y":"선택형","n":6,"s":"모세가 반석을 쳐서 물이 나오게 한 곳과 연관이 없는 곳은 어디인가? (출17:1-7)","c":["르비딤","맛사","므리바","마라"],"a":"4"},{"t":"OT","b":"출애굽기","y":"선택형","n":7,"s":"모세의 아들 중에 모세가 이방에서 나그네가 되었음을 회고하게 만드는 이름을 지닌 아들은 누구인가? (출18:3)","c":["게르솜","엘리에셀","이스보셋","훌"],"a":"1"},{"t":"OT","b":"출애굽기","y":"선택형","n":8,"s":"모세의 아들 중에 하나님이 모세를 도와서 바로의 칼에서 구원하셨다는 점을 회고하게 만드는 이름을 지닌 아들은 누구인가? (출18:4)","c":["게르솜","엘리에셀","이스보셋","훌"],"a":"2"},{"t":"OT","b":"출애굽기","y":"선택형","n":9,"s":"십계명 중에 \"너는 네 하나님 여호와의 이름을 망령되게 부르지 말라\"는 계명은 몇째 계명인가? (출20:7)","c":["첫째","셋째","넷째","다섯째"],"a":"2"},{"t":"OT","b":"출애굽기","y":"선택형","n":10,"s":"십계명 중에 \"너를 위하여 새긴 우상을 만들지 말고 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅 아래 물 속에 있는 것의 어떤 형상도 만들지 말며 그것들에게 절하지 말며 그것들을 섬기지 말라\"라는 계명은 몇째 계명인가? (출20:4)","c":["첫째","둘째","셋째","넷째"],"a":"2"},{"t":"OT","b":"출애굽기","y":"선택형","n":11,"s":"출애굽기 24장에 의하면 시내 산에서 하나님을 뵙게 된 이스라엘 자손들의 존귀한 자들 중에 속하지 않는 자는 누구인가?","c":["여호수아","모세","나답","칠십 장로"],"a":"1"},{"t":"OT","b":"출애굽기","y":"선택형","n":12,"s":"백성들이 금송아지 형상을 만들어 예배를 드리는 것을 보고 \"그러나 이제 그들의 죄를 사하시옵소서 그렇지 아니하시오면 원하건대 주께서 기록하신 책에서 내 이름을 지워버려 주옵소서\"라고 간구한 자는 누구인가? (출32:32)","c":["모세","아론","여호수아","갈렙"],"a":"1"},{"t":"OT","b":"출애굽기","y":"선택형","n":13,"s":"이스라엘 백성들이 광야에서 성막을 완성하게 되었을 때 여호와의 무엇이 성막에 충만하게 임하게 되었는가? (출40:34)","c":["영광","광채","천사","은총"],"a":"1"},{"t":"OT","b":"출애굽기","y":"선택형","n":14,"s":"성막의 지성소 안에 있는 것은 무엇인가? (출26:34)","c":["진설병","물두멍","증거궤","순금 등대"],"a":"3"},{"t":"OT","b":"출애굽기","y":"완성형","n":1,"s":"갈대 상자에 넣어진 모세가 바로의 딸에게 발견되었을 때, 그를 위하여 히브리 여인 중에서 유모를 불러 젖을 먹이도록 제안했던 모세의 누나는 ( )이다(출2장; 민26:59)","a":"미리암"},{"t":"OT","b":"출애굽기","y":"완성형","n":2,"s":"여호와께서 그에게 이르시되 네 손에 있는 것이 무엇이냐 그가 이르되 지팡이니이다 여호와께서 이르시되 그것을 땅에 던지라 하시매 곧 땅에 던지니 그것이 ( )이 된지라(출4:2-3)","a":"뱀"},{"t":"OT","b":"출애굽기","y":"완성형","n":3,"s":"그 날에 나는 내 백성이 거주하는 고센 땅을 구별하여 그 곳에는 ( )가 없게 하리니 이로 말미암아 이 땅에서 내가 여호와인 줄을 네가 알게 될 것이라(출8:22).","a":"파리"},{"t":"OT","b":"출애굽기","y":"완성형","n":4,"s":"너희는 이레 동안 ( )을 먹을지니 그 첫날에 누룩을 너희 집에서 제하라 무릇 첫날부터 일곱째 날까지 유교병을 먹는 자는 이스라엘에서 끊어지리라(출12:15).","a":"무교병"},{"t":"OT","b":"출애굽기","y":"완성형","n":5,"s":"모세가 바다 위로 손을 내밀매 여호와께서 큰 ( )이 밤새도록 바닷물을 물러가게 하시니 물이 갈라져 바다가 마른 땅이 된지라(출14:21)","a":"동풍"},{"t":"OT","b":"출애굽기","y":"완성형","n":6,"s":"출애굽한 이스라엘 백성들이 광야에서 여행하는 동안 하나님께서 그들에게 메추라기와 ( )를 주셨다(출16:31).","a":"만나"},{"t":"OT","b":"출애굽기","y":"완성형","n":7,"s":"너는 또 온 백성 가운데서 능력 있는 사람들 곧 하나님을 두려워하며 진실하며 불의한 이익을 미워하는 자를 살펴서 백성 위에 세워 ( )과 백부장과 오십부장과 십부장을 삼아 그들이 때를 따라 백성을 재판하게 하라(출18:21).","a":"천부장"},{"t":"OT","b":"출애굽기","y":"완성형","n":8,"s":"네 부모를 ( )하라 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라(출20:12).","a":"공경"},{"t":"OT","b":"출애굽기","y":"완성형","n":9,"s":"네가 히브리 종을 사면 그는 여섯 해 동안 섬길 것이요 일곱째 해에는 몸값을 물지 않고 나가 ( )이 될 것이며(출21:2).","a":"자유인"},{"t":"OT","b":"출애굽기","y":"완성형","n":10,"s":"너는 ( )을 받지 말라 ( )은 밝은 자의 눈을 어둡게 하고 의로운 자의 말을 굽게 하느니라(출23:8).","a":"뇌물"},{"t":"OT","b":"출애굽기","y":"완성형","n":11,"s":"모세와 아론과 나답과 아비후와 이스라엘 장로 칠십 인이 올라가서 이스라엘의 하나님을 보니 그의 발 아래에는 ( )을 편 듯하고 하늘 같이 청명하더라 하나님이 이스라엘 자손들의 존귀한 자들에게 손을 대지 아니하셨고 그들은 하나님을 뵙고 먹고 마셨더라(출24:9-11).","a":"청옥"},{"t":"OT","b":"출애굽기","y":"완성형","n":12,"s":"산 위의 여호와의 ( )이 이스라엘 자손의 눈에 맹렬한 불 같이 보였고 모세는 구름 속으로 들어가서 산 위에 올랐으며 모세가 사십 일 사십 야를 산에 있으니라(출24:17-18).","a":"영광"},{"t":"OT","b":"출애굽기","y":"완성형","n":13,"s":"성막에서 섬길 제사장들을 위해 이스라엘 백성들은 거룩한 패를 만들고 도장을 새김같이 그 위에 \"여호와께 ( )\"이라 새겼다(출28:36).","a":"성결"},{"t":"OT","b":"출애굽기","y":"완성형","n":14,"s":"낮에는 여호와의 ( )이 성막 위에 있고 밤에는 불이 그 구름 가운데에 있음을 이스라엘의 온 족속이 그 모든 행진하는 길에서 그들의 눈으로 보았더라(출40:38).","a":"구름"},{"t":"OT","b":"출애굽기","y":"단답형","n":1,"s":"미디안 제사장 이드로의 딸로서 모세의 아내가 된 자는 누구인가? (출2:21) ( )","a":"십보라"},{"t":"OT","b":"출애굽기","y":"단답형","n":2,"s":"“오 주여 나는 본래 말을 잘 하지 못하는 자니이다 주께서 주의 종에게 명령하신 후에도 역시 그러하니 나는 입이 뻣뻣하고 혀가 둔한 자니이다”라고 말한 자는 누구인가? (출4:10) ( )","a":"모세"},{"t":"OT","b":"출애굽기","y":"단답형","n":3,"s":"모세가 바로와 애굽에 내린 열 가지 재앙들 중에 처음 난 것들이 다 죽게 한 것은 몇째 재앙인가? (출11-12장) ( )","a":"열번째"},{"t":"OT","b":"출애굽기","y":"단답형","n":4,"s":"애굽을 도망 나온 이스라엘 백성들에게 여호와께서는 낮에는 구름기둥으로, 밤에는 ( )기둥으로 함께 해주셨다(출14:22). ( )","a":"불"},{"t":"OT","b":"출애굽기","y":"단답형","n":5,"s":"모세가 쓴 물이 나는 곳에 나무를 던져 단 물로 만든 곳은 어디인가? (출15:23-25)( )","a":"마라"},{"t":"OT","b":"출애굽기","y":"단답형","n":6,"s":"출애굽한 이스라엘 백성들이 광야에서 생활하는 동안 하나님께서 주신 것으로 깟씨 같이 희고 맛은 꿀 섞은 과자 같은 것은 무엇인가? (출16:31) ( )","a":"만나"},{"t":"OT","b":"출애굽기","y":"단답형","n":7,"s":"\"여호와를 찬송하리로다 너희를 애굽 사람의 손에서와 바로의 손에서 건져내시고 백성을 애굽 사람의 손 아래에서 건지셨도다 이제 내가 알았도다 여호와는 모든 신보다 크시므로 이스라엘에게 교만하게 행하는 그들을 이기셨도다\"라고 노래한 자는 누구인가? (출18:10-11) ( )","a":"이드로(르우엘)"},{"t":"OT","b":"출애굽기","y":"단답형","n":8,"s":"“살인하지 말라”는 몇째 계명인가? (출20:13) ( )","a":"여섯째"},{"t":"OT","b":"출애굽기","y":"단답형","n":9,"s":"출애굽기에 의하면 사람이 소나 양을 도둑질하여 잡거나 팔면 그는 소 한 마리에 소 다섯 마리로 갚고 양 한 마리에 양 몇 마리로 갚아야 하는가? (출22:1) ( )","a":"네 마리"},{"t":"OT","b":"출애굽기","y":"단답형","n":10,"s":"출애굽기에 의하면 이스라엘 남자들은 매년 세 번의 절기를 지켜야 했는데, 그것은 무교절(유월절), 맥추절(칠칠절, 오순절) 그리고 무엇인가? (출23:15-17) ( )","a":"수장절(초막절, 장막절)"},{"t":"OT","b":"출애굽기","y":"단답형","n":11,"s":"출애굽한 이스라엘 백성들이 광야 생활을 하는 동안 여호와의 임재를 느낄 수 있도록 만든 장막을 무엇이라고 하는가? (출25장) ( )","a":"성막(회막)"},{"t":"OT","b":"출애굽기","y":"단답형","n":12,"s":"훌의 손자요 우리의 아들로서, 여호와께서 성막을 짓게 하실 때 하나님의 영을 그에게 충만하게 하여 지혜와 총명과 지식과 여러 가지 재주로 정교한 일을 연구하여 성막을 잘 짓도록 하신 대상은 누구인가? (출35:30-31) ( )","a":"브살렐"},{"t":"OT","b":"출애굽기","y":"단답형","n":13,"s":"모세는 어느 지파에 속하는가? (출2:1) ( )","a":"레위"},{"t":"OT","b":"출애굽기","y":"진위형","n":1,"s":"여호와께서 모세를 부르실 때에 감람나무에 불이 붙었으나 타지 않는 모습을 보여주셨다(출3:2). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":2,"s":"여호와께서 모세를 이스라엘의 지도자로 부르셨을 때에 그가 말을 잘 못하고 입이 뻣뻣하고 혀가 둔하다고 말하자, 여호와께서는 아론을 대언자로 붙여주셨다(출4:14). (O,X)","a":"O"},{"t":"OT","b":"출애굽기","y":"진위형","n":3,"s":"애굽의 가축들에게 심한 돌림병이 생겨 죽게 한 것은 열 가지 재앙에 포함되지 않는다(출9:3). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":4,"s":"애굽에 있던 이스라엘 백성들이 유월절에 먹게 되었던 것은 양고기나 염소고기와 유교병과 단 나물이다(출12:5-8). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":5,"s":"출애굽한 이스라엘 백성들이 사막 중에서 물 샘 열둘과 종려나무 일흔 그루를 발견하게 된 곳은 엘림이다(출15:27). (O,X)","a":"O"},{"t":"OT","b":"출애굽기","y":"진위형","n":6,"s":"이스라엘이 광야에서 아말렉과 싸울 때에 모세의 손을 붙들어 올려 그 손이 해가 지도록 내려오지 않게 도와준 자들은 아론과 여호수아이다(출17:12). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":7,"s":"광야 생활을 하는 이스라엘 백성들을 홀로 재판하는 모세에게 천부장, 백부장, 오십부장, 십부장을 두어서 다스리도록 제안을 했던 사람은 그의 장인 이드로이다(출18:13-27). (O,X)","a":"O"},{"t":"OT","b":"출애굽기","y":"진위형","n":8,"s":"\"네 이웃에 대하여 거짓 증거하지 말라\"는 계명은 열째 계명이다(출20:16). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":9,"s":"출애굽기 23장에 의하면 이스라엘 백성들이 여호와의 말씀을 순종하면 여호와께서 왕벌을 보내어 히위 족속, 가나안 족속, 헷 족속을 쫓아내신다고 약속하셨다. (O,X)","a":"O"},{"t":"OT","b":"출애굽기","y":"진위형","n":10,"s":"이스라엘 백성들이 성막을 지을 때에 그 속의 기물 중에 하나인 등잔대는 순동으로 만들어졌다(출25:31). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형","n":11,"s":"이스라엘 백성들이 광야에서 성막을 완성하였을 때 여호와의 천사들이 성막에 충만하게 임했다(출40:34-35). (O,X)","a":"X"},{"t":"OT","b":"출애굽기","y":"진위형", ,"s":"제사장은 창녀나 이혼녀를 아내로 취해서는 안된다. (O,X)","a":"O"},{"t":"OT","b":"레위기","y":"진위형","n":21,"s":"제사장의 출가한 딸은 이혼당해 아버지의 집에 머무는 중에도 성물은 먹을 수 없다. (O,X)","a":"X"},{"t":"OT","b":"레위기","y":"진위형","n":22,"s":"토지는 오직 희년에만 무를 수 있다. (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"선택형","n":1,"s":"민수기 35장 7절에서 레위지파에게 주어진 성읍의 수는 몇인가?","c":["48","12","7","50"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":2,"s":"민수기 12장 1절에서 미리암과 아론이 모세를 비방한 이유는 무엇인가?","c":["모세가 구스 여자를 쫓아내어서","구스 여자가 모세를 사랑하여","모세가 구스 여자를 취하여서","모세가 구스에서 살고 싶어서"],"a":"3"},{"t":"OT","b":"민수기","y":"선택형","n":3,"s":"\"하나님은 사람이 아니시니 거짓말을 하지 않으시고 인생이 아니시니 후회가 없으시도다 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴\"(민23:19) 이 말씀은 누가 누구에게 한 것인가?","c":["모세가 미리암에게","발람이 발락에게","발락이 발람에게","모세가 발락에게"],"a":"2"},{"t":"OT","b":"민수기","y":"선택형","n":4,"s":"다음 중 틀린 것은 무엇인가?(민1-2)","c":["이스라엘 12지파는 진을 치고 있을 때와 행진 중일 때 항상 괘가 중앙에 있다","이스라엘 12지파는 진을 치고 있을 때와 행진 중일 때 그 배열이 서로 달랐다","진을 치고 있을 때 유다 지파는 해 돋는 동편에 위치한다","레위인 외에 사람이 장막 운반하는 데에 가까이 오면 죽는다"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":5,"s":"다음 괄호 안에 들어갈 말은 무엇인가? \"그 다음에 ( )이(가) 레위인의 진과 함께 모든 진의 중앙에 있어 진행하되 그들의 진친 순서대로 각 사람은 그 위치에서 그 기를 따라 앞으로 행할지니라\"(민2:17)","c":["제사장","장막","법궤","회막"],"a":"4"},{"t":"OT","b":"민수기","y":"선택형","n":6,"s":"민수기 3장 9절에 따르면 레위인은 누구와 누구의 자손에게 온전히 맡겨지는가?","c":["아론","모세","여호수아","게르손"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":7,"s":"민수기 5장 6-7절에 따르면, 사람들이 죄를 지으면 어떻게 해야 하는가? 다음 중 가장 정확한 것은 무엇인가?","c":["도피성에 도망가서 제사장께 자복한다","그 지은 죄를 자복하고 그 죄 값을 평생토록 오배를 갚는다","그 지은 죄를 자복하고 그 죄 값을 온전히 갚되 오분의 일을 더하여 그가 죄를 지었던 그 사람에게 돌려준다","도피성에 도망가서 숨는다"],"a":"3"},{"t":"OT","b":"민수기","y":"선택형","n":8,"s":"민수기 7장에 관한 내용이다. 다음 중 틀린 것은 무엇인가?","c":["족장들은 여호와께 수레를 바쳤다(3절)","그 수레들은 레위인들에게 주어지고 회막 봉사에 쓰였다(5절)","제단을 봉헌할 때 예물을 드린다(10절 이하)","희생제물은 반드시 저녁때에만 드려야 한다"],"a":"4"},{"t":"OT","b":"민수기","y":"선택형","n":9,"s":"민수기에 대한 내용 중 틀린 것은 무엇인가?","c":["민수기에는 두 번의 이스라엘 인구 조사에 관한 보고가 있다","두 번째 인구조사 (민 26)는 출애굽 세대 인구를 조사한 것이다","민수기는 이스라엘 백성이 40년 동안 광야에서 유랑하는 내용이다","민수기는 소위 '오경'이라 불리는 책 중 한 권이다"],"a":"2"},{"t":"OT","b":"민수기","y":"선택형","n":10,"s":"민수기와 관련 없는 것은 무엇인가?","c":["지도자 모세","메추라기와 만나","장대에 달린 놋뱀","희년법"],"a":"4"},{"t":"OT","b":"민수기","y":"선택형","n":11,"s":"“내가 그를 보아도 이때의 일이 아니며 내가 그를 바라보아도 가까운 일이 아니로다 한 별이 야곱에게서 나오며 한 규가 이스라엘에게서 일어나서 모압을 이쪽에서 저쪽까지 쳐서 무찌르고 또 셋의 자식들을 다 멸하리로다”(민24:17) 이 구절과 관련하여 맞는 것은 무엇인가?","c":["모세가 시내산에서 한 예언이다","이스라엘을 저주하기 원하였던 발락이 이방 선지자 발람으로부터 들은 말이다","미리암에게 신이 내려 모세에게 한 노래이다","고라와 그의 일당들이 반역하여 벌 받은 후 모세가 한 예언이다"],"a":"2"},{"t":"OT","b":"민수기","y":"선택형","n":12,"s":"이스라엘 백성은 약 40년간 광야에서 불순종의 시기를 보낸다(민10-25). 이 후 그들의 모습으로 옳은 것은 무엇인가?","c":["다시 인구 조사를 하며 재정비 한다","모세를 크게 원망하며 극한 반란을 일으킨다"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":13,"s":"민수기에 대한 내용으로 틀린 것은 무엇인가?","c":["민수기에는 희생제사와 서원에 대한 기록이 없다","모세를 이어 여호수아가 이스라엘의 지도자가 된다","백성 중 일부가 가나안 동편에 정착한다","광야에서 불순종 하던 이스라엘 백성 중 오직 여호수아와 갈렙만이 후에 가나안을 들어간다"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":14,"s":"가나안 정탐꾼들의 보고에 대한 내용 중 틀린 것은 무엇인가? (민13장)","c":["그 땅엔 젖과 꿀이 흐르고 있지 않았다","갈렙은 올라가 그 땅을 취하자고 하였다","그 땅 거주민은 강하고 성읍은 견고하고 심히 크다","그 땅의 과일을 가지고 와 보여주었다"],"a":"1"},{"t":"OT","b":"민수기","y":"선택형","n":15,"s":"민수기 16장 48절 말씀인 “죽은 자와 산 자 사이에 섰을 때에 염병이 그치니라”와 관계없는 내용은 무엇인가?","c":["그 서있는 자는 향로를 들고 있는 아론이다","그 서있는 자는 놋뱀 달린 장대를 들고 있는 모세이다","모세와 아론에게 반역한 이들이 염병에 걸렸다","아론은 모세의 명대로 행동하였다"],"a":"2"},{"t":"OT","b":"민수기","y":"선택형","n":16,"s":"민수기에 대한 내용 중 틀린 것은 무엇인가?","c":["하나님이 시내산에서 주신 부가된 명령들이 나온다","시내산에서 광야를 거쳐 약속된 땅에 이르는 여정이 나온다","모세가 여호와 하나님을 만난 장면이 처음으로 기록되어있다","네겝과 요단 동편의 정복과 이주에 대한 내용이 기록되어있다"],"a":"3"},{"t":"OT","b":"민수기","y":"선택형","n":17,"s":"민수기 1장에 대한 내용 중 옳은 것은 무엇인가?","c":["1장에 나온 인구 조사는 남자 여자 노인 어린아이 모두의 수를 계수한 것이다.","인구 조사 때 가장 큰 지파는 유다지파였다.","레위인도 유사시엔 병역의무가 있었다.","민수기 1장에서 인구 조사 후 다시는 인구조사를 하지 않았다."],"a":"2"},{"t":"OT","b":"민수기","y":"선택형","n":18,"s":"다음 중 민수기에서 규정하고 있지 않는 것은 무엇인가? (민5장)","c":["모든 부정 한 것들을 추방 하는 것","소유권 침해에 대한 배상","아내의 간통 혐의에 대한 규정","성전 봉헌에 대한 규정"],"a":"4"},{"t":"OT","b":"민수기","y":"완성형","n":1,"s":"가나안 정탐군들의 보고는 다음과 같다. 완성하시오. “아말렉인은 남방 땅에 거주하고 헷인과 여부스인과 아모리인은 ( )에 거주하고 가나안인은 해변과 요단강가에 거주하더이다”(민13:29).","a":"산지"},{"t":"OT","b":"민수기","y":"완성형","n":2,"s":"이스라엘 자손이 여호와께 거제로 드리는 모든 성물은 내가 영구한 몫의 음식으로 너와 네 자녀에게 주노니 이는 여호와 앞에 너와 네 후손에게 영원한 ( ) 언약이니라(민18:19).","a":"소금"},{"t":"OT","b":"민수기","y":"완성형","n":3,"s":"호세아 9장 10절에 이스라엘 백성이 바알브올에 가서 부끄러운 우상에게 몸을 드림으로 저희가 사랑하는 우상 같이 가증하여졌다고 말하였다. 이 사건은 민수기 25장에서 그들이 ( )에 머물 때에 ( ) 여자들과 음행한 사건을 언급하는 것이다.","a":"싯딤, 모압"},{"t":"OT","b":"민수기","y":"완성형","n":4,"s":"레위 지파를 대표했던 아론의 지팡이에 꽃이 피고 열매가 열려 그가 선택된 후 하나님께서 하신 말씀은 다음과 같다. \"너와 네 아들들과 네 조상의 가문은 성소에 대한 ( )를 함께 담당할 것이요 너와 네 아들들은 너희의 제사장 직분에 대한 ( )를 함께 담당할 것이니라\"(민18:1).","a":"죄, 죄"},{"t":"OT","b":"민수기","y":"완성형","n":5,"s":"민수기의 지역적 배경은, 처음 1-10:10은 시내산이고 다음 10:11-25:18은 ( )이며 마지막 26-36:13은 모압 평지이다.","a":"광야"},{"t":"OT","b":"민수기","y":"완성형","n":6,"s":"보라 내가 이스라엘 자손 중에서 ( )을 택하여 이스라엘 자손 중에 태를 열어 태어난 모든 자를 대신하게 하였은즉 ( )은 내 것이라(민3:12).","a":"레위인"},{"t":"OT","b":"민수기","y":"완성형","n":7,"s":"민수기 11장에서 모세가 백성을 감당하기에 힘들어 하자, \"여호와께서 모세에게 이르시되 이스라엘 노인 중에 네가 알기로 백성의 ( )와 지도자가 될 만한 자 칠십 명을 모아 내게 데리고와 회막에 이르러 거기서 너와 함께 서게 하라. 내가 강림하여 거기서 너와 말하고 네게 임한 영을 그들에게도 임하게 하리니 그들이 너와 함께 백성의 짐을 담당하고 너 혼자 담당하지 아니하리라\"라고 말씀하셨다(민11:16-17).","a":"장로"},{"t":"OT","b":"민수기","y":"완성형","n":8,"s":"모세가 그에게 이르되 네가 나를 두고 시기하느냐 여호와께서 그의 영을 그의 모든 백성에게 주사 다 ( )가/이 되게 하시기를 원하노라(민11:29).","a":"선지자"},{"t":"OT","b":"민수기","y":"완성형","n":9,"s":"내가 이스라엘의 ( )를 레위 자손에게 기업으로 다 주어서 그들이 하는 일 곧 회막에서 하는 일을 갚나니(민18:21).","a":"십일조"},{"t":"OT","b":"민수기","y":"완성형","n":10,"s":"제사장 아론의 손자 엘르아살의 아들 비느하스가 내 ( )으로 질투하여 이스라엘 자손 중에서 내 노를 돌이켜서 내 ( )으로 그들을 소멸하지 않게 하였도다(민25:11).","a":"질투심, 질투심"},{"t":"OT","b":"민수기","y":"완성형","n":11,"s":"너희는 너희가 거주하는 땅을 더럽히지 말라 ( )는 땅을 더럽히나니 ( ) 흘림을 받은 땅은 그 ( )를 흘리게 한 자의 피가 아니면 속함을 받을 수 없느니라(민35:33).","a":"피, 피, 피"},{"t":"OT","b":"민수기","y":"완성형","n":12,"s":"민수기 20장에서 이스라엘 백성에게 물이 부족하자 하나님의 기적으로 바위에서 물이 나왔다. 다음 13절을 완성하라. \"이스라엘 자손이 여호와와 다투었으므로 이를 ( ) 물이라 하니라 여호와께서 그들 중에서 그 거룩함을 나타내셨더라\"","a":"므리바"},{"t":"OT","b":"민수기","y":"완성형","n":13,"s":"이스라엘 자손에게 말하여 그들에게 이르라 너희가 요단강을 건너 가나안 땅에 들어가거든 너희를 위하여 성읍을 ( )으로 정하여 부지중에 살인한 자가 그리로 피하게 하라(민35:10-11)","a":"도피성"},{"t":"OT","b":"민수기","y":"단답형","n":1,"s":"‘아비람’과 ‘온’과 함께 당을 짓고 모세에게 반역한 인물은 누구인가? ( )","a":"고라"},{"t":"OT","b":"민수기","y":"단답형","n":2,"s":"이스라엘 자손이 신 광야에 이르러 백성이 가데스에 이르렀을 때에 거기서 죽어 장사된 인물은 누구인가? ( )","a":"미리암"},{"t":"OT","b":"민수기","y":"단답형","n":3,"s":"모압의 발락은 지속적으로 누구의 아들로 소개된다. 그의 아버지 이름은 무엇인가? (민22:2, 4, 10, 16; 23:18; 삿11:25; 수24:9) ( )","a":"십볼"},{"t":"OT","b":"민수기","y":"단답형","n":4,"s":"민수기 6장은 특별한 서원에 대하여 말하는데, 자기 몸을 구별하여 여호와께 드리려고 하면 자기 몸을 구별하는 모든 날 동안에는 포도나무 소산은 씨나 껍질이라도 먹지 않고 그 서원을 하고 구별하는 모든 날 동안은 삭도를 절대로 그의 머리에 대지 않는 서원은 누구의 서원인가? ( )","a":"나실인"},{"t":"OT","b":"민수기","y":"단답형","n":5,"s":"여호와의 모든 계명을 기억하여 준행하고 방종하게하는 마음과 눈의 욕심을 따라 음행하지 않게 하기 위해 이스라엘 백성이 의복에 특별히 달은 것은 무엇인가? (민15:38-39)( )","a":"술"},{"t":"OT","b":"민수기","y":"단답형","n":6,"s":"모세를 뒤 이을 후계자로 임명된 사람은 누구인가? ( )","a":"여호수아"},{"t":"OT","b":"민수기","y":"단답형","n":7,"s":"이스라엘을 저주하도록 모압 왕 발락에게 고용된 이방 예언자는 누구인가? ( )","a":"발람"},{"t":"OT","b":"민수기","y":"단답형","n":8,"s":"민수기 4장에서 지성소와 천막, 휘장 등을 운반하기로 임무를 받은 이들은 누구인가? ( )","a":"레위인"},{"t":"OT","b":"민수기","y":"진위형","n":1,"s":"민수기 9장 11절에 다르면 시체로 부정케 된 자의 유월절은 둘째 달 열넷째 날이다. (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":2,"s":"민수기 21장에서 모세가 놋뱀을 만들어 장대위에 달았다. 뱀에게 물린 자들은 이 놋뱀을 만져야만 살 수 있었다. (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":3,"s":"이스라엘 백성을 계수할 때에 항상 레위 지파를 먼저 계수하였다(민1:49). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":4,"s":"민수기에서 이스라엘 인구 조사가 두 번 이루어졌는데, 한번은 시내산에서 또 한 번은 모압 평지에서 이루어졌다. (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":5,"s":"민수기 14장 22절은 말하기를, 하나님의 영광과 애굽과 광야에서 행한 이적을 보고서도 열 번이나 그를 시험하고 목소리를 청종하지 아니한 사람들은 그들의 조상들에게 맹세한 땅을 결단코 보지 못할 것이라고 말한다. (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":6,"s":"모세와 아론은 하나님을 믿었으나 그의 거룩함을 나타내지 아니하였기 때문에 백성들을 그들에게 주기로 한 땅에 이끌지 못한다(민20:12). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":7,"s":"이스라엘 백성은 하나님이 주시기로 한 가나안 땅을 정탐하고 나서 감사의 예배를 드린다(민14:1). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":8,"s":"여호와는 이스라엘 자손 중에 아론의 분깃이요 아론의 기업이다(민18:20). (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":9,"s":"이스라엘 민족은 싯딤에서 모압 여자들과 음행하며 바알브올에 가담하였다(민25). (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":10,"s":"민수기는 여자의 서원에 대하여는 말하고 있지 않다(민30장). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":11,"s":"민수기 2장에서 이스라엘 자손의 진 편성은 동서남북으로 나누어서 하였다. (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":12,"s":"부정한 사람은 한 달 뒤에 유월절을 거행해야 한다(민9:1-14). (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":13,"s":"모세의 배타적 권위를 미리암과 아론이 비난을 하자 하나님은 세 사람 모두와 말씀하시기로 한다(민12:1-16). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":14,"s":"민수기 14장에서, 여호와께 방종하였던 이스라엘은 아멜렉에게 패전한다. (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":15,"s":"아론이 죽은 후 엘르아살이 그의 후계자가 된다(민20:22-29). (O,X)","a":"O"},{"t":"OT","b":"민수기","y":"진위형","n":16,"s":"민수기 31장에서, 이스라엘 백성은 미디안 사람들에게 우호적이어서 여자는 물론 남자들도 치지 말라고 여호와께서 명하신다. (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":17,"s":"르우벤, 갓, 베냐민, 므낫세 반 지파는 요단 동편 지역에 정착하기를 원하였다(민32장). (O,X)","a":"X"},{"t":"OT","b":"민수기","y":"진위형","n":18,"s":"땅의 소유권은 결혼을 통해 다른 지파에게로 넘어갈 수 있다(민36장). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"선택형","n":1,"s":"신명기는 모세의 연설들을 많이 담고 있다. 이에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["연설에 담겨있는 율법에는 큰 축복뿐만 아니라 저주의 내용도 있다","모세가 죽기 전 요단강 서쪽에 머무르고 있는 이스라엘 민족에게 한 그의 연설이 담겨져 있다","모세의 연설은 호렙이라 불리는 하나님의 산에서 있었던 일들을 회상 한다","모세 연설의 중심에는 율법(토라)이 강조되어 있다"],"a":"2"},{"t":"OT","b":"신명기","y":"선택형","n":2,"s":"다음 중 신명기에서 발견 되지 않는 규정은 무엇인가?","c":["소위 십계명이라 불리는 율법","왕이 지켜야 할 율법","병역 의무 면제에 관한 법","이스라엘 여러 성소에서 제의를 행해야 한다는 법"],"a":"4"},{"t":"OT","b":"신명기","y":"선택형","n":3,"s":"신명기에서 율법에 대하여 본격적으로 다루기 전 모세는 여러 경고의 말을 한다. 이에 대한 내용으로 틀린 것은? (신4:1-49)","c":["형상을 만들어 숭배하지 마라","한번 약속의 땅에 들어가면 영원히 그 곳에서 살 것이다","여호와 하나님 외에 다른 신은 없다","여호와께서 이스라엘 백성의 조상을 애굽에서 건져내셨다"],"a":"2"},{"t":"OT","b":"신명기","y":"선택형","n":4,"s":"다음 중 신명기 5장에 나온 소위 '십계명' 에 속하지 않는 것은 무엇인가?","c":["너희는 예루살렘에서만 하나님께 제사를 드려라","여호와 외에는 다른 신들을 네게 두지 말아라","하나님 여호와의 이름을 망령되이 일컫지 말라","네 이웃에 대하여 거짓 증거하지 말아라"],"a":"1"},{"t":"OT","b":"신명기","y":"선택형","n":5,"s":"다음은 신명기 6-11장에 나온 권면과 내용들이다. 옳지 않은 것은 무엇인가?","c":["만나 사건을 회고 한다","아론의 죽음","사마리아인들에 대한 경고","하나님께서 고아와 과부, 나그네를 돌보신다"],"a":"3"},{"t":"OT","b":"신명기","y":"선택형","n":6,"s":"신명기 율법(12-26장)에서 다루지 않는 것은?","c":["십일조","순례의 의무","참예언의 기준","예루살렘 성전 재건축"],"a":"4"},{"t":"OT","b":"신명기","y":"선택형","n":7,"s":"모세의 마지막 활동(31-34장)에 대한 것으로 옳지 않는 것은? (신 31:16)","c":["땅 정복을 위한 격려","율법 낭독의 의무 권고","죽기 전에 하나님께서 모세에게 느보산에서 약속의 땅을 보라고 하심","이스라엘은 하나님과의 언약을 절대 어기지 않을 것이다"],"a":"4"},{"t":"OT","b":"신명기","y":"선택형","n":8,"s":"신명기 9:7-21에는 출애굽기 32장의 금송아지 사건을 회고하고 있다. 두 본문 사이의 차이점은 무엇인가?","c":["금송아지의 숫자가 다르다","출애굽기에서는 주물을 태워 빻은 것을 물에 타서 마시지만, 신명기에서는 시냇물에 뿌린다","출애굽기에는 주물을 태우기만 하지만, 신명기에서는 태워서 빻기까지 한다","금송아지의 성별이 다르다"],"a":"2"},{"t":"OT","b":"신명기","y":"선택형","n":9,"s":"모세가 신명기서에서 이스라엘 백성에게 연설하고 가르치는 것이 아닌 것은 무엇인가?","c":["죽음 이후의 영광","이스라엘 백성의 과거 역사","여러 율례와 율법들","하나님에게만 충성할 것을 요구"],"a":"1"},{"t":"OT","b":"신명기","y":"선택형","n":10,"s":"모세의 첫 번째 연설 (신1:1-4:43)은 이스라엘 백성의 과거 역사를 상고하며 교훈을 전한다. 이에 대한 옳지 않은 설명은 무엇인가?","c":["이스라엘의 불신앙에 대해 하나님은 심판하신다","이스라엘의 미래 역사는 이미 여호수아에게 다 알려 주셨다","이스라엘이 하나님께 순종할 때에는 하나님이 구원을 베푸신다","하나님에 대한 순종은 축복을 가져오고 불순종은 형벌을 낳는다"],"a":"2"},{"t":"OT","b":"신명기","y":"선택형","n":11,"s":"다음 중 십계명의 제 일 계명은 무엇인가?","c":["너는 네 하나님 여호와의 이름을 망령되이 일컫지 말라","살인하지 말지니라","나를 사랑하고 내 계명을 지키는 자에게는 천 대까지 은혜를 베푸느니라","나 외에는 다른 신들을 네게 두지 말지니라"],"a":"4"},{"t":"OT","b":"신명기","y":"선택형","n":12,"s":"신명기서에서 말하는 여호와 하나님의 성격이 아닌 것은 무엇인가? (신7:9-11)","c":["신실하신 하나님","자신을 사랑하는 자에게 천대까지 그 언약을 이행하시는 하나님","자신을 미워하는 자도 절대 보응하지 않으시는 사랑의 하나님","인애를 베푸시는 하나님"],"a":"3"},{"t":"OT","b":"신명기","y":"선택형","n":13,"s":"신명기 8장에 근거하여, 하나님이 이스라엘로 사십년 동안 광야 길을 걷게 하신 이유가 아닌 것은 무엇인가?","c":["이스라엘 군사들을 훈련시키기 위하여","이스라엘을 낮추시기 위하여","이스라엘을 시험하여 그 마음이 어떠한지 알기 위하여","이스라엘을 시험하여 그 명령을 지키는지 알려하기 위하여"],"a":"1"},{"t":"OT","b":"신명기","y":"선택형","n":14,"s":"다음 중 신명기서에 나오는 규례가 아닌 것은 무엇인가? (신13장)","c":["십일조","정한 음식과 가증한 음식","빚을 면제해 주는 면제년","우상 숭배자들을 돌보아 개종시키는 법"],"a":"4"},{"t":"OT","b":"신명기","y":"완성형","n":1,"s":"'쉐마 이스라엘' 은 신명기의 가장 유명하고 중요한 구절로 알려진 6장 4절을 일컫는다. 다음 4-5절의 괄호 안에 공통적으로 들어 갈 단어를 적어라. \"이스라엘아 들으라 우리 하나님 ( )는 오직 유일한 ( )이시니, 너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 ( )를 사랑하라.\"","a":"여호와"},{"t":"OT","b":"신명기","y":"완성형","n":2,"s":"네 하나님 여호와가 네게 명령한 대로 ( )을 지켜 거룩하게 하라 (신5:12).","a":"안식일"},{"t":"OT","b":"신명기","y":"완성형","n":3,"s":"십계명의 내용이다. 괄호 안에 알맞은 말을 적어라. \"너는 네 하나님 여호와께서 명령한 대로 네 ( )를 공경하라 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길고 복을 누리리라\"(신5:16)","a":"부모"},{"t":"OT","b":"신명기","y":"완성형","n":4,"s":"이러므로 너희는 나의 이 ( )을/를 너희의 마음과 뜻에 두고 또 그것을 너희의 손목에 매어 기호를 삼고 너희 미간에 붙여 표를 삼으며 또 그것을 너희의 자녀에게 가르치며 집에 앉아 있을 때에든지, 길을 갈 때에든지, 누워 있을 때에든지, 일어날 때에든지 이 ( )을/를 강론하고, 또 네 집 문설주와 바깥문에 기록하라(신11:18-20).","a":"말(말씀)"},{"t":"OT","b":"신명기","y":"완성형","n":5,"s":"내가 오늘 ( )과 ( )를 너희 앞에 두나니, 너희가 만일 내가 오늘 너희에게 명하는 너희의 하나님 여호와의 명령을 들으면 ( )이 될 것이요, 너희가 만일 내가 오늘 너희에게 명령하는 도에서 돌이켜 떠나 너희의 하나님 여호와의 명령을 듣지 아니하고 본래 알지 못하던 다른 신들을 따르면 ( )를 받으리라(신11:26-28).","a":"복, 저주, 복, 저주"},{"t":"OT","b":"신명기","y":"완성형","n":6,"s":"네 하나님 여호와께 ( )하거든 갚기를 더디하지 말라 네 하나님 여호와께서 반드시 그것을 네게 요구하시리니 더디면 그것이 네게 죄가 될 것이라, 네가 ( )하지 아니하였으면 무죄하리라 그러나 네 입으로 말한 것은 그대로 실행하도록 유의하라 무릇 자원한 예물은 네 하나님 여호와께 네가 ( )하여 입으로 언약한 대로 행할지니라(신23:21-23).","a":"서원"},{"t":"OT","b":"신명기","y":"완성형","n":7,"s":"사람이 새로이 ( )를 맞이하였으면 그를 군대로 내보내지 말 것이요 아무 직무도 그에게 맡기지 말 것이며 그는 일 년 동안 한가하게 집에 있으면서 그가 맞이한 ( )를 즐겁게 할지니라(신24:5).","a":"아내"},{"t":"OT","b":"신명기","y":"완성형","n":8,"s":"형상금지의 근거가 되는 말씀이다. 괄호 안에 알맞은 말을 채워라. \"여호와께서 ( ) 불길 중에서 너희에게 말씀하시던 날에 너희가 어떤 형상도 보지 못하였은즉 너희는 깊이 삼가라\"(신4:15).","a":"호렙 산(출애굽기에는 시내산으로)"},{"t":"OT","b":"신명기","y":"완성형","n":9,"s":"모세가 신명기에서 이스라엘 백성에게 궁극적으로 가르치고자 하는 것이 무엇인지 신명기 1장 5절에 잘 나온다. 괄호 안에 알맞은 말을 채워라. \"모세가 요단 저쪽 모압 땅에서 이 ( )을 설명하기 시작하였더라 일렀으되.\"","a":"율법"},{"t":"OT","b":"신명기","y":"완성형","n":10,"s":"내가 오늘 하늘과 땅을 불러 너희에게 증거를 삼노라 내가 생명과 사망과 복과 저주를 네 앞에 두었은즉 너와 네 자손이 살기 위하여 ( )을 택하고, 네 하나님 여호와를 사랑하고 그의 말씀을 청종하며 또 그를 의지하라 그는 네 ( )이시요 네 장수이시니 여호와께서 네 조상 아브라함과 이삭과 야곱에게 주리라고 맹세하신 땅에 네가 거주하리라(신30:19-20).","a":"생명"},{"t":"OT","b":"신명기","y":"완성형","n":11,"s":"내가 그 때에 너희의 ( )장들에게 명하여 이르기를 너희가 너희의 형제 중에서 송사를 들을 때에 쌍방간에 공정히 판결할 것이며 그들 중에 있는 타국인에게도 그리 할 것이라. ( )은 하나님께 속한 것인즉 너희는 ( )할 때에 외모를 보지 말고 귀천을 차별 없이 듣고 사람의 낯을 두려워하지 말 것이며 스스로 결단하기 어려운 일이 있거든 내게로 돌리라 내가 들으리라 하였고(신1:16-17).","a":"재판"},{"t":"OT","b":"신명기","y":"완성형","n":12,"s":"너를 낮추시며 너를 주리게 하시며 또 너도 알지 못하며 네 조상들도 알지 못하던 만나를 네게 먹이신 것은 사람이 떡으로만 사는 것이 아니요 여호와의 입에서 나오는 모든 ( )으로 사는 줄을 네가 알게 하려 하심이니라(신8:3).","a":"말씀"},{"t":"OT","b":"신명기","y":"완성형","n":13,"s":"그 때에 여호와께서 ( ) 지파를 구별하여 여호와의 언약궤를 메게 하며 여호와 앞에 서서 그를 섬기며 또 여호와의 이름으로 축복하게 하셨으니 그 일은 오늘까지 이르느니라. 그러므로 ( )는 그의 형제 중에 분깃이 없으며 기업이 없고 네 하나님 여호와께서 그에게 말씀하심 같이 여호와가 그의 기업이시니라(신10:8-9).","a":"레위"},{"t":"OT","b":"신명기","y":"완성형","n":14,"s":"다음은 신명기 12장 6-7절의 예배 장소에 대한 법도이다. 괄호 안에 알맞은 말을 채워라. \"너희의 번제와 너희의 제물과 너희의 십일조와 너희 손의 거제와 너희의 서원제와 낙헌 예물과 너희 소와 양의 처음 난 것들을 너희는 그리로 가져다가 드리고, 거기 곧 너희의 하나님 여호와 앞에서 먹고 너희의 하나님 여호와께서 너희의 손으로 수고한 일에 ( ) 주심으로 말미암아 너희와 너희의 가족이 즐거워할지니라.\"","a":"복"},{"t":"OT","b":"신명기","y":"완성형","n":15,"s":"삼가 너는 마음에 악한 생각을 품지 말라 곧 이르기를 일곱째 해 면제년이 가까이 왔다 하고 네 궁핍한 형제를 악한 눈으로 바라보며 아무것도 주지 아니하면 그가 너를 ( )께 호소하리니 그것이 네게 ( )가 되리라(신15:9).","a":"여호와, 죄"},{"t":"OT","b":"신명기","y":"완성형","n":16,"s":"너는 재판을 굽게 하지 말며 사람을 외모로 보지 말며 또 ( )을 받지 말라 ( )은 지혜자의 눈을 어둡게 하고 의인의 말을 굽게 하느니라(신16:19).","a":"뇌물"},{"t":"OT","b":"신명기","y":"단답형","n":1,"s":"신명기 5장에 나오는 소위 '십계명' 의 내용은 성경의 어느 책에 이미 등장한 것인가? ( )","a":"출애굽기"},{"t":"OT","b":"신명기","y":"단답형","n":2,"s":"모세의 후계자로 임명된 자는 누구인가?(신31:1-29) ( )","a":"여호수아"},{"t":"OT","b":"신명기","y":"단답형","n":3,"s":"신명기서에 나온 종교적 가르침과 명령들은 왕하 22-23에 기록된 유다의 종교개혁정신과 일맥상통한다. 유다 어느 왕의 종교개혁인가? ( )","a":"요시야"},{"t":"OT","b":"신명기","y":"단답형","n":4,"s":"고대 이스라엘은 남자의 육신에 할례를 행하였다. 신명기서는 이를 재해석한 것이 유명한데, 어디에 할례를 행하라고 하였는가?(신 10:16; 30:6) ( )","a":"마음"},{"t":"OT","b":"신명기","y":"단답형","n":5,"s":"신명기 8장 19절은 이스라엘이 나그네를 사랑하라고 명한다. 그 이유는 무엇인가? ( )","a":"이스라엘도 애굽 땅에서 나그네 되었었기 때문에"},{"t":"OT","b":"신명기","y":"단답형","n":6,"s":"마음과 뜻에 두고 또 손목에 매어 기호를 삼고 미간에 붙여 표를 삼으며, 자녀에게 가르치며 집에 앉아 있을 때에든지, 길을 갈 때에든지, 누워 있을 때에든지, 일어날 때에든지 강론하고, 또 집 문설주와 바깥문에 기록해야 하는 것은 무엇인가?(신11:18-20) ( )","a":"말(씀)"},{"t":"OT","b":"신명기","y":"단답형","n":7,"s":"고난의 떡이라고도 불리며, 이스라엘 백성이 애굽 땅에서 급히 나온 고난의 날을 기억하기 위하여 먹었던 것은 무엇인가? ( )","a":"무교병"},{"t":"OT","b":"신명기","y":"단답형","n":8,"s":"신명기 17장에서 이스라엘 왕이 평생 자기 옆에 두고 읽어 배우며 지켜 행하여야 할 것은 무엇인가?(신17:17-19) ( )","a":"율법(서)"},{"t":"OT","b":"신명기","y":"진위형","n":1,"s":"신명기에서 모세의 연설은 호렙산에 있었던 일들을 회고하는데, 그 일들은 출애굽기에 나오는 시내산에서 겪었던 일들이다. (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":2,"s":"7장의 권면에서, 하나님은 이스라엘이 가나안의 민족들을 진멸하고 서로 혼인하지 않기를 원하신다. (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":3,"s":"신명기는 이스라엘이 이방 민족을 이겨 승리했을 때에 자만해 지지 말 것을 경고한다. (신9:1-6) (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":4,"s":"신명기는 전 이스라엘을 위하여 여러 성소를 많이 만들 것을 권면하고 있다. (신12:2-31) (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":5,"s":"이방인들의 예배 처소는 이방인들이 알아서 관리하도록 한다(신 12:2-31). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":6,"s":"우상숭배를 권하는 자는 친척 친구들이라 하더라도 죽여야 한다(신 12:2-31). (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":7,"s":"암송아지의 목을 꺾는 의식은 여인이 강간을 당하였을 때 행하는 의식이다. (신21:1-9) (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":8,"s":"전쟁 포로인 여인과는 절대 결혼해서는 안 된다(신21:10-14). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":9,"s":"신명기 법에, 이웃의 포도원에 들어가 그 포도를 배불리 먹어도 되지만 그릇에 담지는 말고, 이웃의 곡식밭에 들어가서 그 이삭을 따도 되지만 낫을 대지는 말라고 명한다(신23:24-25). (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":10,"s":"악인에게 가하는 태형은 40대를 넘지 못한다(신25:2-3). (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":11,"s":"신명기에는 이스라엘 민족이 포로로 잡혀갔다가 귀환할 것 까지 약속하고 있다(신31:1-10). (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":12,"s":"모세는 결국 요단강 건너 약속의 땅으로 들어갔다(신1:34-40). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":13,"s":"민수기 20:14-21에서 에돔은 이스라엘이 자기 지역을 통과하는 것을 거절한다. 그러나 신명기 2:1-8에서는 평화롭게 통과한다. (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":14,"s":"출애굽기 34장에 따르면 십계명을 모세가 돌판에 기록했지만, 신명기 10장에는 하나님께서 직접 기록하셨다. (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":15,"s":"신명기는 하나님께서 주시기로 약속하신 가나안 땅에 들어가기 직전 모압땅에 머물 때에 있었던 일들을 적은 것이다. 하나님께서 하신 그 약속은 모세에게 처음 하신 것이다. (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":16,"s":"하나님은 이스라엘이 배부르고 소유가 풍성해지면 하나님을 잊을까 염려하신다(신8:12-14). (O,X)","a":"O"},{"t":"OT","b":"신명기","y":"진위형","n":17,"s":"여호와의 목전에 악을 행하여 죽여야 하는 자는 한 사람의 증거만 있어도 용서치 말고 죽여야 한다(신17:6). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":18,"s":"'생명에는 생명으로, 눈에는 눈으로, 이에는 이로, 손에는 손으로, 발에는 발로' 라는 식의 법전은 이스라엘 주변 국가들의 법이지 이스라엘은 지니지 않았던 법이다(신19:21). (O,X)","a":"X"},{"t":"OT","b":"신명기","y":"진위형","n":19,"s":"신명기에 따르자면, 하나님의 명령과 말씀은 어렵기 때문에 심히 노력하여야만 행할 수 있다(신30:11-14). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"선택형","n":1,"s":"여리고 성의 함락, 가나안 정복, 땅의 분배 등과 관련된 책은 무엇인가?","c":["출애굽기","민수기","신명기","여호수아"],"a":"4"},{"t":"OT","b":"여호수아","y":"선택형","n":2,"s":"\"오직 강하고 극히 담대하여 나의 종 모세가 네게 명령한 그 율법을 다 지켜 행하고 우로나 좌로나 치우치지 말라 그리하면 어디로 가든지 형통하리니\"라는 약속은 하나님께서 누구에게 주신 것인가? (수1:7)","c":["갈렙","아론","여호수아","사무엘"],"a":"3"},{"t":"OT","b":"여호수아","y":"선택형","n":3,"s":"요단강을 건넌 이스라엘 백성들은 길갈에서 기념비를 세웠는데 그 기념비는 몇 개의 돌로 세워졌는가? (수4:8)","c":["한 개","세 개","열 개","열두 개"],"a":"4"},{"t":"OT","b":"여호수아","y":"선택형","n":4,"s":"요단 강물이 갈라진 때는 언제인가? (수3:15)","c":["여호수아가 손을 들 때","백성들이 소리를 지를 때","언약궤를 멘 제사장들의 발이 요단의 물을 밟을 때","여호수아가 지팡이를 요단강에 내리칠 때"],"a":"3"},{"t":"OT","b":"여호수아","y":"선택형","n":5,"s":"이스라엘 백성들이 가나안 땅을 정복하기 위해 요단강을 건널 때 제일 먼저 요단강에 들어간 사람들은 누구인가? (수3:6)","c":["군인들","찬양을 부르는 자들","연장자들","언약궤를 멘 제사장들"],"a":"4"},{"t":"OT","b":"여호수아","y":"선택형","n":6,"s":"이스라엘 백성들이 여리고 성을 함락시켰을 때 그 속에 있던 외투 한 벌과 은 이백 세겔, 그리고 무게가 오십 세겔이 되는 금덩이 하나를 개인적으로 취한 자는 누구인가? (수7:21)","c":["라합","아간","미가","갈렙"],"a":"2"},{"t":"OT","b":"여호수아","y":"선택형","n":7,"s":"여리고와 아이를 침공한 이스라엘 백성들이 두려워하며 목숨을 건지기 위해 해어진 전대와 찢어진 포도주 부대를 싣고 기운 신을 신고 낡은 옷을 입고 나그네처럼 행세하며 이스라엘과 조약을 맺게 된 주민들은 누구인가? (수9:3-6)","c":["기브온 주민","아모리 주민","브리스 주민","히위 주민"],"a":"1"},{"t":"OT","b":"여호수아","y":"선택형","n":8,"s":"아모리 족속의 다섯 왕에 포함되지 않는 자는 누구인가? (수10:5)","c":["예루살렘 왕","헤브론 왕","야르뭇 왕","두로 왕"],"a":"4"},{"t":"OT","b":"여호수아","y":"선택형","n":9,"s":"여호수아가 이스라엘 지파들에게 가나안 땅을 분배할 때 어떤 방법을 택했는가? (수14:2)","c":["모세의 유언에 따라","제비 뽑아","각 지파들이 원하는대로","여호수아가 명령하여"],"a":"2"},{"t":"OT","b":"여호수아","y":"선택형","n":10,"s":"이스라엘이 가나안에서 쫓아내지 못하여 함께 예루살렘에 거한 족속은 누구인가? (수15:63)","c":["여부스","블레셋","아모리","헷"],"a":"1"},{"t":"OT","b":"여호수아","y":"선택형","n":11,"s":"도피성이 세워진 도시가 아닌 곳은 어디인가? (수20장)","c":["게데스","세겜","헤브론","예루살렘"],"a":"4"},{"t":"OT","b":"여호수아","y":"선택형","n":12,"s":"여호수아는 몇 살에 죽었는가? (수24:29)","c":["100세","110세","120세","130세"],"a":"2"},{"t":"OT","b":"여호수아","y":"선택형","n":13,"s":"이스라엘이 가나안을 점령한 후에 요단강 동쪽으로 가서 살고 싶어했던 지파들에 포함되지 않는 것은 어느 족속인가? (수13:8)","c":["르우벤 지파","갓 지파","시므온 지파","므낫세 반 지파"],"a":"3"},{"t":"OT","b":"여호수아","y":"선택형","n":14,"s":"가나안으로 진입한 이스라엘 군대가 아이 성을 정복할 때에 사용한 전술은 무엇인가? (수8:6)","c":["야간 기습","내분 작전","유인 작전","스파이 작전"],"a":"3"},{"t":"OT","b":"여호수아","y":"완성형","n":1,"s":"여호와의 종 모세가 죽은 후에 여호와께서 모세의 수종자 눈의 아들 ( )에게 말씀하여 이르시되 내 종 모세가 죽었으니 이제 너는 이 모든 백성과 더불어 일어나 이 요단을 건너 내가 그들 곧 이스라엘 자손에게 주는 그 땅으로 가라(수1:1-2).","a":"여호수아"},{"t":"OT","b":"여호수아","y":"완성형","n":2,"s":"여호수아 3장에 의하면 이스라엘 백성들이 요단강을 건너 가나안으로 침공할 때에 여호수아가 제사장들에게 ( )를 메고 백성보다 앞서 건너게 했다.","a":"언약궤(법궤)"},{"t":"OT","b":"여호수아","y":"완성형","n":3,"s":"이스라엘 자손들이 여호수아가 명령한 대로 행하되 여호와께서 여호수아에게 이르신 대로 이스라엘 자손들의 지파의 수를 따라 요단 가운데에서 돌 ( )을 택하여 자기들이 유숙할 곳으로 가져다가 거기에 두었더라(수4:8).","a":"열둘"},{"t":"OT","b":"여호수아","y":"완성형","n":4,"s":"여호와의 군대 ( )이 여호수아에게 이르되 네 발에서 신을 벗으라 네가 선 곳은 거룩하니라 하니 여호수아가 그대로 행하니라(수5:15).","a":"대장(장관)"},{"t":"OT","b":"여호수아","y":"완성형","n":5,"s":"이 성과 그 가운데에 있는 모든 것은 여호와께 온전히 바치되 기생 ( )과 그 집에 동거하는 자는 모두 살려 주라 이는 우리가 보낸 사자들을 그가 숨겨 주었음이니라(수6:17).","a":"라합"},{"t":"OT","b":"여호수아","y":"완성형","n":6,"s":"여리고 성을 함락한 이스라엘 백성들이 아이 성을 진격하였다가 패하게 된 이유는 ( )이 하나님의 명령을 어기고 외투와 은 이백 세겔과 무게가 오십 세겔이 되는 금덩이 하나를 취했기 때문이다(수7:21).","a":"아간"},{"t":"OT","b":"여호수아","y":"완성형","n":7,"s":"여호와께서 ( ) 사람을 이스라엘 자손에게 넘겨 주시던 날에 태양이 머물고 달이 멈추었다(수10:12).","a":"아모리"},{"t":"OT","b":"여호수아","y":"완성형","n":8,"s":"여호수아가 갈렙에게 기업으로 분배한 지역은 ( )이다(수14:13).","a":"헤브론"},{"t":"OT","b":"여호수아","y":"완성형","n":9,"s":"갈렙의 딸 악사가 출가할 때 아버지에게 구한 것은 밭과 샘물이었는데, 갈렙은 그녀에게 윗샘과 ( )을 주었다(수15:19).","a":"아랫샘"},{"t":"OT","b":"여호수아","y":"완성형","n":10,"s":"여호와께서 그들의 주위에 ( )을 주셨으되 그 조상들에게 맹세하신 대로 하셨으므로 그들의 모든 원수들 중에 그들과 맞선 자가 하나도 없었으니 이는 여호와께서 그들의 모든 원수들을 그들의 손에 넘겨 주셨음이니라(수21:44).","a":"안식"},{"t":"OT","b":"여호수아","y":"완성형","n":11,"s":"\"만일 여호와를 섬기는 것이 너희에게 좋지 않게 보이거든 너희 조상들이 강 저쪽에서 섬기던 신들이든지 또는 너희가 거주하는 땅에 있는 아모리 족속의 신들이든지 너희가 섬길 자를 오늘 택하라 오직 나와 내 집은 여호와를 섬기겠노라\"라고 선포한 자는 ( )이다(수24:15).","a":"여호수아"},{"t":"OT","b":"여호수아","y":"완성형","n":12,"s":"또 이스라엘 자손이 애굽에서 가져 온 ( )의 뼈를 세겜에 장사하였으니 이곳은 야곱이 백 크시타를 주고 세겜의 아버지 하몰의 자손들에게서 산 밭이라(수24:32).","a":"요셉"},{"t":"OT","b":"여호수아","y":"완성형","n":13,"s":"여호수아 때에 회막이 세워진 곳은 ( )이다(수18:1).","a":"실로"},{"t":"OT","b":"여호수아","y":"완성형","n":14,"s":"요셉이 장사된 곳은 ( )이다(수24:32).","a":"세겜"},{"t":"OT","b":"여호수아","y":"단답형","n":1,"s":"여리고에 살았던 기생으로 이스라엘의 두 정탐꾼을 숨겨준 사람은 누구인가? (수2:2-3) ( )","a":"라합"},{"t":"OT","b":"여호수아","y":"단답형","n":2,"s":"\"우리가 듣자 곧 마음이 녹았고 너희로 말미암아 사람이 정신을 잃었나니 너희의 하나님 여호와는 위로는 하늘에서도 아래로는 땅에서도 하나님이시니라\"라고 고백한 사람은 누구인가? (수2:11) ( )","a":"라합"},{"t":"OT","b":"여호수아","y":"단답형","n":3,"s":"요단강을 건넌 이스라엘 백성들이 할례 산에서 할례를 행한 곳은 어느 지역인가? (수5:9) ( )","a":"길갈"},{"t":"OT","b":"여호수아","y":"단답형","n":4,"s":"이스라엘 백성들이 여리고 성을 함락시키기 위해 성 주위를 몇 번 돌았는가? (수6:3-4) ( )","a":"13(열셋)"},{"t":"OT","b":"여호수아","y":"단답형","n":5,"s":"이스라엘 백성들이 여리고 성을 함락시켰을 때 그 속에 있던 외투 한 벌과 은 이백 세겔과 무게가 오십 세겔 되는 금덩이 하나를 취한 자는 누구인가? (수7:21) ( )","a":"아간"},{"t":"OT","b":"여호수아","y":"단답형","n":6,"s":"광야에서 내렸던 만나가 그친 곳은 어디인가? (수5:10-12) ( )","a":"길갈"},{"t":"OT","b":"여호수아","y":"단답형","n":7,"s":"\"태양이 중천에 머물러서 거의 종일토록 속히 내려가지 아니하였다\"고 기록하고 있어서 여호수아에서도 인용하고 있는 책은 무엇인가? (수10:12-13) ( )","a":"야살의 책"},{"t":"OT","b":"여호수아","y":"단답형","n":8,"s":"\"그 날에 여호와께서 말씀하신 이 산지를 지금 내게 주소서 당신도 그 날에 들으셨거니와 그 곳에는 아낙 사람이 있고 그 성읍들은 크고 견고할지라도 여호와께서 나와 함께 하시면 내가 여호와께서 말씀하신 대로 그들을 쫓아내리이다\"라고 말한 자는 누구인가? (수14:12) ( )","a":"갈렙"},{"t":"OT","b":"여호수아","y":"단답형","n":9,"s":"부지중에 실수로 사람을 죽인 자가 도망하여 피의 보복자를 피할 수 있도록 만든 성을 무엇이라고 하는가? (수20:3) ( )","a":"도피성"},{"t":"OT","b":"여호수아","y":"단답형","n":10,"s":"여호수아가 가나안 땅을 정복한 후에 요단 강 동쪽으로 돌려보낸 지파들은 르우벤 사람과 갓 사람과 또 어떤 지파의 반인가? (수13:8) ( )","a":"므낫세"},{"t":"OT","b":"여호수아","y":"단답형","n":11,"s":"여호수아 24장에 의하면 여호수아의 마지막 설교가 주어진 곳은 어디인가? ( )","a":"세겜"},{"t":"OT","b":"여호수아","y":"단답형","n":12,"s":"아론의 아들로서, 이스라엘 백성들이 가나안을 점령할 때 여호수아와 함께 지도자 역할을 했던 제사장은 누구인가? (수14:1, 24:33) ( )","a":"엘르아살"},{"t":"OT","b":"여호수아","y":"단답형","n":13,"s":"제사장 엘르아살의 아들로서 르우벤, 갓, 므낫세 반 지파들이 요단강 동쪽에서 여호와만을 섬기며 살도록 다짐하게 만든 자는 누구인가? (수22:13) ( )","a":"비느하스"},{"t":"OT","b":"여호수아","y":"진위형","n":1,"s":"여리고에 살았던 라합의 직업은 여사제였다(수2:1). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":2,"s":"가나안 정복을 시작한 이스라엘 백성들이 처음 침공해야 했던 성은 아이성이다(수6장).","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":3,"s":"이스라엘 백성들이 요단강을 건널 때에는 곡식을 거두는 시기여서 요단강에 물이 없어 건너기가 쉬웠다(수3:15). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":4,"s":"요단강을 건넌 이스라엘 백성들이 할례 산에서 할례를 행했을 때 여호와께서 그들에게 \"내가 오늘 애굽의 수치를 너희에게서 떠나가게 하였다\"고 말씀해주셨다(수5:9). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":5,"s":"요단 강을 건넌 이스라엘 백성들이 처음으로 진을 친 곳은 여리고이다(수4:19). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":6,"s":"광야에서 내렸던 만나가 비로소 그친 곳은 길갈이다(수 5:12). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":7,"s":"이스라엘이 아모리 사람들과 싸울 때에 태양이 중천에 머물러서 거의 종일토록 속히 내려가지 않았다는 점을 언급하고 있어서 여호수아가 인용하고 있는 책은 야살의 책이다(수10:13). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":8,"s":"자신들에게 배분된 땅이 너무 좁다고 불평하며 더 많은 땅을 달라고 하자 여호수아가 그들로 하여금 스스로 개척하라고 명령했던 지파들은 요셉의 자손이었던 에브라임과 므낫세 지파이다(수17:14-18). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":9,"s":"도피성에는 부지중에 실수로 사람을 죽인 자들뿐만 아니라 의도적으로 사람을 죽인 자도 함께 피하여 보복을 면할 수 있었다(수20:3). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":10,"s":"여호수아는 가나안을 정복한 후에 요단 강 동쪽으로 돌아가려하는 르우벤, 갓, 므낫세 반 지파에게 절대로 그곳으로 다시 돌아가지 못하도록 명령했다(수22:1-6). (O,X)","a":"X"},{"t":"OT","b":"여호수아","y":"진위형","n":11,"s":"예루살렘에 거주한 가나안의 부족은 여부스 족이다(수15:63). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":12,"s":"여리고 성을 함락시킨 이스라엘 백성들은 그 전리품들을 여호와의 곳간에 넣어야 했다 (수6:19). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":13,"s":"여호수아가 분깃으로 받은 성읍은 에브라임 산지 딤낫 세라이다(수19:50). (O,X)","a":"O"},{"t":"OT","b":"여호수아","y":"진위형","n":14,"s":"아간은 돌로 처형되고 불사름을 당했다(수 7:25-26). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"선택형","n":1,"s":"\"여호수아가 죽은 후에 이스라엘 자손이 여호와께 여쭈어 이르되 우리 가운데 누가 먼저 올라가서 가나안 족속과 싸우리이까\"라는 구절로 시작되는 책은 무엇인가?","c":["여호수아","신명기","사사기","사무엘서"],"a":"3"},{"t":"OT","b":"사사기","y":"선택형","n":2,"s":"\"이스라엘 자손이 여호와의 목전에 악을 행하여 자기들의 하나님 여호와를 잊어버리고 바알들과 아세라들을 섬긴지라\"라는 구절과 비슷한 구절들이 반복되는 책은 무엇인가? (삿3:7)","c":["사사기","여호수아","신명기","사무엘서"],"a":"1"},{"t":"OT","b":"사사기","y":"선택형","n":3,"s":"가나안 왕 야빈의 군대 장관 시스라를 쳐죽인 여인은 누구인가? (삿4:21)","c":["라합","라헬","미리암","야엘"],"a":"4"},{"t":"OT","b":"사사기","y":"선택형","n":4,"s":"다음 중 이스라엘의 사사가 아닌 자는 누구인가?","c":["여룹바알","입다","입산","요시야"],"a":"4"},{"t":"OT","b":"사사기","y":"선택형","n":5,"s":"드보라에 관한 설명 중에서 틀린 것은 무엇인가? (삿4:4-6)","c":["남편이 랍비돗이다","여선지자이다","가나안 왕 야빈과 싸웠다","발람을 군대 장관으로 세웠다"],"a":"4"},{"t":"OT","b":"사사기","y":"선택형","n":6,"s":"기드온이 전쟁에 나갈 용사들을 택한 순서로 옳은 것은 무엇인가? (삿7:1-8)","c":["삼만-일만-칠백","일만-오천-삼백","삼만 이천-일만-삼백","일반-칠천-삼백"],"a":"3"},{"t":"OT","b":"사사기","y":"선택형","n":7,"s":"사사기 9장에 언급되는 요담의 비유에 포함되지 않는 나무는 무엇인가?","c":["감람나무","떨기나무","무화과나무","가시나무"],"a":"2"},{"t":"OT","b":"사사기","y":"선택형","n":8,"s":"기생의 아들로 태어나 사사가 된 자는 누구인가? (삿11:1)","c":["입다","입산","압돈","삼손"],"a":"1"},{"t":"OT","b":"사사기","y":"선택형","n":9,"s":"삼손에 관해 틀린 것은 무엇인가? (삿13-16장)","c":["단 지파","나실인","블레셋과 대적","이스라엘 여인 들릴라와 결혼"],"a":"4"},{"t":"OT","b":"사사기","y":"선택형","n":10,"s":"사사 삼손의 힘의 근원은 어디에 있었는가? (삿16:17)","c":["머리털","오른팔","왼팔","넓적다리"],"a":"1"},{"t":"OT","b":"사사기","y":"선택형","n":11,"s":"레위인의 첩 사건으로 이스라엘의 열 한 지파가 베냐민 지파를 치려고 모인 곳은 어디인가? (삿20:1)","c":["길갈","세겜","미스바","헤브론"],"a":"3"},{"t":"OT","b":"사사기","y":"선택형","n":12,"s":"베냐민에 속한 기브아 사람들이 한 레위인의 첩을 밤새도록 능욕하다가 죽게 만들자 그 레위인이 시체를 열두 덩이로 나누어 이스라엘 사방에 뿌린 사건이 기록되고 있는 책은? (삿19장)","c":["사사기","사무엘서","열왕기서","여호수아"],"a":"1"},{"t":"OT","b":"사사기","y":"선택형","n":13,"s":"여호수아가 죽은 후에 \"그 세대의 사람도 다 그 조상들에게로 돌아갔고 그 후에 일어난 다른 세대는 여호와를 알지 못하며 여호와께서 이스라엘을 위하여 행하신 일도 알지 못하였더라\"라는 구절이 언급되는 책은 무엇인가? (삿2:10)","c":["사사기","사무엘서","열왕기서","룻기"],"a":"1"},{"t":"OT","b":"사사기","y":"선택형","n":14,"s":"가나안의 군대 장관 시스라가 야엘의 장막에 들어와 물을 달라고 했을 때 그녀가 준것은 무엇인가? (삿 5:25)","c":["물","포도주","신선한 우유","엉긴 우유"],"a":"4"},{"t":"OT","b":"사사기","y":"완성형","n":1,"s":"사사기는 \"그 때에 이스라엘이 ( )이 없으므로 사람이 각기 자기의 소견에 옳은 대로 행하였더라\"라는 구절로 끝난다(삿21:25).","a":"왕"},{"t":"OT","b":"사사기","y":"완성형","n":2,"s":"왼손잡이 사사로서 이스라엘을 모압 왕 에글론으로부터 구원한 자는 ( )이다(삿3:15).","a":"에훗"},{"t":"OT","b":"사사기","y":"완성형","n":3,"s":"소 모는 막대기로 블레셋 사람 육백 명을 죽인 사사는 ( )이다(삿3:31).","a":"삼갈"},{"t":"OT","b":"사사기","y":"완성형","n":4,"s":"이스라엘의 여사사는 ( )이다(삿4, 5장).","a":"드보라"},{"t":"OT","b":"사사기","y":"완성형","n":5,"s":"드보라의 명령에 따라 전쟁에 나간 이스라엘의 장수로, 아비노암의 아들은 ( )이다(삿4:6).","a":"바락"},{"t":"OT","b":"사사기","y":"완성형","n":6,"s":"기드온은 백성들이 미디안 족속들로부터 탈취한 귀고리들을 달라고 해서 그것으로 ( )을 만들었다(삿8:27).","a":"에봇"},{"t":"OT","b":"사사기","y":"완성형","n":7,"s":"세 대가 나팔을 불며 항아기를 부수고 왼손에 횃불을 들고 오른손에 나팔을 들어 불며 외쳐 이르되 여호와와 기드온의 ( )이다 하고(삿7:20).","a":"칼"},{"t":"OT","b":"사사기","y":"완성형","n":8,"s":"나귀 턱뼈로 블레셋 사람 일천 명을 죽인 이스라엘의 사사는 ( )이다(삿15:15).","a":"삼손"},{"t":"OT","b":"사사기","y":"완성형","n":9,"s":"사사 시대에 에브라임 산지에 살던 사람 중에 자기 집에 신당을 두고 에봇과 드라빔을 만들고 한 아들을 세워 그의 제사장으로 삼았던 자는 ( )이다(삿17:4).","a":"미가"},{"t":"OT","b":"사사기","y":"완성형","n":10,"s":"기드온이 그들에게 이르되 내가 너희를 다스리지 아니하겠고 나의 아들도 너희를 다스리지 아니할 것이요 ( )께서 너희를 다스리시리라 하니라(삿8:23).","a":"여호와"},{"t":"OT","b":"사사기","y":"완성형","n":11,"s":"서늘한 다락방에 혼자 앉아 있다가, 사사 에훗에 의해 칼에 맞아 죽게 된 모압의 왕은 ( )이다(삿3:20-22).","a":"에글론"},{"t":"OT","b":"사사기","y":"완성형","n":12,"s":"보소서 내가 양털 한 뭉치를 타작 마당에 두리니 만일 ( )이 양털에만 있고 주변 땅은 마르면 주께서 이미 말씀하심 같이 내 손으로 이스라엘을 구원하실 줄을 내가 알겠나이다(삿6:37).","a":"이슬"},{"t":"OT","b":"사사기","y":"완성형","n":13,"s":"기드온이 대적한 족속은 ( ) 족속이다(삿6:7; 7:1).","a":"미디안"},{"t":"OT","b":"사사기","y":"완성형","n":14,"s":"에브라임 산지에 사는 미가라는 사람이 예루살렘에서 온 젊은이를 자기 집의 제사장으로 세우고 기뻐했는데 그 이유는 그가 ( )이었기 때문이다(삿17:13).","a":"레위인"},{"t":"OT","b":"사사기","y":"단답형","n":1,"s":"옷니엘, 기드온, 입다, 삼손 등과 같은 인물들이 언급되는 구약의 책은 무엇인가? ( )","a":"사사기"},{"t":"OT","b":"사사기","y":"단답형","n":2,"s":"겐 사람 헤벨의 아내 야엘의 장막에서 그녀에 의해 말뚝에 박혀 죽게 된 가나안의 장수의 이름은 무엇인가? (삿4, 5장) ( )","a":"시스라"},{"t":"OT","b":"사사기","y":"단답형","n":3,"s":"\"보소서 나의 집은 므낫세 중에 극히 약하고 나는 내 아버지 집에서 가장 작은 자니이다\"라고 하며 하나님의 부르심에 주저했던 사사는 누구인가? (삿6:15) ( )","a":"기드온"},{"t":"OT","b":"사사기","y":"단답형","n":4,"s":"기드온이 오브라에서 여호와를 위하여 제단을 쌓고 붙인 이름은 무엇인가? (삿6:24) ( )","a":"여호와 살롬"},{"t":"OT","b":"사사기","y":"단답형","n":5,"s":"기드온의 아들 아비멜렉을 왕으로 추대한 자들은 어느 지역 사람들인가? (삿9:1) ( )","a":"세겜"},{"t":"OT","b":"사사기","y":"단답형","n":6,"s":"기드온의 아들 중에 아비멜렉이 왕이 된 것을 감람나무, 무화과나무, 포도나무, 가시나무 비유를 사용하여 비난한 자는 누구인가? (삿9:7-15) ( )","a":"요담"},{"t":"OT","b":"사사기","y":"단답형","n":7,"s":"아들 삼십, 나귀 삼십, 성읍 삼십을 가지고 있었던 사사는 누구인가? (삿10:3-4) ( )","a":"야일"},{"t":"OT","b":"사사기","y":"단답형","n":8,"s":"아들 사십, 손자 삼십이 있어 그들이 어린 나귀 칠십을 타게 한 사사는 누구인가? (삿12:13-14) ( )","a":"압돈"},{"t":"OT","b":"사사기","y":"단답형","n":9,"s":"\"주 여호와여 구하옵나니 나를 생각하옵소서 하나님이여 구하옵나니 이번만 나를 강하게 하사 나의 두 눈을 뺀 블레셋 사람에게 원수를 단번에 갚게 하옵소서\"라고 기도한 사사는 누구인가? (삿16:28) ( )","a":"삼손"},{"t":"OT","b":"사사기","y":"단답형","n":10,"s":"삼손이 죽으면서 블레셋 사람들에게 복수를 하게 된 곳은 어느 신의 신전인가? (삿16:23) ( )","a":"다곤"},{"t":"OT","b":"사사기","y":"단답형","n":11,"s":"갈렙의 아우 그나스의 아들로서, 갈렙의 딸 악사와 결혼한 이스라엘의 사사는 누구인가? (삿1:13) ( )","a":"옷니엘"},{"t":"OT","b":"사사기","y":"단답형","n":12,"s":"아비멜렉이 세겜의 왕이 되기 위해 형제 70명을 죽였을 때 자신은 살아 남아서 아비멜렉을 비난한 자는 누구인가? (삿9:7-21) ( )","a":"요담"},{"t":"OT","b":"사사기","y":"단답형","n":13,"s":"망대 아래에 서 있다가 한 여인이 던진 맷돌 위짝을 머리에 맞아 두개골이 깨어지자 자기의 무기를 든 청년을 불러 칼로 자신을 죽이도록 한 자는 누구인가? (삿9:53-54) ( )","a":"아비멜렉"},{"t":"OT","b":"사사기","y":"단답형","n":14,"s":"아들 삼십 명과 딸 삼심 명을 두어, 딸들을 밖으로 시집 보냈고 아들들을 위하여는 밖에서 여자 삼십 명을 데려왔던 사사는 누구인가? (삿12:8-9) ( )","a":"입산"},{"t":"OT","b":"사사기","y":"진위형","n":1,"s":"이스라엘의 첫 번째 사사로 메소보다미아 왕 구산 리사다임의 손에서 이스라엘을 구해낸 사사는 에훗이다(삿3:8-9). (O,X)","a":"X"},{"t":"OT","b":"사사기","y":"진위형","n":2,"s":"여룹바알은 기드온의 또 다른 이름이다(삿6:32; 7:1). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":3,"s":"기드온의 아들 아비멜렉도 사사 중에 한 사람이다(삿9장). (O,X)","a":"X"},{"t":"OT","b":"사사기","y":"진위형","n":4,"s":"이스라엘의 사사들 중에서 바알과 아세라의 제단을 훼파한 자는 기드온이다(삿 6:25). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":5,"s":"기드온의 아들로서 형제 70명을 죽이고 스스로 세겜의 왕이 된 자는 여룹바알이다(삿9장). (O,X)","a":"X"},{"t":"OT","b":"사사기","y":"진위형","n":6,"s":"기드온의 삼백 용사들은 물 가에 내려가서 물을 마실 때에 무릎을 꿇고 물을 마신 자들이다(삿7:5-6). (O,X)","a":"X"},{"t":"OT","b":"사사기","y":"진위형","n":7,"s":"사사기 9장에 나오는 감람나무, 무화과나무, 포도나무, 가시나무의 비유 중에 가시나무가 상징하는 자는 아비멜렉이다. (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":8,"s":"사사 중에 \"죽을 때에 죽인 자가 살았을 때에 죽인 자보다 더욱 많았던\" 사사는 기드온이다(삿16:30). (O,X)","a":"X"},{"t":"OT","b":"사사기","y":"진위형","n":9,"s":"자신이 여호와 앞에 한 서원 때문에 자신의 딸을 미스바에서 번제로 바쳐야했던 사사는 입다이다(삿 11장). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":10,"s":"레위인의 첩 사건으로 나머지 열 한 지파와 싸워야 했던 이스라엘의 한 지파는 베냐민 지파이다(삿19, 20장). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":11,"s":"삼손이 나귀 턱뼈로 일천 명을 죽인 곳을 '턱뼈의 산'이란 뜻의 라맛 레히라고 불렀다(삿15:17). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":12,"s":"삼손이 나귀 턱뼈로 일천 명을 죽이고 목이 말라 여호와께 부르짖었을 때 한 우묵한 곳에서 물이 솟아나게 하시자, 삼손이 그것을 마시고 난 후에 그 샘의 이름을 엔학고레(부르짖은 자의 샘)라고 불렀다(삿15:19). (O,X)","a":"O"},{"t":"OT","b":"사사기","y":"진위형","n":13,"s":"사사들의 활동은 삼손에서 끝이 났다(삼상8:1). (O,X)","a":"X"},{"t":"OT","b":"룻기","y":"선택형","n":1,"s":"룻기의 내용에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["룻의 시어머니 나오미는 흉년 때문에 가족들과 모압에 가서 살았다","나오미는 두 아들이 있었다","주인공 룻은 정통 이스라엘 계통의 여자이다","모압에서 나오미의 두 아들과 남편은 모두 죽었다"],"a":"3"},{"t":"OT","b":"룻기","y":"선택형","n":2,"s":"룻에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["모압 여자인데 이스라엘 집안에 시집갔다","남편이 죽었지만 시어머니에게 '어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 하나님이 되시리니' 라고 말하였다","남편이 죽자 당시 풍습에 따라 남편의 형제와 결혼하였다","시어머니도 과부가 되었다"],"a":"3"},{"t":"OT","b":"룻기","y":"선택형","n":3,"s":"룻기 이야기에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["나오미는 보아스에게 자기 며느리 룻을 받아들여야 할 것을 말한다","룻은 그녀와 보아스와의 첫 만남에 대하여 자기 시어머니께 모두 이야기 한다","룻의 시어머니 나오미는 룻에게 타작마당에서 보아스 옆에 누우라고 조언하였다","룻이 타작마당에서 보아스 옆에 누웠을 때 보아스도 이를 거절하지 않았다"],"a":"1"},{"t":"OT","b":"룻기","y":"선택형","n":4,"s":"룻기에 나온 결혼 관습에 대한 것으로 옳지 않은 것은 무엇인가? (룻 2:20)","c":["과부와 시형제간의 결혼 풍습은 신25:5-10에도 설명되어있다","사두개인이 예수에게 던진 부활에 관한 문제, 즉 일곱 형제들과 여자의 결혼 문제와 관련있다(마22:23-33; 막12:18-27; 눅20:27-28)","룻의 기업을 물을 자가 가까이 있었으나 보아스가 그 권리를 얻었다","보아스는 룻의 기업을 물을 자가 아니다"],"a":"4"},{"t":"OT","b":"룻기","y":"선택형","n":5,"s":"과부가 된 룻은 자신의 처지를 누구와 의논하여 극복하는가?","c":["사사","하나님","과부인 시어머니 나오미","보리 추수하는 자들"],"a":"3"},{"t":"OT","b":"룻기","y":"선택형","n":6,"s":"과부가 된 룻과 그녀의 시어머니 나오미가 그들의 어려운 처지를 극복한 방법은 무엇인가?","c":["부자인 보아스에게 찾아가 애원하였다","적극적으로 기지를 발휘해 보아스가 룻에게 인애를 베풀게 만든다","성소에 가서 희생 제물을 드렸다","재판을 벌여 보아스가 무조건 룻을 책임지게 하였다"],"a":"2"},{"t":"OT","b":"룻기","y":"선택형","n":7,"s":"룻기의 지리적 배경이 되는 곳으로 옳지 않은 곳은 어디인가?","c":["모압 땅","베들레헴 우물가","타작마당","베들레헴의 어느 밭"],"a":"2"},{"t":"OT","b":"룻기","y":"선택형","n":8,"s":"자신 곁에 누워있는 룻을 보고 보아스가 한 반응으로 옳은 것은 무엇인가?","c":["정숙치 못한 여인이라며 마구 꾸짖었다","여호와의 복을 빌어 주었다","놀라 실신하였다","성읍 장로들을 모아 놓고 룻을 고발하였다"],"a":"2"},{"t":"OT","b":"룻기","y":"선택형","n":9,"s":"룻과 그의 동서 오르바의 차이점은 무엇인가?","c":["룻은 모압 여인이고 오르바는 헷 여인이다","룻은 과부가 되었지만, 오르바는 남편과 잘 살았다","룻은 보아스의 후처이고, 오르바는 본처이다","룻은 과부에 자식이 없는 시어머니와 끝까지 함께 있었으나, 오르바는 떠났다"],"a":"4"},{"t":"OT","b":"룻기","y":"선택형","n":10,"s":"나오미에 대한 설명으로 옳지 않은 것은 무엇인가?","c":["보아스가 자기의 며느리 룻을 마음에 두자 룻에게 조신하라고 타이른다","하나님이 자기를 징벌하셨다고 한탄하였다","며느리 룻이 밭으로 가서 이삭을 줍는 것을 허락하였다","룻에게 어떻게 보아스에게 접근해야하는지 자세히 알려주었다"],"a":"1"},{"t":"OT","b":"룻기","y":"선택형","n":11,"s":"나오미가 며느리인 룻에게 고향으로 돌아가라고 했을 때 룻이 한 대답으로 옳지 않은 것은 무엇인가? (룻1:16-17)","c":["어머니를 따르지 말고 돌아가라고 강권하지 말아라","어머니가 죽는 곳에서 나도 죽어 장사될 것이다","죽는 일 외에 어머니를 떠나면 여호와의 벌을 받기 원한다","하나님이 우리 둘의 여생을 책임지실 것이니 걱정하지 말자"],"a":"4"},{"t":"OT","b":"룻기","y":"선택형","n":12,"s":"룻이 보아스에게 이방 여인인 자신에게 어찌하여 밭에서 이삭을 줍도록 은혜를 베푸는 지 물었을 때 보아스가 한 대답으로 옳지 않은 것은 무엇인가?","c":["남편이 죽은 후 네가 시어머니에게 한 모든 것을 내가 들었다","남편이 죽었지만 부모와 고국을 떠나 알지 못하던 백성에게로 온 것을 들었다","하나님이 꿈에 내게 나타나셔서 네가 올 것을 미리 알려 주셨다","여호와께서 네가 한 모든 일에 보응하시고 상주시기를 원한다"],"a":"3"},{"t":"OT","b":"룻기","y":"선택형","n":13,"s":"나오미가 며느리인 룻에게 밤에 보아스에게 가서 그 옆에 누우라고 하였을 때 룻의 반응으로 옳은 것은 무엇은가?","c":["슬피 울었다","어머니의 말씀대로 다 행하리라고 하였다","너무 기뻐서 나오미에게 포옹하였다","처음엔 주저 하였으나 곧 일어나 목욕을 하였다"],"a":"2"},{"t":"OT","b":"룻기","y":"선택형","n":14,"s":"옆에 누어있는 룻을 보고 보아스가 한 말로 옳지 않은 것은 무엇인가? (룻3:10-13)","c":["나 외에는 너의 기업을 무를 자가 없다","하나님이 복 주시길 원한다","네가 현숙한 여자인 줄 성읍 백성이 다 안다","두려워 말라"],"a":"1"},{"t":"OT","b":"룻기","y":"완성형","n":1,"s":"룻이 이르되 내게 어머니를 떠나며 어머니를 따르지 말고 돌아가라 강권하지 마옵소서 어머니께서 가시는 곳에 나도 가고 어머니께서 머무시는 곳에서 나도 머물겠나이다 어머니의 백성이 나의 ( )이 되고 어머니의 하나님이 나의 ( )이 되시리니(룻1:16).","a":"백성, 하나님"},{"t":"OT","b":"룻기","y":"완성형","n":2,"s":"룻기는 대부분의 개신교 성경 순서에 ( )기 다음에 나오는 책이며, ( ) 시대를 배경으로 하는 이야기이다.","a":"사사"},{"t":"OT","b":"룻기","y":"단답형","n":1,"s":"룻기의 마지막에는 족보가 등장한다. 그 족보 마지막에 등장하는 인물은 누구인가? 룻은 그 인물의 증조모이다. ( )","a":"다윗"},{"t":"OT","b":"룻기","y":"단답형","n":2,"s":"나오미와 룻이 양식 때문에 베들레헴에 왔을 때 그곳은 무슨 곡물을 추수 할 때였는가? ( )","a":"보리"},{"t":"OT","b":"룻기","y":"단답형","n":3,"s":"룻기에서 보아스가 법률적으로 합법하게 룻과 결혼하기위해 어디에서 재판을 하는가? 이 장소는 구약의 여러 곳에서도 재판을 하는 장소로 나온다(신21:15, 19; 암5:10, 12, 15; 잠31:23; 애5:14 룻4:1-12). ( )","a":"성문(룻 4:1-12)"},{"t":"OT","b":"룻기","y":"진위형","n":1,"s":"다윗의 혈통은 이방인이 전혀 없는 순수 이스라엘 혈통이다. (O,X)","a":"X"},{"t":"OT","b":"룻기","y":"진위형","n":2,"s":"이삭을 줍는 룻은 보아스의 주목을 끌었고, 보아스는 보리 베는 자들이 룻을 성가시지 않도록 보호하였다(룻2:1-23). (O,X)","a":"O"},{"t":"OT","b":"룻기","y":"진위형","n":3,"s":"나오미의 두 모압 며느리 중 룻의 동서는 자기 남편이 죽고 시어머니가 고향에 돌아가려 할 때 자신의 고향으로 돌아갔다(룻1:1-22). (O,X)","a":"O"},{"t":"OT","b":"룻기","y":"진위형","n":4,"s":"룻은 모압의 이방 여인이지만 다윗의 증조모가 되었다. 이처럼 구약 성서는 이방인 중 모압 사람들에게는 항상 호의 적이었다. (O,X)","a":"X"},{"t":"OT","b":"룻기","y":"진위형","n":5,"s":"\"룻이 이삭을 주우러 일어날 때에 보아스가 자기 소년들에게 명령하여 이르되 그에게 곡식 단 사이에서 줍게 하고 책망하지 말며, 또 그를 위하여 곡식 다발에서 조금씩 뽑아 버려서 그에게 줍게 하고 꾸짖지 말라 하니라…\" 위의 2장 15-16절 말씀은 구약 성서 어디에서도 찾아 볼 수 없는 보아스 만의 고유한 관용정신이 나타나 있다. (O,X)","a":"X"},{"t":"OT","b":"룻기","y":"진위형","n":6,"s":"보아스는 남편과 아들이 없는 룻의 기업을 물을 자가 아닌데도 자원하여 룻과 결혼하였다(룻2:20). (O,X)","a":"X"},{"t":"OT","b":"룻기","y":"진위형","n":7,"s":"처음 나오미의 가족이 고향인 베들레헴을 떠나 모압에 간 이유는 전쟁 때문이다. (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"선택형","n":1,"s":"사무엘, 사울 왕, 다윗 왕의 활동들을 집중적으로 다루고 있는 책은 무엇인가?","c":["사사기","사무엘서","열왕기서","역대기"],"a":"2"},{"t":"OT","b":"사무엘상·하","y":"선택형","n":2,"s":"엘리 제사장의 행실이 나빠 여호와를 알지 못하던 두 아들 이름은 무엇인가? (삼상2:12, 22, 34)","c":["홉니와 비느하스","나답과 아비후","오홀라와 오홀리바","스알야숩과 마헬살랄하스바스"],"a":"1"},{"t":"OT","b":"사무엘상·하","y":"선택형","n":3,"s":"한나가 기도하던 때에 실로에 있던 성소의 제사장은 누구인가? (삼상 1:9)","c":["홉니","비느하스","엘리","아히멜렉"],"a":"3"},{"t":"OT","b":"사무엘상·하","y":"선택형","n":4,"s":"사무엘이 어린 시절을 보낸 곳은 n":6,"s":"브엘세바에서 사사가 된 ( )과 아비야는 자기 아버지 사무엘의 행위를 따르지 아니하고 이익을 따라 뇌물을 받고 판결을 굽게 했다 (삼상8:2-3).","a":"요엘"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":7,"s":"\"내가 누구의 소를 빼앗았느냐 누구의 나귀를 빼앗았느냐 누구를 속였느냐 누구를 압제하였느냐 내 눈을 흐리게 하는 뇌물을 누구의 손에서 받았느냐 그리하였으면 내가 그것을 너희에게 갚으리라\"라고 말한 자는 ( )이다(삼상12:3).","a":"사무엘"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":8,"s":"\"나는 너희를 위하여 기도하기를 쉬는 죄를 여호와 앞에 결단코 범하지 아니하고 선하고 의로운 길을 너희에게 가르칠 것이다\"라고 말한 자는 ( )이다(삼상12:23).","a":"사무엘"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":9,"s":"\"순종이 제사보다 낫고 듣는 것이 숫양의 기름보다 나으니\"라는 말은 하나님이 사무엘을 통해서 ( )에게 한 말이다(삼상15:22).","a":"사울"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":10,"s":"그의 용모와 키를 보지 말라 내가 이미 그를 버렸노라 내가 보는 것은 사람과 같지 아니하니 사람은 외모를 보거니와 나 여호와는 ( )을 보느니라 하시더라(삼상16:7).","a":"중심"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":11,"s":"사울이 죽인 자는 천천이요 ( )은 만만이로다(삼상18:7).","a":"다윗"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":12,"s":"다윗이 블레셋 사람 이백 명을 죽이고 난 후 아내로 취하게 된 사울 왕의 딸은 ( )이다(삼상18:27).","a":"미갈"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":13,"s":"나발의 아내로서 총명하고 용모가 아름다운 여인이었으며 나중에 다윗의 아내가 된 여인의 이름은 ( )이다(삼상25장).","a":"아비가일"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":14,"s":"다윗 왕의 맏아들로서 이복누이 다말을 범한 자는 ( )이다(삼하3:2).","a":"암논"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":15,"s":"요압과 그의 동생 ( )가 아브넬을 죽인 것은 그가 기브온 전쟁에서 자기 동생 아사헬을 죽인 까닭이었더라(삼하3:30).","a":"아비새"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":16,"s":"다윗은 사울 왕의 장수였던 ( )의 죽음에 대해, \"어찌하여 미련한 자의 죽음 같은고 네 손이 결박되지 아니하였고 네 발이 차꼬에 채이지 아니하였거늘 불의한 자식의 앞에 엎드러짐 같이 네가 엎드러졌도다\"라고 애도했다(삼하3:33-34).","a":"아브넬"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":17,"s":"하나님의 궤가 나곤의 타작 마당에 이르렀을 때 소가 뛰자 하나님의 궤를 붙잡았다가 죽게 된 자는 ( )이다(삼하6:6-8).","a":"웃사"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":18,"s":"\"네가 가는 모든 곳에서 내가 너와 함께 있어 네 모든 원수를 네 앞에서 멸하였은즉 땅에서 위대한 자들의 이름 같이 네 이름을 위대하게 만들어 주리라\"라는 약속은 하나님이 ( )을 통해서 다윗에게 주신 것이다(삼하7:9).","a":"나단"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":19,"s":"요나단의 아들로서 다윗에게 은총을 받아 할아버지 사울의 밭을 다 돌려받고 항상 다윗의 상에서 떡을 먹을 것을 약속받은 자는 ( )이다(삼하9:7).","a":"므비보셋"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":20,"s":"우리아의 아내로서 다윗 왕과 동침한 여인은 ( )이다(삼하11장).","a":"밧세바"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":21,"s":"다윗 왕의 딸이요 압살롬의 아름다운 누이인 다말에 집착하여 결국 그녀를 성폭행한 이복형제는 ( )이다(삼하13장).","a":"암논"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":22,"s":"온 이스라엘 가운데에서 ( ) 같이 아름다움으로 크게 칭찬 받는 자가 없었으니 그는 발바닥부터 정수리까지 흠이 없음이라 그의 머리털이 무거우므로 연말마다 깎았으며 그의 머리 털을 깎을 때에 그것을 달아본 즉 그의 머리털이 왕의 저울로 이백 세겔이었더라(삼하 14:25-26).","a":"압살롬"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":23,"s":"다윗 왕의 아들 압살롬이 반역을 일으켰을 때, 압살롬을 위해 아히도벨의 세운 계략을 물리쳐서 아히도벨이 죽게 하고 다윗에게 유리하게 만든 자는 ( )이다(삼하17장).","a":"후새"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":24,"s":"다윗 왕의 아들들 중에서 자기 이름을 전할 아들이 없음을 안타까워하며 자기 이름을 기념하는 기념비를 왕의 골짜기에 세운 자는 ( )이다(삼하18:18).","a":"압살롬"},{"t":"OT","b":"사무엘상·하","y":"완성형","n":25,"s":"블레셋 군대가 쳐들어 왔을 때 다윗 왕이 직접 전장에 나가 싸웠다. 그 때에 거인족의 아들 중에 무게가 삼백 세겔 되는 놋 창을 들고 새 칼을 찬 이스비브놉이 다윗을 죽이려 하자 ( )가 다윗을 도와 그 블레셋 사람들을 죽이고, \"왕은 다시 우리와 함께 전장에 나가지 마옵소서 이스라엘의 등불이 꺼지지 말게 하옵소서\"라고 말했다(삼하21:16-17).","a":"아비새"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":1,"s":"엘가나의 아내들 중에 한나가 자식이 없자 그녀를 심히 격분시키고 괴롭게 하였던 또 다른 아내의 이름은 무엇인가? (삼상1:6) ( )","a":"브닌나"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":2,"s":"\"사람이 사람에게 범죄하면 하나님이 심판하시려니와 만일 사람이 여호와께 범죄하면 누가 그를 위하여 간구하겠느냐\"라고 하면서 죄악에 빠진 아들들을 꾸짖었던 제사장은 누구인가? (삼상2:25) ( )","a":"엘리"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":3,"s":"\"내 마음이 여호와로 말미암아 즐거워하며 내 뿔이 여호와로 말미암아 높아졌으며 내 입이 내 원수들을 향하여 크게 열렸으니 이는 내가 주의 구원으로 말미암아 기뻐함이니이다…전에 임신하지 못하던 자는 일곱을 낳았고 많은 자녀를 둔 자는 쇠약하도다…\"라는 기도를 한 자는 누구인가? (삼상2:1-5) ( )","a":"한나"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":4,"s":"사무엘의 두 아들의 이름은 요엘과 누구인가? (삼상8:2) ( )","a":"아비야"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":5,"s":"여호와의 궤를 들여다 본 까닭에 (오만) 칠십 명이 죽게 되자 그 궤를 기럇여아림으로 보내버린 사람들은 어디에 사는 사람들이었는가? (삼상6:19) ( )","a":"벧세메스"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":6,"s":"하나님이 이스라엘의 왕으로 삼으려고 사무엘을 통해 불렀을 때 \"나는 이스라엘 지파의 가장 작은 지파 베냐민 사람이 아니니이까 또 나의 가족은 베냐민 지파 모든 가족 중에 가장 미약하지 아니하니이까 당신이 어찌하여 내게 이같이 말씀하시니이까\"라고 반응했던 자는 누구인가? (삼상9:21) ( )","a":"사울"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":7,"s":"사무엘이 왕으로 기름을 붓고 난 다음에 하나님의 산에서 선지자들과 함께 예언을 하게 된 자는 누구인가? (삼상10:10) ( )","a":"사울"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":8,"s":"\"거역하는 것은 점치는 죄와 같고 완고한 것은 사신 우상에게 절하는 죄와 같음이라 왕이 여호와의 말씀을 버렸으므로 여호와께서도 왕을 버려 왕이 되지 못하게 하셨나이다\"라는 말은 사무엘이 누구에 한 말인가? (삼상15:23) ( )","a":"사울"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":9,"s":"\"그의 용모와 키를 보지 말라 내가 이미 그를 버렸노라 내가 보는 것은 사람과 같지 아니하니 사람은 외모를 보거니와 나 여호와는 중심을 보느니라\"라는 말은 사무엘이 누구를 왕으로 기름 부으려 했을때 하나님께서 하신 말씀인가? (삼상16:6-7) ( )","a":"엘리압"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":10,"s":"\"너는 칼과 창과 단창으로 내게 나아 오거니와 나는 만군의 여호와의 이름 곧 네가 모욕하는 이스라엘 군대의 하나님의 이름으로 네게 나아가노라\"라고 외친 자는 누구인가? (삼상17:45) ( )","a":"다윗"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":11,"s":"추적하는 사울 왕을 피하여 온 다윗에게 진설병을 제공한 놉 땅의 제사장은 누구인가? (삼상21:1-6) ( )","a":"아히멜렉"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":12,"s":"사울 왕을 피하여 도망가던 다윗은 가드의 어느 왕 앞에서 미친 체하고 대문짝에 그적거리며 침을 수염에 흘리기까지 하며 목숨을 건지게 되었는가? (삼상21:10-15) ( )","a":"아기스"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":13,"s":"사울 왕과 그의 아들들이 전사한 산은 어디인가? (삼상31:1) ( )","a":"길보아 산"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":14,"s":"\"여호와께서 너를 떠나 네 대적이 되셨거늘 네가 어찌하여 내게 묻느냐 여호와께서 나를 통하여 말씀하신 대로 네게 행하사 나라를 네 손에서 떼어 네 이웃 다윗에게 주셨느니라\"라는 말은 누가 사울 왕에게 한 말인가? (삼상27:16-17) ( )","a":"사무엘"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":15,"s":"\"내 형 요나단이여 내가 그대를 애통함은 그대는 내게 심히 아름다움이라 그대가 나를 사랑함이 기이하여 여인의 사랑보다 더하였도다\"라고 말한 자는 누구인가? (삼하1:26) ( )","a":"다윗"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":16,"s":"다윗은 헤브론에서 칠년 육 개월 동안 유다를 다스렸고 예루살렘에서 몇 년 동안 온 이스라엘과 유다를 다스렸는가? (삼하4:4-5) ( )","a":"33년"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":17,"s":"\"나는 백향목 궁에 살거늘 하나님의 궤는 휘장 가운데에 있도다\"라고 말하며 여호와를 위해 성전을 지으려는 열망을 보인 자는 누구인가? (삼하7:2) ( )","a":"다윗"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":18,"s":"다윗 왕이 밧세바와 동침하고 우리아를 죽게 만든 사실을 알고 가난한 사람에게 있는 작은 암양 새끼 한 마리의 비유로 그를 꾸짖은 선지자는 누구인가? (삼하12장) ( )","a":"나단"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":19,"s":"\"내 아들 압살롬아 내 아들 내 아들 압살롬아 차라리 내가 너를 대신하여 죽었더면, 압살롬 내 아들아 내 아들아\" 하고 아들의 죽음을 애도한 자는 누구인가? (삼하18:33) ( )","a":"다윗"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":20,"s":"다윗 왕이 압살롬의 반역으로 도망을 다닐 때 자기 지역으로 온 다윗과 신하들에 대해 돌을 던지고 저주하며 \"피를 흘린 자여 사악한 자여 가거라 가거라 사울의 족속의 모든 피를 여호와께서 네게로 돌리셨도다\"라고 말하고 그들을 쫓아버린 자는 누구인가? (삼하16:7-8) ( )","a":"시므이"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":21,"s":"다윗 왕의 아들 압살롬은 반역을 일으켰다가 어느 장군의 부하들에게 죽게 되었는가? (삼하18장) ( )","a":"요압"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":22,"s":"다윗 왕이 블레셋 족속과 가드에서 전쟁을 할 때 손가락과 발가락이 각기 여섯 개씩 모두 스물 네 개가 있는 거인족의 소생이 이스라엘 사람을 능욕하자 다윗의 형 삼마의 아들인 누가 그를 죽였는가? (삼하 21:20-21) ( )","a":"요나단"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":23,"s":"다윗 왕은 단에서부터 브엘세바까지의 인구 조사를 위해 누구에게 명령했는가? (삼하24:2) ( )","a":"요압"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":24,"s":"다윗의 인구 조사에 대한 하나님의 벌을 전한 선지자는 누구인가? (삼하24:11) ( )","a":"갓"},{"t":"OT","b":"사무엘상·하","y":"단답형","n":25,"s":"다윗이 인구 조사를 한 것에 대해 하나님께서 사흘 동안 전염병이 내리게 하셨을 때 단에서부터 브엘세바까지 백성의 죽은 자가 몇 명이나 되었는가? (삼하24:15) ( )","a":"칠만"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":1,"s":"자식이 없는 한나가 실로의 성소에서 기도할 때 그녀가 취한 줄로 생각하고 꾸짖었던 자는 엘리야이다(삼상1:14). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":2,"s":"여호와께서 세 번이나 부르실 때에 자신이 섬기던 엘리 제사장이 부르는 것으로 간주하였던 자는 한나이다(삼상3장). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":3,"s":"\"여호와는 가난하게도 하시고 부하게도 하시며 낮추기도 하시고 높이기도 하시는도다\"라고 기도한 자는 한나이다(삼상2:7). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":4,"s":"사울 왕은 엘리 제사장으로부터 이스라엘의 초대 왕으로 기름부음을 받았다(삼상10:1). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":5,"s":"이스라엘의 사사요 선지자로서 벧엘, 길갈, 미스바 등 여러 곳을 순회하며 다스린 자는 사무엘이다(삼상7:15-17). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":6,"s":"이스라엘 백성들이 주위의 모든 나라들처럼 왕을 세워달라고 했을 때 사무엘은 그 제안을 환영하며 하나님께서 왕을 세워 주시도록 중보 기도를 했다(삼상8:6). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":7,"s":"사울이 이스라엘의 초대 왕으로 취임을 하게 된 곳은 예루살렘이다(삼상10:17). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":8,"s":"기도하기를 쉬는 죄를 언급한 자는 다윗이다(삼상12:23). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":9,"s":"이스라엘이 블레셋과 싸울 때에 자기의 무기를 든 소년에게 \"여호와의 구원은 사람의 많고 적음에 달리지 아니하였느니라\"라고 말한 자는 요나단이다(삼상14:6). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":10,"s":"사무엘상 13장에 의하면 사무엘이 사울 왕의 나라가 길지 못할 것을 예언한 이유는 사울 왕이 블레셋과 전투를 하러 나가기 전에 직접 번제를 드렸기 때문이다. (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":11,"s":"환난 당한 모든 자와 빚진 모든 자와 마음이 원통한 자와 아둘람 굴에 함께 모여 사백명 가량의 우두머리가 된 자는 다니엘이다(삼상 22:1-2). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":12,"s":"사울 왕의 명령으로 도엑이 놉의 제사장들 팔십 오명과 자녀들을 죽일 때 제사장 아히멜렉의 아들 중에 살아남은 자는 아비아달이다(삼상22:20). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":13,"s":"다윗이 사울 왕을 죽일 수 있는 상황 속에서도 그를 살려준 것이 두 번이다(삼상24, 26장). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":14,"s":"사울 왕은 블레셋과의 전투 중에 화살에 맞아 부상을 당하자 무기를 든 자에게 칼로 찔러달라고 해서 그의 칼에 찔려 죽었다(삼상31:4). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":15,"s":"다윗이 헤브론에서 유다 족속의 왕이 된 날수는 칠년육개월이었다(삼하5:5). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":16,"s":"사울의 아들 이스보셋의 군지휘관이었던 바아나와 레갑이 침상에서 낮잠을 자고 있던 이스보셋을 죽이고 다윗에게 가자 다윗은 그들에게 군지휘관의 위치를 제공했다(삼하4장). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":17,"s":"우리아의 아내였던 밧세바가 다윗 왕과 동침하여 아기를 낳게 되었는데 그가 커서 솔로몬 왕이 되었다(삼하12:18). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":18,"s":"솔로몬의 다른 이름은 여디디야인데, 이는 여호와께서 사랑하신다는 의미를 지니고 있다(삼하12:25). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":19,"s":"베냐민 사람 비그리의 아들이요 불량배로서 이스라엘 지파 사람들을 모아 다윗의 왕권에 도전하다가 한 여인에게 머리가 베여 성벽에서 던져진 자는 세바이다(삼하20장). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":20,"s":"다윗 왕의 인구 조사로 말미암아 하나님께서 전염병의 재앙을 내리시자 다윗 왕은 여부스 사람 아라우나의 타작 마당에서 번제와 화목제를 드렸다(삼하24:18-25). (O,X)","a":"O"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":21,"s":"다윗 왕의 인구 조사로 말미암아 하나님께서 전염병의 재앙을 내렸을 때 다윗 왕은 아라우나의 타작 마당에서 번제와 화목제를 드리게 되었는데, 그는 아라우나로부터 공짜로 제물들을 얻지 않고 은 오백 세겔을 주고 타작 마당과 소를 샀다(삼하24:24). (O,X)","a":"X"},{"t":"OT","b":"사무엘상·하","y":"진위형","n":22,"s":"다윗의 인구 조사에 대한 하나님의 벌을 전한 선지자는 나단이다(삼하24:11). (O,X)","a":"X"},{"t":"OT","b":"열왕기상·하","y":"선택형","n":1,"s":"\"다윗 왕이 나이가 많아 늙으니 이불을 덮어도 따뜻하지 아니한지라\"라는 구절로 시작하는 책은 무엇인가? (왕상1:1)","c":["사무엘상","사무엘하","열왕기상","열왕기하"],"a":"3"},{"t":"OT","b":"열왕기상·하","y":"선택형","n":2,"s":"다윗 왕의 신복 중에서 솔로몬이 아니라 아도니야가 왕이 되도록 도운 자는 누구인가? (왕상1:8)","c":["사독","브나야","나단","요압"],"a":"4"},{"t":"OT","b":"열왕기상·하","y":"선택형","n":3,"s":"다윗
